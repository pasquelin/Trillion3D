[package]
name = "web-geometry-compiler"
version = "0.7.0"
edition = "2021"
license = "MIT"
[lib]
name = "web_geometry_compiler"
path = "src/lib.rs"
[[bin]]
name = "web-geometry-compiler"
path = "src/main.rs"
[[bin]]
name = "web-geometry-oracle"
path = "src/oracle_main.rs"
[dependencies]
serde_json = "1"
sha2 = "0.10"
rayon = "1.10"
memmap2 = "0.9"
meshopt = "0.4"
ufbx = "0.11.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tga", "tiff", "webp", "bmp", "gif"] }
# Lecture d'archives ZIP (MIT, zip-rs/zip2), pour le pilote conteneur `zip`. Sans son défaut de
# fonctionnalités : seul `deflate` par `flate2` en Rust pur, ni chiffrement ni codec natif.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
# Lecture d'archives tar.gz (MIT OU Apache-2.0), pour le pilote conteneur `unitypackage` : `flate2`
# sur son backend Rust pur (miniz_oxide), et `tar` sans `xattr`, qui restaurerait des attributs
# étendus. Décompression seule, aucun code d'éditeur.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4.46", default-features = false }
yaml-rust2 = { version = "0.13", default-features = false }
# Décodage des blocs BCn du pilote `dds` (MIT ou Apache-2.0, UniversalGameExtraction/texture2ddecoder,
# notices conservées avec la dépendance). Rust pur, sans `std` ni SDK d'éditeur : la reconstruction
# entière que définit la spécification, rien de plus.
texture2ddecoder = "0.1.2"
# Lecture OpenEXR (BSD-3-Clause, `johannesvollmer/exrs`, Rust pur et sans `unsafe`, notices
# conservées avec la dépendance), pour le pilote `exr`. Version figée : elle nomme le pilote et entre
# dans l'identité du cache. Aucun code ni SDK d'éditeur, aucune bibliothèque C.
exr = "1.74.2"
# Transcodage des charges Basis Universal du pilote `ktx2` — ETC1S sous BasisLZ et UASTC LDR 4 × 4 —
# vers RGBA8 (Apache-2.0, marcogomez/basisu, notices conservées avec la dépendance). Rust pur, sans
# `cc` ni source C++ : un portage du transcodeur de référence de Binomial, vérifié octet pour octet
# contre lui. Décodage seul, aucun encodeur, aucun code d'éditeur.
basisu = { version = "0.1.0", default-features = false, features = ["std", "zstd"] }
# Décompression Zstandard des niveaux du pilote `ktx2` (MIT, KillingSpark/zstd-rs). Rust pur,
# décompression seule ; `hash` garde la vérification du condensé qu'une trame peut porter, et la
# longueur attendue du niveau, annoncée par l'index du conteneur, borne la lecture et l'allocation.
ruzstd = { version = "0.7.3", default-features = false, features = ["std", "hash"] }
# Lecture USD des pilotes `usd` et `usdz` : couches `.usda` (texte) et `.usdc` (binaire « crate »),
# et composition des couches (MIT, mxpv/openusd, notices conservées avec la dépendance). Rust pur,
# sans dépendance C++ : aucun code ni SDK d'éditeur, aucune bibliothèque de Pixar. Lecture seule ici.
# Version figée : elle nomme le pilote et entre dans l'identité du cache.
openusd = "0.7.0"
[dev-dependencies]
# Le décodeur de pages, partagé avec le module WebAssembly : le compilateur ne l'embarque pas,
# il s'en sert pour prouver que ce qu'il encode se relit à l'identique.
web-geometry-page-codec = { path = "../page-codec-wasm" }

[build-dependencies]
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
