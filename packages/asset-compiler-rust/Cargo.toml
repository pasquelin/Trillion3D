[package]
name = "web-geometry-compiler"
version = "0.1.0"
edition = "2021"
license = "MIT"
[lib]
name = "web_geometry_compiler"
path = "src/lib.rs"
[[bin]]
name = "web-geometry-compiler"
path = "src/main.rs"
[[bin]]
name = "web-geometry-oracle"
path = "src/oracle_main.rs"
[dependencies]
serde_json = "1"
sha2 = "0.10"
rayon = "1.10"
memmap2 = "0.9"
meshopt = "0.4"
ufbx = "0.11.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tga", "tiff", "webp"] }
# Lecture d'archives ZIP (MIT, zip-rs/zip2), pour le pilote conteneur `zip`. Sans son défaut de
# fonctionnalités : seul `deflate` par `flate2` en Rust pur, ni chiffrement ni codec natif.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
# Lecture d'archives tar.gz (MIT OU Apache-2.0), pour le pilote conteneur `unitypackage` : `flate2`
# sur son backend Rust pur (miniz_oxide), et `tar` sans `xattr`, qui restaurerait des attributs
# étendus. Décompression seule, aucun code d'éditeur.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4.46", default-features = false }
yaml-rust2 = { version = "0.13", default-features = false }
# Décodage des blocs BCn du pilote `dds` (MIT ou Apache-2.0, UniversalGameExtraction/texture2ddecoder,
# notices conservées avec la dépendance). Rust pur, sans `std` ni SDK d'éditeur : la reconstruction
# entière que définit la spécification, rien de plus.
texture2ddecoder = "0.1.2"
# Lecture OpenEXR (BSD-3-Clause, `johannesvollmer/exrs`, Rust pur et sans `unsafe`, notices
# conservées avec la dépendance), pour le pilote `exr`. Version figée : elle nomme le pilote et entre
# dans l'identité du cache. Aucun code ni SDK d'éditeur, aucune bibliothèque C.
exr = "1.74.2"
[dev-dependencies]
# Le décodeur de pages, partagé avec le module WebAssembly : le compilateur ne l'embarque pas,
# il s'en sert pour prouver que ce qu'il encode se relit à l'identique.
web-geometry-page-codec = { path = "../page-codec-wasm" }

[build-dependencies]
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
