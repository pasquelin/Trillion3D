[package]
name = "trillion3d-math"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "trillion3d_math"
path = "src/lib.rs"

# `golden`: the reference values' harness (`src/golden.rs`), for the dependents' tests only.
[features]
golden = []

[dependencies]
# fdlibm's `pow` and `powf` in pure Rust from musl (MIT), the same on every host: the sRGB curve
# (`src/color.rs`) takes its power from here, never from the platform's C library. The page codec
# carries the same crate. `src/scalar/acos.rs` and `src/scalar/trig.rs` are tested against it too.
libm = "0.2.16"
