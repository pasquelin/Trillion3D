[package]
name = "trillion3d-page-codec"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

# `rlib` for the native compiler, testing the decoder against its own encoder;
# `cdylib` for `wasm32-unknown-unknown`, exporting only the kernels' ABI (`wasm_*.rs`).
[lib]
name = "trillion3d_page_codec"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

# The maths primitives, shared with the compiler; it has no dependency itself.
[dependencies]
trillion3d-math = { path = "../math/rust" }

# The reader of the reference values the codec's mirrored primitives are tested against.
[dev-dependencies]
trillion3d-math = { path = "../math/rust", features = ["golden"] }

[profile.release]
lto = true
# 3 rather than "s" (STR-03): the page decoder runs about twice as fast for the same bits —
# Rust has no fast-math, every float operation is IEEE-exact at any level — in a module no larger.
opt-level = 3
codegen-units = 1
panic = "abort"
