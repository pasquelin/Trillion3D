[package]
name = "trillion3d-page-codec"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

# `rlib` for the native compiler, testing the decoder against its own encoder;
# `cdylib` for `wasm32-unknown-unknown`, exporting only the ABI of `wasm.rs`.
[lib]
name = "trillion3d_page_codec"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
# fdlibm's arc cosine, pure Rust from musl (MIT): the reference `src/acos.rs` is transcribed from,
# with the instruction's square root rather than its software one, and tested against.
libm = "0.2.16"

[profile.release]
lto = true
# 3 rather than "s" (STR-03): the page decoder runs about twice as fast for the same bits —
# Rust has no fast-math, every float operation is IEEE-exact at any level — in a module no larger.
opt-level = 3
codegen-units = 1
panic = "abort"
