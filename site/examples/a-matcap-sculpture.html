<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A matcap sculpture</title>
    <meta name="thumbnail" content="4" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a1614;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math, texture } from '../runtime/engine.js';
      import { controls, opening, ease, mix } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      world.scene.background = math.color('#1a1614');

      // A matcap is a picture of a lit ball. Each pixel of the sculpture looks up the point of the
      // ball whose surface faces the camera the same way: the light is baked into the picture, and
      // the scene's lamps do not touch it. Every ball here is painted on a canvas, pixel by pixel,
      // from its normal: a diffuse part, a highlight, a rim, and for metals a reflected room.
      const clamp = (value) => Math.min(1, Math.max(0, value));
      const KEY = (() => { const l = [-0.5, 0.65, 0.58], n = Math.hypot(...l); return l.map((value) => value / n); })();
      // The room a metal reflects: a warm window high on the left, a dark floor, a bright horizon.
      const room = (r) => {
        const up = r[1], window = clamp((r[0] * KEY[0] + r[1] * KEY[1] + r[2] * KEY[2] - 0.8) * 6);
        const sky = up > 0 ? mix([0.55, 0.52, 0.5], [0.2, 0.2, 0.24], clamp(up * 1.6)) : mix([0.55, 0.5, 0.45], [0.05, 0.04, 0.04], clamp(-up * 3));
        return mix(sky, [1.4, 1.25, 1.05], window);
      };
      function ball({ base, rim = [0, 0, 0], shine = 0, gloss = 20, metal = 0, wrap = 0 }) {
        const size = 256, canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        const context = canvas.getContext('2d'), image = context.createImageData(size, size);
        for (let py = 0; py < size; py++)
          for (let px = 0; px < size; px++) {
            // The normal of the ball at this pixel; outside it, the edge's normal, so a sample at
            // the silhouette never reads the background.
            let x = ((px + 0.5) / size) * 2 - 1, y = 1 - ((py + 0.5) / size) * 2;
            const reach = Math.hypot(x, y);
            if (reach > 0.999) [x, y] = [(x / reach) * 0.999, (y / reach) * 0.999];
            const n = [x, y, Math.sqrt(Math.max(0, 1 - x * x - y * y))];
            const lit = clamp((n[0] * KEY[0] + n[1] * KEY[1] + n[2] * KEY[2] + wrap) / (1 + wrap));
            const half = [KEY[0], KEY[1], KEY[2] + 1], length = Math.hypot(...half);
            const spot = clamp((n[0] * half[0] + n[1] * half[1] + n[2] * half[2]) / length) ** gloss;
            const fresnel = (1 - n[2]) ** 3;
            const reflected = [2 * n[2] * n[0], 2 * n[2] * n[1], 2 * n[2] * n[2] - 1];
            const diffuse = base.map((value) => value * (0.18 + 0.9 * lit));
            const colour = mix(diffuse, room(reflected).map((value, k) => value * base[k] * 1.6), metal)
              .map((value, k) => value + spot * shine + fresnel * rim[k]);
            colour.forEach((value, k) => (image.data[(py * size + px) * 4 + k] = Math.round(clamp(value) ** (1 / 2.2) * 255)));
            image.data[(py * size + px) * 4 + 3] = 255;
          }
        context.putImageData(image, 0, 0);
        return texture.canvas(canvas);
      }
      const BALLS = {
        'red clay': ball({ base: [0.55, 0.16, 0.08], shine: 0.08, gloss: 6, wrap: 0.3, rim: [0.25, 0.1, 0.05] }),
        chrome: ball({ base: [0.9, 0.92, 0.95], metal: 1, shine: 1.2, gloss: 120 }),
        gold: ball({ base: [1, 0.72, 0.3], metal: 0.9, shine: 0.9, gloss: 60 }),
        jade: ball({ base: [0.12, 0.42, 0.26], shine: 0.5, gloss: 40, wrap: 0.6, rim: [0.2, 0.6, 0.4] }),
        pearl: ball({ base: [0.82, 0.78, 0.8], shine: 0.35, gloss: 25, wrap: 0.4, rim: [0.35, 0.3, 0.55] }),
        obsidian: ball({ base: [0.03, 0.03, 0.04], metal: 0.35, shine: 1.4, gloss: 200, rim: [0.2, 0.25, 0.4] }),
      };
      const NAMES = Object.keys(BALLS);
      const matcaps = Object.fromEntries(NAMES.map((name) => [name, material.meshMatcap({ matcap: BALLS[name] })]));
      // The same pictures flat on a disc, lit by nothing: the ball the sculpture is reading.
      const flats = Object.fromEntries(NAMES.map((name) => [name, material.meshBasic({ map: BALLS[name] })]));

      // Three sculptures, all in the scene from the start; the one chosen is shown.
      const SHAPES = {
        knot: [geometry.torusKnot(0.9, 0.3, 256, 32, 2, 3)],
        rings: [geometry.torus(1.25, 0.09, 24, 128), geometry.torus(1.0, 0.09, 24, 128), geometry.torus(0.75, 0.09, 24, 128), geometry.sphere(0.4, 48, 24)],
        vase: [geometry.lathe([[0.001, -1.3], [0.55, -1.3], [0.62, -1.1], [0.95, -0.5], [1, 0], [0.7, 0.6], [0.35, 1], [0.32, 1.3], [0.45, 1.45], [0.4, 1.5], [0.001, 1.45]], 96)],
      };
      const sculptures = Object.fromEntries(Object.entries(SHAPES).map(([name, shapes]) => {
        const holder = object.group();
        const pieces = shapes.map((shape) => {
          const piece = object.mesh(shape, matcaps[NAMES[0]]);
          holder.add(piece);
          return piece;
        });
        holder.visible = false;
        world.scene.add(holder);
        return [name, { holder, pieces }];
      }));

      // The gallery: a stone floor, a plinth, a dark wall with the matcap hung on it as a round
      // picture, and six small balls on a bench, one per matcap, the chosen one lifted.
      const stone = material.meshStandard({ color: '#4a4038', roughness: 0.85 });
      const marble = material.meshStandard({ color: '#e8e0d4', roughness: 0.35 });
      const floor = object.mesh(geometry.cylinder(14, 14, 0.2, 96), stone);
      floor.position.y = -0.1;
      const plinth = object.mesh(geometry.box(1.8, 1.4, 1.8), marble);
      plinth.position.y = 0.7;
      const wall = object.mesh(geometry.box(12, 7, 0.4), material.meshStandard({ color: '#2a2230', roughness: 0.9 }));
      wall.position.set(0, 3.5, -5);
      const frame = object.mesh(geometry.torus(1.12, 0.08, 16, 96), material.meshStandard({ color: '#c89a4a', roughness: 0.3, metalness: 1 }));
      frame.position.set(0, 4.2, -4.75);
      const picture = object.mesh(geometry.circle(1.08, 96), flats[NAMES[0]]);
      picture.position.set(0, 4.2, -4.78);
      const bench = object.mesh(geometry.box(5.2, 0.5, 0.9), marble);
      bench.position.set(0, 0.25, 2.8);
      world.scene.add(floor, plinth, wall, frame, picture, bench);
      const samples = NAMES.map((name, k) => {
        const sample = object.mesh(geometry.sphere(0.3, 48, 24), matcaps[name]);
        sample.position.set((k - 2.5) * 0.82, 0.8, 2.8);
        world.scene.add(sample);
        return { sample, name, lift: 0 };
      });

      // A low warm key for long shadows across the floor, a cool fill so nothing falls to black.
      // They light the gallery; the matcap surfaces ignore them.
      const sun = light.directional({ color: '#ffc58a', intensity: 3.2, position: [-7, 5, 5], castShadow: true });
      const fill = light.hemisphere({ color: '#7f95c8', groundColor: '#3a2a22', intensity: 0.55 });
      const lamp = light.point({ color: '#ffb070', intensity: 18, distance: 9, position: [0, 6, -2.5] });
      world.scene.add(sun, fill, lamp);
      world.controls.target.set(0, 2.4, 0);
      world.controls.minDistance = 3.5;
      world.controls.maxDistance = 16;
      world.controls.maxPolarAngle = Math.PI / 2 - 0.05;

      let shown = null, rise = 0;
      const ui = controls({
        matcap: NAMES,
        sculpture: Object.keys(SHAPES),
        gallery: true,
        turn: true,
      }, (values, key) => {
        if (key === undefined || key === 'sculpture') {
          for (const { holder } of Object.values(sculptures)) holder.visible = false;
          shown = sculptures[values.sculpture];
          shown.holder.visible = true;
          rise = 0;
        }
        if (key === undefined || key === 'sculpture' || key === 'matcap') {
          for (const piece of shown.pieces) piece.material = matcaps[values.matcap];
          picture.material = flats[values.matcap];
        }
        // Switch off the gallery's lamps: the room goes dark, the matcap surfaces do not change.
        if (key === 'gallery') {
          sun.intensity = values.gallery ? 3.2 : 0;
          fill.intensity = values.gallery ? 0.55 : 0.04;
          lamp.intensity = values.gallery ? 18 : 0;
        }
        world.invalidate();
      }, world);

      // The opening: the camera arcs in from the side while the sculpture rises out of its plinth,
      // turning, then keeps swinging slowly in front of the wall. A press or a wheel on the canvas stops the camera.
      opening(world, (time) => {
        const arrive = ease.out(time / 4), angle = 1.9 - 1.5 * arrive + Math.sin(Math.max(0, time - 4) * 0.12) * 0.9;
        const distance = 13 - 5.2 * arrive, height = 6.5 - 2.6 * arrive;
        world.camera.position.set(Math.sin(angle) * distance, height, Math.cos(angle) * distance);
      });
      let time = 0, turn = 0;
      world.onFrame(({ delta }) => {
        const step = Math.min(delta, 0.05);
        time += step;
        rise = Math.min(1, rise + step / 1.6);
        if (ui.turn) turn += step * 0.5;
        const up = ease.out(rise);
        shown.holder.position.y = 0.2 + 2.7 * up;
        shown.holder.scale.setScalar(0.001 + up);
        shown.holder.rotation.set(0, turn + (1 - up) * 3, 0);
        // The rings turn inside each other like a gimbal, each about one axis of its own.
        const [outer, middle, inner] = sculptures.rings.pieces;
        outer.rotation.set(Math.PI / 2 + Math.sin(time * 0.4) * 0.5, 0, 0);
        middle.rotation.set(0, time * 0.7, 0);
        inner.rotation.set(time * 1.1, 0, 0);
        for (const one of samples) {
          one.lift += ((one.name === ui.matcap ? 1 : 0) - one.lift) * Math.min(1, step * 6);
          one.sample.position.y = 0.8 + one.lift * 0.35 + Math.sin(time * 2 + one.sample.position.x) * 0.03 * one.lift;
        }
        world.invalidate();
      });
    </script>
  </body>
</html>
