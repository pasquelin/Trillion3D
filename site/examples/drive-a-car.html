<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Drive a car</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      p {
        position: absolute;
        bottom: 0;
        margin: 0.5rem;
        color: #1f2a37;
        font: 12px system-ui;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p data-words="credit"></p>
    <script type="module">
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { vehicle } from '../runtime/engine.js';
      import { controls, readout } from '../runtime/kit.js';

      // A sports car, a motorcycle and a tank parked in a compiled valley. Each is a body on
      // wheels: `vehicle.car`, `vehicle.motorcycle` and `vehicle.tracked` put it on Jolt's own
      // vehicle constraint, with its engine, gearbox, differentials, suspension and anti-roll bars;
      // `world.controls` 'vehicle' drives the one you pick with the keyboard.
      const world = createWorld('view', { physics: true });
      world.scene.background = math.color('#bcd3e6');
      world.camera.far = 400;
      await world.scene.load('../assets/examples/terrain/cache/native/full/manifest.json');

      const sun = light.directional({ intensity: 3.2, castShadow: true });
      sun.position.set(40, 70, 25);
      world.scene.add(
        sun,
        light.hemisphere({ intensity: 1.1, color: '#ffffff', groundColor: '#6d7a5a' }),
      );

      // Cliffs around the 128 m valley, so no drive ends off its edge.
      const rock = material.meshStandard({ color: '#8b857c', roughness: 0.95, physics: 'stone' });
      for (const [x, z, w, d] of [
        [0, -66, 136, 4],
        [0, 66, 136, 4],
        [-66, 0, 4, 136],
        [66, 0, 4, 136],
      ]) {
        const cliff = object.mesh(geometry.box(w, 40, d), rock);
        cliff.position.set(x, 10, z);
        cliff.physics = 'static';
        cliff.receiveShadow = true;
        world.scene.add(cliff);
      }

      const paint = (color, extra = {}) =>
        material.meshStandard({ color, roughness: 0.45, metalness: 0.2, ...extra });
      const tyre = paint('#1d1f23', { roughness: 0.9, metalness: 0 });
      const hub = paint('#c9ccd1', { metalness: 0.8, roughness: 0.3 });
      const glow = (color) => paint(color, { emissive: color, emissiveIntensity: 2 });
      // A part drawn on a body: a mesh at `at`, never simulated on its own.
      const part = (parent, shape, look, at, turn = [0, 0, 0]) => {
        const mesh = object.mesh(shape, look);
        mesh.position.set(...at);
        mesh.rotation.set(...turn);
        mesh.castShadow = true;
        parent.add(mesh);
        return mesh;
      };
      // A wheel: a tyre whose axle runs along the body's x, placed where it rests on flat ground,
      // with a hub and a spoke to show it turn. Its radius and width are read from it.
      const wheel = (body, at, radius, width) => {
        const tread = part(body, geometry.cylinder(radius, radius, width, 28), tyre, at, [
          0,
          0,
          Math.PI / 2,
        ]);
        part(
          tread,
          geometry.cylinder(radius * 0.62, radius * 0.62, width * 1.04, 20),
          hub,
          [0, 0, 0],
        );
        part(tread, geometry.box(radius * 1.5, width * 1.08, radius * 0.18), tyre, [0, 0, 0]);
        return tread;
      };
      // A body: its box carries the mass. It and every part drawn with `solid` make its collision
      // shape, so that what is seen is what collides; its wheels are the vehicle's own.
      const hulls = new Map();
      const chassis = (size, color) => {
        const body = object.mesh(geometry.box(...size), paint(color));
        body.castShadow = body.receiveShadow = true;
        hulls.set(body, [{ type: 'box', halfExtents: size.map((side) => side / 2) }]);
        return body;
      };
      const drawn = {
        box: ({ halfExtents }) => geometry.box(...halfExtents.map((half) => half * 2)),
        sphere: ({ radius }) => geometry.sphere(radius, 20, 14),
        cylinder: ({ radius, halfHeight }) => geometry.cylinder(radius, radius, halfHeight * 2, 16),
      };
      const solid = (body, shape, look, at, turn) => {
        const mesh = part(body, drawn[shape.type](shape), look, at, turn);
        hulls.get(body).push({ ...shape, position: at, quaternion: mesh.quaternion.toArray() });
      };
      const block = (body, size, look, at, turn) =>
        solid(body, { type: 'box', halfExtents: size.map((side) => side / 2) }, look, at, turn);

      // The sports car, 1,470 kg: the C5 Corvette the engine's car is drawn from.
      const car = chassis([1.86, 0.45, 4.5], '#c8102e');
      block(
        car,
        [1.4, 0.42, 1.9],
        paint('#15191f', { roughness: 0.1, metalness: 0.6 }),
        [0, 0.43, 0.25],
      );
      block(car, [1.7, 0.06, 0.3], paint('#15191f'), [0, 0.4, 2.15]);
      for (const x of [-0.65, 0.65]) {
        block(car, [0.35, 0.1, 0.05], glow('#fff4d6'), [x, 0.05, -2.26]);
        block(car, [0.35, 0.1, 0.05], glow('#ff2a2a'), [x, 0.08, 2.26]);
      }
      const carWheels = [-1.35, 1.35].flatMap((z) =>
        [-0.8, 0.8].map((x) => wheel(car, [x, -0.2, z], 0.33, 0.26)),
      );

      // The motorcycle and its rider, 319 kg together.
      const bike = chassis([0.34, 0.45, 1.3], '#1f4fd1');
      block(bike, [0.4, 0.22, 0.55], paint('#1f4fd1'), [0, 0.32, -0.2]);
      block(bike, [0.7, 0.05, 0.05], paint('#2b303a'), [0, 0.62, -0.55]);
      block(bike, [0.4, 0.62, 0.3], paint('#2b2f36'), [0, 0.72, 0.2], [-0.35, 0, 0]);
      solid(bike, { type: 'sphere', radius: 0.16 }, paint('#f2c14e'), [0, 1.15, 0.05]);
      block(bike, [0.12, 0.08, 0.05], glow('#fff4d6'), [0, 0.25, -0.67]);
      const bikeWheels = [-0.72, 0.72].map((z) => wheel(bike, [0, -0.3, z], 0.31, 0.14));

      // The tank, 61 t: an M1 Abrams' hull, turret and gun, on six road wheels a side.
      const tank = chassis([3.6, 1, 7], '#5b6b3a');
      block(tank, [2.6, 0.7, 3.2], paint('#56663a'), [0, 0.85, 0.3]);
      solid(
        tank,
        { type: 'cylinder', radius: 0.13, halfHeight: 2.25 },
        paint('#4a5630'),
        [0, 0.9, -3.5],
        [Math.PI / 2, 0, 0],
      );
      for (const x of [-1.55, 1.55]) block(tank, [0.62, 0.12, 7.2], tyre, [x, -0.05, 0]);
      const tankWheels = [-2.75, -1.65, -0.55, 0.55, 1.65, 2.75].flatMap((z) =>
        [-1.55, 1.55].map((x) => wheel(tank, [x, -0.6, z], 0.42, 0.6)),
      );

      const fleet = {
        car: {
          body: car,
          mass: 1470,
          radius: 0.33,
          wheels: carWheels,
          make: vehicle.car,
          start: [0, 20],
        },
        motorcycle: {
          body: bike,
          mass: 319,
          radius: 0.31,
          wheels: bikeWheels,
          make: vehicle.motorcycle,
          start: [-8, 22],
        },
        tracked: {
          body: tank,
          mass: 61300,
          radius: 0.42,
          wheels: tankWheels,
          make: vehicle.tracked,
          start: [12, 28],
        },
      };
      for (const entry of Object.values(fleet))
        entry.driver = entry.make(entry.body, { wheels: entry.wheels });

      // Each starts on the ground below its spot, found by an exact raycast on the cooked valley
      // once the physics has streamed it in.
      const groundAt = async (x, z) => {
        const down = math.ray(math.vector3(x, 60, z), math.vector3(0, -1, 0));
        for (;;) {
          const hit = await world.raycast(down, { exact: true });
          if (hit) return hit.point.y;
          await new Promise((wait) => setTimeout(wait, 100));
        }
      };
      // Parked at `[x, z]`: set a little above what the ray meets there, level, facing `yaw`, and
      // simulated anew (setting `physics` again makes the body, and the vehicle with it, afresh).
      // Put back on its wheels, a vehicle stays where it stands, never on its start another may
      // have driven to since: the ray meets the vehicle itself, and it drops back onto its wheels.
      const park = async ({ body, mass, radius, wheels: [first] }, [x, z], yaw = 0) => {
        body.position.set(x, (await groundAt(x, z)) + radius - first.position.y + 0.3, z);
        body.quaternion.set(0, Math.sin(yaw / 2), 0, Math.cos(yaw / 2));
        body.physics = { mass, shape: { type: 'compound', parts: hulls.get(body) } };
      };
      const heading = math.vector3();
      const right = (entry) => {
        const { position, quaternion } = entry.body;
        heading.set(0, 0, -1).applyQuaternion(quaternion);
        return park(entry, [position.x, position.z], Math.atan2(-heading.x, -heading.z));
      };
      world.camera.position.set(0, 30, 60);
      world.camera.lookAt(0, 0, 0);
      for (const entry of Object.values(fleet)) {
        await park(entry, entry.start);
        world.scene.add(entry.body);
        world.physics.add(entry.driver);
      }

      let driven = fleet.car;
      world.controls.vehicle = driven.driver;
      world.controls.kind = 'vehicle';
      controls(
        {
          vehicle: ['car', 'motorcycle', 'tracked'],
          reset: () => right(driven),
        },
        ({ vehicle: kind }) => {
          driven = fleet[kind];
          world.controls.vehicle = driven.driver;
        },
        world,
      );
      const speed = readout('speed'),
        gear = readout('gear'),
        rpm = readout('rpm');

      // The camera follows the driven vehicle from behind, eased so a bump never shakes it.
      const chase = { car: [0, 2.4, 7.5], motorcycle: [0, 1.8, 5], tracked: [0, 5.5, 15] };
      const eye = math.vector3(),
        aim = math.vector3();
      world.beforeFrame(({ delta }) => {
        const { body, driver } = driven;
        const kind = driver.kind;
        eye
          .set(...chase[kind])
          .applyQuaternion(body.quaternion)
          .add(body.position);
        eye.y = Math.max(eye.y, body.position.y + 1);
        const ease = 1 - Math.exp(-delta * 5);
        world.camera.position.lerp(eye, ease);
        aim.copy(body.position);
        aim.y += kind === 'tracked' ? 1.5 : 0.8;
        world.camera.lookAt(aim);
        const shown = driver.gear === -1 ? 'R' : driver.gear === 0 ? 'N' : String(driver.gear);
        speed(`${Math.round(Math.abs(driver.speed) * 3.6)} km/h`);
        gear(shown);
        rpm(`${Math.round(driver.rpm)}`);
        world.invalidate();
      });
    </script>
  </body>
</html>
