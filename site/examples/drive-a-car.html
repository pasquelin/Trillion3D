<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Drive a car</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      p {
        position: absolute;
        bottom: 0;
        margin: 0.5rem;
        color: #1f2a37;
        font: 12px system-ui;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p data-words="credit"></p>
    <script type="module">
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { vehicle } from '../runtime/engine.js';
      import { controls, fleet, readout } from '../runtime/kit.js';

      // A sports car, a motorcycle and a tank parked in a compiled valley. Each is a body on
      // wheels: `vehicle.car`, `vehicle.motorcycle` and `vehicle.tracked` put it on Jolt's own
      // vehicle constraint, with its engine, gearbox, differentials, suspension and anti-roll bars;
      // `world.controls` 'vehicle' drives the one you pick with the keyboard.
      const world = createWorld('view', { physics: true });
      world.scene.background = math.color('#bcd3e6');
      world.camera.far = 400;
      await world.scene.load('../assets/examples/terrain/cache/native/full/manifest.json');

      const sun = light.directional({ intensity: 3.2, castShadow: true });
      sun.position.set(40, 70, 25);
      world.scene.add(
        sun,
        light.hemisphere({ intensity: 1.1, color: '#ffffff', groundColor: '#6d7a5a' }),
      );

      // Cliffs around the 128 m valley, so no drive ends off its edge.
      const rock = material.meshStandard({ color: '#8b857c', roughness: 0.95, physics: 'stone' });
      for (const [x, z, w, d] of [
        [0, -66, 136, 4],
        [0, 66, 136, 4],
        [-66, 0, 4, 136],
        [66, 0, 4, 136],
      ]) {
        const cliff = object.mesh(geometry.box(w, 40, d), rock);
        cliff.position.set(x, 10, z);
        cliff.physics = 'static';
        cliff.receiveShadow = true;
        world.scene.add(cliff);
      }

      // The three are built by the kit's `fleet`: each body and every part drawn on it make its
      // collision shape, so that what is seen is what collides, and each starts on the ground
      // below its spot, found by an exact raycast once the physics has streamed the valley in.
      world.camera.position.set(0, 30, 60);
      world.camera.lookAt(0, 0, 0);
      const { vehicles, right, chase } = await fleet(world, {
        geometry,
        material,
        object,
        math,
        vehicle,
      });

      let driven = vehicles.car;
      world.controls.vehicle = driven.driver;
      world.controls.kind = 'vehicle';
      controls(
        {
          vehicle: ['car', 'motorcycle', 'tracked'],
          reset: () => right(driven),
        },
        ({ vehicle: kind }) => {
          driven = vehicles[kind];
          world.controls.vehicle = driven.driver;
        },
        world,
      );
      const speed = readout('speed'),
        gear = readout('gear'),
        rpm = readout('rpm');

      // The camera follows the driven vehicle from behind, eased so a bump never shakes it.
      world.beforeFrame(({ delta }) => {
        chase(driven, delta);
        const { driver } = driven;
        const shown = driver.gear === -1 ? 'R' : driver.gear === 0 ? 'N' : String(driver.gear);
        speed(`${Math.round(Math.abs(driver.speed) * 3.6)} km/h`);
        gear(shown);
        rpm(`${Math.round(driver.rpm)}`);
        world.invalidate();
      });
    </script>
  </body>
</html>
