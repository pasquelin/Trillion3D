<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Light bouncing off a red wall</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light } from '../runtime/engine.js';

      const world = createWorld('view', { controls: 'orbit' });
      // Light that bounces: off by default, on for this session.
      world.bounce = true;
      const plaster = material.meshStandard({ color: [0.82, 0.8, 0.76], roughness: 0.9 });
      const floor = object.mesh(geometry.box(8, 0.3, 8), plaster);
      floor.position.y = -0.15;
      const wall = object.mesh(geometry.box(0.3, 3, 8), material.meshStandard({ color: [0.75, 0.08, 0.05], roughness: 0.7 }));
      wall.position.set(-2.5, 1.5, 0);
      const column = object.mesh(geometry.box(0.6, 2, 0.6), plaster);
      column.position.set(-1.2, 1, 0.8);
      world.scene.add(floor, wall, column);

      // The sun reaches the red wall and the floor, not the column's face turned from it, nor
      // its own shadow. What each surface returns depends on what colour struck it.
      world.scene.add(light.directional({
        intensity: 3.5, color: [1, 0.96, 0.9], position: [15, 11, 4], target: [0, 0, 0], castShadow: true,
      }));
      world.camera.position.set(-1.75, 1.4, 4.2);
      world.camera.lookAt(-1.6, 0.8, 0.6);
      world.controls.target.set(-1.6, 0.8, 0.6);
      world.invalidate();
    </script>
  </body>
</html>
