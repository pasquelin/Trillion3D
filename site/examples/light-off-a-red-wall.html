<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Light bouncing off a red wall</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createExplorer } from '../runtime/engine.js';

      const explorer = await createExplorer('view', {
        manifestUrl: '../assets/examples/red-wall/cache/native/full/manifest.json',
        scope: 'full',
        interactive: true,
        // Light that bounces: off by default, on for this session. The cache carries the
        // resident proxy the bounce is traced against.
        bounce: true,
      });
      // The sun reaches the red wall and the floor, not the column's shadow nor its face turned
      // from the sun. What lights those is the sun's light bounced off the wall — and it comes
      // back red. With `bounce` off the shadow is black: no declared light reaches it.
      explorer.addLight({
        id: 'sun',
        kind: 'directional',
        direction: [-0.75, -0.55, -0.2],
        color: [1, 0.96, 0.9],
        intensity: 3.5,
        castsShadow: true,
      });
      explorer.setPose({ ...explorer.homePose(), position: [-1.75, 1.4, 4.2], target: [-1.6, 0.8, 0.6] });
      explorer.invalidate();
    </script>
  </body>
</html>
