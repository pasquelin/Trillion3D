<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A ring of lamps on one budget</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createExplorer } from '../runtime/engine.js';

      const view = document.getElementById('view');
      const explorer = await createExplorer(view, {
        manifestUrl: '../assets/examples/still-life/cache/native/full/manifest.json',
        scope: 'full',
        interactive: true,
      });
      explorer.addLight({
      "id": "sun",
      "kind": "directional",
      "direction": [
              -0.55,
              -0.7,
              -0.45
      ],
      "color": [
              1,
              0.95,
              0.85
      ],
      "intensity": 3,
      "castsShadow": true
});
      explorer.addLight({
      "id": "lamp-1",
      "kind": "point",
      "position": [
              3,
              2,
              0
      ],
      "color": [
              1,
              0.4,
              0.2
      ],
      "intensity": 10,
      "range": 8
});
      explorer.addLight({
      "id": "lamp-2",
      "kind": "point",
      "position": [
              -3,
              2,
              0
      ],
      "color": [
              0.2,
              0.6,
              1
      ],
      "intensity": 10,
      "range": 8
});
      explorer.addLight({
      "id": "lamp-3",
      "kind": "point",
      "position": [
              0,
              2,
              3
      ],
      "color": [
              0.3,
              1,
              0.4
      ],
      "intensity": 10,
      "range": 8
});
      // Multiple clustered point lights evaluated on one per-tile budget.
explorer.setPose({ ...explorer.homePose(), position: [4.5, 3.2, 4.5], target: [0, 0.6, 0] });
explorer.invalidate();
    </script>
  </body>
</html>
