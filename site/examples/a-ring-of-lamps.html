<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A ring of lamps on one budget</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e1621;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      p {
        position: absolute;
        bottom: 0;
        margin: 0.5rem;
        color: #cbd5e1;
        font: 12px system-ui;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p id="shadows"></p>
    <script type="module">
      import { createWorld, geometry, material, object, light } from '../runtime/engine.js';

      const world = createWorld('view', { controls: 'orbit' });
      const sand = material.meshStandard({ color: [0.6, 0.55, 0.45], roughness: 0.9 });
      const chalk = material.meshStandard({ color: [0.88, 0.85, 0.78], roughness: 0.7 });
      const floor = object.mesh(geometry.box(6, 0.3, 14), sand);
      floor.position.y = -0.15;
      world.scene.add(floor);
      const profile = [[0, 0], [0.42, 0], [0.42, 0.25], [0.3, 0.25], [0.28, 2.7], [0.4, 2.7], [0.42, 2.95], [0, 2.95]];
      for (const side of [-1, 1]) {
        for (let index = 0; index < 6; index++) {
          const column = object.mesh(geometry.lathe(profile, 24), chalk);
          column.position.set(side * 1.8, 0, index * 2.4 - 6);
          world.scene.add(column);
        }
        const lintel = object.mesh(geometry.box(0.9, 0.4, 13.5), chalk);
        lintel.position.set(side * 1.8, 3.15, 0);
        world.scene.add(lintel);
      }

      // Sixteen shadow-casting lamps around the colonnade.
      for (let index = 0; index < 16; index++) {
        const angle = (index / 16) * Math.PI * 2;
        world.scene.add(light.point({
          position: [Math.sin(angle) * 3.2, 2.2, Math.cos(angle) * 7.2],
          color: index % 2 ? [1, 0.75, 0.45] : [0.7, 0.8, 1],
          intensity: 4,
          distance: 9,
          castShadow: true,
          radius: 0.1,
        }));
      }
      world.camera.position.set(4.5, 3.6, 10);
      world.camera.lookAt(0, 1.2, 0);
      world.controls.target.set(0, 1.2, 0);

      // The world settles once every lamp's shadow has been drawn; the counter reads the
      // resident pages until the scene stops moving.
      const shadows = document.getElementById('shadows');
      world.onFrame(({ metrics }) => {
        const text = `resident pages: ${metrics.residentPages ?? '?'} — triangles selected: ${metrics.selectedTriangles ?? '?'}`;
        if (shadows.textContent !== text) shadows.textContent = text;
      });
      world.invalidate();
    </script>
  </body>
</html>
