<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sixty-four lamps</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });

      // A dark floor and a grid of pale pillars to catch the light.
      const floor = object.mesh(geometry.box(16, 0.2, 16), material.meshStandard({ color: '#3a3d45', roughness: 0.7 }));
      floor.position.y = -0.1;
      world.scene.add(floor);
      const chalk = material.meshStandard({ color: '#e8e4da', roughness: 0.5 });
      const pillar = geometry.cylinder(0.25, 0.3, 1, 32);
      for (let row = -3; row <= 3; row++)
        for (let column = -3; column <= 3; column++) {
          const height = 0.6 + ((row * 7 + column * 3 + 50) % 5) * 0.35;
          const mesh = object.mesh(pillar, chalk);
          mesh.scale.y = height;
          mesh.position.set(column * 1.9, height / 2, row * 1.9);
          world.scene.add(mesh);
        }

      // A dim night sky, so a pillar's shaded side reads against the floor.
      world.scene.add(light.hemisphere({ intensity: 0.4, color: '#6f7fa8', groundColor: '#2a2c33' }));

      // Sixty-four lamps: each a point light and a small glowing bulb of its colour. The engine
      // sorts the lights into screen tiles, so each pixel only adds up the lamps that reach it.
      // They fly above the tallest pillar (2 m), so every top catches their light.
      const lamps = Array.from({ length: 64 }, (_, index) => {
        const colour = math.color().setHSL((index * 0.618) % 1, 0.9, 0.55);
        const glow = light.point({ color: colour, intensity: 14, distance: 6, radius: 0.08 });
        const bulb = object.mesh(geometry.sphere(0.08, 16, 12), material.meshStandard({ color: '#000000', emissive: colour, emissiveIntensity: 6 }));
        world.scene.add(glow, bulb);
        return { glow, bulb, phase: index * 2.39996, orbit: 1.5 + (index % 8) * 0.8 };
      });
      world.camera.position.set(0, 7, 9.5);
      world.camera.lookAt(0, 0, 0);
      world.controls.target.set(0, 0, 0);
      world.controls.maxPolarAngle = Math.PI / 2 - 0.05;

      const ui = controls({ lamps: [1, 64, 32, 1], speed: [0, 2, 0.6], power: [1, 40, 14], shadows: false }, (values) => {
        lamps.forEach(({ glow, bulb }, index) => {
          glow.visible = bulb.visible = index < values.lamps;
          glow.intensity = values.power;
          // Off by default: each moving lamp that casts a shadow redraws its shadow map every frame.
          glow.castShadow = values.shadows;
        });
      }, world);
      let time = 0;
      world.onFrame(({ delta }) => {
        time += delta * ui.speed;
        for (const { glow, bulb, phase, orbit } of lamps) {
          const angle = time * (6 / orbit) * 0.3 + phase;
          const at = [Math.cos(angle) * orbit, 2.5 + Math.sin(time * 1.3 + phase) * 0.3, Math.sin(angle) * orbit];
          glow.position.set(...at);
          bulb.position.set(...at);
        }
        world.invalidate();
      });
    </script>
  </body>
</html>
