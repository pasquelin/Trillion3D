<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>See the triangles</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      p {
        position: absolute;
        top: 0;
        margin: 0.5rem;
        color: #cbd5e1;
        font: 12px system-ui;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p data-words="credit"></p>
    <script type="module">
      import { createWorld, light, camera } from '../runtime/engine.js';
      import { controls, readout, language } from '../runtime/kit.js';

      const lit = (world) => {
        world.scene.add(light.directional({ intensity: 3.5, color: '#ffeedd', position: [12, 14, 8], castShadow: true }));
        world.scene.add(light.directional({ intensity: 0.8, color: '#8ca6e6', position: [-14, 4, 10] }));
      };
      // `?model=terrain-tiles` opens instead a terrain cooked tile by tile, the open world's path,
      // and `?model=terrain-tiles-none` its exact cook: a stretched triangle shows at once here.
      // `?model=chalet` opens a chalet of thin closed walls, 0.1 m slabs and 0.12 m logs, whose
      // walls every view and every pixel error must keep. Each: its cache, the eye, the target.
      const terrain = [[-160, 260, 920], [384, 40, 384]];
      const cook = new Map([
        ['terrain-tiles', ['terrain-tiles/cache', ...terrain]],
        ['terrain-tiles-none', ['terrain-tiles/cache-none', ...terrain]],
        ['chalet', ['chalet/cache', [13, 7, 15], [0, 3.4, 0]]],
      ]).get(new URLSearchParams(location.search).get('model'));
      const [cache, eye, target] = cook ?? [null, [0.36, 0.34, 0.64], [0, 0.25, 0]];
      // The bust's path stays literal: the examples test reads it to check the file and its credit.
      const load = (scene) => cache ? scene.load(`../assets/examples/${cache}/native/full/manifest.json`) : scene.load('../assets/examples/bust/cache/native/full/manifest.json');
      // Only the bust is a scan: its credit is not shown over the scenes built in code.
      document.querySelector('[data-words="credit"]').hidden = Boolean(cook);

      // The scanned bust (or a scene built in code), drawn as its triangles: each its own colour.
      const world = createWorld('view', { controls: 'orbit' });
      await load(world.scene);
      lit(world);
      world.camera.position.set(...eye);
      world.camera.lookAt(...target);
      world.controls.target.set(...target);

      // The lit comparison shares the loaded scene, lights and residency with the diagnostic view.
      let beauty = null;
      const fit = () => {
        const width = world.canvas.clientWidth / 2, height = world.canvas.clientHeight;
        if (!beauty || !width || !height) return;
        world.rect = { x: 0, y: 0, width, height };
        beauty.rect = { x: width, y: 0, width, height };
      };
      new ResizeObserver(fit).observe(world.canvas);

      // `world.diagnostic.mode` swaps the image for a view of the engine's own work;
      // `world.pixelError` is how many pixels a coarser version may be off before a finer one
      // is drawn: 0 draws the exact triangles, more draws fewer and bigger ones.
      controls({
        view: ['triangles', 'clusters', 'lod', 'pages', 'beauty'],
        pixelError: [0, 16, 0, 0.5],
        sideBySide: false,
      }, (values) => {
        world.diagnostic.mode = values.view;
        world.pixelError = values.pixelError;
        if (values.sideBySide && !beauty) {
          beauty = world.addView({ camera: camera.perspective(), rect: { x: 1, y: 0, width: 1, height: 1 } });
          beauty.diagnostic.mode = 'beauty';
        } else if (!values.sideBySide && beauty) {
          beauty.dispose();
          beauty = null;
          world.rect = null;
        }
        fit();
        world.invalidate();
      }, world);
      const triangles = readout('trianglesDrawn'), pages = readout('pagesMemory');
      world.onFrame(({ metrics }) => {
        triangles(metrics.selectedTriangles?.toLocaleString(language()) ?? '?');
        pages(String(metrics.residentPages ?? '?'));
      });
      world.beforeFrame(() => {
        if (!beauty) return;
        beauty.camera.fov = world.camera.fov;
        beauty.camera.near = world.camera.near;
        beauty.camera.far = world.camera.far;
        beauty.camera.zoom = world.camera.zoom;
        beauty.camera.position.copy(world.camera.position);
        beauty.camera.quaternion.copy(world.camera.quaternion);
      });
      world.invalidate();
    </script>
  </body>
</html>
