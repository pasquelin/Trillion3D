<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A field of ten thousand pebbles</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p id="count"></p>
    <script type="module">
      import { createWorld, geometry, material, object, light, metric } from '../runtime/engine.js';

      // A deterministic sequence in [0, 1): the same field from the same seed on every run.
      function random(seed) {
        let state = seed >>> 0;
        return () => (state = (Math.imul(state, 1664525) + 1013904223) >>> 0) / 4294967296;
      }

      const world = createWorld('view', { controls: 'orbit' });
      const bed = object.mesh(geometry.box(20, 0.2, 20), material.meshStandard({ color: [0.68, 0.6, 0.45], roughness: 0.9 }));
      bed.position.y = -0.1;
      world.scene.add(bed);

      // One pebble mesh, geometry and material shared, placed ten thousand times: the compiler
      // would cut it once and the engine would draw every placement from the same pages.
      const COUNT = 10000,
        pebbleGeometry = geometry.sphere(0.08, 12, 12),
        pebbleMaterial = material.meshStandard({ color: [0.55, 0.53, 0.5], roughness: 0.8 }),
        next = random(7);
      for (let index = 0; index < COUNT; index++) {
        const pebble = object.mesh(pebbleGeometry, pebbleMaterial);
        pebble.position.set((next() - 0.5) * 18, 0.03, (next() - 0.5) * 18);
        pebble.rotation.y = next() * Math.PI * 2;
        pebble.scale.set(0.7 + next(), 0.5 + next() * 0.4, 0.7 + next() * 0.8);
        world.scene.add(pebble);
      }

      world.scene.add(light.directional({
        intensity: 3, color: [1, 0.93, 0.82], position: [12, 9, 13], target: [0, 0, 0], castShadow: true,
      }));
      world.camera.position.set(4, 1.1, 6);
      world.camera.lookAt(-3, 0, -4);
      world.controls.target.set(-3, 0, -4);

      // Every pebble shares one geometry and one material: the counter reads how few draw calls
      // ten thousand placements actually take.
      const count = document.getElementById('count');
      world.onFrame(() => {
        const { drawCalls } = metric.frame(world);
        count.textContent = `${COUNT} pebbles and their bed — ${drawCalls ?? '?'} draw calls`;
      });
      world.invalidate();
    </script>
  </body>
</html>
