<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A field of pebbles</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls, seeded } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      // An evening sky, and a beach that runs past the far plane to meet it at the horizon.
      world.scene.background = math.color('#e3b98f');
      world.camera.far = 300;
      const bed = object.mesh(geometry.box(800, 0.2, 800), material.meshStandard({ color: '#c9ad7f', roughness: 0.9 }));
      bed.position.y = -0.1;
      world.scene.add(bed);

      // One pebble shape and six materials, placed ten thousand times: the engine draws every
      // placement of a shape and a material together. A seeded sequence places them: the same
      // field on every run.
      const COUNT = 10000, pebble = geometry.sphere(0.08, 12, 12), next = seeded(7);
      const stones = Array.from({ length: 6 }, () => material.meshStandard({ roughness: 0.35 }));
      for (let index = 0; index < COUNT; index++) {
        const mesh = object.mesh(pebble, stones[index % 6]);
        mesh.position.set((next() - 0.5) * 18, 0.03, (next() - 0.5) * 18);
        mesh.rotation.y = next() * Math.PI * 2;
        mesh.scale.set(0.7 + next(), 0.5 + next() * 0.4, 0.7 + next() * 0.8);
        world.scene.add(mesh);
      }
      // A low evening sun: every pebble drags a long shadow behind it. The sky lights the sides
      // the sun misses.
      const sun = light.directional({ intensity: 3.5, color: '#ffc58a', castShadow: true });
      world.scene.add(sun, light.hemisphere({ intensity: 1, color: '#9fb4ff', groundColor: '#8a7456' }));
      world.camera.position.set(2.2, 0.9, 3.2);
      world.camera.lookAt(-1, 0, -1);
      world.controls.target.set(-1, 0, -1);
      world.controls.maxPolarAngle = Math.PI / 2 - 0.05;

      // The six colours run from one picked colour to the other.
      // The sun moves only when a slider does: a still scene redraws nothing.
      controls({ sunTurn: [0, 360, 35, 1], sunHeight: [0.1, 1.5, 0.35], first: '#f4efe4', last: '#2f6f8f' }, ({ sunTurn, sunHeight, first, last }) => {
        const turn = math.degToRad(sunTurn);
        sun.position.set(Math.cos(turn) * 10, sunHeight * 10, Math.sin(turn) * 10);
        stones.forEach((stone, index) => stone.color.copy(math.color(first)).lerp(math.color(last), index / 5));
        world.invalidate();
      }, world);
    </script>
  </body>
</html>
