<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A molecule</title>
    <meta name="thumbnail" content="5" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d14;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls, readout } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      world.scene.background = math.color('#0b0d14');

      // The palette the atoms are painted from: one material per colour, shared by every atom and
      // every half-bond of that colour.
      const PAINTS = ['#ff5a5f', '#ff9f1c', '#ffd23f', '#9be564', '#2ec4b6', '#3a86ff', '#8e6cff', '#ff5ab4', '#f4f1ea', '#a7b0c0', '#e8412c', '#3f6fe8'];
      const paints = PAINTS.map((color) => material.meshStandard({ color, roughness: 0.28, metalness: 0.1 }));
      const [RED, ORANGE, YELLOW, GREEN, TEAL, BLUE, VIOLET, PINK, WHITE, SILVER, OXYGEN, NITROGEN] = PAINTS.keys();

      // Four structures, each atoms (a point and a paint) and bonds (two atoms). Carbon cages and
      // crystals are bonded wherever two atoms stand one bond length apart.
      const bondedByDistance = (atoms, length) => {
        const bonds = [];
        for (let a = 0; a < atoms.length; a++)
          for (let b = a + 1; b < atoms.length; b++) {
            const d = Math.hypot(...atoms[a].at.map((value, axis) => value - atoms[b].at[axis]));
            if (d > length * 0.85 && d < length * 1.15) bonds.push([a, b]);
          }
        return bonds;
      };
      const phi = (1 + Math.sqrt(5)) / 2, PATCHES = [RED, ORANGE, YELLOW, GREEN, TEAL, BLUE, VIOLET, PINK, WHITE, OXYGEN, NITROGEN, SILVER];
      function buckyball() {
        // The truncated icosahedron: every cyclic turn of three sign patterns, edge length 2.
        const seeds = [[0, 1, 3 * phi], [1, 2 + phi, 2 * phi], [phi, 2, 2 * phi + 1]], at = [];
        for (const seed of seeds)
          for (let signs = 0; signs < 8; signs++) {
            const p = seed.map((value, axis) => (signs >> axis) & 1 ? -value : value);
            if (seed.some((value, axis) => value === 0 && (signs >> axis) & 1)) continue;
            for (let turn = 0; turn < 3; turn++) at.push([p[turn % 3], p[(turn + 1) % 3], p[(turn + 2) % 3]]);
          }
        // Each atom belongs to one of twelve pentagons, around one of the twelve corners of an
        // icosahedron: painted by the nearest corner, the ball shows its twelve patches.
        const corners = [[0, 1, phi], [0, -1, phi], [0, 1, -phi], [0, -1, -phi]].flatMap((p) => [0, 1, 2].map((turn) => [p[turn % 3], p[(turn + 1) % 3], p[(turn + 2) % 3]]));
        const atoms = at.map((p) => {
          const nearest = corners.reduce((best, c, k) => (p[0] * c[0] + p[1] * c[1] + p[2] * c[2] > p[0] * corners[best][0] + p[1] * corners[best][1] + p[2] * corners[best][2] ? k : best), 0);
          return { at: p, paint: PATCHES[nearest] };
        });
        return { atoms, bonds: bondedByDistance(atoms, 2), length: 2 };
      }
      function nanotube() {
        // A honeycomb sheet, bond length 1, rolled into a tube: its x becomes the angle round.
        // Its atoms stand in 24 columns half a cell apart; the rows kept end on atoms with two bonds.
        const radius = (12 * Math.sqrt(3)) / (Math.PI * 2), atoms = [], seen = new Set();
        for (let i = -12; i < 12; i++)
          for (let j = 0; j < 9; j++)
            for (const dy of [0, 1]) {
              const column = (((2 * i + j) % 24) + 24) % 24, y = j * 1.5 + dy, key = `${column}|${y}`;
              if (y < 1 || y > 12 || seen.has(key)) continue;
              seen.add(key);
              const angle = (column / 24) * Math.PI * 2;
              atoms.push({ at: [radius * Math.cos(angle), y - 6.5, radius * Math.sin(angle)], paint: [TEAL, BLUE, VIOLET, PINK, RED, ORANGE][Math.min(5, Math.floor(y / 2.25))] });
            }
        return { atoms, bonds: bondedByDistance(atoms, 1), length: 1 };
      }
      function diamond() {
        // Two interleaved face-centred cubic lattices, cut round: every carbon holds four others.
        const a = 4 / Math.sqrt(3), base = [[0, 0, 0], [0, 0.5, 0.5], [0.5, 0, 0.5], [0.5, 0.5, 0]], atoms = [];
        for (let i = -3; i <= 3; i++)
          for (let j = -3; j <= 3; j++)
            for (let k = -3; k <= 3; k++)
              for (const shift of [0, 0.25])
                for (const b of base) {
                  const p = [i + b[0] + shift, j + b[1] + shift, k + b[2] + shift].map((value) => (value - 0.125) * a);
                  const reach = Math.hypot(...p);
                  if (reach < 3.6) atoms.push({ at: p, paint: [WHITE, SILVER, TEAL, BLUE, VIOLET][Math.min(4, Math.floor(reach / 0.8))] });
                }
        return { atoms, bonds: bondedByDistance(atoms, 1), length: 1 };
      }
      function helix() {
        // Sixteen base pairs, a turn every ten: phosphates and sugars on two strands winding round
        // one axis, and between them the bases, A with T and G with C.
        const atoms = [], bonds = [], PAIRS = 16, BASES = [[GREEN, PINK], [PINK, GREEN], [YELLOW, BLUE], [BLUE, YELLOW]];
        const add = (at, paint) => atoms.push({ at, paint }) - 1;
        let last = null;
        for (let k = 0; k < PAIRS; k++) {
          const turn = (k * Math.PI * 2) / 10, y = (k - (PAIRS - 1) / 2) * 0.34;
          const one = [Math.cos(turn), y, Math.sin(turn)], two = [Math.cos(turn + 2.6), y, Math.sin(turn + 2.6)];
          const p1 = add(one, ORANGE), p2 = add(two, ORANGE), [c1, c2] = BASES[(k * 7) % 4];
          const along = (from, to, share) => from.map((value, axis) => value + (to[axis] - value) * share);
          const b1 = add(along(one, two, 0.2), NITROGEN), b2 = add(along(one, two, 0.38), c1);
          const b3 = add(along(one, two, 0.62), c2), b4 = add(along(one, two, 0.8), NITROGEN);
          bonds.push([p1, b1], [b1, b2], [b2, b3], [b3, b4], [b4, p2]);
          if (last) {
            // A sugar between two phosphates of a strand, a little further out.
            for (const [from, to] of [[last[0], p1], [last[1], p2]]) {
              const middle = along(atoms[from].at, atoms[to].at, 0.5), out = 1.18 / Math.hypot(middle[0], middle[2]);
              const sugar = add([middle[0] * out, middle[1], middle[2] * out], OXYGEN);
              bonds.push([from, sugar], [sugar, to]);
            }
          }
          last = [p1, p2];
        }
        return { atoms, bonds, length: 0.36 };
      }

      // Every structure centred and scaled to the same size: a ball of radius three.
      const STRUCTURES = { 'C60 buckyball': buckyball(), 'carbon nanotube': nanotube(), 'diamond crystal': diamond(), 'DNA double helix': helix() };
      for (const structure of Object.values(STRUCTURES)) {
        const centre = [0, 1, 2].map((axis) => structure.atoms.reduce((sum, { at }) => sum + at[axis], 0) / structure.atoms.length);
        const reach = Math.max(...structure.atoms.map(({ at }) => Math.hypot(...at.map((value, axis) => value - centre[axis]))));
        const scale = 3 / reach;
        for (const atom of structure.atoms) atom.at = atom.at.map((value, axis) => (value - centre[axis]) * scale);
        structure.length *= scale;
      }

      // Pools of atoms and half-bonds, every one in the scene from the start, shown as needed. A
      // bond is two half-cylinders, each in the colour of the atom it leaves from.
      const ATOMS = Math.max(...Object.values(STRUCTURES).map(({ atoms }) => atoms.length));
      const BONDS = Math.max(...Object.values(STRUCTURES).map(({ bonds }) => bonds.length));
      const molecule = object.group();
      const ball = geometry.sphere(1, 32, 16), rod = geometry.cylinder(1, 1, 1, 16);
      const atoms = Array.from({ length: ATOMS }, () => {
        const mesh = object.mesh(ball, paints[0]);
        mesh.visible = false;
        molecule.add(mesh);
        return { mesh, from: [0, 0, 0], to: [0, 0, 0], delay: 0 };
      });
      const halves = Array.from({ length: BONDS * 2 }, () => {
        const mesh = object.mesh(rod, paints[0]);
        mesh.rotation.order = 'YXZ';
        mesh.visible = false;
        molecule.add(mesh);
        return mesh;
      });
      world.scene.add(molecule);

      // A dark stage below catches the shadow; a warm key, two coloured rims and a cool fill.
      const stage = object.mesh(geometry.cylinder(9, 9, 0.2, 96), material.meshStandard({ color: '#161a24', roughness: 0.4, metalness: 0.2 }));
      stage.position.y = -4.3;
      world.scene.add(
        stage,
        light.directional({ color: '#ffd9b0', intensity: 3, position: [-4, 9, 5], castShadow: true }),
        light.point({ color: '#40c8ff', intensity: 40, distance: 16, position: [6, 2, -4] }),
        light.point({ color: '#ff5ab4', intensity: 30, distance: 16, position: [-6, -1, -4] }),
        light.hemisphere({ color: '#8fa8ff', groundColor: '#20182a', intensity: 0.5 }),
      );
      world.camera.position.set(0, 1.6, 9.6);
      world.camera.lookAt(0, 0, 0);
      world.controls.target.set(0, 0, 0);
      world.controls.minDistance = 4;
      world.controls.maxDistance = 20;
      world.controls.maxPolarAngle = Math.PI / 2 + 0.12;

      // Styles as sizes, in bond lengths: the ball of an atom and the radius of a bond.
      const STYLES = { 'ball and stick': [0.3, 0.09], 'space filling': [0.85, 0], sticks: [0.13, 0.13] };
      let structure = null, flight = 1, sizeFrom = [0.3, 0.09], sizeTo = [0.3, 0.09], morph = 1, atomCount = null, bondCount = null;
      const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);
      // A new structure: every atom leaves where it stands for its new place, a little apart in
      // time; spare atoms fly out and vanish. The bonds wait for the atoms to land.
      function assemble(next) {
        structure = next;
        atoms.forEach((atom, k) => {
          const target = next.atoms[k];
          atom.from = [atom.mesh.position.x, atom.mesh.position.y, atom.mesh.position.z];
          atom.to = target ? target.at : atom.from.map((value) => value * 3);
          atom.delay = (k / ATOMS) * 0.45;
          if (target) {
            atom.mesh.material = paints[target.paint];
            atom.mesh.visible = true;
          }
        });
        next.bonds.forEach(([a, b], k) => {
          halves[k * 2].material = paints[next.atoms[a].paint];
          halves[k * 2 + 1].material = paints[next.atoms[b].paint];
        });
        flight = 0;
        atomCount?.(String(next.atoms.length));
        bondCount?.(String(next.bonds.length));
      }
      function placeBonds(grow) {
        const [, radius] = sizeNow();
        halves.forEach((mesh, k) => (mesh.visible = radius > 0 && k < structure.bonds.length * 2 && grow > 0));
        structure.bonds.forEach(([a, b], k) => {
          const p = structure.atoms[a].at, q = structure.atoms[b].at, d = q.map((value, axis) => value - p[axis]);
          const length = Math.hypot(...d), r = Math.max(0.001, radius * structure.length * grow);
          [0.25, 0.75].forEach((share, side) => {
            const mesh = halves[k * 2 + side];
            mesh.position.set(...p.map((value, axis) => value + d[axis] * share));
            mesh.rotation.set(Math.acos(Math.max(-1, Math.min(1, d[1] / length))), Math.atan2(d[0], d[2]), 0);
            mesh.scale.set(r, length / 2, r);
          });
        });
      }
      const sizeNow = () => sizeFrom.map((value, k) => value + (sizeTo[k] - value) * ease(morph));

      // The opening: the atoms start scattered in a wide cloud and gather into the buckyball.
      const scatter = ((state) => () => (state = (Math.imul(state, 1664525) + 1013904223) >>> 0) / 4294967296 - 0.5)(9);
      for (const atom of atoms) atom.mesh.position.set(scatter() * 30, scatter() * 20, scatter() * 30);

      const ui = controls({
        mouse: 'Drag to turn around the molecule; pick another and its atoms fly to their new places',
        molecule: Object.keys(STRUCTURES),
        style: Object.keys(STYLES),
        spin: true,
      }, (values, key) => {
        if (key === undefined || key === 'molecule') assemble(STRUCTURES[values.molecule]);
        if (key === 'style') {
          sizeFrom = sizeNow();
          sizeTo = STYLES[values.style];
          morph = 0;
        }
        world.invalidate();
      }, world);
      atomCount = readout('Atoms');
      bondCount = readout('Bonds');
      atomCount(String(structure.atoms.length));
      bondCount(String(structure.bonds.length));

      let turn = 0;
      world.onFrame(({ delta }) => {
        const step = Math.min(delta, 0.05);
        if (ui.spin) turn += step * 0.25;
        molecule.rotation.set(0.25, turn, 0);
        const moving = flight < 1.6, reshaping = morph < 1;
        if (moving) flight = Math.min(1.6, flight + step / 1.4);
        if (reshaping) morph = Math.min(1, morph + step / 0.6);
        if (moving || reshaping) {
          const [size] = sizeNow();
          atoms.forEach((atom, k) => {
            const t = ease(Math.min(1, Math.max(0, (flight - atom.delay) / 1))), swirl = (1 - t) * 1.6;
            const [x, y, z] = atom.from.map((value, axis) => value + (atom.to[axis] - value) * t);
            atom.mesh.position.set(x * Math.cos(swirl) - z * Math.sin(swirl), y, x * Math.sin(swirl) + z * Math.cos(swirl));
            const present = k < structure.atoms.length;
            atom.mesh.scale.setScalar(Math.max(0.001, size * structure.length * (present ? 1 : 1 - t)));
            if (!present && t >= 1) atom.mesh.visible = false;
          });
          // The bonds grow once the last atom has landed.
          placeBonds(Math.min(1, Math.max(0, (flight - 1.45) / 0.15)));
        }
        world.invalidate();
      });
    </script>
  </body>
</html>
