<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A colour ramp in linear light</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p>Far row: base colour in equal linear steps, 0 to 1. Near row: equal display steps, converted to linear.</p>
    <script type="module">
      import { createExplorer } from '../runtime/engine.js';

      const explorer = await createExplorer('view', {
        manifestUrl: '../assets/examples/ramp/cache/native/full/manifest.json',
        scope: 'full',
        interactive: true,
      });
      // Base colours are linear: the far row goes from 0 to 1 in equal linear steps and reads as
      // uneven to the eye, the near row takes equal display (sRGB) steps converted to linear and
      // reads as even. One white light straight down; the display transfer is applied once, at
      // composition.
      explorer.addLight({
        id: 'lamp',
        kind: 'directional',
        direction: [0, -1, -0.2],
        color: [1, 1, 1],
        intensity: 3.14,
        castsShadow: false,
      });
      explorer.setPose({ ...explorer.homePose(), position: [0, 4.6, 4.6], target: [0, 0, 0] });
      explorer.invalidate();
    </script>
  </body>
</html>
