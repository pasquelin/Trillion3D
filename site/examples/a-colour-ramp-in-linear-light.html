<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Linear colour ramp</title>
    <meta name="thumbnail" content="1.5" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      const slab = object.mesh(geometry.box(8, 0.3, 3.4), material.meshStandard({ color: '#111216', roughness: 0.9 }));
      slab.position.y = -0.15;
      world.scene.add(slab);
      // Colours are stored as linear light. The back row adds the same amount of light at each step
      // and looks uneven; the front row takes equal steps as a screen shows them (sRGB) and looks even.
      const display = (value) => (value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4);
      const tiles = [];
      for (let step = 0; step <= 10; step++)
        for (const [z, level] of [[-0.7, step / 10], [0.7, display(step / 10)]]) {
          const matter = material.meshStandard({ roughness: 0.9 });
          const tile = object.mesh(geometry.box(0.56, 0.3, 0.56), matter);
          tile.position.set((step - 5) * 0.62, 0.15, z);
          world.scene.add(tile);
          tiles.push({ matter, level });
        }
      world.scene.add(light.directional({ intensity: 3.14, position: [0, 23, 4.6] }));
      world.camera.position.set(0, 2.6, 3.6);
      world.camera.lookAt(0, 0, 0);
      world.controls.target.set(0, 0, 0);

      // Each tile is the picked colour, in linear light, scaled by its level.
      controls({ colour: '#ff9a3c' }, ({ colour }) => {
        const full = math.color(colour);
        for (const { matter, level } of tiles) matter.color.copy(full).multiplyScalar(level);
        world.invalidate();
      });
    </script>
  </body>
</html>
