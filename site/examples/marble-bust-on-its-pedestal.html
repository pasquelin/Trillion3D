<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Marble bust</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      p {
        position: absolute;
        top: 0;
        margin: 0.5rem;
        color: #cbd5e1;
        font: 12px system-ui;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p data-words="credit"></p>
    <script type="module">
      import { createWorld, light } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      // A loaded model is a compiled cache: the compiler cut the glTF file and its textures into
      // clusters, and the engine streams in the ones the view needs.
      const bust = await world.scene.load('../assets/examples/bust/cache/native/full/manifest.json');

      // A warm lamp that walks around the head, and a cool fill from the far side.
      const lamp = light.point({ intensity: 3, distance: 6, radius: 0.05, castShadow: true });
      world.scene.add(lamp, light.directional({ intensity: 0.5, color: '#8ca6e6', position: [-14, 4, 10] }));
      world.camera.position.set(0.45, 0.4, 0.66);
      world.camera.lookAt(0, 0.22, 0);
      world.controls.target.set(0, 0.22, 0);

      let circling = false;
      controls({ lampTurn: [-180, 180, 40, 1], lampHeight: [0, 1.2, 0.6], colour: '#ffd9a8', exposure: [0.3, 3, 1], circle: () => (circling = !circling, world.invalidate()) }, (values) => {
        const turn = (values.lampTurn * Math.PI) / 180;
        lamp.position.set(Math.sin(turn) * 0.9, values.lampHeight, Math.cos(turn) * 0.9);
        lamp.color.set(values.colour);
        world.exposure = values.exposure;
        world.invalidate();
      }, world);
      // The camera circles the point the orbit turns around, one step per frame, when asked (a step
      // no longer than a tenth of a second, so the first frame after a pause does not jump). It
      // moves the orbit's own pose, so a drag starts where the circle left the view, and a press
      // or a wheel on the canvas stops it: the viewer's hand always wins.
      for (const type of ['pointerdown', 'wheel'])
        world.canvas.addEventListener(type, () => (circling = false), { passive: true });
      world.onFrame(({ delta }) => {
        if (!circling) return;
        const { position } = world.camera, { target } = world.controls, turn = Math.min(delta, 0.1) * 0.3;
        const x = position.x - target.x, z = position.z - target.z;
        position.set(target.x + x * Math.cos(turn) + z * Math.sin(turn), position.y, target.z + z * Math.cos(turn) - x * Math.sin(turn));
        world.controls.update();
        world.invalidate();
      });
    </script>
  </body>
</html>
