<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A marble bust on its pedestal</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p>Marble Bust 01 by Rico Cilliers, Poly Haven, CC0 — see assets/examples/CREDITS.md</p>
    <script type="module">
      import { createExplorer } from '../runtime/engine.js';

      const explorer = await createExplorer('view', {
        manifestUrl: '../assets/examples/bust/cache/native/full/manifest.json',
        scope: 'full',
        interactive: true,
      });
      // A loaded model is a compiled cache: the compiler cut the glTF file and its textures into
      // clusters, and the engine streams them. One key light from the side, one soft fill.
      explorer.addLight({
        id: 'sun',
        kind: 'directional',
        direction: [-0.6, -0.7, -0.4],
        color: [1, 0.93, 0.82],
        intensity: 3.5,
        castsShadow: true,
      });
      explorer.addLight({
        id: 'fill',
        kind: 'directional',
        direction: [0.7, -0.2, -0.5],
        color: [0.55, 0.65, 0.9],
        intensity: 0.6,
        castsShadow: false,
      });
      explorer.setPose({ ...explorer.homePose(), position: [0.55, 0.45, 0.8], target: [0, 0.22, 0] });
      explorer.invalidate();
    </script>
  </body>
</html>
