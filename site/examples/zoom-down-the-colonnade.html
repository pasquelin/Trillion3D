<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Zooming down a colonnade</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createExplorer, webgpuPagesBackend } from '../runtime/engine.js';

      // Manual rendering: the loop below draws every frame itself, so the canvas size is given.
      const canvas = document.getElementById('view');
      const explorer = await createExplorer(canvas, {
        manifestUrl: '../assets/examples/colonnade/cache/native/full/manifest.json',
        scope: 'full',
        backends: [webgpuPagesBackend],
        width: canvas.clientWidth,
        height: canvas.clientHeight,
        pixelRatio: devicePixelRatio,
      });
      explorer.addLight({
        id: 'sun',
        kind: 'directional',
        direction: [-0.5, -0.5, -0.75],
        color: [1, 0.95, 0.85],
        intensity: 3,
        castsShadow: true,
      });

      // The camera stays at one end; only the field of view breathes between 20 and 90 degrees,
      // one pose per frame, then the pages that pose needs, one render, and the frame flushed.
      const home = explorer.homePose();
      async function zoom(time) {
        explorer.setPose({
          ...home,
          position: [0, 1.8, 11],
          target: [0, 1.5, -6],
          fov: 55 - Math.cos(time / 4000) * 35,
        });
        await explorer.awaitPages();
        explorer.render();
        await explorer.flush();
        requestAnimationFrame(zoom);
      }
      requestAnimationFrame(zoom);
    </script>
  </body>
</html>
