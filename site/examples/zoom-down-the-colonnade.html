<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Colonnade zoom</title>
    <meta name="thumbnail" content="2.5" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls, opening } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      const sand = material.meshStandard({ color: '#b59a73', roughness: 0.9 });
      const chalk = material.meshStandard({ color: '#eee5d2', roughness: 0.7 });
      const floor = object.mesh(geometry.box(6, 0.3, 30), sand);
      floor.position.set(0, -0.15, -8);
      world.scene.add(floor);
      const profile = [[0, 0], [0.42, 0], [0.42, 0.25], [0.3, 0.25], [0.28, 2.7], [0.4, 2.7], [0.42, 2.95], [0, 2.95]];
      const shaft = geometry.lathe(profile, 32);
      for (const side of [-1, 1]) {
        for (let index = 0; index < 12; index++) {
          const column = object.mesh(shaft, chalk);
          column.position.set(side * 1.8, 0, 4 - index * 2.4);
          world.scene.add(column);
        }
        const lintel = object.mesh(geometry.box(0.9, 0.4, 28), chalk);
        lintel.position.set(side * 1.8, 3.15, -9);
        world.scene.add(lintel);
      }
      // A red door at the far end: the subject the camera keeps the same size.
      const door = object.mesh(geometry.box(1.6, 2.6, 0.3), material.meshStandard({ color: '#b0302a', roughness: 0.5 }));
      door.position.set(0, 1.3, -23);
      world.scene.add(door);
      world.scene.add(light.directional({ intensity: 3.2, color: '#ffc890', position: [10, 5, 6], castShadow: true }));
      world.scene.add(light.hemisphere({ intensity: 1.3, color: '#b8ccf0', groundColor: '#7a6650' }));
      world.camera.far = 200;

      world.controls.target.set(0, 1.3, -23);
      world.controls.maxPolarAngle = Math.PI / 2 - 0.05;
      // Seen from where a 50° lens frames the door at the size the zoom then keeps.
      world.camera.fov = 50;
      world.camera.position.set(0, 1.4, -23 + 4.8 / Math.tan((50 * Math.PI) / 360));

      // The dolly zoom: the field of view narrows while the camera backs away along its view axis
      // just enough to keep the door the same size, so the colonnade around it seems to stretch.
      // What stays constant is the width the view spans at the target: distance × tan(fov / 2).
      const offset = math.vector3();
      const halfTan = (fov) => Math.tan((fov * Math.PI) / 360);
      const spanned = () => world.camera.position.distanceTo(world.controls.target) * halfTan(world.camera.fov);
      function place(fov, width = spanned()) {
        offset.subVectors(world.camera.position, world.controls.target).setLength(width / halfTan(fov));
        world.camera.position.copy(world.controls.target).add(offset);
        world.camera.fov = fov;
        // The orbit reads its pose back from the camera and the target: the next drag starts here.
        world.controls.update();
        world.invalidate();
      }

      // The automatic zoom runs until the viewer takes the camera: a press or a wheel on the canvas
      // stops it for good, and the button starts it again from wherever the viewer left the view.
      let phase = 0, kept = spanned();
      const zoom = opening(world, (time) => place(51 - Math.cos(phase + time / 2) * 39, kept));
      function start() {
        kept = spanned();
        phase = Math.acos(Math.min(1, Math.max(-1, (51 - world.camera.fov) / 39)));
        zoom.restart();
      }
      controls({ fieldOfView: [12, 90, 50, 1], dollyZoom: () => (zoom.gliding ? zoom.stop() : start()) }, (values, key) => {
        if (key !== 'fieldOfView') return;
        zoom.stop();
        place(values.fieldOfView);
      }, world);
    </script>
  </body>
</html>
