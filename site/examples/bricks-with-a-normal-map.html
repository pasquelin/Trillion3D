<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bricks with a normal map</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, texture } from '../runtime/engine.js';

      // The tangent-space normal map of a brick wall: courses of bricks, every second course
      // offset by half a brick, each brick a slightly rounded slab standing out of the mortar.
      // The map is the normalised gradient of that height field (green up); the wall itself
      // stays two triangles.
      function brickNormals(rows, columns, size = 512) {
        const height = (u, v) => {
          const course = Math.floor(v * rows),
            shift = course % 2 ? 0.5 / columns : 0,
            x = ((u + shift) * columns) % 1,
            y = (v * rows) % 1,
            mortar = 0.08,
            inside = Math.min(x, 1 - x, (y * columns) / rows, ((1 - y) * columns) / rows);
          return inside < mortar ? 0 : Math.min(1, (inside - mortar) / 0.06);
        };
        const step = 1 / size, pixels = new Uint8Array(size * size * 4);
        for (let py = 0; py < size; py++)
          for (let px = 0; px < size; px++) {
            const u = px / size, v = py / size,
              dx = (height(u + step, v) - height(u - step, v)) * 4,
              dy = (height(u, v + step) - height(u, v - step)) * 4,
              length = Math.hypot(dx, dy, 1),
              rgba = [0.5 - dx / length / 2, 0.5 + dy / length / 2, 0.5 + 1 / length / 2, 1];
            rgba.forEach((value, channel) => {
              pixels[(py * size + px) * 4 + channel] = Math.round(Math.min(1, Math.max(0, value)) * 255);
            });
          }
        return texture.data(pixels, size, size, 'rgba');
      }

      const world = createWorld('view', { controls: 'orbit' });
      const concrete = material.meshStandard({ color: [0.5, 0.5, 0.48], roughness: 0.9 });
      const floor = object.mesh(geometry.box(7, 0.2, 3), concrete);
      floor.position.set(0, -0.1, 1.5);
      const backing = object.mesh(geometry.box(6.4, 3.4, 0.3), concrete);
      backing.position.set(0, 1.5, -0.2);
      const wall = object.mesh(geometry.plane(6, 3), material.meshStandard({
        color: [0.62, 0.3, 0.22], roughness: 0.85, normalMap: brickNormals(12, 8),
      }));
      wall.position.set(0, 1.5, 0);
      world.scene.add(floor, backing, wall);

      // The bricks exist in the normal map alone; a light raking down the wall is what makes
      // the relief show.
      world.scene.add(light.directional({
        intensity: 3, color: [1, 0.95, 0.88], position: [9.8, 8.4, 4.2], target: [0, 0, 0], castShadow: true,
      }));
      world.camera.position.set(2.2, 1.9, 3.6);
      world.camera.lookAt(0, 1.4, 0);
      world.controls.target.set(0, 1.4, 0);
      world.invalidate();
    </script>
  </body>
</html>
