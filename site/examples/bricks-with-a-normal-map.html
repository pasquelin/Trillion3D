<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Brick normal map</title>
    <meta name="thumbnail" content="2" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, texture } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      // The normal map of a brick wall: courses of bricks, every second one offset by half a brick,
      // each brick a slab standing out of the mortar. Each pixel stores which way that relief faces:
      // red leans right, green leans up the picture, whose first row is its top.
      function brickNormals(rows, columns, size = 512) {
        const height = (u, v) => {
          const course = Math.floor(v * rows), shift = course % 2 ? 0.5 / columns : 0;
          const x = ((u + shift) * columns) % 1, y = (v * rows) % 1, mortar = 0.08;
          const inside = Math.min(x, 1 - x, (y * columns) / rows, ((1 - y) * columns) / rows);
          return inside < mortar ? 0 : Math.min(1, (inside - mortar) / 0.06);
        };
        const step = 1 / size, pixels = new Uint8Array(size * size * 4);
        for (let py = 0; py < size; py++)
          for (let px = 0; px < size; px++) {
            const u = px / size, v = py / size;
            const dx = (height(u + step, v) - height(u - step, v)) * 4, dy = (height(u, v + step) - height(u, v - step)) * 4;
            const length = Math.hypot(dx, dy, 1);
            [0.5 - dx / length / 2, 0.5 - dy / length / 2, 0.5 + 1 / length / 2, 1].forEach((value, channel) => {
              pixels[(py * size + px) * 4 + channel] = Math.round(Math.min(1, Math.max(0, value)) * 255);
            });
          }
        return texture.data(pixels, size, size, 'rgba');
      }
      const world = createWorld('view', { controls: 'orbit' });
      const bricks = material.meshStandard({ color: '#a4533a', roughness: 0.85, normalMap: brickNormals(12, 8) });
      // A wall 20 cm thick, its front face at z = 0: seen from any side, it stays a wall.
      const wall = object.mesh(geometry.box(6, 3, 0.2), bricks);
      wall.position.set(0, 1.5, -0.1);
      const floor = object.mesh(geometry.box(7, 0.2, 4.5), material.meshStandard({ color: '#55534f', roughness: 0.9 }));
      floor.position.set(0, -0.1, 0.75);
      world.scene.add(wall, floor);
      // A lamp close to the wall, sliding along it: its light grazes the bricks.
      const lamp = light.point({ intensity: 14, color: '#ffc27a', distance: 8, radius: 0.05 });
      world.scene.add(lamp, light.ambient({ intensity: 0.35, color: '#8fb4ff' }));
      world.camera.position.set(1.2, 1.7, 5.2);
      world.camera.lookAt(0, 1.4, 0);
      world.controls.target.set(0, 1.4, 0);
      world.controls.maxPolarAngle = Math.PI / 2 - 0.05;

      const ui = controls({ sweep: true, lamp: [-3, 3, -1.2], colour: '#ffc27a', bricks: '#a4533a' }, (values) => {
        lamp.color.set(values.colour);
        bricks.color.set(values.bricks);
        lamp.position.set(values.lamp, 1.8, 0.35);
        world.invalidate();
      }, world);
      world.onFrame(({ time }) => {
        if (!ui.sweep) return;
        lamp.position.set(Math.sin(time * 0.5) * 2.6, 1.8, 0.35);
        world.invalidate();
      });
    </script>
  </body>
</html>
