<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vr Composition Layers</title>
    <meta name="thumbnail" content="2" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101729;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, object, geometry, material, light } from '../runtime/engine.js';
      import { xrControls } from '../runtime/kit.js';
      const world = createWorld('view', { xr: true, controls: 'orbit', renderScale: 1 });
      world.camera.position.set(0, 1.6, 3);
      world.camera.lookAt(0, 1.2, -2);
      world.scene.add(
        object.mesh(geometry.box(6, 0.1, 6), material.meshStandard({ color: '#253350' })),
        light.ambient({ intensity: 1 }),
        light.directional({ intensity: 2, position: [2, 5, 3] }),
      );
      for (const [x, color] of [
        [-1, '#56b4e9'],
        [0, '#ffd166'],
        [1, '#d55e00'],
      ]) {
        const box = object.mesh(geometry.box(0.5, 0.5, 0.5), material.meshStandard({ color }));
        box.position.set(x, 1.2, -2);
        world.scene.add(box);
      }
      await xrControls(world, false, () => {
        const picture = document.createElement('canvas');
        picture.width = 1024;
        picture.height = 512;
        const ctx = picture.getContext('2d');
        ctx.fillStyle = '#202b47';
        ctx.fillRect(0, 0, 1024, 512);
        ctx.fillStyle = '#ffd166';
        ctx.font = '100px sans-serif';
        ctx.fillText('Trillion3D', 190, 290);
        const space = world.xr.referenceSpace.getOffsetReferenceSpace(
          new XRRigidTransform({ x: 0, y: 1.5, z: -2 }),
        );
        world.xr
          .createLayer('quad', {
            space,
            width: 1.2,
            height: 0.6,
            viewPixelWidth: 1024,
            viewPixelHeight: 512,
          })
          .update(picture);
      });
    </script>
  </body>
</html>
