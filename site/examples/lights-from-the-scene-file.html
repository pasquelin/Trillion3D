<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The lights the scene file brought</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p id="lamps"></p>
    <script type="module">
      import { createExplorer } from '../runtime/engine.js';

      const explorer = await createExplorer('view', {
        manifestUrl: '../assets/examples/hall/cache/native/full/manifest.json',
        scope: 'full',
        interactive: true,
      });
      // No `addLight` here. The scene file declares three lamps (`KHR_lights_punctual`); the
      // compiler read them, converted candela to the engine's radiometric unit and wrote them
      // beside the cache; the explorer declared them on open. They are listed below, as
      // `importedLights()` returns them, and they can be changed with `setLight` like any other.
      explorer.setPose({ ...explorer.homePose(), position: [0, 3.6, 8.5], target: [0, 1.2, -1] });
      explorer.invalidate();
      document.getElementById('lamps').textContent = explorer
        .importedLights()
        .map(({ id, kind, intensity }) => `${id}: ${kind}, ${intensity.toFixed(2)} W/sr`)
        .join(' — ');
    </script>
  </body>
</html>
