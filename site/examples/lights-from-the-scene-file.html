<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lights from the file</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      // No `light.*` call here. The scene file declares its lamps (`KHR_lights_punctual`); the
      // compiler read them, converted candela to the engine's radiometric unit, and the loaded
      // model carries them on `lights`, live lights like any other.
      const model = await world.scene.load('../assets/examples/hall/cache/native/full/manifest.json');
      world.camera.position.set(0, 3.6, 8.5);
      world.camera.lookAt(0, 1.2, -1);
      world.controls.target.set(0, 1.2, -1);

      // One on/off toggle, one power slider and one colour per lamp, declared from the file.
      const specs = {};
      model.lights.forEach((lamp, index) => {
        specs[`lamp${index + 1}`] = true;
        specs[`power${index + 1}`] = [0, lamp.intensity * 3, lamp.intensity];
        specs[`colour${index + 1}`] = `#${lamp.color.getHexString()}`;
      });
      controls(specs, (values) => {
        model.lights.forEach((lamp, index) => {
          // A lamp is a child of the model: hiding it, not removing it, turns it off.
          lamp.visible = values[`lamp${index + 1}`];
          lamp.intensity = values[`power${index + 1}`];
          lamp.color.set(values[`colour${index + 1}`]);
        });
        world.invalidate();
      });
    </script>
  </body>
</html>
