<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A lighthouse beam sweeping the shore</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createExplorer } from '../runtime/engine.js';

      // Manual rendering: the loop below draws every frame itself, so the canvas size is given.
      // No backend is named: the engine takes its own page raster where WebGPU was granted and
      // its own WebGL2 page path where it was not, which draws this scene without cast shadows.
      const canvas = document.getElementById('view');
      const explorer = await createExplorer(canvas, {
        manifestUrl: '../assets/examples/lighthouse/cache/native/full/manifest.json',
        scope: 'full',
        width: canvas.clientWidth,
        height: canvas.clientHeight,
        pixelRatio: devicePixelRatio,
      });
      // Night: a faint moon, and the beam — one spotlight in the lantern room, its emitter
      // radius enclosing the room and the tower top so that neither puts it out.
      explorer.addLight({
        id: 'moon',
        kind: 'directional',
        direction: [0.4, -0.6, 0.7],
        color: [0.5, 0.6, 0.85],
        intensity: 0.5,
        castsShadow: true,
      });
      explorer.addLight({
        id: 'beam',
        kind: 'spot',
        position: [0, 7.2, 0],
        direction: [1, -0.9, 0],
        coneAngle: 0.26,
        color: [1, 0.95, 0.8],
        intensity: 4000,
        range: 40,
        emitterRadius: 1.6,
        castsShadow: true,
      });
      explorer.setPose({ ...explorer.homePose(), position: [13, 8, 15], target: [0, 3, 0], far: 200 });

      // One turn every eight seconds: the beam's direction is set every frame and the shore
      // shows it where it lands — no fog is drawn, the beam itself is invisible in clear air.
      async function frame(time) {
        const angle = time / 8000 * Math.PI * 2;
        explorer.setLight('beam', { direction: [Math.cos(angle), -0.9, Math.sin(angle)] });
        await explorer.awaitPages();
        explorer.render();
        await explorer.flush();
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
