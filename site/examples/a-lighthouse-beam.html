<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lighthouse beam</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      function random(seed) {
        let state = seed >>> 0;
        return () => (state = (Math.imul(state, 1664525) + 1013904223) >>> 0) / 4294967296;
      }
      const world = createWorld('view', { controls: 'orbit' });
      world.camera.far = 200;
      const sand = material.meshStandard({ color: '#857c6a', roughness: 0.7 });
      const rock = material.meshStandard({ color: '#4a4744', roughness: 0.9 });
      const whitewash = material.meshStandard({ color: '#e0dccf', roughness: 0.8 });
      const shore = object.mesh(geometry.box(30, 0.4, 30), sand);
      shore.position.y = -0.2;
      const skirt = object.mesh(geometry.lathe([[0, 0], [4, 0], [3.4, 1.2], [2.6, 1.6], [0, 1.6]], 48), rock);
      const shaft = object.mesh(geometry.lathe([[0, 0], [1.4, 0], [1, 4.6], [1.3, 4.6], [1.3, 4.9], [0, 4.9]], 48), whitewash);
      shaft.position.y = 1.6;
      const room = object.mesh(geometry.cylinder(0.9, 0.9, 1.4, 32), material.meshStandard({ color: '#ffe9b0', emissive: '#ffe2a0', emissiveIntensity: 2 }));
      room.position.y = 7.2;
      const roof = object.mesh(geometry.cylinder(0.3, 1.3, 0.2, 32), whitewash);
      roof.position.y = 8.0;
      world.scene.add(shore, skirt, shaft, room, roof);
      // Boulders along the shore, where the beam lands.
      const next = random(11);
      for (let index = 0; index < 40; index++) {
        const distance = 4 + next() * 9, angle = next() * Math.PI * 2;
        const boulder = object.mesh(geometry.sphere(0.4 + next() * 0.9, 16, 12), rock);
        boulder.position.set(Math.cos(angle) * distance, -0.2, Math.sin(angle) * distance);
        world.scene.add(boulder);
      }
      // Night: a faint moon, and the beam, one spot light in the lantern room aimed through its
      // `target`. There is no fog, so the beam shows only where it lands.
      world.scene.add(light.directional({ intensity: 1, color: '#8099d9', position: [-8, 12, -14], castShadow: true }));
      const beam = light.spot({ position: [0, 7.2, 0], intensity: 4000, distance: 40, castShadow: true, radius: 1.6 });
      world.scene.add(beam);
      world.camera.position.set(11, 7, 13);
      world.camera.lookAt(0, 3, 0);
      world.controls.target.set(0, 3, 0);

      const ui = controls({ turnsPerMinute: [0, 30, 8, 1], beamWidth: [0.1, 0.6, 0.26], colour: '#fff2cc' }, (values) => {
        beam.angle = values.beamWidth;
        beam.color.set(values.colour);
        world.invalidate();
      });
      let angle = -1.6;
      world.onFrame(({ delta }) => {
        angle += (delta * ui.turnsPerMinute * Math.PI * 2) / 60;
        beam.target.position.set(Math.cos(angle) * 10, 7.2 - 0.9 * 10, Math.sin(angle) * 10);
        world.invalidate();
      });
      world.invalidate();
    </script>
  </body>
</html>
