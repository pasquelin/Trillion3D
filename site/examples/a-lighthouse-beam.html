<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A lighthouse beam sweeping the shore</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light } from '../runtime/engine.js';

      function random(seed) {
        let state = seed >>> 0;
        return () => (state = (Math.imul(state, 1664525) + 1013904223) >>> 0) / 4294967296;
      }

      // Host-led loop: the beam turns every frame, so the world schedules nothing.
      const world = createWorld('view', { interactive: false, controls: 'orbit', pixelRatio: devicePixelRatio });
      const sand = material.meshStandard({ color: [0.5, 0.47, 0.4], roughness: 0.7 });
      const rock = material.meshStandard({ color: [0.28, 0.27, 0.26], roughness: 0.9 });
      const whitewash = material.meshStandard({ color: [0.85, 0.83, 0.78], roughness: 0.8 });

      const shore = object.mesh(geometry.box(30, 0.4, 30), sand);
      shore.position.y = -0.2;
      const skirt = object.mesh(geometry.lathe([[0, 0], [4, 0], [3.4, 1.2], [2.6, 1.6], [0, 1.6]], 48), rock);
      const shaft = object.mesh(geometry.lathe([[0, 0], [1.4, 0], [1, 4.6], [1.3, 4.6], [1.3, 4.9], [0, 4.9]], 48), whitewash);
      shaft.position.y = 1.6;
      const room = object.mesh(geometry.cylinder(0.9, 0.9, 1.4, 32), material.meshStandard({
        color: [0.8, 0.85, 0.9], roughness: 0.1, opacity: 0.3, transparent: true,
      }));
      room.position.y = 7.2;
      const roof = object.mesh(geometry.cylinder(0.3, 1.3, 0.2, 32), whitewash);
      roof.position.y = 8.0;
      world.scene.add(shore, skirt, shaft, room, roof);

      // Boulders scattered along the shore, the same rock material as the tower's base.
      const next = random(11);
      for (let index = 0; index < 24; index++) {
        const distance = 4 + next() * 8, angle = next() * Math.PI * 2;
        const boulder = object.mesh(geometry.sphere(0.5 + next(), 12, 12), rock);
        boulder.position.set(Math.cos(angle) * distance, -0.2, Math.sin(angle) * distance);
        world.scene.add(boulder);
      }

      // Night: a faint moon, and the beam — one spot light in the lantern room, aimed through
      // its own `target` node, like a Three.js spot light (`beam.lookAt(...)` would aim it too).
      world.scene.add(light.directional({
        intensity: 0.5, color: [0.5, 0.6, 0.85], position: [-8, 12, -14], target: [0, 0, 0], castShadow: true,
      }));
      const beam = light.spot({
        position: [0, 7.2, 0], color: [1, 0.95, 0.8], intensity: 4000, distance: 40, angle: 0.26, castShadow: true,
        radius: 1.6,
      });
      world.scene.add(beam);
      world.camera.position.set(13, 8, 15);
      world.camera.lookAt(0, 3, 0);
      world.controls.target.set(0, 3, 0);
      world.camera.far = 200;

      // One turn every eight seconds: the beam's aim is set every frame and the shore shows it
      // where it lands — no fog is drawn, the beam itself is invisible in clear air.
      function frame(time) {
        const angle = (time / 8000) * Math.PI * 2, radius = 10;
        beam.target.position.set(Math.cos(angle) * radius, 7.2 - 0.9 * radius, Math.sin(angle) * radius);
        world.render();
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
