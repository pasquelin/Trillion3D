<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A chess opening from above</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #22332a;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls, readout } from '../runtime/kit.js';

      // A short opening (the Scotch game), move by move, squares written from and to. Castling moves
      // the king, then the rook: `+` joins the two.
      const OPENING = 'e2e4 e7e5 g1f3 b8c6 d2d4 e5d4 f3d4 g8f6 b1c3 f8b4 d4c6 b7c6 f1d3 d7d5 e1g1+h1f1';
      const BACK = ['rook', 'knight', 'bishop', 'queen', 'king', 'bishop', 'knight', 'rook'];

      // `panZoom`: a flat view that never turns. The camera looks straight down from high up through
      // a narrow lens, so the pieces at the edge of the board stand as straight as those in the middle.
      const world = createWorld('view', { controls: 'panZoom' });
      world.scene.background = math.color('#22332a');
      world.camera.fov = 26;
      world.camera.far = 200;
      // A felt table wider than any zoom shows, and a wooden frame around the board.
      const felt = object.mesh(geometry.box(160, 0.2, 160), material.meshStandard({ color: '#2d4a37', roughness: 0.95 }));
      felt.position.y = -0.3;
      const frame = object.mesh(geometry.box(9, 0.2, 9), material.meshStandard({ color: '#5a3a24', roughness: 0.5 }));
      frame.position.y = -0.2;
      world.scene.add(felt, frame);
      const squares = [material.meshStandard({ color: '#6b4630', roughness: 0.6 }), material.meshStandard({ color: '#e9dcc0', roughness: 0.6 })];
      for (let rank = 1; rank <= 8; rank++)
        for (let file = 0; file < 8; file++) {
          const tile = object.mesh(geometry.box(1, 0.1, 1), squares[(rank + file) % 2]);
          tile.position.set(file - 3.5, -0.05, 4.5 - rank);
          world.scene.add(tile);
        }
      const at = (square) => [square.charCodeAt(0) - 97 - 3.5, 4.5 - Number(square[1])];

      // Each piece is a small stack of shapes on a round foot; seen from above, its crown says what
      // it is: a pawn's ball, a rook's battlements, a knight's head, a bishop's point, a queen's
      // ring, a king's cross.
      function piece(kind, matter, facing) {
        const group = object.group();
        const add = (shape, [x, y, z], turn = 0) => {
          const mesh = object.mesh(shape, matter);
          mesh.position.set(x, y, z);
          mesh.rotation.x = turn;
          group.add(mesh);
          return mesh;
        };
        add(geometry.cylinder(0.34, 0.38, 0.12, 32), [0, 0.06, 0]);
        if (kind === 'pawn') {
          add(geometry.cone(0.22, 0.45, 32), [0, 0.34, 0]);
          add(geometry.sphere(0.13, 24, 16), [0, 0.6, 0]);
        }
        if (kind === 'rook') {
          add(geometry.cylinder(0.22, 0.26, 0.55, 32), [0, 0.4, 0]);
          add(geometry.cylinder(0.3, 0.3, 0.12, 32), [0, 0.73, 0]);
          for (const [x, z] of [[0.2, 0], [-0.2, 0], [0, 0.2], [0, -0.2]]) add(geometry.box(0.12, 0.12, 0.12), [x, 0.85, z]);
        }
        if (kind === 'knight') {
          add(geometry.cylinder(0.2, 0.26, 0.45, 32), [0, 0.35, 0]);
          add(geometry.box(0.22, 0.5, 0.26), [0, 0.72, -0.08 * facing], 0.5 * facing);
          add(geometry.box(0.16, 0.14, 0.3), [0, 0.86, -0.28 * facing]);
        }
        if (kind === 'bishop') {
          add(geometry.cone(0.24, 0.8, 32), [0, 0.52, 0]);
          add(geometry.sphere(0.15, 24, 16), [0, 0.85, 0]);
          add(geometry.sphere(0.06, 12, 8), [0, 1.02, 0]);
        }
        if (kind === 'queen') {
          add(geometry.cylinder(0.14, 0.27, 0.85, 32), [0, 0.52, 0]);
          add(geometry.torus(0.17, 0.05, 12, 24), [0, 1, 0], Math.PI / 2);
          add(geometry.sphere(0.1, 16, 12), [0, 1.08, 0]);
        }
        if (kind === 'king') {
          add(geometry.cylinder(0.15, 0.28, 0.95, 32), [0, 0.57, 0]);
          add(geometry.box(0.1, 0.1, 0.4), [0, 1.1, 0]);
          add(geometry.box(0.4, 0.1, 0.1), [0, 1.1, 0]);
        }
        world.scene.add(group);
        return group;
      }
      const colours = [material.meshStandard({ color: '#f4efe6', roughness: 0.35 }), material.meshStandard({ color: '#c0392b', roughness: 0.35 })];
      const start = new Map();
      [0, 1].forEach((side) => {
        BACK.forEach((kind, file) => {
          const column = String.fromCharCode(97 + file);
          start.set(`${column}${side ? 8 : 1}`, piece(kind, colours[side], side ? -1 : 1));
          start.set(`${column}${side ? 7 : 2}`, piece('pawn', colours[side], side ? -1 : 1));
        });
      });
      world.scene.add(light.directional({ intensity: 3, color: '#fff1dc', position: [4, 10, 3], castShadow: true }));
      world.scene.add(light.point({ intensity: 20, color: '#ffb45e', position: [-5, 3, -5], distance: 14 }));
      world.scene.add(light.hemisphere({ color: '#e8eeff', groundColor: '#3a4a3a', intensity: 0.8 }));
      // High above the board's middle: at this lens the board fills two thirds of the height, and the
      // corners of the view, the stats among them, fall on the felt.
      world.camera.position.set(0, 26, 0.01);
      world.camera.lookAt(0, 0, 0);

      // The board as it stands: square → piece. A move hops the piece over a parabola; a piece on
      // the square it lands on is captured and leaves the board.
      let board, steps, step, hop;
      function reset() {
        board = new Map(start);
        for (const [square, item] of board) {
          const [x, z] = at(square);
          item.position.set(x, 0, z);
          item.visible = true;
        }
        steps = OPENING.split(/[ +]/);
        step = 0;
        hop = { t: -1.5 };
      }
      reset();
      const ui = controls({
        mouse: 'Drag to slide the board · scroll or pinch to zoom · arrow keys to pan',
        play: true,
        speed: [0.3, 3, 1],
        follow: false,
        replay: reset,
      }, world);
      const moveShown = readout('Move');
      const aim = math.vector3();
      world.onFrame(({ delta }) => {
        if (!ui.play) return;
        hop.t += delta * ui.speed * 1.2;
        if (hop.t >= 1 && hop.item) {
          const [x, z] = at(hop.to);
          hop.item.position.set(x, 0, z);
          const taken = board.get(hop.to);
          if (taken) taken.visible = false;
          board.delete(hop.from);
          board.set(hop.to, hop.item);
          hop = { t: step === steps.length ? -3 : 0 };
        }
        if (!hop.item && hop.t >= 0) {
          if (step === steps.length) reset();
          else {
            const move = steps[step++];
            hop = { t: 0, from: move.slice(0, 2), to: move.slice(2, 4), item: board.get(move.slice(0, 2)) };
            moveShown(`${Math.ceil(step / 2)}. ${hop.from} → ${hop.to}${board.has(hop.to) ? ' takes' : ''}`);
          }
        }
        if (hop.item) {
          const [x0, z0] = at(hop.from), [x1, z1] = at(hop.to), t = Math.max(0, hop.t);
          hop.item.position.set(x0 + (x1 - x0) * t, Math.sin(t * Math.PI) * 0.9, z0 + (z1 - z0) * t);
          // Follow: the view glides over the moving piece, at whatever zoom the viewer chose.
          if (ui.follow) {
            const target = world.controls.target;
            aim.set(hop.item.position.x - target.x, 0, hop.item.position.z - target.z).multiplyScalar(Math.min(1, delta * 3));
            target.add(aim);
            world.camera.position.add(aim);
          }
        }
        world.invalidate();
      });
      world.invalidate();
    </script>
  </body>
</html>
