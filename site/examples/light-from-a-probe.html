<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Light from a probe</title>
    <meta name="thumbnail" content="3.5" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101218;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls, readout } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      world.scene.background = math.color('#101218');

      // Four places, each the light arriving from every direction: a function from a direction
      // (x, y, z), y up, to a colour. Nothing in the scene draws them — only their light shows.
      const glow = (d, [x, y, z], width) => Math.exp((d[0] * x + d[1] * y + d[2] * z - 1) / width);
      const PLACES = {
        'desert at sunset': (d) => {
          if (d[1] < 0) return [0.3, 0.19, 0.1];
          const sun = glow(d, [-0.94, 0.34, 0], 0.08), band = (1 - d[1]) ** 4;
          return [0.04 + 2.2 * sun + 0.45 * band, 0.08 + 1 * sun + 0.2 * band, 0.28 + 0.3 * sun + 0.18 * band];
        },
        'forest clearing': (d) => {
          if (d[1] < 0) return [0.05, 0.035, 0.02];
          const gap = glow(d, [0.3, 0.95, 0.1], 0.06);
          return [0.07 + 0.9 * gap, 0.2 + 1 * gap, 0.06 + 0.75 * gap];
        },
        'neon alley': (d) => [
          0.02 + 1.2 * Math.max(0, d[0]) ** 2 + 0.1 * Math.max(0, -d[0]) ** 2,
          0.02 + 0.1 * Math.max(0, d[0]) ** 2 + 0.9 * Math.max(0, -d[0]) ** 2,
          0.06 + 0.7 * Math.max(0, d[0]) ** 2 + 1.2 * Math.max(0, -d[0]) ** 2,
        ],
        snowfield: (d) => (d[1] < 0 ? [0.72, 0.74, 0.78] : [0.3 + 0.1 * d[1], 0.42 + 0.1 * d[1], 0.62]),
      };

      // THE PROBE. What a surface receives from all those directions depends only on the way it
      // faces, and that function is smooth enough to hold in nine numbers per colour: the first
      // three bands of spherical harmonics. Projecting a place is one sum over the sphere — its
      // light times each band's polynomial, times the solid angle of the sample — here on a grid
      // of 64 × 128 directions, turned by `turn` around the vertical.
      const band = ([x, y, z]) => [0.282095, 0.488603 * y, 0.488603 * z, 0.488603 * x, 1.092548 * x * y, 1.092548 * y * z, 0.315392 * (3 * z * z - 1), 1.092548 * x * z, 0.546274 * (x * x - y * y)];
      function project(place, turn) {
        const sh = new Array(27).fill(0), ROWS = 64, COLUMNS = 128, c = Math.cos(turn), s = Math.sin(turn);
        for (let i = 0; i < ROWS; i++) {
          const theta = ((i + 0.5) / ROWS) * Math.PI, area = Math.sin(theta) * (Math.PI / ROWS) * ((2 * Math.PI) / COLUMNS);
          for (let j = 0; j < COLUMNS; j++) {
            const phi = ((j + 0.5) / COLUMNS) * 2 * Math.PI;
            const d = [Math.sin(theta) * Math.cos(phi), Math.cos(theta), Math.sin(theta) * Math.sin(phi)];
            const colour = place([c * d[0] + s * d[2], d[1], -s * d[0] + c * d[2]]), y = band(d);
            for (let k = 0; k < 9; k++) for (let ch = 0; ch < 3; ch++) sh[k * 3 + ch] += colour[ch] * y[k] * area;
          }
        }
        return sh;
      }
      const probe = light.probe({ sh: new Array(27).fill(0) });

      // What it lights: pale sculptures on a stage, and above them a matte ball — the probe made
      // visible, each point of it the colour the probe gives a surface facing that way.
      const clay = material.meshStandard({ color: '#eeeae4', roughness: 0.8 });
      const terracotta = material.meshStandard({ color: '#c8704c', roughness: 0.7 });
      const jade = material.meshStandard({ color: '#4f9a8e', roughness: 0.6 });
      const garden = object.group();
      world.scene.add(garden);
      const set = (mesh, x, y, z) => (mesh.position.set(x, y, z), garden.add(mesh), mesh);
      set(object.mesh(geometry.cylinder(5, 5.2, 0.4, 128), material.meshStandard({ color: '#8d8a86', roughness: 0.9 })), 0, -0.2, 0);
      set(object.mesh(geometry.sphere(1, 64, 32), clay), -2.2, 1, 0.6);
      set(object.mesh(geometry.torusKnot(0.7, 0.24, 200, 32), terracotta), 1.6, 1.5, -0.4);
      set(object.mesh(geometry.box(0.9, 0.9, 0.9), clay), 1.4, 0.45, 1.8).rotation.set(0, 0.5, 0);
      set(object.mesh(geometry.box(0.6, 0.6, 0.6), jade), 1.4, 1.2, 1.8).rotation.set(0, 1.2, 0);
      set(object.mesh(geometry.lathe([[0, 0], [0.5, 0], [0.6, 0.3], [0.35, 1.2], [0.45, 1.9], [0.4, 2], [0, 2]], 64), clay), -0.3, 0, -2);
      set(object.mesh(geometry.capsule(0.35, 1.2, 12, 32), jade), -2.6, 0.95, -1.9);
      set(object.mesh(geometry.torus(0.8, 0.2, 32, 96), clay), 0.2, 0.2, 2.6).rotation.set(Math.PI / 2, 0, 0);
      const ball = object.mesh(geometry.sphere(0.6, 64, 32), material.meshStandard({ color: '#ffffff', roughness: 1 }));
      ball.position.set(0, 4.2, 0);
      world.scene.add(ball);

      // A key light gives the shapes their shadows; switch it off to see the probe alone.
      const lamp = light.directional({ intensity: 1.4, position: [6, 8, 4], castShadow: true });
      const KEYS = { 'desert at sunset': '#ffb070', 'forest clearing': '#f4ffd8', 'neon alley': '#ff7ad8', snowfield: '#ffffff' };
      world.scene.add(probe, lamp);
      world.camera.position.set(0.6, 3.4, 9.4);
      world.camera.lookAt(0, 1.1, 0);
      world.controls.target.set(0, 1.1, 0);
      world.controls.minDistance = 4;
      world.controls.maxDistance = 18;
      world.controls.maxPolarAngle = Math.PI / 2 - 0.05;

      // A new place is projected once; the probe then glides to it over a second, its 27 numbers
      // written in place, and the lighting follows. The opening glides from darkness.
      let shown = new Array(27).fill(0), aim = shown;
      const ui = controls({
        mouse: 'Drag to turn round the garden; pick a place and the sculptures take on its light',
        place: Object.keys(PLACES),
        turn: [0, 360, 0, 1],
        strength: [0, 2, 1, 0.05],
        keyLight: true,
        spin: true,
      }, (values, key) => {
        if (key === undefined || key === 'place' || key === 'turn') aim = project(PLACES[values.place], math.degToRad(values.turn));
        if (key === undefined || key === 'place') lamp.color.set(KEYS[values.place]);
        probe.intensity = values.strength;
        lamp.visible = values.keyLight;
        world.invalidate();
      }, world);
      const mean = readout('meanLight');

      let time = 0;
      world.onFrame(({ delta }) => {
        const step = Math.min(delta, 0.05);
        if (ui.spin) {
          time += step;
          garden.rotation.set(0, time * 0.15, 0);
          ball.position.set(0, 4.2 + Math.sin(time * 1.3) * 0.25, 0);
        }
        let moved = 0;
        shown = shown.map((value, k) => {
          const next = value + (aim[k] - value) * Math.min(1, step * 3.5);
          moved = Math.max(moved, Math.abs(next - value));
          return next;
        });
        if (moved > 1e-5) {
          probe.sh = shown;
          probe.needsUpdate = true;
          // The constant band alone: the irradiance averaged over every facing, π·L₀₀·Y₀₀.
          mean(shown.slice(0, 3).map((value) => (value * 0.886227).toFixed(2)).join(' · '));
        }
        if (ui.spin || moved > 1e-5) world.invalidate();
      });
    </script>
  </body>
</html>
