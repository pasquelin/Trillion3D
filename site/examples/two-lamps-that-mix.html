<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A warm and a cool lamp that mix</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createExplorer } from '../runtime/engine.js';

      const explorer = await createExplorer('view', {
        manifestUrl: '../assets/examples/still-life/cache/native/full/manifest.json',
        scope: 'full',
        interactive: true,
      });
      // A warm lamp on the left, a cool one on the right, both casting shadows: where only one
      // reaches, the surface takes its colour; where both do, the two add up in linear light and
      // the surface reads as white. Each shadow is lit by the other lamp.
      explorer.addLight({
        id: 'warm',
        kind: 'point',
        position: [-3.2, 4.5, 2],
        color: [1, 0.6, 0.3],
        intensity: 30,
        range: 12,
        castsShadow: true,
      });
      explorer.addLight({
        id: 'cool',
        kind: 'point',
        position: [3.2, 4.5, 2],
        color: [0.35, 0.6, 1],
        intensity: 30,
        range: 12,
        castsShadow: true,
      });
      explorer.setPose({ ...explorer.homePose(), position: [0, 4, 7], target: [0, 0.4, 0] });
      explorer.invalidate();
    </script>
  </body>
</html>
