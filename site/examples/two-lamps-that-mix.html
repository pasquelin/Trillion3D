<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A warm and a cool lamp that mix</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createExplorer } from '../runtime/engine.js';

      const view = document.getElementById('view');
      const explorer = await createExplorer(view, {
        manifestUrl: '../assets/examples/corner-cube/cache/native/full/manifest.json',
        scope: 'full',
        interactive: true,
      });
      explorer.addLight({
      "id": "sun",
      "kind": "directional",
      "direction": [
              -0.55,
              -0.7,
              -0.45
      ],
      "color": [
              1,
              0.95,
              0.85
      ],
      "intensity": 3,
      "castsShadow": true
});
      explorer.addLight({
      "id": "warm",
      "kind": "point",
      "position": [
              2,
              2,
              2
      ],
      "color": [
              1,
              0.6,
              0.2
      ],
      "intensity": 12,
      "range": 6
});
      explorer.addLight({
      "id": "cool",
      "kind": "point",
      "position": [
              -2,
              2,
              -2
      ],
      "color": [
              0.2,
              0.5,
              1
      ],
      "intensity": 12,
      "range": 6
});
      // Warm key and cool fill lights mixing on three cube facets.
explorer.setPose({ ...explorer.homePose(), position: [3.8, 2.6, 3.8], target: [0, 1.0, 0] });
explorer.invalidate();
    </script>
  </body>
</html>
