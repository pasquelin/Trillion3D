<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A lamp housed in its own glass</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createExplorer } from '../runtime/engine.js';

      const explorer = await createExplorer('view', {
        manifestUrl: '../assets/examples/lantern/cache/native/full/manifest.json',
        scope: 'full',
        interactive: true,
      });
      // The bulb sits inside a glass globe, geometry like any other: without `emitterRadius` the
      // globe would enter the lamp's own shadow map and put the lamp out. The radius declares the
      // envelope — the globe's 0.32 m and no more — and the shadow pass writes nothing inside it,
      // so the light leaves the globe and the globe still shades the pavement under the post.
      explorer.addLight({
        id: 'lamp',
        kind: 'point',
        position: [0, 2.4, 0],
        color: [1, 0.8, 0.5],
        intensity: 12,
        range: 10,
        emitterRadius: 0.34,
        castsShadow: true,
      });
      explorer.setPose({ ...explorer.homePose(), position: [2.8, 2.2, 3.4], target: [0, 1.4, -0.5] });
      explorer.invalidate();
    </script>
  </body>
</html>
