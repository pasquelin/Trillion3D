<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A lamp housed in its own glass</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p>Street lamp by W. Sitters, Elements-3D, CC BY 3.0 — see assets/examples/CREDITS.md</p>
    <script type="module">
      import { createExplorer } from '../runtime/engine.js';

      const view = document.getElementById('view');
      const explorer = await createExplorer(view, {
        manifestUrl: '../assets/examples/street-corner/cache/native/full/manifest.json',
        scope: 'full',
        interactive: true,
      });
      explorer.addLight({
      "kind": "point",
      "position": [
              0,
              1.85,
              0
      ],
      "color": [
              1,
              0.9,
              0.7
      ],
      "intensity": 20,
      "range": 5,
      "id": "sun"
});
      // A point light nested directly within the lantern geometry.
explorer.setPose({ ...explorer.homePose(), position: [0.8, 2.1, 1.4], target: [0, 1.8, 0] });
explorer.invalidate();
    </script>
  </body>
</html>
