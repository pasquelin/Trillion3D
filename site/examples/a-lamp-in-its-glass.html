<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Swinging lantern</title>
    <meta name="thumbnail" content="2" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      // A closed cellar, 7.6 m wide, 4.3 m high and 5 m deep: floor, ceiling and four walls.
      const stone = material.meshStandard({ color: '#8a7f73', roughness: 0.9 });
      const slab = (width, height, depth, x, y, z) => {
        const mesh = object.mesh(geometry.box(width, height, depth), stone);
        mesh.position.set(x, y, z);
        world.scene.add(mesh);
      };
      slab(8, 0.2, 5.5, 0, -0.1, 0.7);
      slab(8, 0.2, 5.5, 0, 4.4, 0.7);
      slab(8, 4.3, 0.3, 0, 2.15, -2);
      slab(8, 4.3, 0.3, 0, 2.15, 3.35);
      slab(0.3, 4.3, 5.5, -3.95, 2.15, 0.7);
      slab(0.3, 4.3, 5.5, 3.95, 2.15, 0.7);
      // Crates and a barrel below the lantern, to throw shadows that swing.
      const wood = material.meshStandard({ color: '#8a5a32', roughness: 0.8 });
      for (const [x, z, size] of [[-1.3, -0.8, 0.8], [-0.6, -1.2, 0.6], [1.4, -0.6, 0.9]]) {
        const crate = object.mesh(geometry.box(size, size, size), wood);
        crate.position.set(x, size / 2, z);
        crate.rotation.y = x;
        world.scene.add(crate);
      }
      const barrel = object.mesh(geometry.cylinder(0.35, 0.35, 0.9, 32), material.meshStandard({ color: '#3f6e8c', metalness: 0.6, roughness: 0.4 }));
      barrel.position.set(0.5, 0.45, -0.9);
      world.scene.add(barrel);

      // The lantern hangs 1.4 m below a hook in the ceiling: a bulb in a glass globe. The light's
      // `radius` is the bulb's, so the bulb and its globe do not block their own lamp.
      const HOOK = [0, 4.3, -0.2], CHAIN = 1.4, bulbRadius = 0.07;
      const iron = material.meshStandard({ color: '#202124', metalness: 0.8, roughness: 0.45 });
      const filament = material.meshStandard({ color: '#000000', emissive: '#ffcf8a', emissiveIntensity: 5 });
      const glass = material.meshStandard({ color: '#e6f0ff', roughness: 0.1, opacity: 0.25, transparent: true });
      const lantern = object.group();
      lantern.position.set(...HOOK);
      const chain = object.mesh(geometry.cylinder(0.015, 0.015, CHAIN, 8), iron);
      chain.position.y = -CHAIN / 2;
      const bulb = object.mesh(geometry.sphere(bulbRadius, 24, 16), filament);
      bulb.position.y = -CHAIN - 0.2;
      const globe = object.mesh(geometry.sphere(0.24, 48, 32), glass);
      globe.position.y = -CHAIN - 0.2;
      lantern.add(chain, bulb, globe);
      const lamp = light.point({ intensity: 10, distance: 10, radius: bulbRadius, castShadow: true });
      world.scene.add(lantern, lamp, light.ambient({ intensity: 0.2, color: '#8fb4ff' }));
      // The camera turns on an arc facing the lantern, never above the ceiling, below its own eye
      // level or farther than the front wall: no drag takes it outside the cellar, so none shows
      // the back of a wall. Panning, which would carry the arc along, is off.
      world.controls.target.set(0, 1.4, 0.3);
      world.controls.maxDistance = 2.7;
      world.controls.minAzimuthAngle = -0.9;
      world.controls.maxAzimuthAngle = 0.9;
      world.controls.minPolarAngle = 0.7;
      world.controls.maxPolarAngle = Math.PI / 2;
      world.controls.enablePan = false;
      world.camera.position.set(0.9, 2.2, 2.65);
      world.camera.lookAt(0, 1.4, 0.3);

      const ui = controls({ swing: [0, 0.7, 0.45], lamp: '#ffcf8a', power: [0, 30, 10], glass: [0, 1, 0.25] }, (values) => {
        lamp.color.set(values.lamp);
        lamp.intensity = values.power;
        filament.emissive.set(values.lamp);
        glass.opacity = values.glass;
        world.invalidate();
      }, world);
      // A pendulum: the angle swings, the lamp follows the bulb it hangs from.
      world.onFrame(({ time }) => {
        const angle = Math.sin(time * 1.6) * ui.swing, reach = CHAIN + 0.2;
        lantern.rotation.z = angle;
        lamp.position.set(HOOK[0] + Math.sin(angle) * reach, HOOK[1] - Math.cos(angle) * reach, HOOK[2]);
        world.invalidate();
      });
    </script>
  </body>
</html>
