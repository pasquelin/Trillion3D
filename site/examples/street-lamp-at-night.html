<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A street lamp at night</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p>Street lamp model by W. Sitters, CC BY 3.0 — see assets/examples/CREDITS.md</p>
    <script type="module">
      import { createWorld, light } from '../runtime/engine.js';

      const world = createWorld('view', { controls: 'orbit' });
      await world.scene.load('../assets/examples/street-corner/cache/native/full/manifest.json');
      // One point light at the end of the lamp's arm: the glass fixture casts no shadow on
      // itself, and the pavement and the wall show the light falling off with distance.
      world.scene.add(light.point({
        position: [-0.55, 3.95, 0.4], color: [1, 0.72, 0.4], intensity: 24, distance: 12, castShadow: true,
        radius: 0.25,
      }));
      world.camera.position.set(5.5, 2.4, 7);
      world.camera.lookAt(-0.5, 1.5, -0.5);
      world.controls.target.set(-0.5, 1.5, -0.5);
      world.invalidate();
    </script>
  </body>
</html>
