<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A street lamp at night</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p>Street lamp model by W. Sitters, CC BY 3.0 — see assets/examples/CREDITS.md</p>
    <script type="module">
      import { createExplorer } from '../runtime/engine.js';

      const explorer = await createExplorer('view', {
        manifestUrl: '../assets/examples/street-corner/cache/native/full/manifest.json',
        scope: 'full',
        interactive: true,
      });
      // One point light at the end of the lamp's arm: the glass is its emitter radius, so the
      // fixture casts no shadow on itself, and the pavement and the wall show the light falling
      // off with distance.
      explorer.addLight({
        id: 'lamp',
        kind: 'point',
        position: [-0.55, 3.95, 0.4],
        color: [1, 0.72, 0.4],
        intensity: 24,
        range: 12,
        emitterRadius: 0.25,
        castsShadow: true,
      });
      explorer.setPose({ ...explorer.homePose(), position: [5.5, 2.4, 7], target: [-0.5, 1.5, -0.5] });
      explorer.invalidate();
    </script>
  </body>
</html>
