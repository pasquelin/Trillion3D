<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A character that walks</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #243247;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      p {
        position: absolute;
        bottom: 0;
        margin: 0.5rem;
        color: white;
        font: 12px system-ui;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p>
      CesiumMan © 2017 Cesium —
      <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.
      <a
        href="https://github.com/KhronosGroup/glTF-Sample-Assets/blob/main/LICENSES/LicenseRef-LegalMark-Cesium.txt"
        >Cesium logo notice</a
      >.
    </p>
    <script type="module">
      import { createWorld, animation, light, math } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      world.scene.background = math.color('#243247');
      const sun = light.directional({ intensity: 3, castShadow: true });
      sun.position.set(5, 8, 4);
      world.scene.add(sun, light.hemisphere({ intensity: 1.3 }));
      const requested = Number(new URL(location.href).searchParams.get('count') ?? 1);
      const count = [1, 10, 100].includes(requested) ? requested : 1;
      const columns = Math.ceil(Math.sqrt(count));
      const actions = [];
      for (let i = 0; i < count; i++) {
        const model = await world.scene.load(
          '../assets/examples/cesium-man/cache/native/full/manifest.json',
        );
        model.position.set(((i % columns) - (columns - 1) / 2) * 2, 0, Math.floor(i / columns) * 2);
        const clip = model.animations[0];
        if (!clip) throw new Error('The compiled sample must retain its animation');
        actions.push(
          animation
            .createMixer(model)
            .clipAction(clip)
            .play()
            .seek(i * 0.071),
        );
      }
      world.camera.position.set(columns * 1.4, columns * 0.8 + 1.5, columns * 2.2 + 2);
      world.controls.target.set(0, 0.8, Math.ceil(count / columns) - 1);
      controls(
        { playing: true },
        ({ playing }) => {
          for (const action of actions) {
            if (playing) action.play();
            else {
              const time = action.time;
              action.stop().seek(time);
            }
          }
          world.invalidate();
        },
        world,
      );
      // The witness fixes every pose before comparing with this public source.
      // This hook reports inputs only; it does not claim any timing or pixel result.
      globalThis.deformationCase = {
        world,
        count,
        source: '../assets/examples/cesium-man/source/CesiumMan.glb',
        setTime(seconds) {
          for (const action of actions) action.stop().seek(seconds);
          world.invalidate();
        },
      };
    </script>
  </body>
</html>
