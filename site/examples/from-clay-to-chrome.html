<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>From clay to chrome</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createExplorer } from '../runtime/engine.js';

      const explorer = await createExplorer('view', {
        manifestUrl: '../assets/examples/clay-to-chrome/cache/native/full/manifest.json',
        scope: 'full',
        interactive: true,
      });
      // Twenty-five copper spheres: roughness grows from left to right, metalness from front to back.
      explorer.addLight({
        id: 'sun',
        kind: 'directional',
        direction: [-0.3, -0.8, -0.5],
        color: [1, 0.95, 0.85],
        intensity: 3,
        castsShadow: true,
      });
      explorer.setPose({ ...explorer.homePose(), position: [0.5, 4.5, 8], target: [0, 0.2, 0] });
      explorer.invalidate();
    </script>
  </body>
</html>
