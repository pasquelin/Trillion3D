<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Clay to chrome</title>
    <meta name="thumbnail" content="2" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      const slab = object.mesh(geometry.box(7.5, 0.3, 7.5), material.meshStandard({ color: '#1b1d22', roughness: 0.9 }));
      slab.position.y = -0.15;
      world.scene.add(slab);

      // Twenty-five spheres, one material each: `metalness` grows with the column, `roughness`
      // with the row. Same colour, same light: only those two numbers differ.
      const spheres = [];
      for (let row = 0; row < 5; row++)
        for (let column = 0; column < 5; column++) {
          const matter = material.meshStandard({ roughness: 0.05 + (row / 4) * 0.9, metalness: column / 4 });
          const sphere = object.mesh(geometry.sphere(0.55, 64, 32), matter);
          sphere.position.set((column - 2) * 1.35, 0.55, (row - 2) * 1.35);
          world.scene.add(sphere);
          spheres.push(matter);
        }

      // A sun for the shadows, and two coloured lamps circling above: a metal shows only what it
      // reflects, so its highlights are the lamps themselves.
      world.scene.add(light.directional({ intensity: 3, color: '#fff1dd', position: [9, 5, 3], castShadow: true }));
      const lamps = ['#ffb070', '#70b8ff'].map((colour) => {
        // They cast no shadow: a moving shadow caster redraws its whole shadow map every frame.
        const lamp = light.point({ color: colour, intensity: 40, distance: 16, radius: 0.1 });
        world.scene.add(lamp);
        return lamp;
      });
      world.camera.position.set(0, 4.3, 6.6);
      world.camera.lookAt(0, 0, 0.4);
      world.controls.target.set(0, 0, 0.4);

      const ui = controls({ colour: '#e8a25a', lamps: [0, 80, 40], swing: true }, (values) => {
        for (const matter of spheres) matter.color.set(values.colour);
        for (const lamp of lamps) lamp.intensity = values.lamps;
      });
      let angle = 0.6;
      world.onFrame(({ delta }) => {
        if (ui.swing) angle += delta * 0.5;
        lamps.forEach((lamp, index) => {
          const at = angle + index * Math.PI;
          lamp.position.set(Math.sin(at) * 4, 2.6, Math.cos(at) * 4);
        });
        if (ui.swing) world.invalidate();
      });
      world.invalidate();
    </script>
  </body>
</html>
