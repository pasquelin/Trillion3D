<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>From clay to chrome</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light } from '../runtime/engine.js';

      const world = createWorld('view', { controls: 'orbit' });
      const slab = object.mesh(geometry.box(7, 0.3, 7), material.meshStandard({ color: [0.08, 0.08, 0.09], roughness: 0.9 }));
      slab.position.y = -0.15;
      world.scene.add(slab);

      // Twenty-five copper spheres: roughness grows from left to right, metalness from front to back.
      for (let row = 0; row < 5; row++)
        for (let column = 0; column < 5; column++) {
          const sphere = object.mesh(
            geometry.sphere(0.5, 24, 24),
            material.meshStandard({ color: [0.92, 0.55, 0.32], roughness: row / 4, metalness: 0.08 + (column / 4) * 0.9 }),
          );
          sphere.position.set((column - 2) * 1.25, 0.5, (row - 2) * 1.25);
          world.scene.add(sphere);
        }

      world.scene.add(light.directional({
        intensity: 3, color: [1, 0.95, 0.85], position: [6, 16, 10], target: [0, 0, 0], castShadow: true,
      }));
      world.camera.position.set(0.5, 4.5, 8);
      world.camera.lookAt(0, 0.2, 0);
      world.controls.target.set(0, 0.2, 0);
      world.invalidate();
    </script>
  </body>
</html>
