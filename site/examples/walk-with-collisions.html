<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Walk with collisions</title>
    <meta name="thumbnail" content="2" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1c2430;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls, readout } from '../runtime/kit.js';

      // The engine's character, with the physics on: its body is the physics' own. It climbs
      // the stairs and the ramp, rides the platform and pushes the boxes, and they push back;
      // it starts and stops no faster than the floor's friction lets it, and slides on the ice.
      // A click locks the mouse to look; W A S D walk (Z Q S D on AZERTY), Shift sprints,
      // Space jumps, Escape frees the mouse.
      const world = createWorld('view', { controls: 'character', physics: true });
      world.scene.background = math.color('#bcd3e6');
      world.camera.far = 200;
      world.camera.position.set(0, world.controls.eyeHeight, 9);
      world.camera.lookAt(0, 1, 0);

      // Stone underfoot: the soles grip it, and a stop glides a little (`physics`, its friction).
      const matte = (color, physics = 'stone') => material.meshStandard({ color, roughness: 0.85, physics });
      // Everything that never moves is a static body: the floor, the stairs, the ramp, the ice.
      const fixed = (size, at, matter, turn = [0, 0, 0]) => {
        const block = object.mesh(geometry.box(...size), typeof matter === 'string' ? matte(matter) : matter);
        block.position.set(...at);
        block.rotation.set(...turn);
        block.receiveShadow = block.castShadow = true;
        block.physics = 'static';
        world.scene.add(block);
        return block;
      };
      fixed([40, 1, 40], [0, -0.5, 0], '#8f9ba8');
      // Stairs of 0.2 m risers, each under the knee height the character steps up, to a landing.
      for (let k = 0; k < 5; k++)
        fixed([3, 0.2 * (k + 1), 0.4], [-7, 0.1 * (k + 1), 2 - k * 0.4], '#c7b89a');
      fixed([3, 1, 3], [-7, 0.5, -1.3], '#c7b89a');
      // A ramp of 20°, gentler than the steepest floor the character stands on.
      const RAMP = (20 * Math.PI) / 180;
      fixed([3, 0.2, 6], [7, Math.sin(RAMP) * 3 - 0.1, -1], '#a8b8a0', [RAMP, 0, 0]);
      // A patch of ice, 2 cm thick: a rubber sole grips it five times less than stone, so a jog
      // let go on it slides almost 4 m, and a start from rest takes seconds.
      const ice = material.meshStandard({ color: '#d4ecf7', roughness: 0.15, physics: 'ice' });
      fixed([6, 0.02, 8], [0, 0.01, 4], ice);

      // The platform is kinematic: the page moves it, and it carries what stands on it.
      const platform = object.mesh(geometry.box(3, 0.3, 3), matte('#d9824b'));
      platform.position.set(0, 0.15, -8);
      platform.castShadow = platform.receiveShadow = true;
      platform.physics = 'kinematic';
      world.scene.add(platform);

      // A stack of light boxes, 12 kg each: well under the push of an adult's 250 N.
      const crate = geometry.box(0.6, 0.6, 0.6),
        cardboard = matte('#c9a36b'),
        boxes = [];
      const stack = () => {
        for (const box of boxes.splice(0)) world.scene.remove(box);
        for (let row = 0; row < 3; row++)
          for (let k = 0; k < 3 - row; k++) {
            const box = object.mesh(crate, cardboard);
            box.position.set(-0.62 + k * 0.62 + row * 0.31, 0.3 + row * 0.61, -3);
            box.castShadow = box.receiveShadow = true;
            box.physics = { type: 'dynamic', mass: 12 };
            world.scene.add(box);
            boxes.push(box);
          }
      };
      stack();

      const sun = light.directional({ intensity: 3, castShadow: true });
      sun.position.set(6, 14, 8);
      world.scene.add(
        sun,
        light.hemisphere({ intensity: 1.1, color: '#ffffff', groundColor: '#8a9099' }),
      );

      const settings = controls(
        { pushStrength: [0, 600, 250, 10], platformSpeed: [0, 3, 1, 0.1], stackAgain: stack },
        ({ pushStrength }) => (world.controls.pushStrength = pushStrength),
        world,
      );
      const awake = readout('awake'),
        speed = readout('speed');
      // The platform slides back and forth on a sine; it moves on every frame, so the world does.
      let phase = 0;
      world.beforeFrame(({ delta }) => {
        phase += Math.min(delta, 0.1) * settings.platformSpeed * 0.5;
        platform.position.x = Math.sin(phase) * 4;
        world.invalidate();
      });
      world.onFrame(() => {
        const v = world.controls.velocity;
        awake(String(world.physics.stats.active));
        speed(`${Math.hypot(v.x, v.z).toFixed(1)} m/s`);
      });
    </script>
  </body>
</html>
