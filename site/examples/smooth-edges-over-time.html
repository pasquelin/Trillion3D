<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Smooth edges over time</title>
    <meta name="thumbnail" content="4" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #c9d8ea;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      // Waits for #363: `createWorld` takes `temporalAntialiasing`, and `world.temporalAntialiasing`
      // switches it on the next frame; until then the toggle changes nothing.
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls, readout, words, circling } from '../runtime/kit.js';
      const say = words();

      // Temporal antialiasing: each frame the image is drawn a fraction of a pixel aside, and mixed
      // with the frames before it, followed as the camera moves. A thin wire a pixel wide, which
      // one frame catches or misses, becomes a smooth line over a few frames.
      const world = createWorld('view', { controls: 'orbit', temporalAntialiasing: true });
      world.scene.background = math.color('#c9d8ea');

      // Everything here is thin on purpose: a lattice mast, its guy wires, a ring of pickets.
      const steel = material.meshStandard({ color: '#c8341e', roughness: 0.45, metalness: 0.6 });
      const cable = material.meshStandard({ color: '#2a2d33', roughness: 0.5, metalness: 0.8 });
      const wood = material.meshStandard({ color: '#f1ece2', roughness: 0.8 });
      const rod = geometry.cylinder(1, 1, 1, 8);
      // A rod from one point to another: stood up along the line between them, at its middle.
      function bar(from, to, radius, matter) {
        const d = to.map((value, axis) => value - from[axis]), length = Math.hypot(...d);
        const mesh = object.mesh(rod, matter);
        mesh.rotation.order = 'YXZ';
        mesh.position.set(...from.map((value, axis) => value + d[axis] / 2));
        mesh.rotation.set(Math.acos(d[1] / length), Math.atan2(d[0], d[2]), 0);
        mesh.scale.set(radius, length, radius);
        world.scene.add(mesh);
      }
      // The mast: three legs, and at every metre a triangle of struts and a zigzag of braces.
      const HEIGHT = 14, SPAN = 0.7;
      const leg = (k, y) => [Math.cos((k * Math.PI * 2) / 3) * SPAN, y, Math.sin((k * Math.PI * 2) / 3) * SPAN];
      for (let k = 0; k < 3; k++) bar(leg(k, 0), leg(k, HEIGHT), 0.035, steel);
      for (let y = 0; y < HEIGHT; y++)
        for (let k = 0; k < 3; k++) {
          bar(leg(k, y + 1), leg((k + 1) % 3, y + 1), 0.015, steel);
          bar(leg(k, y), leg((k + 1) % 3, y + 1), 0.012, steel);
        }
      // Guy wires from three heights to three anchors on the ground.
      for (const height of [5, 9.5, 13.5])
        for (let k = 0; k < 3; k++) {
          const angle = (k * Math.PI * 2) / 3 + Math.PI / 3;
          bar(leg(k, height), [Math.cos(angle) * 11, 0, Math.sin(angle) * 11], 0.008, cable);
        }
      // A ring of pickets and two rails, the fence a camera sees edge-on on one side.
      const picket = geometry.box(0.05, 1.1, 0.03);
      for (let k = 0; k < 180; k++) {
        const angle = (k / 180) * Math.PI * 2, post = object.mesh(picket, wood);
        post.position.set(Math.cos(angle) * 13, 0.55, Math.sin(angle) * 13);
        post.rotation.y = -angle;
        world.scene.add(post);
      }
      for (const y of [0.3, 0.85]) {
        const rail = object.mesh(geometry.torus(13, 0.02, 6, 256), wood);
        rail.rotation.x = Math.PI / 2;
        rail.position.y = y;
        world.scene.add(rail);
      }
      const ground = object.mesh(geometry.cylinder(16, 16, 0.2, 128), material.meshStandard({ color: '#7d9a5a', roughness: 0.95 }));
      ground.position.y = -0.1;
      world.scene.add(ground, light.directional({ color: '#fff3e0', intensity: 3, position: [8, 14, 6], castShadow: true }), light.hemisphere({ color: '#dfeaff', groundColor: '#4a5a30', intensity: 0.8 }));

      world.camera.position.set(17, 5, 17);
      world.camera.lookAt(0, 5, 0);
      world.controls.target.set(0, 5, 0);
      world.controls.minDistance = 6;
      world.controls.maxDistance = 40;
      world.controls.maxPolarAngle = Math.PI / 2 - 0.05;

      // The setting is read back from the world: what is drawn, not what was asked.
      let state = null;
      controls({
        mouse: 'Drag to look at the wires; switch the smoothing off and watch them break into steps',
        smoothing: true,
        circle: true,
      }, (values, key) => {
        if (key === 'circle') values.circle ? round.restart() : round.stop();
        if (key === undefined || key === 'smoothing') world.temporalAntialiasing = values.smoothing;
        state?.(say(world.temporalAntialiasing ? 'on' : 'off'));
        world.invalidate();
      }, world);
      state = readout('temporalAntialiasing');
      state(say(world.temporalAntialiasing ? 'on' : 'off'));

      // The camera circles slowly, so the wires cross the pixels, until the first press or wheel.
      const round = circling(world, -0.06);
    </script>
  </body>
</html>
