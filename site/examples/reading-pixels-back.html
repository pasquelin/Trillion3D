<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reading pixels back</title>
    <meta name="thumbnail" content="4" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #20283a;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #readback {
        position: absolute;
        right: 12px;
        bottom: 12px;
        display: grid;
        gap: 6px;
        padding: 8px;
        border-radius: 10px;
        background: rgba(12, 16, 26, 0.78);
        color: #cbd5e1;
        font: 12px system-ui;
      }
      #readback canvas {
        width: 288px;
        height: auto;
        border-radius: 4px;
      }
      #thumb {
        image-rendering: pixelated;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="readback">
      <canvas id="thumb" width="192" height="108"></canvas>
      <canvas id="histogram" width="576" height="120"></canvas>
      <span id="picked" data-words="hover"></span>
    </div>
    <script type="module">
      import { createWorld, geometry, material, object, light, math, capture } from '../runtime/engine.js';
      import { controls, readout, words } from '../runtime/kit.js';
      const say = words();

      const world = createWorld('view', { controls: 'orbit' });
      world.scene.background = math.color('#20283a');

      // A carousel of colour: a turntable, twelve hues standing round it, a white figure in the
      // middle. As it turns, the colours the camera sees change, and so do the numbers read back.
      const ground = object.mesh(geometry.cylinder(14, 14, 0.4, 96), material.meshStandard({ color: '#4a5263', roughness: 0.9 }));
      ground.position.y = -0.2;
      const table = object.group();
      const disc = object.mesh(geometry.cylinder(6.5, 6.8, 0.5, 96), material.meshStandard({ color: '#d8d2c6', roughness: 0.6 }));
      disc.position.y = 0.25;
      table.add(disc);
      const SHAPES = [geometry.sphere(0.8, 48, 24), geometry.box(1.3, 1.3, 1.3), geometry.torusKnot(0.55, 0.2, 128, 16), geometry.cone(0.8, 1.8, 48)];
      for (let k = 0; k < 12; k++) {
        const angle = (k / 12) * Math.PI * 2, hue = math.color('#ffffff').setHSL(k / 12, 0.75, 0.55);
        const piece = object.mesh(SHAPES[k % 4], material.meshStandard({ color: hue, roughness: 0.35, metalness: 0.05 }));
        piece.position.set(Math.cos(angle) * 5, 1.5, Math.sin(angle) * 5);
        piece.rotation.y = -angle;
        table.add(piece);
      }
      const figure = object.mesh(geometry.lathe([[0, 0], [1.2, 0], [1.3, 0.3], [0.6, 0.8], [0.9, 2.2], [0.4, 3.4], [0.8, 4], [0, 4.4]], 64), material.meshStandard({ color: '#f4f1ea', roughness: 0.3 }));
      figure.position.y = 0.5;
      table.add(figure);
      world.scene.add(ground, table);

      const sun = light.directional({ color: '#fff0dc', intensity: 3.2, castShadow: true });
      world.scene.add(sun, light.hemisphere({ color: '#c8d8ff', groundColor: '#6a5a4a', intensity: 0.85 }));
      world.camera.far = 200;
      world.camera.position.set(0, 9, 17);
      world.controls.target.set(0, 1.8, 0);
      world.controls.minDistance = 7;
      world.controls.maxDistance = 40;
      world.controls.maxPolarAngle = Math.PI / 2 - 0.05;
      world.camera.lookAt(0, 1.8, 0);

      // `capture.buffer` draws the view once more, offscreen, at the size asked, and hands back
      // its pixels: four bytes each, red, green, blue, alpha, top row first.
      const thumb = document.getElementById('thumb'), picture = thumb.getContext('2d');
      const bars = document.getElementById('histogram').getContext('2d'), picked = document.getElementById('picked');
      const W = thumb.width, H = thumb.height;
      let last = null, busy = false;
      const hex = (r, g, b) => '#' + [r, g, b].map((v) => v.toString(16).padStart(2, '0')).join('');
      async function readBack() {
        if (busy) return;
        busy = true;
        const started = performance.now();
        try {
          last = await capture.buffer(world, { width: W, height: H });
        } catch {
          // No view to read yet: the world has not opened its first frame. The next tick asks again.
          return;
        } finally {
          busy = false;
        }
        took(`${(performance.now() - started).toFixed(1)} ms`);
        const { data } = last, image = picture.createImageData(W, H);
        image.data.set(data);
        // Alpha is set opaque: the picture shows the colours read, whatever the view kept there.
        for (let i = 3; i < image.data.length; i += 4) image.data[i] = 255;
        picture.putImageData(image, 0, 0);
        // The mean colour, the brightest pixel, and how many pixels fall at each brightness.
        const counts = [new Uint32Array(64), new Uint32Array(64), new Uint32Array(64)], sum = [0, 0, 0];
        let brightest = 0, brightestAt = 0;
        for (let i = 0; i < data.length; i += 4) {
          for (let c = 0; c < 3; c++) counts[c][data[i + c] >> 2]++, (sum[c] += data[i + c]);
          const luma = 0.2126 * data[i] + 0.7152 * data[i + 1] + 0.0722 * data[i + 2];
          if (luma > brightest) (brightest = luma), (brightestAt = i);
        }
        const pixels = W * H;
        mean(hex(...sum.map((v) => Math.round(v / pixels))));
        peak(hex(data[brightestAt], data[brightestAt + 1], data[brightestAt + 2]));
        const { width, height } = bars.canvas, top = Math.max(...counts.flatMap((row) => [...row]));
        bars.clearRect(0, 0, width, height);
        ['rgba(255,90,90,0.9)', 'rgba(90,220,120,0.9)', 'rgba(100,150,255,0.9)'].forEach((stroke, c) => {
          bars.strokeStyle = stroke;
          bars.lineWidth = 3;
          bars.beginPath();
          counts[c].forEach((n, k) => bars.lineTo((k / 63) * width, height - 4 - Math.sqrt(n / top) * (height - 8)));
          bars.stroke();
        });
      }
      thumb.addEventListener('pointermove', (event) => {
        if (!last) return;
        const box = thumb.getBoundingClientRect();
        const x = Math.min(W - 1, Math.floor(((event.clientX - box.left) / box.width) * W)), y = Math.min(H - 1, Math.floor(((event.clientY - box.top) / box.height) * H));
        const i = (y * W + x) * 4, { data } = last;
        picked.textContent = say('pixel', { x, y, colour: hex(data[i], data[i + 1], data[i + 2]) });
        picked.style.color = hex(data[i], data[i + 1], data[i + 2]);
      });

      // A full-size picture, encoded as PNG; never while a small read is under way.
      async function savePicture() {
        if (busy) return;
        busy = true;
        let blob;
        try {
          blob = await capture.surface(world, { width: 1920, height: 1080 });
        } finally {
          busy = false;
        }
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'carousel.png';
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      }
      // The sun's height moves the shadows and the light, and the colours read back with them.
      const ui = controls({
        mouse: 'Drag to look around · the picture bottom right is the view read back as numbers',
        sunHeight: [5, 85, 40, 1],
        live: true,
        turning: true,
        savePng: () => savePicture(),
      }, (values, key) => {
        if (key === undefined || key === 'sunHeight') {
          const rise = (values.sunHeight * Math.PI) / 180;
          sun.position.set(Math.cos(rise) * 12, Math.sin(rise) * 20, Math.cos(rise) * 9);
          sun.color.set('#ff9a5c').lerp(math.color('#fff4e4'), Math.min(1, values.sunHeight / 40));
        }
        world.invalidate();
      });
      const mean = readout('meanColour'), peak = readout('brightest'), took = readout('readBack');

      let circling = true, since = 0;
      for (const type of ['pointerdown', 'wheel'])
        world.canvas.addEventListener(type, () => (circling = false), { passive: true });
      world.onFrame(({ delta }) => {
        const step = Math.min(delta, 0.05);
        if (ui.turning) table.rotation.y += step * 0.25;
        if (circling) {
          const { position } = world.camera, { target } = world.controls, turn = -step * 0.06;
          const x = position.x - target.x, z = position.z - target.z;
          position.set(target.x + x * Math.cos(turn) + z * Math.sin(turn), position.y, target.z + z * Math.cos(turn) - x * Math.sin(turn));
          world.controls.update();
        }
        // Twice a second while live: a read costs one more draw, at the small size, asked for
        // after this frame rather than inside it.
        since += delta;
        if (ui.live && since > 0.5) (since = 0), setTimeout(readBack);
        if (ui.turning || circling || ui.live) world.invalidate();
      });
      world.invalidate();
    </script>
  </body>
</html>
