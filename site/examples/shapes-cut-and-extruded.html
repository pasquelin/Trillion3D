<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shapes cut and extruded</title>
    <meta name="thumbnail" content="2" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math, side } from '../runtime/engine.js';
      import { controls, readout, language } from '../runtime/kit.js';

      // Flat outlines drawn like a pen on paper — lines, curves, arcs — with holes cut out of them.
      const circle = (x, y, radius) => math.shape().absarc(x, y, radius, 0, Math.PI * 2);
      function heart() {
        return math.shape().moveTo(0, -0.75)
          .bezierCurveTo(-0.2, -0.45, -0.85, -0.2, -0.8, 0.25)
          .bezierCurveTo(-0.75, 0.7, -0.2, 0.8, 0, 0.4)
          .bezierCurveTo(0.2, 0.8, 0.75, 0.7, 0.8, 0.25)
          .bezierCurveTo(0.85, -0.2, 0.2, -0.45, 0, -0.75);
      }
      function star(points = 5) {
        const outline = math.shape();
        for (let k = 0; k < points * 2; k++) {
          const angle = (k / (points * 2)) * Math.PI * 2 + Math.PI / 2, r = k % 2 ? 0.36 : 0.85;
          outline[k ? 'lineTo' : 'moveTo'](Math.cos(angle) * r, Math.sin(angle) * r);
        }
        return outline;
      }
      function gear(teeth = 12) {
        const outline = math.shape();
        for (let k = 0; k < teeth; k++) {
          const a = (k / teeth) * Math.PI * 2, step = Math.PI / teeth;
          outline[k ? 'lineTo' : 'moveTo'](Math.cos(a) * 0.62, Math.sin(a) * 0.62);
          outline.lineTo(Math.cos(a + step * 0.25) * 0.82, Math.sin(a + step * 0.25) * 0.82);
          outline.lineTo(Math.cos(a + step * 0.95) * 0.82, Math.sin(a + step * 0.95) * 0.82);
          outline.lineTo(Math.cos(a + step * 1.2) * 0.62, Math.sin(a + step * 1.2) * 0.62);
        }
        // A round hole in the middle and six small ones around it.
        outline.holes.push(circle(0, 0, 0.18));
        for (let k = 0; k < 6; k++) outline.holes.push(circle(Math.cos(k * 1.047) * 0.4, Math.sin(k * 1.047) * 0.4, 0.08));
        return outline;
      }
      function nut() {
        const outline = math.shape();
        for (let k = 0; k < 6; k++) outline[k ? 'lineTo' : 'moveTo'](Math.cos(k * 1.047) * 0.78, Math.sin(k * 1.047) * 0.78);
        outline.holes.push(circle(0, 0, 0.38));
        return outline;
      }
      function moon() {
        // Two arcs: the outer edge one way, the inner edge back the other way.
        return math.shape().absarc(0, 0, 0.8, Math.PI * 0.35, Math.PI * 1.65).absarc(0.35, 0, 0.62, Math.PI * 1.45, Math.PI * 0.55, true);
      }
      const outlines = [
        { draw: heart, colour: '#e0405a' },
        { draw: star, colour: '#f2b134' },
        { draw: gear, colour: '#8ea3c0', metal: 0.9 },
        { draw: nut, colour: '#2f8f83' },
        { draw: moon, colour: '#d9d2ff' },
      ];

      const world = createWorld('view', { controls: 'orbit' });
      const floor = object.mesh(geometry.box(14, 0.2, 6), material.meshStandard({ color: '#2a2f3a', roughness: 0.75 }));
      floor.position.y = -0.1;
      world.scene.add(floor);
      const pieces = outlines.map(({ draw, colour, metal = 0.1 }, index) => {
        const piece = object.mesh(geometry.shape(draw()), material.meshStandard({ color: colour, roughness: 0.3, metalness: metal, side: side.double }));
        piece.position.set((index - 2) * 2.1, 1.05, 0);
        world.scene.add(piece);
        return piece;
      });

      world.scene.add(light.directional({ intensity: 3.2, color: '#fff1dc', position: [4, 8, 7], castShadow: true }));
      world.scene.add(light.point({ intensity: 40, color: '#ff8a5c', position: [-6, 2.5, -2], distance: 16 }));
      world.scene.add(light.point({ intensity: 40, color: '#5c9dff', position: [6, 2.5, -2], distance: 16 }));
      world.scene.add(light.hemisphere({ color: '#a8b8e0', groundColor: '#2a221c', intensity: 0.5 }));
      world.camera.position.set(0, 2.4, 7.2);
      world.camera.lookAt(0, 0.9, 0);
      world.controls.target.set(0, 0.9, 0);

      // A change rebuilds the five solids from their outlines: depth pushes the flat shape back,
      // the bevel rounds its rims, curve segments decide how smooth each curve becomes. The
      // rebuild waits for the next frame, so a dragged slider rebuilds once a frame, not once a step.
      let stale = false;
      const ui = controls({
        mouse: 'Drag to look around; a depth of zero leaves the flat cut-out shape',
        depth: [0, 1, 0.35],
        bevel: true,
        bevelSize: [0.01, 0.12, 0.05],
        bevelSegments: [1, 8, 3, 1],
        curveSegments: [2, 40, 16, 1],
        spin: true,
      }, (values, key) => {
        if (key !== undefined && key !== 'spin') stale = true;
        world.invalidate();
      }, world);
      const triangles = readout('triangles');
      function rebuild(values) {
        let count = 0;
        outlines.forEach(({ draw }, index) => {
          const solid = values.depth === 0
            ? geometry.shape(draw(), values.curveSegments)
            : geometry.extrude(draw(), {
              depth: values.depth,
              bevelEnabled: values.bevel,
              bevelThickness: values.bevelSize,
              bevelSize: values.bevelSize,
              bevelSegments: values.bevelSegments,
              curveSegments: values.curveSegments,
            });
          // The solid is centred on its thickness, so it turns about its middle.
          solid.translate(0, 0, -values.depth / 2);
          pieces[index].geometry = solid;
          count += solid.index ? solid.index.count / 3 : solid.attributes.position.count / 3;
        });
        triangles(count.toLocaleString(language()));
      }
      rebuild(ui);
      world.beforeFrame(() => {
        if (stale) (stale = false), rebuild(ui);
      });

      let time = 0;
      world.onFrame(({ delta }) => {
        if (!ui.spin) return;
        time += delta;
        pieces.forEach((piece, index) => piece.rotation.y = Math.sin(time * 0.7 + index * 0.8) * 1.1);
        world.invalidate();
      });
    </script>
  </body>
</html>
