<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Before/after slider</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f2c49b;
      }
      canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
      /* The "before" image lies on top, cut at the split; the pointer passes through it to the
         orbit of the "after" world underneath. */
      #before {
        pointer-events: none;
        clip-path: inset(0 50% 0 0);
      }
      #split {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 2px;
        margin-left: -1px;
        background: #fff8ee;
        box-shadow: 0 0 8px #0006;
        pointer-events: none;
      }
      #knob {
        position: absolute;
        top: 50%;
        left: 1px;
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        border-radius: 50%;
        background: #fff8ee;
        box-shadow: 0 2px 10px #0008;
        color: #3a2a1e;
        font: 700 18px/44px system-ui;
        text-align: center;
        cursor: ew-resize;
        pointer-events: auto;
        touch-action: none;
        user-select: none;
      }
      .tag {
        position: absolute;
        top: calc(50% + 32px);
        padding: 3px 9px;
        border-radius: 999px;
        background: #1b1410cc;
        color: #fff4e6;
        font: 600 12px system-ui;
        white-space: nowrap;
      }
      #tagBefore {
        right: 10px;
      }
      #tagAfter {
        left: 10px;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <canvas id="before"></canvas>
    <div id="split"><div id="knob">&#8596;</div><span class="tag" id="tagBefore"></span><span class="tag" id="tagAfter" data-words="finished"></span></div>
    <script type="module">
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls, words, ease, circling } from '../runtime/kit.js';
      const say = words();

      // Two worlds draw the same courtyard: "after" fills the page and takes the mouse, "before"
      // is laid on top and cut at the split. Each owns its meshes, built by the same function.
      const LOOKS = {
        clay: { clay: true, sun: 'golden', shadows: true },
        'no shadows': { clay: false, sun: 'golden', shadows: false },
        'no sun': { clay: false, sun: 'off', shadows: false },
        'noon sun': { clay: false, sun: 'noon', shadows: true },
        finished: { clay: false, sun: 'golden', shadows: true },
      };
      const SUNS = {
        // Behind the camera's first place and high enough that the houses' shadows fall behind
        // them, not across the square.
        golden: { color: '#ffbd78', intensity: 3.4, position: [16, 12, 14] },
        noon: { color: '#fff6ea', intensity: 3.6, position: [3, 22, 4] },
        off: { color: '#ffffff', intensity: 0, position: [16, 12, 14] },
      };

      function courtyard(world) {
        world.scene.background = math.color('#f2c49b');
        const paint = (color, roughness = 0.8, metalness = 0, extra = {}) => material.meshStandard({ color, roughness, metalness, ...extra });
        // Clay: one light grey, matte, on every mesh — the shapes and the light alone.
        const clay = paint('#e4e0d9', 0.9);
        const P = {
          paving: paint('#b99f83', 0.85), inlay: paint('#8d6f57', 0.8), path: paint('#a8896c', 0.85),
          stone: paint('#e2d6c2', 0.7), water: paint('#2d6f8e', 0.08, 0.1), spray: paint('#bfe6fb', 0.1),
          ochre: paint('#e3b27f', 0.9), rose: paint('#d99479', 0.9), roof: paint('#8f4a34', 0.75),
          glass: paint('#1c2733', 0.15, 0.4), shutter: paint('#4d6d4b', 0.6), wood: paint('#7a5033', 0.7),
          iron: paint('#2b2b30', 0.4, 0.8), globe: paint('#000000', 0.4, 0, { emissive: '#ffcf86', emissiveIntensity: 3 }),
          pot: paint('#b5603c', 0.8), leaf: paint('#3e6a31', 0.75), cypress: paint('#2d4a2d', 0.8), orange: paint('#f39a2c', 0.5),
        };
        const meshes = [];
        const put = (shape, paintOf, [x, y, z], turn = null) => {
          const mesh = object.mesh(shape, paintOf);
          mesh.position.set(x, y, z);
          if (turn) mesh.rotation.set(...turn);
          mesh.userData.paint = paintOf;
          meshes.push(mesh);
          world.scene.add(mesh);
          return mesh;
        };
        // The square: paving, a darker ring round the fountain, two crossing paths.
        put(geometry.box(44, 0.2, 44), P.paving, [0, -0.1, 0]);
        put(geometry.cylinder(7, 7, 0.04, 96), P.inlay, [0, 0.02, 0]);
        put(geometry.box(3, 0.02, 44), P.path, [0, 0.01, 0]);
        put(geometry.box(44, 0.02, 3), P.path, [0, 0.012, 0]);
        // The fountain: a wide basin, a column, an upper bowl, a finial.
        put(geometry.cylinder(4, 4.3, 0.75, 72), P.stone, [0, 0.375, 0]);
        put(geometry.torus(4, 0.2, 14, 96), P.stone, [0, 0.76, 0], [-Math.PI / 2, 0, 0]);
        put(geometry.cylinder(3.8, 3.8, 0.05, 72), P.water, [0, 0.62, 0]);
        put(geometry.cylinder(0.45, 0.7, 1.7, 32), P.stone, [0, 1.45, 0]);
        put(geometry.cylinder(1.7, 0.45, 0.45, 48), P.stone, [0, 2.45, 0]);
        put(geometry.cylinder(1.55, 1.55, 0.04, 48), P.water, [0, 2.66, 0]);
        put(geometry.sphere(0.28, 24, 16), P.stone, [0, 3, 0]);
        // Two houses close the square: ochre behind, rose on the left, windows with shutters.
        const house = (paintOf, at, long, alongX) => {
          const size = alongX ? [long, 8, 3] : [3, 8, long];
          put(geometry.box(...size), paintOf, [at[0], 4, at[1]]);
          put(geometry.box(size[0] + 0.6, 0.5, size[2] + 0.6), P.roof, [at[0], 8.25, at[1]]);
          const face = alongX ? at[1] + 1.52 : at[0] + 1.52;
          for (let k = -2; k <= 2; k++)
            for (const y of [2.2, 5.6]) {
              const along = k * 4.2, wide = alongX ? [1.3, 1.9, 0.08] : [0.08, 1.9, 1.3];
              const spot = (offset, depth) => (alongX ? [at[0] + along + offset, y, face + depth] : [face + depth, y, at[1] + along + offset]);
              put(geometry.box(...wide), P.glass, spot(0, 0));
              for (const side of [-1, 1]) put(geometry.box(...(alongX ? [0.6, 1.9, 0.08] : [0.08, 1.9, 0.6])), P.shutter, spot(side * 0.98, 0.04));
            }
        };
        house(P.ochre, [0, -14], 26, true);
        house(P.rose, [-14, 1], 26, false);
        // Cypresses along the open side, orange trees in pots on the diagonals.
        for (let k = 0; k < 6; k++) {
          const z = -11 + k * 4.4;
          put(geometry.cylinder(0.15, 0.2, 1.2, 10), P.wood, [12, 0.6, z]);
          put(geometry.cone(1, 5.5, 18), P.cypress, [12, 3.8, z]);
        }
        for (let k = 0; k < 4; k++) {
          const a = Math.PI / 4 + (k * Math.PI) / 2, x = Math.cos(a) * 8.5, z = Math.sin(a) * 8.5;
          put(geometry.cylinder(0.75, 0.55, 0.9, 24), P.pot, [x, 0.45, z]);
          put(geometry.cylinder(0.09, 0.12, 1.3, 8), P.wood, [x, 1.4, z]);
          put(geometry.sphere(1.15, 24, 16), P.leaf, [x, 2.6, z]);
          for (let f = 0; f < 7; f++) {
            const b = f * 2.4 + k, lift = ((f * 37) % 10) / 10 - 0.4;
            put(geometry.sphere(0.13, 12, 8), P.orange, [x + Math.cos(b) * 1.05, 2.6 + lift, z + Math.sin(b) * 1.05]);
          }
          // A bench between two trees, facing the fountain, and a lamp post beside it.
          const c = a + Math.PI / 4, bx = Math.cos(c) * 6.4, bz = Math.sin(c) * 6.4;
          put(geometry.box(2.2, 0.12, 0.6), P.wood, [bx, 0.5, bz], [0, -c + Math.PI / 2, 0]);
          put(geometry.box(2.2, 0.5, 0.1), P.wood, [bx + Math.cos(c) * 0.3, 0.85, bz + Math.sin(c) * 0.3], [0, -c + Math.PI / 2, 0]);
          put(geometry.box(0.5, 0.44, 0.5), P.stone, [bx, 0.22, bz], [0, -c + Math.PI / 2, 0]);
          const lx = Math.cos(a) * 5, lz = Math.sin(a) * 5;
          put(geometry.cylinder(0.07, 0.1, 3.4, 12), P.iron, [lx, 1.7, lz]);
          put(geometry.sphere(0.26, 20, 14), P.globe, [lx, 3.55, lz]);
        }
        // The jet: droplets thrown from the finial in arcs that fall back into the basin.
        const drops = Array.from({ length: 56 }, (_, k) => ({ mesh: put(geometry.sphere(0.07, 10, 8), P.spray, [0, 3, 0]), angle: k * 2.39996, phase: (k * 0.618) % 1 }));
        const sun = light.directional({ castShadow: true });
        world.scene.add(sun, light.hemisphere({ color: '#9fb9ff', groundColor: '#7a5a40', intensity: 0.8 }));
        return {
          look(name) {
            const look = LOOKS[name], s = SUNS[look.sun];
            for (const mesh of meshes) mesh.material = look.clay ? clay : mesh.userData.paint;
            sun.color.set(s.color);
            sun.intensity = s.intensity;
            sun.position.set(...s.position);
            sun.castShadow = look.shadows;
          },
          flow(time) {
            for (const drop of drops) {
              const t = (time * 0.55 + drop.phase) % 1, reach = 0.6 + (drop.phase * 7 % 1) * 2.6;
              drop.mesh.position.set(Math.cos(drop.angle) * reach * t, 3.1 + 4.2 * t - 4.6 * t * t, Math.sin(drop.angle) * reach * t);
            }
          },
        };
      }

      const world = createWorld('view', { controls: 'orbit' });
      const before = createWorld('before');
      const afterScene = courtyard(world), beforeScene = courtyard(before);
      afterScene.look('finished');
      // High enough that the line of sight passes over the orange trees and the cypresses: the
      // fountain holds the middle, where the split crosses it, with the houses behind.
      world.camera.position.set(15, 14, 15);
      world.camera.lookAt(0, 2.2, 0);
      world.controls.target.set(0, 2.2, 0);
      world.controls.minDistance = 8;
      world.controls.maxDistance = 40;
      world.controls.maxPolarAngle = Math.PI / 2 - 0.05;

      // The split, a share of the page's width: dragged by its knob, and in the opening swept
      // from the right edge to the middle, so the "before" image is seen first, then uncovered.
      const beforeCanvas = document.getElementById('before'), split = document.getElementById('split'), knob = document.getElementById('knob');
      let share = 1, sweeping = true;
      const place = (value) => {
        share = Math.min(1, Math.max(0, value));
        beforeCanvas.style.clipPath = `inset(0 ${(1 - share) * 100}% 0 0)`;
        split.style.left = `${share * 100}%`;
      };
      knob.addEventListener('pointerdown', (event) => {
        sweeping = false;
        knob.setPointerCapture(event.pointerId);
      });
      knob.addEventListener('pointermove', (event) => {
        if (knob.hasPointerCapture(event.pointerId)) place(event.clientX / innerWidth);
      });
      place(1);

      controls({
        mouse: 'Drag the round knob to move the split; drag the picture to turn around the square',
        before: Object.keys(LOOKS).filter((name) => name !== 'finished'),
      }, (values) => {
        beforeScene.look(values.before);
        document.getElementById('tagBefore').textContent = say(values.before);
        before.invalidate();
      });

      // The camera drifts round the square until the first press or wheel on the picture; it
      // moves the orbit's own pose, so a drag starts where the drift left the view.
      circling(world, -0.08);
      const start = performance.now();
      const clock = () => (performance.now() - start) / 1000;
      world.onFrame(() => {
        const time = clock();
        if (sweeping) {
          const t = (time - 1.2) / 2.2;
          place(1 - 0.5 * ease.smooth(t));
          sweeping = t < 1;
        }
        afterScene.flow(time);
        // The "before" world sees through the same eye.
        before.camera.position.copy(world.camera.position);
        before.camera.quaternion.copy(world.camera.quaternion);
        world.invalidate();
      });
      before.onFrame(() => {
        beforeScene.flow(clock());
        before.invalidate();
      });
      world.invalidate();
    </script>
  </body>
</html>
