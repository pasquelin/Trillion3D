<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Circling the marble bust</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p>Marble Bust 01 by Rico Cilliers, Poly Haven, CC0 — see assets/examples/CREDITS.md</p>
    <script type="module">
      import { createWorld, light } from '../runtime/engine.js';

      // Host-led loop: the camera orbits every frame, so the world schedules nothing.
      const world = createWorld('view', { interactive: false, pixelRatio: devicePixelRatio });
      await world.scene.load('../assets/examples/bust/cache/native/full/manifest.json');
      world.scene.add(light.directional({
        intensity: 3.5, color: [1, 0.93, 0.82], position: [12, 14, 8], target: [0, 0, 0], castShadow: true,
      }));

      // The camera circles the pedestal: one position per frame, then one render.
      function orbit(time) {
        const angle = time / 8000;
        world.camera.position.set(Math.sin(angle) * 1.2, 0.5, Math.cos(angle) * 1.2);
        world.camera.lookAt(0, 0.2, 0);
        world.render();
        requestAnimationFrame(orbit);
      }
      requestAnimationFrame(orbit);
    </script>
  </body>
</html>
