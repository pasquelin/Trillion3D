<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Side-by-side stereo</title>
    <meta name="thumbnail" content="4" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0c0e17;
      }
      canvas {
        position: absolute;
        top: 0;
        display: block;
        width: 50%;
        height: 100%;
      }
      #view {
        left: 0;
      }
      #right {
        left: 50%;
      }
      /* One fixation mark over each half: cross the eyes (or relax them) until the two marks
         become one, and the orrery stands out of the screen. */
      .eye {
        position: absolute;
        top: 10px;
        width: 50%;
        color: #f4e6cc;
        font: 600 12px system-ui;
        text-align: center;
        pointer-events: none;
      }
      .eye b {
        display: block;
        margin: 0 auto 4px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ffcf7a;
      }
      #seam {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 2px;
        margin-left: -1px;
        background: #000;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <canvas id="right"></canvas>
    <div id="seam"></div>
    <div class="eye" style="left: 0"><b></b><span id="leftEye"></span></div>
    <div class="eye" style="left: 50%"><b></b><span id="rightEye"></span></div>
    <script type="module">
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls, words, opening } from '../runtime/kit.js';
      const say = words();

      // Two worlds, one per eye, each drawing its own copy of the same orrery. The left half takes
      // the mouse; the right half's camera is the left one moved sideways by the eye separation
      // and turned back onto the same point, so both eyes converge on the orrery's centre.
      const PLANETS = [
        { radius: 2.2, size: 0.22, color: '#b7a58f', height: 2.6, period: 5 },
        { radius: 3.2, size: 0.36, color: '#e8c27a', height: 2.2, period: 8 },
        { radius: 4.3, size: 0.4, color: '#3f7fd0', height: 1.9, period: 12, moon: true },
        { radius: 5.3, size: 0.3, color: '#c8553a', height: 1.6, period: 17 },
        { radius: 6.6, size: 0.75, color: '#d9a066', height: 3.4, period: 26, moon: true },
        { radius: 7.9, size: 0.62, color: '#e6d3a1', height: 2.9, period: 34, rings: true },
      ];

      function orrery(world) {
        world.scene.background = math.color('#0c0e17');
        const brass = material.meshStandard({ color: '#c89b4a', roughness: 0.3, metalness: 1 });
        const walnut = material.meshStandard({ color: '#4a2c1c', roughness: 0.55 });
        const add = (shape, paint, at, parent = world.scene) => {
          const mesh = object.mesh(shape, paint);
          mesh.position.set(...at);
          parent.add(mesh);
          return mesh;
        };
        // A walnut table on a dark floor, a brass rim, the sun on its column.
        add(geometry.box(60, 0.2, 60), material.meshStandard({ color: '#1b1716', roughness: 0.9 }), [0, -0.1, 0]);
        add(geometry.cylinder(8.8, 8.4, 0.5, 96), walnut, [0, 0.25, 0]);
        add(geometry.torus(8.8, 0.09, 10, 128), brass, [0, 0.5, 0]).rotation.set(-Math.PI / 2, 0, 0);
        add(geometry.cylinder(0.25, 0.45, 3, 24), brass, [0, 1.5, 0]);
        add(geometry.sphere(1, 48, 32), material.meshStandard({ color: '#000000', emissive: '#ffb347', emissiveIntensity: 5 }), [0, 3.9, 0]);
        // The sun's own light, and no shadow from it; a still warm key casts the shadows.
        world.scene.add(
          light.point({ color: '#ffc27a', intensity: 90, distance: 24, position: [0, 3.9, 0] }),
          light.directional({ color: '#ffd6a8', intensity: 1.6, position: [-9, 14, 7], castShadow: true }),
          light.hemisphere({ color: '#7f9cff', groundColor: '#3a2a20', intensity: 0.6 }),
        );
        // Each planet on its arm: a group turned round the column carries the arm, the rod and
        // the ball; a moon rides a smaller group on the planet, a ring sits tilted round another.
        const arms = PLANETS.map((planet) => {
          const arm = object.group();
          arm.position.y = planet.height > 3 ? 3.2 : 1 + planet.height * 0.3;
          add(geometry.box(planet.radius, 0.06, 0.06), brass, [planet.radius / 2, 0, 0], arm);
          const rod = planet.height - arm.position.y;
          add(geometry.cylinder(0.03, 0.03, Math.abs(rod), 8), brass, [planet.radius, rod / 2, 0], arm);
          const ball = add(geometry.sphere(planet.size, 40, 24), material.meshStandard({ color: planet.color, roughness: 0.6 }), [planet.radius, rod, 0], arm);
          let moon = null;
          if (planet.moon) {
            moon = object.group();
            moon.position.set(planet.radius, rod, 0);
            add(geometry.sphere(planet.size * 0.3, 20, 12), material.meshStandard({ color: '#d6d9e0', roughness: 0.8 }), [planet.size * 2, 0, 0], moon);
            arm.add(moon);
          }
          if (planet.rings) {
            const band = add(geometry.ring(planet.size * 1.4, planet.size * 2.3, 96), material.meshStandard({ color: '#cdb487', roughness: 0.7, side: 'double' }), [planet.radius, rod, 0], arm);
            band.rotation.set(-Math.PI / 2 + 0.45, 0, 0);
          }
          world.scene.add(arm);
          return { arm, ball, moon, planet };
        });
        // Far stars, for depth: small glowing points on a wide shell above the horizon.
        const star = material.meshStandard({ color: '#000000', emissive: '#dfe8ff', emissiveIntensity: 3 });
        const dot = geometry.sphere(0.12, 8, 6);
        for (let k = 0; k < 160; k++) {
          const a = k * 2.39996, up = 0.08 + ((k * 0.618) % 1) * 0.9, reach = 38 + ((k * 7.31) % 1) * 10;
          add(dot, star, [Math.cos(a) * Math.cos(up) * reach, Math.sin(up) * reach, Math.sin(a) * Math.cos(up) * reach]);
        }
        return (time) => {
          for (const { arm, ball, moon, planet } of arms) {
            arm.rotation.set(0, (time / planet.period) * Math.PI * 2, 0);
            ball.rotation.set(0, time * 1.5, 0);
            moon?.rotation.set(0, time * 3, 0);
          }
        };
      }

      const world = createWorld('view', { controls: 'orbit' });
      const other = createWorld('right');
      const turnLeft = orrery(world), turnRight = orrery(other);
      const target = [0, 2.4, 0];
      world.camera.position.set(0, 12, 30);
      world.camera.lookAt(...target);
      world.controls.target.set(...target);
      world.controls.minDistance = 8;
      world.controls.maxDistance = 40;
      world.controls.maxPolarAngle = Math.PI / 2 - 0.05;

      const ui = controls({
        viewing: ['cross-eyed', 'parallel'],
        separation: [0, 1.5, 0.5, 0.01],
        speed: [0, 3, 1],
      }, (values) => {
        // Cross-eyed: the left picture is for the right eye, so the other eye stands to its left.
        const crossed = values.viewing === 'cross-eyed';
        document.getElementById('leftEye').textContent = say(crossed ? 'rightEye' : 'leftEye');
        document.getElementById('rightEye').textContent = say(crossed ? 'leftEye' : 'rightEye');
        world.invalidate();
      });

      // The opening: the planets start lined up and set off at their own speeds while the camera
      // glides in from afar; the first press or wheel on the picture hands it to the viewer.
      let last = 0;
      opening(world, (glide) => {
        const step = glide - last, { position } = world.camera, { target: aim } = world.controls;
        last = glide;
        const x = position.x - aim.x, y = position.y - aim.y, z = position.z - aim.z, reach = Math.hypot(x, y, z);
        const closer = Math.max(15, reach - step * Math.max(0.6, (reach - 15) * 0.9)) / reach, turn = step * 0.1;
        position.set(aim.x + (x * Math.cos(turn) - z * Math.sin(turn)) * closer, aim.y + y * closer, aim.z + (z * Math.cos(turn) + x * Math.sin(turn)) * closer);
      });
      let time = 0;
      const side = math.vector3();
      world.onFrame(({ delta }) => {
        time += Math.min(delta, 0.1) * ui.speed;
        turnLeft(time);
        // The other eye: the same camera, moved along its own right-hand axis and aimed back.
        const sign = ui.viewing === 'cross-eyed' ? -1 : 1;
        side.set(1, 0, 0).applyQuaternion(world.camera.quaternion);
        other.camera.position.copy(world.camera.position).addScaledVector(side, sign * ui.separation);
        other.camera.lookAt(world.controls.target);
        world.invalidate();
      });
      other.onFrame(() => {
        turnRight(time);
        other.invalidate();
      });
      world.invalidate();
    </script>
  </body>
</html>
