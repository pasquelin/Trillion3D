<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spin an astrolabe</title>
    <meta name="thumbnail" content="2" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, side } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      // A sequence in [0, 1) from a seed: the same scene on every run.
      function random(seed) {
        let state = seed >>> 0;
        return () => (state = (Math.imul(state, 1664525) + 1013904223) >>> 0) / 4294967296;
      }

      // `trackball`: drag spins the object any way at all, over the top and upside down, roll
      // included; there is no horizon to keep.
      const world = createWorld('view', { controls: 'trackball' });
      const brass = material.meshStandard({ color: '#d9a441', metalness: 0.5, roughness: 0.3 });
      const bronze = material.meshStandard({ color: '#b0643a', metalness: 0.5, roughness: 0.35 });
      const astrolabe = object.group();
      world.scene.add(astrolabe);
      // Rings inside rings, each on its own axis: an armillary sphere.
      const rings = [[2.2, [0, 0, 0], brass], [1.9, [Math.PI / 2, 0, 0], bronze], [1.65, [0, 0, Math.PI / 2.6], brass], [1.4, [Math.PI / 3, Math.PI / 4, 0], bronze], [1.15, [Math.PI / 2, 0, Math.PI / 5], brass]];
      const spinning = rings.map(([radius, [x, y, z], matter], index) => {
        const ring = object.mesh(geometry.torus(radius, 0.05, 16, 160), matter);
        ring.rotation.set(x, y, z);
        astrolabe.add(ring);
        return { ring, tilt: z, rate: 0.2 + index * 0.12 };
      });
      // A glowing sun at the heart, and twelve stars pinned on the outer ring.
      const sun = object.mesh(geometry.sphere(0.45, 64, 32), material.meshStandard({ color: '#000000', emissive: '#ffb347', emissiveIntensity: 6 }));
      astrolabe.add(sun);
      const star = material.meshStandard({ color: '#000000', emissive: '#9fd4ff', emissiveIntensity: 8 });
      for (let index = 0; index < 12; index++) {
        const angle = (index / 12) * Math.PI * 2;
        const point = object.mesh(geometry.sphere(0.08, 16, 12), star);
        point.position.set(Math.cos(angle) * 2.2, Math.sin(angle) * 2.2, 0);
        spinning[0].ring.add(point);
      }
      // The night sky around it: a dome seen from inside, and a few hundred far stars.
      const dome = object.mesh(geometry.sphere(40, 64, 32), material.meshStandard({ color: '#1b2350', roughness: 1, side: side.double }));
      world.scene.add(dome);
      const far = material.meshStandard({ color: '#000000', emissive: '#ffffff', emissiveIntensity: 3 }), next = random(2);
      const speck = geometry.sphere(1, 8, 6);
      for (let index = 0; index < 300; index++) {
        const point = object.mesh(speck, far);
        point.scale.setScalar(0.08 + next() * 0.1);
        point.position.set(next() - 0.5, next() - 0.5, next() - 0.5).setLength(36);
        world.scene.add(point);
      }
      const axis = object.mesh(geometry.cylinder(0.03, 0.03, 5.4, 12), bronze);
      astrolabe.add(axis);
      const glow = light.point({ intensity: 25, distance: 10, color: '#ffb347', radius: 0.45, castShadow: true });
      world.scene.add(glow, light.directional({ intensity: 2.5, color: '#9fc0ff', position: [-5, 3, 4] }), light.directional({ intensity: 2, color: '#ffd7a8', position: [5, -2, 3] }), light.ambient({ intensity: 0.3 }));
      world.camera.position.set(0, 1.2, 5.6);
      world.camera.far = 100;
      world.camera.lookAt(0, 0, 0);
      world.controls.target.set(0, 0, 0);

      const ui = controls({ mouse: 'Drag to spin it any way, even upside down · scroll to zoom', turning: true, sun: '#ffb347' }, (values) => {
        glow.color.set(values.sun);
        world.invalidate();
      }, world);
      // Each ring turns in its own plane: the last of its three angles, applied first, is the spin.
      let time = 0;
      world.onFrame(({ delta }) => {
        if (!ui.turning) return;
        time += delta;
        for (const { ring, tilt, rate } of spinning) ring.rotation.z = tilt + time * rate;
        world.invalidate();
      });
    </script>
  </body>
</html>
