<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Drag a crate</title>
    <meta name="thumbnail" content="2" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #9fb4cc;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls, pointerOnPlane } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      world.scene.background = math.color('#9fb4cc');
      const floor = object.mesh(
        geometry.box(12, 0.2, 9),
        material.meshStandard({ color: '#d7c8aa', roughness: 0.9 }),
      );
      floor.position.y = -0.1;
      const crate = object.mesh(
        geometry.box(1.4, 1.4, 1.4),
        material.meshStandard({ color: '#9a5b2f', roughness: 0.75 }),
      );
      const HOME = [0, 0.7, 0];
      crate.position.set(...HOME);
      world.scene.add(floor, crate);
      world.scene.add(
        light.directional({
          intensity: 3,
          color: '#fff0d6',
          position: [5, 9, 6],
          castShadow: true,
        }),
        light.hemisphere({ intensity: 0.8, color: '#d9e8ff', groundColor: '#66513f' }),
      );
      world.camera.position.set(4.8, 4, 6.2);
      world.camera.lookAt(0, 0, 0);
      world.controls.target.set(0, 0, 0);

      let drag = null;
      const ui = controls(
        {
          snap: false,
          home: () => {
            crate.position.set(...HOME);
            world.invalidate();
          },
        },
        world,
      );
      const place = (value) => (ui.snap ? Math.round(value * 2) / 2 : value);
      const within = (value, limit) => Math.max(-limit, Math.min(limit, place(value)));
      world.canvas.addEventListener('pointerdown', (event) => {
        if (event.button !== 0 || drag) return;
        const hit = world.raycast({ x: event.offsetX, y: event.offsetY }, { objects: [crate] });
        if (!hit) return;
        drag = {
          pointerId: event.pointerId,
          offsetX: crate.position.x - hit.point.x,
          offsetZ: crate.position.z - hit.point.z,
          height: hit.point.y,
          controlsEnabled: world.controls.enabled,
        };
        world.controls.enabled = false;
        world.canvas.setPointerCapture(event.pointerId);
      });
      world.canvas.addEventListener('pointermove', (event) => {
        if (!drag || event.pointerId !== drag.pointerId) return;
        const point = pointerOnPlane(world, event, drag.height);
        if (!point) return;
        crate.position.set(
          within(point[0] + drag.offsetX, 5.3),
          HOME[1],
          within(point[1] + drag.offsetZ, 3.8),
        );
        world.invalidate();
      });
      const finish = (event) => {
        if (!drag || event.pointerId !== drag.pointerId) return;
        const { pointerId, controlsEnabled } = drag;
        drag = null;
        world.controls.enabled = controlsEnabled;
        if (world.canvas.hasPointerCapture(pointerId))
          world.canvas.releasePointerCapture(pointerId);
      };
      world.canvas.addEventListener('pointerup', finish);
      world.canvas.addEventListener('pointercancel', finish);
      world.canvas.addEventListener('lostpointercapture', finish);
    </script>
  </body>
</html>
