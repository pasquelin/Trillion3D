<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fog thickening with depth</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createExplorer } from '../runtime/engine.js';

      const view = document.getElementById('view');
      const explorer = await createExplorer(view, {
        manifestUrl: '../assets/examples/colonnade/cache/native/full/manifest.json',
        scope: 'full',
        interactive: true,
      });
      explorer.addLight({
      "kind": "directional",
      "direction": [
              -0.2,
              -0.5,
              -0.8
      ],
      "color": [
              0.7,
              0.8,
              0.9
      ],
      "intensity": 2.5,
      "id": "sun"
});
      // Atmospheric depth haze thickening toward the far end of the hall.
explorer.setPose({ ...explorer.homePose(), position: [0, 1.6, 6.5], target: [0, 1.6, -6.0] });
explorer.invalidate();
    </script>
  </body>
</html>
