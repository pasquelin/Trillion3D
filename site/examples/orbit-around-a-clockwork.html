<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Orbit a clockwork</title>
    <meta name="thumbnail" content="2" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      // `orbit`: the camera circles a point, `world.controls.target`, and never loses the horizon.
      const world = createWorld('view', { controls: 'orbit' });
      const brass = material.meshStandard({ color: '#d4a24c', metalness: 0.85, roughness: 0.3 });
      const steel = material.meshStandard({ color: '#9aa3ad', metalness: 0.9, roughness: 0.25 });
      const wood = material.meshStandard({ color: '#4a2e1c', roughness: 0.6 });
      const pedestal = object.mesh(geometry.cylinder(1.6, 1.8, 1, 64), wood);
      pedestal.position.y = 0.5;
      const floor = object.mesh(geometry.cylinder(8, 8, 0.1, 96), material.meshStandard({ color: '#23262e', roughness: 0.8 }));
      floor.position.y = -0.05;
      world.scene.add(pedestal, floor);

      // A gear: a disc, a hub and teeth round its rim. Two meshing gears turn in opposite ways, the
      // small one faster, in the ratio of their teeth.
      function gear(radius, teeth, matter) {
        const group = object.group();
        const disc = object.mesh(geometry.cylinder(radius, radius, 0.12, 64), matter);
        disc.rotation.x = Math.PI / 2;
        const hub = object.mesh(geometry.cylinder(radius * 0.25, radius * 0.25, 0.3, 32), steel);
        hub.rotation.x = Math.PI / 2;
        group.add(disc, hub);
        for (let index = 0; index < teeth; index++) {
          const angle = (index / teeth) * Math.PI * 2;
          const tooth = object.mesh(geometry.box(0.1, 0.16, 0.12), matter);
          tooth.position.set(Math.cos(angle) * (radius + 0.06), Math.sin(angle) * (radius + 0.06), 0);
          tooth.rotation.z = angle;
          group.add(tooth);
        }
        return group;
      }
      const train = [[0.9, 36, -0.5, 1.9, 0.2], [0.45, 18, 0.88, 1.9, 0.2], [0.6, 24, 0.2, 2.9, -0.1], [0.3, 12, 1.3, 2.75, -0.1]];
      const gears = train.map(([radius, teeth, x, y, z], index) => {
        const wheel = gear(radius, teeth, index % 2 ? steel : brass);
        wheel.position.set(x, y, z);
        world.scene.add(wheel);
        return { wheel, speed: (index % 2 ? -1 : 1) * (36 / teeth) };
      });
      // A pendulum below, swinging on its own beat.
      const pendulum = object.group();
      pendulum.position.set(-0.5, 1.9, 0.35);
      const rod = object.mesh(geometry.cylinder(0.02, 0.02, 0.8, 8), steel);
      rod.position.y = -0.4;
      const bob = object.mesh(geometry.sphere(0.13, 32, 16), brass);
      bob.position.y = -0.85;
      pendulum.add(rod, bob);
      world.scene.add(pendulum);

      world.scene.add(light.spot({ position: [3, 6, 4], intensity: 250, distance: 16, angle: 0.5, penumbra: 0.4, castShadow: true, color: '#fff1dc' }));
      world.scene.add(light.point({ position: [-3, 3, -2], intensity: 25, distance: 10, color: '#6fa8ff' }));
      world.scene.add(light.ambient({ intensity: 0.2, color: '#8fb4ff' }));
      world.camera.position.set(2.6, 3, 4.4);
      world.camera.lookAt(0.2, 2.2, 0);
      world.controls.target.set(0.2, 2.2, 0);

      const ui = controls({
        mouse: 'Drag to turn around · right-drag to slide · scroll to zoom in on the teeth',
        speed: [0, 3, 1], brass: '#d4a24c',
      }, (values) => {
        brass.color.set(values.brass);
        world.invalidate();
      });
      let time = 0;
      world.onFrame(({ delta }) => {
        time += delta * ui.speed;
        for (const { wheel, speed } of gears) wheel.rotation.z = time * speed * 0.5;
        pendulum.rotation.z = Math.sin(time * 3) * 0.35;
        world.invalidate();
      });
    </script>
  </body>
</html>
