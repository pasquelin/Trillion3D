<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Exposure from noon to dusk</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p id="clock"></p>
    <script type="module">
      import { createExplorer } from '../runtime/engine.js';

      // Manual rendering: the loop below draws every frame itself, so the canvas size is given.
      const canvas = document.getElementById('view');
      const explorer = await createExplorer(canvas, {
        manifestUrl: '../assets/examples/sundial/cache/native/full/manifest.json',
        scope: 'full',
        width: canvas.clientWidth,
        height: canvas.clientHeight,
        pixelRatio: devicePixelRatio,
      });
      explorer.addLight({
        id: 'sun',
        kind: 'directional',
        direction: [0, -1, 0],
        color: [1, 1, 1],
        intensity: 3,
        castsShadow: true,
      });
      explorer.setPose({ ...explorer.homePose(), position: [4.5, 3.2, 5.5], target: [0, 0.2, 0] });

      // Twelve seconds from noon to dusk, then back. The sun sinks and reddens, its irradiance
      // falls as it thins through the atmosphere, and the exposure rises to keep the dial
      // readable — what a camera does with its aperture, applied at composition.
      const clock = document.getElementById('clock');
      async function frame(time) {
        const day = (1 - Math.cos((time / 12000) * Math.PI)) / 2, // 0 at noon, 1 at dusk
          elevation = (1 - day * 0.97) * (Math.PI / 2),
          hour = 12 + day * 7;
        explorer.setLight('sun', {
          direction: [-Math.cos(elevation) * 0.8, -Math.sin(elevation), -Math.cos(elevation) * 0.6],
          color: [1, 1 - day * 0.55, 1 - day * 0.85],
          intensity: 3 * (1 - day * 0.85),
        });
        explorer.setEnvironment({ exposure: 1 + day * 1.5 });
        clock.textContent = `${Math.floor(hour)}:${String(Math.floor((hour % 1) * 60)).padStart(2, '0')} — exposure ×${(1 + day * 1.5).toFixed(1)}`;
        await explorer.awaitPages();
        explorer.render();
        await explorer.flush();
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
