<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Exposure from noon to dusk</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p id="clock"></p>
    <script type="module">
      import { createWorld, geometry, material, object, light } from '../runtime/engine.js';

      // Host-led loop: the world schedules nothing, so the sun can be moved every frame by hand.
      const world = createWorld('view', { interactive: false, controls: 'orbit', pixelRatio: devicePixelRatio });
      const stone = material.meshStandard({ color: [0.82, 0.78, 0.68], roughness: 0.8 });
      const bronze = material.meshStandard({ color: [0.55, 0.38, 0.2], metalness: 0.9, roughness: 0.35 });
      const dial = object.mesh(geometry.cylinder(3.2, 3.2, 0.4, 48), stone);
      dial.position.y = -0.2;
      const gnomon = object.mesh(geometry.box(0.08, 2, 0.08), bronze);
      gnomon.position.set(0, 0.7, -0.5);
      gnomon.rotation.x = -Math.PI / 4;
      world.scene.add(dial, gnomon);
      for (let hour = 0; hour < 12; hour++) {
        const angle = (hour / 12) * Math.PI * 2;
        const post = object.mesh(geometry.box(0.16, 0.4, 0.16), bronze);
        post.position.set(Math.cos(angle) * 2.8, 0.2, Math.sin(angle) * 2.8);
        world.scene.add(post);
      }

      const sun = light.directional({ intensity: 3, color: [1, 1, 1], position: [0, 1, 0], target: [0, 0, 0], castShadow: true });
      world.scene.add(sun);
      world.camera.position.set(4.5, 3.2, 5.5);
      world.camera.lookAt(0, 0.2, 0);
      world.controls.target.set(0, 0.2, 0);

      // Twelve seconds from noon to dusk, then back. The sun sinks and reddens, its irradiance
      // falls as it thins through the atmosphere, and the world's exposure rises to compensate —
      // an eye adapting to the fading light, not a change to the sun itself.
      const clock = document.getElementById('clock');
      function frame(time) {
        const day = (1 - Math.cos((time / 12000) * Math.PI)) / 2, // 0 at noon, 1 at dusk
          elevation = (1 - day * 0.97) * (Math.PI / 2),
          hour = 12 + day * 7;
        sun.position.set(Math.cos(elevation) * 8, Math.sin(elevation) * 10, Math.cos(elevation) * 6);
        sun.color.set([1, 1 - day * 0.55, 1 - day * 0.85]);
        sun.intensity = 3 * (1 - day * 0.85);
        world.exposure = 1 + day * 1.5;
        clock.textContent = `${Math.floor(hour)}:${String(Math.floor((hour % 1) * 60)).padStart(2, '0')} — exposure ${world.exposure.toFixed(2)}`;
        world.render();
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
