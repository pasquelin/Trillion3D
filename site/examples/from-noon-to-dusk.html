<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Noon to dusk</title>
    <meta name="thumbnail" content="7" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });

      // A sundial in a ring of columns: every shadow turns with the sun.
      const stone = material.meshStandard({ color: '#d6cbb4', roughness: 0.8 });
      const bronze = material.meshStandard({ color: '#8c6035', metalness: 0.9, roughness: 0.35 });
      const lawn = object.mesh(geometry.cylinder(9, 9, 0.2, 96), material.meshStandard({ color: '#4d6b3a', roughness: 0.95 }));
      lawn.position.y = -0.1;
      const dial = object.mesh(geometry.cylinder(2.2, 2.4, 0.4, 64), stone);
      dial.position.y = 0.2;
      const gnomon = object.mesh(geometry.box(0.08, 1.6, 0.9), bronze);
      gnomon.position.set(0, 0.75, -0.2);
      gnomon.rotation.x = -0.6;
      world.scene.add(lawn, dial, gnomon);
      const profile = [[0, 0], [0.42, 0], [0.42, 0.25], [0.3, 0.25], [0.26, 2.9], [0.4, 3], [0.42, 3.2], [0, 3.2]];
      for (let index = 0; index < 12; index++) {
        const angle = (index / 12) * Math.PI * 2;
        const column = object.mesh(geometry.lathe(profile, 32), stone);
        column.position.set(Math.cos(angle) * 6, 0, Math.sin(angle) * 6);
        const mark = object.mesh(geometry.box(0.12, 0.08, 0.4), bronze);
        mark.position.set(Math.cos(angle) * 1.9, 0.44, Math.sin(angle) * 1.9);
        mark.rotation.y = -angle;
        world.scene.add(column, mark);
      }

      // The sun, and the blue sky's own light filling the shadows it leaves.
      const sun = light.directional({ intensity: 3, castShadow: true });
      world.scene.add(sun, light.ambient({ intensity: 0.25, color: '#8fb4ff' }));
      world.camera.position.set(7, 4.4, 7.8);
      world.camera.lookAt(0, 0.6, 0);
      world.controls.target.set(0, 0.6, 0);

      const ui = controls({ speed: [0, 3, 0.8], hour: [6, 20, 12, 0.5], adaptEyes: true }, world);
      // The sun rises in the east at six and sets in the west at twenty. Near the horizon it
      // reddens and its light thins; `exposure` then rises like an eye adapting to the dusk.
      let hour = ui.hour, from = ui.hour;
      world.onFrame(({ delta }) => {
        if (ui.hour !== from) hour = from = ui.hour;
        hour += delta * ui.speed; // hours per second
        if (hour > 20) hour = 6;
        const arc = ((hour - 6) / 14) * Math.PI, height = Math.sin(arc);
        sun.position.set(Math.cos(arc) * 10, 1 + height * 11, 5);
        sun.color.setRGB(1, 0.55 + 0.45 * height, 0.25 + 0.75 * height);
        sun.intensity = 0.4 + 2.8 * height;
        world.exposure = ui.adaptEyes ? 1 + (1 - height) * 1.5 : 1;
        world.invalidate();
      });
      world.invalidate();
    </script>
  </body>
</html>
