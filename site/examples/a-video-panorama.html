<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A video panorama</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e1830;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <input id="file" type="file" accept="video/*" hidden />
    <script type="module">
      // Waits for #362: a texture made from a video shows each new frame of the video by itself,
      // without a change to its material; until then the panorama stands still.
      import { createWorld, geometry, material, object, texture, side } from '../runtime/engine.js';
      import { controls, playPickedVideo, readout } from '../runtime/kit.js';

      // A 360° video: every direction at once, the turn around the viewer across, from straight up
      // to straight down along. This page films one of its own — dusk over the sea, clouds
      // drifting, a lighthouse sweeping its beam — and "Open video" plays a 360° file of yours.
      const W = 1536, H = 768;
      const studio = document.createElement('canvas');
      studio.width = W;
      studio.height = H;
      const pen = studio.getContext('2d');
      const CLOUDS = Array.from({ length: 14 }, (_, k) => ({ x: (k * 0.37) % 1, y: 0.18 + ((k * 0.61) % 1) * 0.22, size: 40 + ((k * 53) % 70), speed: 0.004 + ((k * 7) % 5) * 0.002 }));
      const LIGHTHOUSE = 0.62;
      function film(seconds) {
        const air = pen.createLinearGradient(0, 0, 0, H / 2);
        air.addColorStop(0, '#0e1830');
        air.addColorStop(0.65, '#5a3a78');
        air.addColorStop(1, '#ff8a5c');
        pen.fillStyle = air;
        pen.fillRect(0, 0, W, H / 2);
        const sea = pen.createLinearGradient(0, H / 2, 0, H);
        sea.addColorStop(0, '#3a3050');
        sea.addColorStop(1, '#070a14');
        pen.fillStyle = sea;
        pen.fillRect(0, H / 2, W, H / 2);
        // Clouds drift east; one leaving the right edge comes back on the left, as the turn does.
        pen.fillStyle = 'rgba(255, 190, 170, 0.35)';
        for (const cloud of CLOUDS) {
          const x = (((cloud.x + seconds * cloud.speed) % 1) * W);
          for (const shift of [-W, 0]) {
            pen.beginPath();
            pen.ellipse(x + shift, cloud.y * H, cloud.size * 2.2, cloud.size * 0.45, 0, 0, Math.PI * 2);
            pen.fill();
          }
        }
        // Glints on the water, rolling toward the viewer.
        pen.fillStyle = 'rgba(255, 170, 120, 0.5)';
        for (let k = 0; k < 160; k++) {
          const depth = ((k * 0.618 + seconds * 0.05) % 1) ** 2, y = H / 2 + 4 + depth * (H / 2 - 8);
          pen.fillRect(((k * 97) % W), y, 6 + depth * 60, 1 + depth * 3);
        }
        // The lighthouse on the horizon, its beam sweeping round once every eight seconds: it
        // flares as it faces the viewer.
        const x = LIGHTHOUSE * W, facing = Math.max(0, Math.cos((seconds / 8) * Math.PI * 2));
        pen.fillStyle = '#1a1420';
        pen.fillRect(x - 5, H / 2 - 40, 10, 40);
        pen.fillStyle = `rgba(255, 244, 200, ${0.3 + 0.7 * facing})`;
        pen.beginPath();
        pen.arc(x, H / 2 - 44, 5 + 20 * facing ** 8, 0, Math.PI * 2);
        pen.fill();
      }
      film(0);
      const video = document.createElement('video');
      video.muted = true;
      video.loop = true;
      video.playsInline = true;
      video.srcObject = studio.captureStream(30);
      video.play();

      // The video on a great sphere seen from inside, unlit, and the camera at its centre. Seen
      // from inside, the sphere's UVs run the wrong way round: they are turned across once.
      const world = createWorld('view', { controls: 'orbit' });
      const ball = geometry.sphere(100, 96, 48), uv = ball.attributes.uv;
      for (let v = 0; v < uv.count; v++) uv.setXY(v, 1 - uv.getX(v), uv.getY(v));
      const dome = object.mesh(ball, material.meshBasic({ map: texture.video(video), side: side.back }));
      world.scene.add(dome);
      world.camera.far = 300;
      world.camera.position.set(0, 0, 0.01);
      world.camera.lookAt(0, 0, 0);
      world.controls.target.set(0, 0, 0);
      world.controls.minDistance = world.controls.maxDistance = 0.01;
      world.controls.maxPolarAngle = Math.PI - 0.05;

      const picker = document.getElementById('file');
      playPickedVideo(picker, video, () => source('your file'));
      const ui = controls({
        mouse: 'Drag to look around; the view turns on its own until you press',
        playing: true,
        fieldOfView: [40, 110, 75, 1],
        openVideo: () => picker.click(),
      }, (values, key) => {
        if (key === 'playing') values.playing ? video.play() : video.pause();
        world.camera.fov = values.fieldOfView;
        world.invalidate();
      }, world);
      const source = readout('Playing');
      source('dusk over the sea');

      // The page films its dusk while it plays, and the view pans slowly until the first press or
      // wheel on the canvas.
      let seconds = 0, panning = true;
      for (const type of ['pointerdown', 'wheel']) world.canvas.addEventListener(type, () => (panning = false), { passive: true });
      world.onFrame(({ delta }) => {
        const step = Math.min(delta, 0.1);
        if (panning) {
          const turn = Math.atan2(world.camera.position.x, world.camera.position.z) + step * 0.05;
          world.camera.position.set(Math.sin(turn) * 0.01, world.camera.position.y, Math.cos(turn) * 0.01);
          world.camera.lookAt(0, 0, 0);
        }
        if (ui.playing) {
          seconds += step;
          if (video.srcObject) film(seconds);
        }
        if (panning || ui.playing) world.invalidate();
      });
    </script>
  </body>
</html>
