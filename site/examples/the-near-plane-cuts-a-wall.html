<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The near plane cuts a wall</title>
    <meta name="thumbnail" content="2" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #c8d8e8;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      const world = createWorld('view');
      world.scene.background = math.color('#c8d8e8');

      // Four arches cross the camera's view at known distances. Moving the real camera near
      // plane through them cuts their geometry; the page never hides or fades a wall itself.
      const ARCHES = [
        { colour: '#d45f45', depth: 5, opening: 3.8 },
        { colour: '#e3a536', depth: 2, opening: 3.4 },
        { colour: '#3f9a78', depth: -1, opening: 3 },
        { colour: '#477bb8', depth: -4, opening: 2.6 },
      ];
      const side = geometry.box(2.2, 5, 0.35);
      for (const { colour, depth, opening } of ARCHES) {
        const stone = material.meshStandard({ color: colour, roughness: 0.75 });
        const parts = [
          [side, -opening - 1.1, 2.5],
          [side, opening + 1.1, 2.5],
          [geometry.box(opening * 2, 1.2, 0.35), 0, 4.4],
        ];
        for (const [shape, x, y] of parts) {
          const wall = object.mesh(shape, stone);
          wall.position.set(x, y, depth);
          world.scene.add(wall);
        }
      }

      // Floor stripes make the distance between the walls readable while the plane advances.
      const floor = object.mesh(
        geometry.box(18, 0.2, 24),
        material.meshStandard({ color: '#d9c9aa', roughness: 0.9 }),
      );
      floor.position.set(0, -0.1, -1);
      world.scene.add(floor);
      const stripeShape = geometry.box(18, 0.03, 0.18);
      const stripePaint = material.meshStandard({ color: '#755d47', roughness: 0.8 });
      for (const { depth } of ARCHES) {
        const stripe = object.mesh(stripeShape, stripePaint);
        stripe.position.set(0, 0.02, depth);
        world.scene.add(stripe);
      }

      world.scene.add(
        light.directional({
          color: '#fff0d8',
          intensity: 3,
          position: [6, 10, 8],
          castShadow: true,
        }),
        light.hemisphere({ color: '#dceaff', groundColor: '#6f604d', intensity: 0.8 }),
      );
      world.camera.position.set(0, 2.1, 9);
      world.camera.lookAt(0, 2.1, -5);
      world.camera.far = 100;

      controls(
        { nearPlane: [0.1, 14, 4, 0.1] },
        ({ nearPlane }) => {
          // Camera optics redraw on assignment; no projection matrix or clipping imitation is needed.
          world.camera.near = nearPlane;
        },
        world,
      );

      addEventListener('pagehide', () => world.dispose(), { once: true });
      world.invalidate();
    </script>
  </body>
</html>
