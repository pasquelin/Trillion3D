<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Floating crates</title>
    <meta name="thumbnail" content="4" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls, readout, seeded } from '../runtime/kit.js';

      // Water is an option of the physics: every step, the worker weighs the water each body
      // displaces and pushes it up by that much, so what is lighter than water floats.
      const world = createWorld('view', { controls: 'orbit', physics: true });
      world.scene.background = math.color('#cfe2ee');
      world.camera.far = 400;

      // A stone basin, static bodies: a floor and four walls the water fills.
      const WIDE = 28, DEEP = 20, WALL = 4.5;
      const stone = material.meshStandard({ color: '#b8b0a2', roughness: 0.92, physics: 'stone' });
      const slab = (w, h, d, x, y, z) => {
        const mesh = object.mesh(geometry.box(w, h, d), stone);
        mesh.position.set(x, y, z);
        mesh.physics = 'static';
        mesh.receiveShadow = mesh.castShadow = true;
        world.scene.add(mesh);
      };
      slab(WIDE + 2, 1, DEEP + 2, 0, -0.5, 0);
      for (const side of [-1, 1]) {
        slab(1, WALL, DEEP + 2, side * (WIDE / 2 + 0.5), WALL / 2, 0);
        slab(WIDE, WALL, 1, 0, WALL / 2, side * (DEEP / 2 + 0.5));
      }

      // Four waves of the engine's own model: the physics floats the bodies on them, and the
      // drawn surface below is moved by the very same numbers.
      const SWELL = [
        { direction: [1, 0.35], wavelength: 11, amplitude: 0.42, steepness: 0.3 },
        { direction: [0.5, 1], wavelength: 6.5, amplitude: 0.2, steepness: 0.25 },
        { direction: [-0.6, 1], wavelength: 3.7, amplitude: 0.09, steepness: 0.15 },
        { direction: [1, -0.8], wavelength: 2.3, amplitude: 0.04, steepness: 0.1 },
      ];

      // The surface: a grid of flat tiles, one shape and one matter shared, each posed every frame
      // on the four corners where the waves carry it. A written shape is cut again and opens the
      // world's session again, so vertices rewritten every frame would never be drawn; a tile
      // moved, turned and stretched is a pose, written in place.
      //
      // A tile is the parallelogram of its corners: a holder turned and stretched, around the tile
      // turned about its normal (turn, stretch, turn reach any flat parallelogram). Its corners are
      // then off their points only by the cell's twist |p - q - r + s| / 4, at most
      // cell² / 4 · Σ k² · |dx · dz| · max(A, Q·A) over the loudest waves the panel allows. Cells sized
      // from that bound keep every corner within TWIST of its point, so neighbours meet within 2 · TWIST.
      const TWIST = 0.03, LOUDEST = 2;
      const bend = SWELL.reduce((sum, { direction: [dx, dz], wavelength, amplitude, steepness }) => {
        const k = (2 * Math.PI) / wavelength;
        return sum + k * k * (Math.abs(dx * dz) / (dx * dx + dz * dz)) * Math.max(amplitude * LOUDEST, steepness / k);
      }, 0);
      const side = Math.sqrt((4 * TWIST) / bend);
      const ACROSS = Math.ceil(WIDE / side), ALONG = Math.ceil(DEEP / side), CX = WIDE / ACROSS, CZ = DEEP / ALONG;
      const tile = geometry.plane(CX, CZ).rotateX(-Math.PI / 2);
      const water = material.meshStandard({ color: '#1d6d8c', roughness: 0.06, metalness: 0.1, transparent: true, opacity: 0.8, depthWrite: false, side: 'double' });
      const holders = [];
      for (let i = 0; i < ACROSS * ALONG; i++) {
        const holder = object.group();
        holder.add(object.mesh(tile, water));
        world.scene.add(holder);
        holders.push(holder);
      }
      // The corners, (ACROSS + 1) × (ALONG + 1) points, x then z, where the waves put them.
      const corners = new Float64Array((ACROSS + 1) * (ALONG + 1) * 3), point = new Float64Array(3);
      const frame = { elements: new Float64Array(16) }, ex = [0, 0, 0], ez = [0, 0, 0];
      const drawSurface = (surface) => {
        for (let k = 0, at = 0; k <= ALONG; k++)
          for (let i = 0; i <= ACROSS; i++, at += 3)
            corners.set(surface.point(-WIDE / 2 + i * CX, -DEEP / 2 + k * CZ, point), at);
        const m = frame.elements;
        for (let k = 0; k < ALONG; k++)
          for (let i = 0; i < ACROSS; i++) {
            const a = (k * (ACROSS + 1) + i) * 3, b = a + 3, c = a + (ACROSS + 1) * 3, d = c + 3;
            const holder = holders[k * ACROSS + i];
            // The tile's two edges, each the mean of its two sides, and its centre.
            for (let axis = 0; axis < 3; axis++) {
              const p = corners[a + axis], q = corners[b + axis], r = corners[c + axis], s = corners[d + axis];
              ex[axis] = (q - p + s - r) / 2;
              ez[axis] = (r - p + s - q) / 2;
            }
            holder.position.set(
              (corners[a] + corners[b] + corners[c] + corners[d]) / 4,
              (corners[a + 1] + corners[b + 1] + corners[c + 1] + corners[d + 1]) / 4,
              (corners[a + 2] + corners[b + 2] + corners[c + 2] + corners[d + 2]) / 4,
            );
            // Its plane: u along the first edge, n the normal, w = u × n.
            const length = Math.hypot(ex[0], ex[1], ex[2]);
            const ux = ex[0] / length, uy = ex[1] / length, uz = ex[2] / length;
            let nx = ez[1] * ex[2] - ez[2] * ex[1], ny = ez[2] * ex[0] - ez[0] * ex[2], nz = ez[0] * ex[1] - ez[1] * ex[0];
            const n = Math.hypot(nx, ny, nz);
            nx /= n; ny /= n; nz /= n;
            const wx = uy * nz - uz * ny, wy = uz * nx - ux * nz, wz = ux * ny - uy * nx;
            // The rest cell to its edges in (u, w), [[m00, m01], [0, m11]], split into turn φ,
            // stretch (σ1, σ2) and turn θ (the closed-form 2 × 2 singular value decomposition).
            const m00 = length / CX, m01 = (ez[0] * ux + ez[1] * uy + ez[2] * uz) / CZ, m11 = (ez[0] * wx + ez[1] * wy + ez[2] * wz) / CZ;
            const E = (m00 + m11) / 2, F = (m00 - m11) / 2, G = m01 / 2, H = -m01 / 2;
            const Q = Math.hypot(E, H), R = Math.hypot(F, G), a1 = Math.atan2(G, F), a2 = Math.atan2(H, E);
            const cos = Math.cos((a2 + a1) / 2), sin = Math.sin((a2 + a1) / 2);
            m[0] = cos * ux + sin * wx; m[1] = cos * uy + sin * wy; m[2] = cos * uz + sin * wz;
            m[4] = nx; m[5] = ny; m[6] = nz;
            m[8] = cos * wx - sin * ux; m[9] = cos * wy - sin * uy; m[10] = cos * wz - sin * uz;
            holder.quaternion.setFromRotationMatrix(frame);
            holder.scale.set(Q + R, 1, Q - R);
            // Rot(θ) on the rest (x, z) is a turn of −θ about y.
            holder.children[0].rotation.y = -(a2 - a1) / 2;
          }
      };

      // What floats and what does not is the matter's density against the water's (kg/m³).
      const matters = {
        crate: material.meshStandard({ color: '#b7793f', roughness: 0.8, physics: 'wood' }),
        barrel: material.meshStandard({ color: '#8e3b2b', roughness: 0.55, physics: 'wood', density: 350 }),
        ball: material.meshStandard({ color: '#ffc93a', roughness: 0.4, physics: 'rubber', density: 120 }),
        ice: material.meshStandard({ color: '#e4f5ff', roughness: 0.12, physics: 'ice' }),
        rock: material.meshStandard({ color: '#6b6660', roughness: 0.95, physics: 'stone' }),
      };
      const shapes = {
        crate: geometry.box(1, 1, 1),
        barrel: geometry.cylinder(0.45, 0.45, 1.3, 24),
        ball: geometry.sphere(0.45, 24, 16),
        ice: geometry.box(1.6, 1, 1.4),
        rock: geometry.box(0.8, 0.7, 0.8),
      };
      const MIX = ['crate', 'crate', 'crate', 'barrel', 'barrel', 'ball', 'ice', 'rock'];

      // The raft is one rigid body of three primitives: a deck and two pontoons under it. The
      // drawn pontoons and mast are plain children of the deck; only the deck holds the body.
      const makeRaft = () => {
        const wood = material.meshStandard({ color: '#d2a86b', roughness: 0.85, physics: 'wood', density: 300 });
        const raft = object.mesh(geometry.box(3.2, 0.18, 2.2), wood);
        const side = [0, 0, Math.SQRT1_2, Math.SQRT1_2];
        raft.physics = {
          type: 'dynamic',
          shape: {
            type: 'compound',
            parts: [
              { type: 'box', halfExtents: [1.6, 0.09, 1.1] },
              { type: 'cylinder', halfHeight: 1.6, radius: 0.32, position: [0, -0.32, 0.75], quaternion: side },
              { type: 'cylinder', halfHeight: 1.6, radius: 0.32, position: [0, -0.32, -0.75], quaternion: side },
            ],
          },
        };
        const tube = geometry.cylinder(0.32, 0.32, 3.2, 24), float = material.meshStandard({ color: '#e0572e', roughness: 0.5 });
        for (const z of [0.75, -0.75]) {
          const pontoon = object.mesh(tube, float);
          pontoon.position.set(0, -0.32, z);
          pontoon.rotation.set(0, 0, Math.PI / 2);
          raft.add(pontoon);
        }
        const mast = object.mesh(geometry.cylinder(0.05, 0.05, 2.2, 12), wood);
        mast.position.set(-0.8, 1.1, 0);
        const flag = object.mesh(geometry.box(0.9, 0.55, 0.03), material.meshStandard({ color: '#2f86c9', roughness: 0.6 }));
        flag.position.set(-0.33, 1.9, 0);
        raft.add(mast, flag);
        return raft;
      };

      let bodies = [];
      const place = (mesh, x, y, z) => {
        mesh.position.set(x, y, z);
        mesh.castShadow = mesh.receiveShadow = true;
        world.scene.add(mesh);
        bodies.push(mesh);
      };
      const next = seeded(7);
      const drop = (count) => {
        for (let i = 0; i < count; i++) {
          const kind = MIX[Math.floor(next() * MIX.length)];
          const mesh = object.mesh(shapes[kind], matters[kind]);
          mesh.rotation.set(next() * 3, next() * 3, next() * 3);
          mesh.physics = 'dynamic';
          place(mesh, (next() - 0.5) * (WIDE - 4), 5 + next() * 5, (next() - 0.5) * (DEEP - 4));
        }
      };
      const fill = () => {
        for (const mesh of bodies) world.scene.remove(mesh);
        bodies = [];
        place(makeRaft(), -3, 4.5, 1);
        drop(40);
        // Three crates ride on the raft.
        for (const [x, z] of [[-3.6, 1.4], [-2.4, 1.4], [-3, 0.4]]) {
          const crate = object.mesh(shapes.crate, matters.crate);
          crate.physics = 'dynamic';
          place(crate, x, 5.6, z);
        }
      };

      const sun = light.directional({ intensity: 3, color: '#fff4e2', castShadow: true });
      sun.position.set(14, 22, 9);
      world.scene.add(sun, light.hemisphere({ intensity: 1.3, color: '#dcefff', groundColor: '#6d7a80' }));
      world.camera.position.set(20, 15, 24);
      world.controls.target.set(0, 1.5, 0);

      // Set again, the water's waves would start over: they go on from where they are.
      const pour = ({ level, waves, density, current }) => {
        const now = world.physics.waterSurface?.wavesNow();
        world.physics.water = {
          level,
          density,
          current: [current, 0, current * 0.3],
          waves: SWELL.map((wave, i) => ({ ...wave, amplitude: wave.amplitude * waves, steepness: wave.steepness * Math.min(1, waves), phase: now?.[i].phase ?? 0 })),
        };
      };
      const settings = controls(
        {
          level: [0.2, 3.8, 2.4, 0.1],
          waves: [0, LOUDEST, 1, 0.05],
          density: [200, 1400, 1000, 10],
          current: [-2, 2, 0.4, 0.1],
          drop: () => drop(12),
          again: fill,
          slowMotion: false,
        },
        (values) => {
          pour(values);
          world.physics.timeScale = values.slowMotion ? 0.25 : 1;
        },
        world,
      );
      fill();

      const count = readout('bodies'), awake = readout('awake'), step = readout('step');
      world.onFrame(() => {
        const surface = world.physics.waterSurface;
        if (surface) drawSurface(surface);
        // Moving water asks for the next frame; still water is drawn once and rests.
        if (settings.waves > 0) world.invalidate();
        const s = world.physics.stats;
        count(String(s.bodies));
        awake(String(s.active));
        step(`${s.stepMs.toFixed(2)} ms`);
      });
    </script>
  </body>
</html>
