<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mountain terrain</title>
    <meta name="thumbnail" content="2" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, buffer } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });

      // The height map: a height for every point of the ground, here written as a formula — three
      // ridges, a shoulder, a winding valley cut between them and a little erosion.
      const hill = (x, z, cx, cz, sx, sz, top) => top * Math.exp(-((x - cx) ** 2) / sx - (z - cz) ** 2 / sz);
      const valley = (z) => 0.35 + 0.48 * Math.sin(z * 0.48) - 0.08 * z;
      function height(x, z) {
        const ridges = hill(x, z, -2.5, 0.3, 1.9, 11, 4.4) + hill(x, z, 0.1, -2.5, 1.05, 2.2, 4.8)
          + hill(x, z, 2.55, 0.1, 1.1, 13, 4.1) + hill(x, z, -0.4, 2.9, 3.2, 1.25, 2.7);
        const cut = Math.exp(-((x - valley(z)) ** 2) / 0.5) * (1.15 + ridges * 0.28);
        const wear = (0.13 * Math.sin(x * 2.8 + z * 0.7) + 0.1 * Math.sin(z * 3.4 - x)) * Math.min(1, ridges / 1.5);
        return ridges - cut + wear;
      }

      // Sampled on a 12 m square, 192 cells a side, two triangles per cell. The normal of each
      // sample comes from the slope between its neighbours, so the slopes shade smoothly and the
      // edge of the sun's light follows the relief, not the triangles.
      const SIZE = 12, CELLS = 192, row = CELLS + 1, WATER = -0.55, STEP = SIZE / CELLS;
      const positions = new Float32Array(row * row * 3);
      for (let i = 0; i < row; i++)
        for (let j = 0; j < row; j++) {
          const x = (i / CELLS - 0.5) * SIZE, z = (j / CELLS - 0.5) * SIZE;
          positions.set([x, height(x, z), z], (i * row + j) * 3);
        }
      const heightAt = (i, j) => positions[(Math.min(CELLS, Math.max(0, i)) * row + Math.min(CELLS, Math.max(0, j))) * 3 + 1];
      const sample = (i, j) => {
        const at = (i * row + j) * 3;
        const nx = (heightAt(i - 1, j) - heightAt(i + 1, j)) / (2 * STEP), nz = (heightAt(i, j - 1) - heightAt(i, j + 1)) / (2 * STEP);
        const length = Math.hypot(nx, 1, nz);
        return [positions[at], positions[at + 1], positions[at + 2], nx / length, 1 / length, nz / length];
      };
      // Four bands by height — soil, grass, rock, then stone at the top —, each its own mesh. A
      // triangle that straddles a boundary is cut along it: the band ends on the contour line
      // itself, straight across each triangle, never on the triangles' staircase.
      const EDGES = [-Infinity, 0.45, 1.45, 2.7, Infinity];
      const cross = (p, q, level) => {
        const t = (level - p[1]) / (q[1] - p[1]), point = p.map((value, axis) => value + (q[axis] - value) * t);
        const length = Math.hypot(point[3], point[4], point[5]);
        return [point[0], level, point[2], point[3] / length, point[4] / length, point[5] / length];
      };
      const clip = (polygon, level, keepAbove) => {
        const kept = [], inside = (p) => (keepAbove ? p[1] >= level : p[1] <= level);
        polygon.forEach((p, index) => {
          const q = polygon[(index + 1) % polygon.length];
          if (inside(p)) kept.push(p);
          if (inside(p) !== inside(q)) kept.push(cross(p, q, level));
        });
        return kept;
      };
      const bands = EDGES.slice(1).map(() => ({ position: [], normal: [] }));
      for (let i = 0; i < CELLS; i++)
        for (let j = 0; j < CELLS; j++) {
          const a = sample(i, j), b = sample(i + 1, j), c = sample(i + 1, j + 1), d = sample(i, j + 1);
          for (const triangle of [[a, d, c], [a, c, b]])
            bands.forEach((band, index) => {
              let polygon = triangle;
              if (index > 0) polygon = clip(polygon, EDGES[index], true);
              if (index < bands.length - 1 && polygon.length) polygon = clip(polygon, EDGES[index + 1], false);
              for (let k = 1; k + 1 < polygon.length; k++)
                for (const p of [polygon[0], polygon[k], polygon[k + 1]]) band.position.push(p[0], p[1], p[2]), band.normal.push(p[3], p[4], p[5]);
            });
        }
      const colours = ['#2e4029', '#4a6133', '#614a33', '#b8b3a6'];
      bands.forEach(({ position, normal }, index) => {
        const ground = geometry.createBuffer({
          position: buffer.float32(new Float32Array(position), 3),
          normal: buffer.float32(new Float32Array(normal), 3),
          index: buffer.uint32(Array.from({ length: position.length / 3 }, (_, vertex) => vertex)),
        });
        world.scene.add(object.mesh(ground, material.meshStandard({ color: colours[index], roughness: 0.9 })));
      });

      // The water lies flat at one level: wherever the valley floor dips below it, a river shows.
      // It covers the same square as the ground, no more.
      const water = object.mesh(geometry.plane(SIZE, SIZE), material.meshStandard({ color: '#0b5a80', metalness: 0.1, roughness: 0.2 }));
      water.rotation.set(-Math.PI / 2, 0, 0);
      water.position.y = WATER;
      world.scene.add(water);

      // A skirt closes the block on its four sides, from the ground — or the water where the
      // river crosses the edge — down to a base below the lowest point: the edge is a clean cut
      // of earth, never a sheet of water or a slope hanging in the air.
      let lowest = Infinity;
      for (let v = 1; v < positions.length; v += 3) lowest = Math.min(lowest, positions[v]);
      const base = lowest - 0.4, wall = [], cuts = [];
      const edges = [[(k) => k, [-1, 0]], [(k) => CELLS * row + k, [1, 0]], [(k) => k * row, [0, -1]], [(k) => k * row + CELLS, [0, 1]]];
      for (const [vertex, [ox, oz]] of edges) {
        const first = wall.length / 3;
        for (let k = 0; k < row; k++) {
          const at = vertex(k) * 3, x = positions[at], z = positions[at + 2];
          wall.push(x, Math.max(positions[at + 1], WATER), z, x, base, z);
        }
        // The side runs along z when it faces x, and along x when it faces z: the winding that
        // turns its face outward follows from the sign of the facing.
        const out = ox + oz > 0 === (ox !== 0);
        for (let k = 0; k < CELLS; k++) {
          const top = first + k * 2, bottom = top + 1, nextTop = top + 2, nextBottom = top + 3;
          cuts.push(...(out ? [top, nextBottom, bottom, top, nextTop, nextBottom] : [top, bottom, nextBottom, top, nextBottom, nextTop]));
        }
      }
      const skirt = geometry.createBuffer({ position: buffer.float32(new Float32Array(wall), 3), index: buffer.uint32(cuts) });
      skirt.computeVertexNormals();
      world.scene.add(object.mesh(skirt, material.meshStandard({ color: '#3a2e24', roughness: 0.95 })));

      // A sun that casts the peaks' shadows, and the sky's light on the slopes it misses.
      const sun = light.directional({ intensity: 3, color: '#ffe2b8', castShadow: true });
      world.scene.add(sun, light.hemisphere({ intensity: 1.1, color: '#bcd4ff', groundColor: '#5a4a3c' }));
      world.camera.position.set(6.5, 5, 8);
      world.camera.lookAt(0, 0.9, 0);
      world.controls.target.set(0, 0.9, 0);
      world.controls.maxPolarAngle = Math.PI / 2 - 0.05;

      // The hour moves the sun across the range, and the peaks' shadows swing across the valley.
      controls({ hour: [6, 18, 9, 0.25], sunColour: '#ffe2b8', exposure: [0.4, 2.5, 1.1] }, (values) => {
        const arc = ((values.hour - 6) / 12) * Math.PI;
        sun.position.set(Math.cos(arc) * 10, Math.sin(arc) * 8 + 0.5, 4);
        sun.color.set(values.sunColour);
        world.exposure = values.exposure;
        world.invalidate();
      }, world);
    </script>
  </body>
</html>
