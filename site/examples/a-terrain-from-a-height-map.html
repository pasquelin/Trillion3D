<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A terrain from a height map</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld } from '../runtime/engine.js';

      const world = createWorld('view', { controls: 'orbit' });
      // The relief is a grid of heights: 97 by 97 samples of a height function
      // (`scripts/docs/mountain-terrain/model.mjs`) turned into one surface at compile time, its
      // material chosen by altitude band. The mountain light came with the scene file.
      await world.scene.load('../assets/gallery/offline/terrain/cache/native/full/manifest.json');
      world.camera.position.set(7.5, 6, 9);
      world.camera.lookAt(0, 1.2, 0);
      world.controls.target.set(0, 1.2, 0);
      world.invalidate();
    </script>
  </body>
</html>
