<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mountain terrain</title>
    <meta name="thumbnail" content="4" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      // The relief is 97 by 97 height samples turned into one surface when the file was compiled; its
      // sun came with the scene file, on `lights`.
      const terrain = await world.scene.load('../assets/gallery/offline/terrain/cache/native/full/manifest.json');
      const [sun] = terrain.lights, noon = sun?.intensity ?? 1;
      world.camera.position.set(6.5, 5, 8);
      world.camera.lookAt(0, 0.9, 0);
      world.controls.target.set(0, 0.9, 0);

      // The day runs: the sun rises on one side of the range, crosses it, sets on the other, and the
      // peaks' shadows swing across the valley.
      const ui = controls({ daySpeed: [0, 1, 0.25], sun: '#ffe2b8', exposure: [0.4, 2.5, 1.2] }, (values) => {
        sun?.color.set(values.sun);
        world.exposure = values.exposure;
        world.invalidate();
      });
      let hour = 0.35;
      world.onFrame(({ delta }) => {
        hour = (hour + delta * ui.daySpeed * 0.1) % 1;
        const arc = hour * Math.PI;
        if (sun) {
          sun.position.set(Math.cos(arc) * 10, Math.sin(arc) * 8 + 0.5, 4);
          sun.intensity = noon * (0.3 + Math.sin(arc));
        }
        world.invalidate();
      });
    </script>
  </body>
</html>
