<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A cooked flag</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      p {
        position: absolute;
        top: 0;
        margin: 0.5rem;
        color: #1f2a37;
        font: 12px system-ui;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p data-words="credit"></p>
    <script type="module">
      // Waits for #573: the simulated vertices are uploaded in place, so the flag is drawn where it hangs.
      import { createWorld, light, math } from '../runtime/engine.js';
      import { controls, readout } from '../runtime/kit.js';

      // A compiled model: the flag's node declares a cloth pinned along the pole, and the compiler
      // cooked its soft-body settings with the model. Once the physics is on, the flag is restored
      // from them — nothing is built on the page — and sags from its pole from the first step.
      const world = createWorld('view', { controls: 'orbit', physics: true });
      world.scene.background = math.color('#cfe0ee');
      const MODEL = '../assets/examples/flag/cache/native/full/manifest.json';
      let model = await world.scene.load(MODEL);

      const sun = light.directional({ intensity: 3, castShadow: true });
      sun.position.set(6, 12, 8);
      world.scene.add(sun, light.hemisphere({ intensity: 1.2, color: '#ffffff', groundColor: '#6d7a5a' }));
      world.camera.position.set(1.5, 3.2, 5);
      world.controls.target.set(0.8, 2.9, 0);

      controls(
        {
          // Loaded again, the flag is restored again, straight out: it sags anew at once.
          again: async () => {
            world.scene.remove(model);
            model = await world.scene.load(MODEL);
          },
          slowMotion: false,
        },
        (values) => {
          world.physics.timeScale = values.slowMotion ? 0.25 : 1;
        },
        world,
      );

      const bodies = readout('bodies'), step = readout('step');
      world.onFrame(() => {
        bodies(String(world.physics.stats.bodies));
        step(`${world.physics.stats.stepMs.toFixed(2)} ms`);
      });
    </script>
  </body>
</html>
