<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sky and ground light</title>
    <meta name="thumbnail" content="4" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #263042;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls, readout, opening, ease } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      world.scene.background = math.color('#263042');

      // Pale sculptures floating over a wide floor. Painted almost white, they take the colour of
      // whatever lights them: the sky on their tops, the ground on their undersides, and a blend
      // of the two on every side in between.
      const chalk = material.meshStandard({ color: '#f3efe7', roughness: 0.7 });
      const shell = material.meshStandard({ color: '#f6e7d8', roughness: 0.5 });
      const glaze = material.meshStandard({ color: '#dfe8f0', roughness: 0.35 });
      const floorMatter = material.meshStandard({ color: '#4f7a32', roughness: 0.95 });
      const floor = object.mesh(geometry.cylinder(16, 16, 0.3, 128), floorMatter);
      floor.position.y = -0.15;
      world.scene.add(floor);

      const floaters = [];
      const float = (shape, matter, x, y, z, bob, rest) => {
        const mesh = object.mesh(shape, matter);
        mesh.position.set(x, y, z);
        world.scene.add(mesh);
        floaters.push({ mesh, x, y, z, bob, rest, phase: floaters.length * 1.7, delay: floaters.length * 0.12 });
        return mesh;
      };
      float(geometry.sphere(1.6, 96, 48), chalk, 0, 3.4, 0, 0.25, 1.6);
      float(geometry.torus(1.3, 0.38, 48, 128), shell, -4.2, 2.6, 1.2, 0.35, 1.7);
      float(geometry.torusKnot(0.9, 0.3, 240, 32, 2, 5), glaze, 4.1, 3.1, 0.6, 0.3, 1.4);
      float(geometry.box(1.6, 1.6, 1.6, 2, 2, 2), chalk, -2.2, 5.4, -3.2, 0.4, 1.4);
      float(geometry.cone(0.9, 2, 64), shell, 2.6, 5.6, -3.4, 0.35, 1.3);
      float(geometry.capsule(0.55, 1.6, 16, 48), glaze, -1.6, 1.8, 3.6, 0.2, 1.4);
      float(geometry.cylinder(1, 1, 0.5, 64), chalk, 1.8, 1.6, 3.4, 0.25, 1.1);
      // A cloud of pebbles above, a ring of them round the middle: many small normals facing
      // every way, the whole gradient at a glance.
      const pebble = geometry.sphere(0.32, 32, 16);
      for (let k = 0; k < 16; k++) {
        const angle = (k / 16) * Math.PI * 2;
        float(pebble, k % 2 ? chalk : shell, Math.cos(angle) * 6.8, 2.2 + Math.sin(angle * 3) * 0.8, Math.sin(angle) * 6.8, 0.5, 0.32);
      }

      // Six places, each a sky colour above and the colour of its ground below. The floor wears
      // the ground colour, a little darker: it is what sends that colour back up.
      const PLACES = {
        'meadow at noon': { sky: '#8fb8ff', ground: '#5d8a3a', sun: '#fff1d6' },
        'snowfield': { sky: '#9cc2ff', ground: '#f2f5fa', sun: '#ffffff' },
        'red desert': { sky: '#a8c8ec', ground: '#c9582c', sun: '#ffe2b8' },
        'sunset beach': { sky: '#ff9d70', ground: '#e8c89a', sun: '#ff8a4a' },
        'tropical lagoon': { sky: '#86d8ff', ground: '#1fb0a8', sun: '#fff4dc' },
        'overcast city': { sky: '#c7cbd3', ground: '#5c5a57', sun: '#dde2ea' },
      };
      const sky = light.hemisphere({ intensity: 1.6 });
      const sun = light.directional({ intensity: 1.4, position: [6, 10, 5], castShadow: true });
      world.scene.add(sky, sun);
      world.camera.position.set(0, 1.2, 22);
      world.controls.target.set(0, 3, 0);
      world.controls.update();
      world.controls.minDistance = 6;
      world.controls.maxDistance = 34;
      world.controls.maxPolarAngle = Math.PI / 2 - 0.05;

      let skyShown = null, groundShown = null;
      const ui = controls({
        place: Object.keys(PLACES),
        skyStrength: [0, 3, 1.6, 0.05],
        sun: true,
        float: true,
      }, (values, key) => {
        const place = PLACES[values.place];
        if (key === undefined || key === 'place') {
          sky.color.set(place.sky);
          sky.groundColor.set(place.ground);
          sun.color.set(place.sun);
          floorMatter.color.set(place.ground).multiplyScalar(0.8);
          skyShown?.(place.sky);
          groundShown?.(place.ground);
        }
        sky.intensity = values.skyStrength;
        // Without the sun, only the sky and the ground light the scene: no shadow, no key, just
        // the gradient from one colour to the other.
        sun.intensity = values.sun ? 1.4 : 0;
        world.invalidate();
      }, world);
      skyShown = readout('skyFromAbove');
      groundShown = readout('groundFromBelow');
      skyShown(PLACES[ui.place].sky);
      groundShown(PLACES[ui.place].ground);

      // The opening: the sculptures rest on the floor, then lift off one after the other while the
      // camera rises from ground level. A press or a wheel on the canvas stops the camera.
      opening(world, (time) => {
        const t = ease.inOut(time / 4);
        world.camera.position.set(Math.sin(t * 0.7) * 16, 1.2 + t * 5.5, Math.cos(t * 0.7) * 16 + (1 - t) * 6);
        return t < 1;
      });
      let time = 0;
      world.onFrame(({ delta }) => {
        time += Math.min(delta, 0.05);
        for (const { mesh, x, y, z, bob, rest, phase, delay } of floaters) {
          const lift = ease.inOut((time - 0.3 - delay) / 1.6);
          const drift = ui.float ? Math.sin(time * 0.8 + phase) * bob : 0;
          mesh.position.set(x, rest + (y - rest) * lift + drift * lift, z);
          mesh.rotation.set(0.3 * Math.sin(phase), time * 0.2 + phase, 0);
        }
        world.invalidate();
      });
    </script>
  </body>
</html>
