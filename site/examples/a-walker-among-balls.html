<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A walker among balls</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls, readout, seeded } from '../runtime/kit.js';

      // A compiled hall collides with its own triangles, cooked by the compiler: the balls roll on
      // its floor and stop at its walls, and the walker's feet find the floor through the physics.
      const world = createWorld('view', { controls: 'orbit', physics: true });
      world.scene.background = math.color('#20252e');
      await world.scene.load('../assets/examples/hall/cache/native/full/manifest.json');
      const sun = light.directional({ intensity: 2.5, castShadow: true });
      sun.position.set(4, 9, 3);
      world.scene.add(
        sun,
        light.hemisphere({ intensity: 1, color: '#ffffff', groundColor: '#555a66' }),
      );
      world.camera.position.set(7, 6, 8);
      world.controls.target.set(0, 1, 0);

      const matter = material.meshStandard({ color: '#e0a33b', roughness: 0.4, physics: 'rubber' });
      const ball = geometry.sphere(0.25, 20, 12),
        next = seeded(9);
      const drop = (count) => {
        for (let i = 0; i < count; i++) {
          const body = object.mesh(ball, matter);
          body.position.set((next() - 0.5) * 6, 3 + next() * 2, (next() - 0.5) * 6);
          body.castShadow = true;
          body.physics = 'dynamic';
          world.scene.add(body);
        }
      };
      drop(40);

      // The walker: a kinematic capsule the page moves; it pushes the balls it meets. Each step,
      // an exact ray down finds the cooked floor under it, and its feet are put there.
      const walker = object.mesh(
        geometry.capsule(0.3, 1.1),
        material.meshStandard({ color: '#4f8fd6', roughness: 0.5, physics: 'wood' }),
      );
      walker.physics = 'kinematic';
      walker.castShadow = true;
      walker.position.set(2.5, 2, 0);
      world.scene.add(walker);
      const down = math.ray(math.vector3(), math.vector3(0, -1, 0));
      const settings = controls({ walking: true, balls: () => drop(20) }, () => {}, world);
      let angle = 0;
      world.beforeFrame(async ({ delta }) => {
        if (!settings.walking) return;
        angle += delta * 0.5;
        const x = 2.5 * Math.cos(angle),
          z = 1.6 * Math.sin(angle);
        down.origin.set(x, 3.5, z);
        const floor = await world.raycast(down, { exact: true, maxDistance: 6 });
        walker.position.set(x, (floor ? floor.point.y : 0) + 0.85, z);
        walker.rotation.y = -angle;
        world.invalidate();
      });

      const bodies = readout('bodies'),
        awake = readout('awake'),
        step = readout('step');
      world.onFrame(() => {
        const s = world.physics.stats;
        bodies(String(s.bodies));
        awake(String(s.active));
        step(`${s.stepMs.toFixed(2)} ms`);
      });
    </script>
  </body>
</html>
