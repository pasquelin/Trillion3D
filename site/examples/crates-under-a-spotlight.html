<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Crates under one spotlight</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p>Crate model by W. Sitters, CC BY 3.0 — see assets/examples/CREDITS.md</p>
    <script type="module">
      import { createWorld, light } from '../runtime/engine.js';

      const world = createWorld('view', { controls: 'orbit' });
      await world.scene.load('../assets/examples/crates/cache/native/full/manifest.json');
      // One spot light above the crates: the cone half-angle is in radians, the distance in metres.
      world.scene.add(light.spot({
        position: [1.5, 5, 2.5], target: [-1.5, -3.15, -1.75],
        color: [1, 0.92, 0.8], intensity: 300, distance: 14, angle: 0.45, castShadow: true,
        radius: 0.1,
      }));
      world.camera.position.set(4.5, 2.8, 5.5);
      world.camera.lookAt(0, 0.7, 0);
      world.controls.target.set(0, 0.7, 0);
      world.invalidate();
    </script>
  </body>
</html>
