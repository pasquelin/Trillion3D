<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Crates under one spotlight</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p>Crate model by W. Sitters, CC BY 3.0 — see assets/examples/CREDITS.md</p>
    <script type="module">
      import { createExplorer } from '../runtime/engine.js';

      const explorer = await createExplorer('view', {
        manifestUrl: '../assets/examples/crates/cache/native/full/manifest.json',
        scope: 'full',
        interactive: true,
      });
      // One spot light above the crates: the cone half-angle is in radians, the range in metres.
      explorer.addLight({
        id: 'spot',
        kind: 'spot',
        position: [1.5, 5, 2.5],
        direction: [-0.3, -0.85, -0.45],
        color: [1, 0.92, 0.8],
        intensity: 300,
        range: 14,
        coneAngle: 0.45,
        emitterRadius: 0.1,
        castsShadow: true,
      });
      explorer.setPose({ ...explorer.homePose(), position: [4.5, 2.8, 5.5], target: [0, 0.7, 0] });
      explorer.invalidate();
    </script>
  </body>
</html>
