<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sun shadows</title>
    <meta name="thumbnail" content="4.5" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #8fb3d9;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls, readout, words, opening, ease } from '../runtime/kit.js';
      const say = words();

      const world = createWorld('view', { controls: 'orbit' });
      world.scene.background = math.color('#8fb3d9');

      // A sundial garden, in metres, north toward −z and east toward +x. An obelisk stands in
      // the middle; round it a pergola, a carved screen and a windmill throw shadows of every
      // shape: stripes, a lattice, turning blades.
      const paint = (color, roughness = 0.8) => material.meshStandard({ color, roughness });
      const put = (shape, matter, x, y, z, parent = world.scene) => {
        const mesh = object.mesh(shape, matter);
        mesh.position.set(x, y, z);
        parent.add(mesh);
        return mesh;
      };
      put(geometry.cylinder(26, 26, 0.3, 128), paint('#6c8f45', 0.95), 0, -0.15, 0);
      put(geometry.cylinder(10, 10, 0.08, 128), paint('#e2d6bd', 0.85), 0, 0.04, 0);
      const stone = paint('#efe6d4', 0.7), bronze = paint('#9a6a3a', 0.5), timber = paint('#8b5d36', 0.75);
      const OBELISK = 6;
      put(geometry.box(1.6, 0.5, 1.6), stone, 0, 0.25, 0);
      put(geometry.cylinder(0.32, 0.55, OBELISK - 1.1, 4), stone, 0, 0.5 + (OBELISK - 1.1) / 2, 0).rotation.set(0, Math.PI / 4, 0);
      put(geometry.cone(0.32, 0.6, 4), bronze, 0, OBELISK - 0.3, 0).rotation.set(0, Math.PI / 4, 0);
      // A bronze arrow set in the paving points north.
      put(geometry.cone(0.35, 1.2, 3), bronze, 0, 0.2, -8.6).rotation.set(-Math.PI / 2, 0, 0);

      // The pergola: four posts and a roof of thin slats, west of the dial.
      const pergola = object.group();
      pergola.position.set(-14, 0, 2);
      for (const [x, z] of [[-2.5, -3], [2.5, -3], [-2.5, 3], [2.5, 3]]) put(geometry.box(0.3, 3, 0.3), timber, x, 1.5, z, pergola);
      for (const x of [-2.5, 2.5]) put(geometry.box(0.25, 0.4, 7), timber, x, 3.2, 0, pergola);
      for (let k = 0; k < 14; k++) put(geometry.box(6, 0.18, 0.12), timber, 0, 3.5, -3.1 + k * 0.48, pergola);
      put(geometry.box(1.6, 0.5, 0.5), timber, 0, 0.25, 0, pergola);
      world.scene.add(pergola);

      // The screen: a stone frame filled with a lattice of square openings, east of the dial.
      const screen = object.group();
      screen.position.set(14, 0, -3);
      screen.rotation.set(0, -0.5, 0);
      put(geometry.box(0.5, 4.6, 0.5), stone, -3.2, 2.3, 0, screen);
      put(geometry.box(0.5, 4.6, 0.5), stone, 3.2, 2.3, 0, screen);
      put(geometry.box(6.9, 0.5, 0.5), stone, 0, 4.85, 0, screen);
      for (let k = 0; k < 11; k++) {
        put(geometry.box(0.12, 4.2, 0.2), stone, -2.75 + k * 0.55, 2.4, 0, screen);
        if (k < 8) put(geometry.box(6, 0.12, 0.2), stone, 0, 0.6 + k * 0.55, 0, screen);
      }
      world.scene.add(screen);

      // The windmill, north-west: a tapered tower, a cap, and four sails on one axle.
      const mill = object.group();
      mill.position.set(-9, 0, -15);
      mill.rotation.set(0, 0.6, 0);
      put(geometry.cylinder(1.3, 2.1, 7, 12), paint('#f1ece2', 0.8), 0, 3.5, 0, mill);
      put(geometry.cone(1.7, 2, 12), paint('#5b4a3e', 0.8), 0, 8, 0, mill);
      const sails = object.group();
      sails.position.set(0, 6.6, 1.9);
      for (let k = 0; k < 4; k++) {
        const arm = object.group();
        arm.rotation.set(0, 0, (k * Math.PI) / 2);
        put(geometry.box(0.14, 5.4, 0.1), timber, 0, 2.8, 0, arm);
        put(geometry.box(1.1, 4.2, 0.05), paint('#f7f1e6', 0.9), 0.62, 3.2, 0, arm);
        sails.add(arm);
      }
      mill.add(sails);
      world.scene.add(mill);

      // Where the obelisk's tip falls at each whole hour of the chosen day: seventeen stones,
      // every one in the scene from the start, moved and shown when the day changes.
      const HOURS = Array.from({ length: 17 }, (_, k) => 4 + k);
      const markers = HOURS.map(() => {
        const marker = put(geometry.cylinder(0.22, 0.22, 0.12, 24), bronze, 0, 0.1, 0);
        marker.visible = false;
        return marker;
      });

      // The sun from the day of the year, the hour and the latitude: its declination, its hour
      // angle, then its height and its bearing (the standard formulas of solar position).
      function sunAt(hour, day, latitude) {
        const decline = math.degToRad(23.44) * Math.sin((2 * Math.PI * (284 + day)) / 365);
        const angle = math.degToRad(15 * (hour - 12)), at = math.degToRad(latitude);
        const height = Math.asin(Math.sin(at) * Math.sin(decline) + Math.cos(at) * Math.cos(decline) * Math.cos(angle));
        // Bearing from the south, turning west.
        const south = Math.atan2(Math.sin(angle), Math.cos(angle) * Math.sin(at) - Math.tan(decline) * Math.cos(at));
        return { height, south, direction: [-Math.sin(south) * Math.cos(height), Math.sin(height), Math.cos(south) * Math.cos(height)] };
      }
      const tipOf = ({ direction: [x, y, z] }) => [(-x / y) * OBELISK, (-z / y) * OBELISK];

      const sun = light.directional({ castShadow: true });
      const sky = light.hemisphere({ color: '#a9c8ff', groundColor: '#5b6b3a', intensity: 0.8 });
      world.scene.add(sun, sky);
      world.camera.position.set(0, 60, 30);
      world.controls.target.set(0, 1.5, 0);
      world.controls.update();
      world.controls.minDistance = 8;
      world.controls.maxDistance = 70;
      world.controls.maxPolarAngle = Math.PI / 2 - 0.05;

      const DAYS = { 'summer solstice': 172, 'spring equinox': 80, 'winter solstice': 355 };
      const COMPASS = ['S', 'SW', 'W', 'NW', 'N', 'NE', 'E', 'SE'].map((point) => say(point));
      const deg = (radians) => `${Math.round(math.radToDeg(radians))}°`;
      let shown = null, now = null;
      // The three numbers of the moment: how high the sun stands, where it stands, and how long
      // the obelisk's shadow falls.
      const report = () => {
        const bearing = ((math.radToDeg(now.south) % 360) + 360) % 360;
        shown.height(now.height > 0 ? deg(now.height) : say('belowHorizon'));
        shown.bearing(say('bearing', { point: COMPASS[Math.round(bearing / 45) % 8], degrees: Math.round((bearing + 180) % 360) }));
        shown.length(now.height > 0.01 ? `${Math.hypot(...tipOf(now)).toFixed(1)} m` : '—');
      };
      const ui = controls({
        hour: [4, 21, 16.5, 0.05],
        day: Object.keys(DAYS),
        latitude: [-60, 70, 48, 1],
        sails: true,
      }, (values, key) => {
        if (key === 'sails') return world.invalidate();
        const day = DAYS[values.day];
        now = sunAt(values.hour, day, values.latitude);
        // The sun is moved here, when a control changes, and never frame by frame.
        const [x, y, z] = now.direction, up = Math.max(0, now.height);
        sun.position.set(x * 60, y * 60, z * 60);
        sun.intensity = 3.4 * Math.min(1, up / 0.12);
        sun.color.set('#ff8a45').lerp(math.color('#fff5e6'), Math.min(1, up / 0.5));
        sky.intensity = 0.25 + 0.6 * Math.min(1, Math.max(0, now.height + 0.1) / 0.4);
        HOURS.forEach((hour, k) => {
          const then = sunAt(hour, day, values.latitude), [tx, tz] = tipOf(then);
          markers[k].visible = then.height > math.degToRad(8) && Math.hypot(tx, tz) < 24;
          markers[k].position.set(tx, 0.1, tz);
        });
        if (shown) report();
        world.invalidate();
      }, world);
      shown = { height: readout('sunHeight'), bearing: readout('sunBearing'), length: readout('obeliskShadow') };
      report();

      // The opening: the camera spirals down from high above the dial to eye level. A press or a
      // wheel on the canvas hands it to the viewer at once.
      opening(world, (time) => {
        const t = ease.out(time / 4.5), round = 0.2 + t * 0.9, reach = 60 - t * 34;
        world.camera.position.set(Math.sin(round) * reach, 60 - t * 50, Math.cos(round) * reach);
        return t < 1;
      });
      let turn = 0;
      world.onFrame(({ delta }) => {
        if (!ui.sails) return;
        turn += Math.min(delta, 0.05) * 0.9;
        sails.rotation.set(0, 0, turn);
        world.invalidate();
      });
    </script>
  </body>
</html>
