<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A neon sign that glows</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createExplorer } from '../runtime/engine.js';

      const explorer = await createExplorer('view', {
        manifestUrl: '../assets/examples/neon/cache/native/full/manifest.json',
        scope: 'full',
        interactive: true,
      });
      // The tube emits: its material carries an emissive colour with a strength of six, added
      // to the image whatever the lighting. What it throws on the wall and the floor is a point
      // light of the same colour at the centre of the sign, its emitter radius enclosing the
      // tube so that the glass does not shadow its own light. No bloom is drawn.
      explorer.addLight({
        id: 'neon',
        kind: 'point',
        position: [0.4, 1.6, 0.35],
        color: [1, 0.25, 0.6],
        intensity: 3,
        range: 8,
        emitterRadius: 1.9,
        castsShadow: true,
      });
      explorer.setPose({ ...explorer.homePose(), position: [1.2, 1.7, 4.2], target: [0.2, 1.4, 0] });
      explorer.invalidate();
    </script>
  </body>
</html>
