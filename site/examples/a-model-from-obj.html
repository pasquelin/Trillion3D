<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A model from OBJ</title>
    <meta name="thumbnail" content="4" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #231d24;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      p {
        position: absolute;
        top: 0;
        margin: 0.5rem;
        color: #e6d6c4;
        font: 12px system-ui;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p>Chess set modelled for these examples, CC0 — see assets/examples/CREDITS.md</p>
    <script type="module">
      import { createWorld, light, math } from '../runtime/engine.js';
      import { controls, readout } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      world.scene.background = math.color('#231d24');
      // The model was written as a plain OBJ file — `v` positions, `vn` a smooth normal per vertex,
      // `f` triangles, an `o` per piece and a `usemtl` per material from its `.mtl` — then compiled
      // once by the repository's compiler: the OBJ became clusters, and the engine streams the ones
      // the view needs. Everything in the picture comes from that one file; the page adds the light.
      await world.scene.load('../assets/examples/a-model-from-obj/cache/native/full/manifest.json');

      // The pieces stand five to ten centimetres tall: the near plane comes in to half a centimetre
      // so the camera can lean down among them without clipping them.
      world.camera.near = 0.005;
      world.camera.far = 20;

      // A late-afternoon sun through a window rakes the board and draws every piece's shadow; a cool
      // rim from behind and the room's soft light keep the black pieces from going flat black.
      const sun = light.directional({ color: '#ffc58a', intensity: 3.4, castShadow: true });
      world.scene.add(
        sun,
        light.directional({ intensity: 1.1, color: '#9fb6ff', position: [-3, 2, -4] }),
        light.hemisphere({ color: '#fff1e0', groundColor: '#4a3426', intensity: 0.6 }),
      );
      const placeSun = (degrees, height) => {
        const turn = (degrees * Math.PI) / 180;
        sun.position.set(Math.cos(turn) * 3, height, Math.sin(turn) * 3);
      };

      const VIEWS = {
        finished: 'beauty',
        triangles: 'triangles',
        clusters: 'clusters',
        'level of detail': 'lod',
      };
      let turning = true;
      controls(
        {
          mouse: 'Drag to turn round the board, scroll to lean in: see what the OBJ became',
          view: Object.keys(VIEWS),
          sunAngle: [-180, 180, 30, 1],
          sunHeight: [0.6, 5, 2.4],
          turn: () => ((turning = true), world.invalidate()),
        },
        (values) => {
          world.diagnostic.mode = VIEWS[values.view];
          placeSun(values.sunAngle, values.sunHeight);
          world.invalidate();
        },
      );
      const triangles = readout('Triangles drawn');

      // The opening: the whole board first, from above white's side; then the eye comes down behind
      // the white pawns to the height of the pieces, rises again over the game and circles the
      // table slowly. A press or a wheel hands the camera back; the Turn button starts the turn again.
      const OVER = { eye: [0.3, 0.4, 0.5], look: [0, 0, 0] };
      const LOW = { eye: [0.07, 0.05, 0.3], look: [0, 0.035, 0.02] };
      const PATH = [
        [OVER, 1.2],
        [LOW, 4],
        [LOW, 1.5],
        [OVER, 4],
      ];
      const ease = (t) => t * t * (3 - 2 * t);
      let from = OVER,
        leg = 0,
        time = 0;
      for (const type of ['pointerdown', 'wheel'])
        world.canvas.addEventListener(type, () => ((leg = PATH.length), (turning = false)), {
          passive: true,
        });
      world.camera.position.set(...OVER.eye);
      world.controls.target.set(...OVER.look);
      world.controls.minDistance = 0.08;
      world.controls.maxDistance = 2.2;
      world.controls.maxPolarAngle = Math.PI / 2 - 0.05;
      world.controls.update();
      world.onFrame(({ delta, metrics }) => {
        triangles(metrics.selectedTriangles?.toLocaleString('en') ?? '?');
        const step = Math.min(delta, 0.1);
        if (leg < PATH.length) {
          const [to, seconds] = PATH[leg];
          time += step;
          const t = ease(math.clamp(time / seconds, 0, 1));
          const at = (a, b) => a.map((value, axis) => value + (b[axis] - value) * t);
          world.camera.position.set(...at(from.eye, to.eye));
          world.controls.target.set(...at(from.look, to.look));
          world.controls.update();
          if (t === 1) ((from = to), (leg += 1), (time = 0));
        } else if (turning) {
          const { position } = world.camera,
            { target } = world.controls,
            turn = step * 0.15;
          const x = position.x - target.x,
            z = position.z - target.z;
          position.set(
            target.x + x * Math.cos(turn) + z * Math.sin(turn),
            position.y,
            target.z + z * Math.cos(turn) - x * Math.sin(turn),
          );
          world.controls.update();
        } else return;
        world.invalidate();
      });
      world.invalidate();
    </script>
  </body>
</html>
