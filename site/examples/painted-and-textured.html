<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Painted and textured</title>
    <meta name="thumbnail" content="1.5" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, texture } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      // A picture drawn on a canvas: checks of two colours, `count` by `count`.
      const board = document.createElement('canvas');
      board.width = board.height = 256;
      function paintChecks(count, first, second) {
        const context = board.getContext('2d'), cell = 256 / count;
        for (let y = 0; y < count; y++)
          for (let x = 0; x < count; x++) {
            context.fillStyle = (x + y) % 2 ? first : second;
            context.fillRect(x * cell, y * cell, cell, cell);
          }
      }
      paintChecks(8, '#f2efe6', '#e0663c');
      const checks = texture.canvas(board);

      const world = createWorld('view', { controls: 'orbit' });
      const slab = object.mesh(geometry.box(7, 0.3, 5), material.meshStandard({ color: '#2a2f3a', roughness: 0.85 }));
      slab.position.y = -0.15;
      world.scene.add(slab);
      // The same three shapes twice: painted with a colour, then wrapped in the picture.
      const painted = material.meshStandard({ color: '#e0663c', roughness: 0.4 });
      const textured = material.meshStandard({ map: checks, roughness: 0.5 });
      for (const [row, matter] of [[-1.1, painted], [1.1, textured]]) {
        const sphere = object.mesh(geometry.sphere(0.7, 64, 32), matter);
        sphere.position.set(-2, 0.7, row);
        const box = object.mesh(geometry.box(1.2, 1.2, 1.2), matter);
        box.position.set(0, 0.6, row);
        box.rotation.y = 0.5;
        const cylinder = object.mesh(geometry.cylinder(0.6, 0.6, 1.4, 64), matter);
        cylinder.position.set(2, 0.7, row);
        world.scene.add(sphere, box, cylinder);
      }
      world.scene.add(light.directional({ intensity: 3, color: '#fff3e2', position: [6, 10, 8], castShadow: true }));
      world.scene.add(light.directional({ intensity: 0.6, color: '#8fb4ff', position: [-8, 5, -6] }));
      world.camera.position.set(0.6, 3.2, 5.4);
      world.camera.lookAt(0, 0.4, 0);
      world.controls.target.set(0, 0.4, 0);

      // A new picture drawn on the same canvas reaches the surface once the texture is told so.
      controls({ checks: [2, 16, 8, 1], paint: '#e0663c', second: '#f2efe6' }, (values) => {
        paintChecks(values.checks, values.second, values.paint);
        checks.needsUpdate = true;
        painted.color.set(values.paint);
        world.invalidate();
      });
    </script>
  </body>
</html>
