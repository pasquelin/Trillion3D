<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Painted and textured surfaces</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createExplorer } from '../runtime/engine.js';

      const explorer = await createExplorer('view', {
        manifestUrl: '../assets/examples/painted/cache/native/full/manifest.json',
        scope: 'full',
        interactive: true,
      });
      // The far row is painted: one base colour per material. The near row is textured: the
      // same shapes read their base colour from an image, through the texture coordinates the
      // scene file carries; the compiler baked each image's mip chain into the cache.
      explorer.addLight({
        id: 'sun',
        kind: 'directional',
        direction: [-0.5, -0.7, -0.5],
        color: [1, 0.96, 0.9],
        intensity: 3,
        castsShadow: true,
      });
      explorer.addLight({
        id: 'fill',
        kind: 'directional',
        direction: [0.6, -0.3, 0.7],
        color: [0.6, 0.7, 0.9],
        intensity: 0.6,
        castsShadow: false,
      });
      explorer.setPose({ ...explorer.homePose(), position: [0.5, 3.4, 6.2], target: [0, 0.5, 0] });
      explorer.invalidate();
    </script>
  </body>
</html>
