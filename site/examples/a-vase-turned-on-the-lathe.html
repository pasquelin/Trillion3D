<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A vase turned on the lathe</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createExplorer } from '../runtime/engine.js';

      const view = document.getElementById('view');
      const explorer = await createExplorer(view, {
        manifestUrl: '../assets/examples/colonnade/cache/native/full/manifest.json',
        scope: 'full',
        interactive: true,
      });
      explorer.addLight({
      "kind": "directional",
      "direction": [
              -0.4,
              -0.6,
              0.6
      ],
      "intensity": 3,
      "id": "sun",
      "color": [
              1,
              0.95,
              0.85
      ]
});
      // The colonnade shafts are turned on the lathe from a spline profile.
explorer.setPose({ ...explorer.homePose(), position: [2.5, 1.5, -4.0], target: [1.8, 1.5, -6.0] });
explorer.invalidate();
    </script>
  </body>
</html>
