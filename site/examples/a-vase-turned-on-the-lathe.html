<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A vase turned on the lathe</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createExplorer } from '../runtime/engine.js';

      const explorer = await createExplorer('view', {
        manifestUrl: '../assets/examples/vase/cache/native/full/manifest.json',
        scope: 'full',
        interactive: true,
      });
      // The vase is one profile of forty points turned around the vertical axis at compile time
      // (`scripts/docs/examples/scenes-geometry.mjs`, `lathe`): a shell, outer wall and inner
      // wall, that the light reads as one smooth surface.
      explorer.addLight({
        id: 'window',
        kind: 'directional',
        direction: [-0.7, -0.5, -0.5],
        color: [1, 0.96, 0.9],
        intensity: 3,
        castsShadow: true,
      });
      explorer.addLight({
        id: 'fill',
        kind: 'directional',
        direction: [0.6, -0.3, 0.7],
        color: [0.6, 0.7, 0.9],
        intensity: 0.5,
        castsShadow: false,
      });
      explorer.setPose({ ...explorer.homePose(), position: [2.4, 1.6, 3.2], target: [0, 0.9, 0] });
      explorer.invalidate();
    </script>
  </body>
</html>
