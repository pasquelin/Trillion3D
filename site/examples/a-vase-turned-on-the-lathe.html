<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vases on the wheel</title>
    <meta name="thumbnail" content="2" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      const bench = object.mesh(geometry.box(8, 0.3, 2.4), material.meshStandard({ color: '#5a3a24', roughness: 0.5 }));
      bench.position.y = -0.15;
      world.scene.add(bench);

      // A vase is one profile — out along the outer wall, over the lip, back down inside — that
      // `geometry.lathe` turns around the vertical axis.
      function profile(belly, neck, height) {
        const radius = (y) => 0.18 + belly * Math.sin((y / height) * Math.PI) ** 1.4 - neck * Math.max(0, y / height - 0.7);
        const points = [[0, 0]];
        for (let step = 0; step <= 30; step++) points.push([radius((step / 30) * height), (step / 30) * height]);
        points.push([radius(height) + 0.05, height + 0.04], [radius(height) - 0.02, height + 0.04]);
        for (let step = 30; step >= 0; step--) points.push([Math.max(0, radius((step / 30) * height) - 0.03), (step / 30) * height]);
        points.push([0, 0]);
        return points;
      }
      const glazes = ['#2f8f83', '#e0663c', '#f2b134', '#3c6ee0', '#a04ad0'].map((colour) => material.meshStandard({ color: colour, roughness: 0.2 }));
      const shapes = [[0.3, 0.2, 1.6], [0.22, 0.05, 2.1], [0.36, 0.4, 1.3], [0.18, 0.1, 2.4], [0.28, 0.3, 1.8]];
      const vases = shapes.map(([width, pinch, height], index) => {
        const vase = object.mesh(geometry.lathe(profile(width, pinch, height), 96), glazes[index]);
        vase.position.x = (index - 2) * 1.5;
        world.scene.add(vase);
        return vase;
      });
      world.scene.add(light.directional({ intensity: 3, color: '#fff1dc', position: [5, 8, 7], castShadow: true }));
      world.scene.add(light.point({ intensity: 30, color: '#7fb0ff', position: [-3, 2.5, -2], distance: 12 }));
      world.scene.add(light.point({ intensity: 30, color: '#ff9a6a', position: [4, 1.5, -2], distance: 12 }));
      world.camera.position.set(0, 2.2, 6.2);
      world.camera.lookAt(0, 1, 0);
      world.controls.target.set(0, 1, 0);

      // Width and height stretch every vase: a scale on the object, the shape stays the same.
      const ui = controls({ width: [0.5, 1.6, 1], height: [0.5, 1.5, 1], gloss: [0, 1, 0.8], spin: true }, (values) => {
        for (const vase of vases) vase.scale.set(values.width, values.height, values.width);
        for (const glaze of glazes) glaze.roughness = 1 - values.gloss;
        world.invalidate();
      });
      world.onFrame(({ delta }) => {
        if (!ui.spin) return;
        for (const vase of vases) vase.rotation.y += delta * 0.8;
        world.invalidate();
      });
    </script>
  </body>
</html>
