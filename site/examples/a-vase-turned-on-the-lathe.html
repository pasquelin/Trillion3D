<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A vase turned on the lathe</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light } from '../runtime/engine.js';

      const world = createWorld('view', { controls: 'orbit' });
      const table = object.mesh(geometry.box(5, 0.3, 5), material.meshStandard({ color: [0.3, 0.18, 0.1], roughness: 0.6 }));
      table.position.y = -0.15;
      world.scene.add(table);

      // The vase is one profile of forty points turned around the vertical axis: a shell, outer
      // wall and inner wall, that the light reads as one smooth surface. The inner wall follows
      // the outer wall's own radius, offset by a constant thickness at the same heights, so the
      // two walls never cross.
      const outerRadiusAt = (y) =>
        0.32 + 0.4 * Math.sin((y / 1.9) * Math.PI) ** 1.4 - 0.12 * Math.max(0, y - 1.5);
      const wallThickness = 0.03;
      const profile = [[0, 0]];
      for (let step = 0; step <= 30; step++) {
        const y = (step / 30) * 1.9;
        profile.push([outerRadiusAt(y), y]);
      }
      profile.push([0.5, 1.95], [0.42, 1.95]);
      for (let step = 30; step >= 0; step--) {
        const y = (step / 30) * 1.9;
        profile.push([Math.max(0, outerRadiusAt(y) - wallThickness), y]);
      }
      profile.push([0, 0]);
      const vase = object.mesh(geometry.lathe(profile, 96), material.meshStandard({ color: [0.55, 0.72, 0.6], roughness: 0.25 }));
      world.scene.add(vase);

      world.scene.add(light.directional({
        intensity: 3, color: [1, 0.96, 0.9], position: [14, 10, 10], target: [0, 0, 0], castShadow: true,
      }));
      world.scene.add(light.directional({
        intensity: 0.5, color: [0.6, 0.7, 0.9], position: [-12, 6, -14], target: [0, 0, 0],
      }));
      world.camera.position.set(2.4, 1.6, 3.2);
      world.camera.lookAt(0, 0.9, 0);
      world.controls.target.set(0, 0.9, 0);
      world.invalidate();
    </script>
  </body>
</html>
