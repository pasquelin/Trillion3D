<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A sundial in the late afternoon</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math, pose } from '../runtime/engine.js';

      const world = createWorld('view', { controls: 'orbit' });
      const stone = material.meshStandard({ color: [0.82, 0.78, 0.68], roughness: 0.8 });
      const bronze = material.meshStandard({ color: [0.55, 0.38, 0.2], metalness: 0.9, roughness: 0.35 });

      const dial = object.mesh(geometry.cylinder(3.2, 3.2, 0.4, 48), stone);
      dial.position.y = -0.2;
      const gnomon = object.mesh(geometry.box(0.08, 2, 0.08), bronze);
      gnomon.position.set(0, 0.7, -0.5);
      gnomon.rotation.x = -Math.PI / 4;
      world.scene.add(dial, gnomon);
      for (let hour = 0; hour < 12; hour++) {
        const angle = (hour / 12) * Math.PI * 2;
        const post = object.mesh(geometry.box(0.16, 0.4, 0.16), bronze);
        post.position.set(Math.cos(angle) * 2.8, 0.2, Math.sin(angle) * 2.8);
        world.scene.add(post);
      }

      // A low, warm sun: the gnomon and the hour posts throw long shadows across the dial.
      world.scene.add(light.directional({
        intensity: 4, color: [1, 0.8, 0.55], position: [16, 6, -9], target: [0, 0, 0], castShadow: true,
      }));
      const framing = pose.fromBounds(math.box3().setFromObject(world.scene));
      world.camera.set(framing);
      world.controls.target.set(...framing.target);
      world.invalidate();
    </script>
  </body>
</html>
