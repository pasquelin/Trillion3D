<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Leaves cut out by their alpha</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, texture, math, side } from '../runtime/engine.js';

      function random(seed) {
        let state = seed >>> 0;
        return () => (state = (Math.imul(state, 1664525) + 1013904223) >>> 0) / 4294967296;
      }
      // A leaf: green inside an almond outline with a darker midrib, transparent outside it.
      function leafTexture() {
        const size = 256,
          canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext('2d'),
          imageData = ctx.createImageData(size, size),
          pixels = imageData.data;
        for (let py = 0; py < size; py++)
          for (let px = 0; px < size; px++) {
            const u = px / size, v = py / size,
              along = v,
              width = 0.42 * Math.sin(Math.PI * along) ** 0.8,
              across = Math.abs(u - 0.5),
              inside = across < width,
              rib = across < 0.012 && along > 0.05 && along < 0.9,
              rgba = inside
                ? [rib ? 0.2 : 0.3 - along * 0.08, rib ? 0.35 : 0.55, 0.12, 1]
                : [0, 0, 0, 0];
            rgba.forEach((value, channel) => {
              pixels[(py * size + px) * 4 + channel] = Math.round(Math.min(1, Math.max(0, value)) * 255);
            });
          }
        ctx.putImageData(imageData, 0, 0);
        return texture.canvas(canvas);
      }

      const world = createWorld('view', { controls: 'orbit' });
      const branch = object.mesh(geometry.cylinder(0.06, 0.06, 4.2, 12), material.meshStandard({ color: [0.3, 0.2, 0.12], roughness: 0.9 }));
      branch.position.y = 2.1;
      const moss = object.mesh(geometry.box(4, 0.3, 4), material.meshStandard({ color: [0.25, 0.3, 0.15], roughness: 0.95 }));
      moss.position.y = -0.15;
      world.scene.add(branch, moss);

      // Every leaf is a flat quad; its outline is the alpha of its texture, and the material's
      // alpha test is one half: the GPU keeps or discards each pixel, no geometry is cut.
      const leafGeometry = geometry.plane(0.4, 0.9),
        leafMaterial = material.meshStandard({ map: leafTexture(), alphaTest: 0.5, side: side.double }),
        next = random(3);
      for (let index = 0; index < 60; index++) {
        const height = 0.8 + next() * 3.2, around = next() * Math.PI * 2;
        const leaf = object.mesh(leafGeometry, leafMaterial);
        leaf.position.set(Math.cos(around) * 0.05, height, Math.sin(around) * 0.05);
        leaf.quaternion.copy(
          math.quaternion().setFromAxisAngle(math.vector3(Math.sin(around), 0, -Math.cos(around)), 1.1 + next() * 0.6),
        );
        world.scene.add(leaf);
      }

      world.scene.add(light.directional({
        intensity: 3, color: [1, 0.96, 0.85], position: [8, 15, 10], target: [0, 0, 0], castShadow: true,
      }));
      world.scene.add(light.directional({
        intensity: 1.2, color: [0.5, 0.65, 0.9], position: [-8, 10, -14], target: [0, 0, 0],
      }));
      world.camera.position.set(2.4, 3, 3.6);
      world.camera.lookAt(0, 2.1, 0);
      world.controls.target.set(0, 2.1, 0);
      world.invalidate();
    </script>
  </body>
</html>
