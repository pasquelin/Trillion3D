<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Leaves cut by alpha</title>
    <meta name="thumbnail" content="2" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, texture, math, side } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      function random(seed) {
        let state = seed >>> 0;
        return () => (state = (Math.imul(state, 1664525) + 1013904223) >>> 0) / 4294967296;
      }
      // A leaf picture: green inside an almond outline with a darker midrib, see-through outside,
      // its edge fading over a few pixels so the cutoff has something to cut.
      function leafTexture() {
        const size = 256, canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        const context = canvas.getContext('2d'), image = context.createImageData(size, size);
        for (let py = 0; py < size; py++)
          for (let px = 0; px < size; px++) {
            const along = py / size, across = Math.abs(px / size - 0.5);
            const width = 0.42 * Math.sin(Math.PI * along) ** 0.8, rib = across < 0.012 && along > 0.05 && along < 0.9;
            const alpha = Math.min(1, Math.max(0, (width - across) * 40 + 0.5));
            const rgba = [rib ? 0.2 : 0.3 - along * 0.08, rib ? 0.35 : 0.58, 0.12, alpha];
            rgba.forEach((value, channel) => (image.data[(py * size + px) * 4 + channel] = Math.round(value * 255)));
          }
        context.putImageData(image, 0, 0);
        return texture.canvas(canvas);
      }
      const world = createWorld('view', { controls: 'orbit' });
      const bark = material.meshStandard({ color: '#4d3320', roughness: 0.9 });
      const branch = object.mesh(geometry.cylinder(0.05, 0.07, 4.2, 16), bark);
      branch.position.y = 2.1;
      const moss = object.mesh(geometry.cylinder(1.6, 1.6, 0.2, 64), material.meshStandard({ color: '#3f4f25', roughness: 0.95 }));
      moss.position.y = -0.1;
      world.scene.add(branch, moss);

      // `alphaTest`: a pixel whose alpha is under it is thrown away, the others are drawn solid.
      const leafMaterial = material.meshStandard({ map: leafTexture(), alphaTest: 0.5, side: side.double });
      const leafShape = geometry.plane(0.4, 0.9), next = random(3);
      const leaves = Array.from({ length: 70 }, () => {
        const height = 0.8 + next() * 3.2, around = next() * Math.PI * 2, tilt = 1.1 + next() * 0.6;
        const leaf = object.mesh(leafShape, leafMaterial);
        leaf.position.set(Math.cos(around) * 0.05, height, Math.sin(around) * 0.05);
        world.scene.add(leaf);
        return { leaf, axis: math.vector3(Math.sin(around), 0, -Math.cos(around)), tilt, phase: next() * 6 };
      });
      world.scene.add(light.directional({ intensity: 3, color: '#fff1d6', position: [6, 10, 7], castShadow: true }));
      world.scene.add(light.directional({ intensity: 1.2, color: '#8fb4ff', position: [-8, 6, -10] }));
      world.camera.position.set(1.4, 2.7, 2);
      world.camera.lookAt(0, 2.4, 0);
      world.controls.target.set(0, 2.4, 0);

      const ui = controls({ cutoff: [0.05, 0.95, 0.5], wind: true }, (values) => {
        leafMaterial.alphaTest = values.cutoff;
        world.invalidate();
      });
      const turn = math.quaternion();
      world.onFrame(({ time }) => {
        for (const { leaf, axis, tilt, phase } of leaves)
          leaf.quaternion.copy(turn.setFromAxisAngle(axis, tilt + (ui.wind ? Math.sin(time * 2.2 + phase) * 0.15 : 0)));
        if (ui.wind) world.invalidate();
      });
      world.invalidate();
    </script>
  </body>
</html>
