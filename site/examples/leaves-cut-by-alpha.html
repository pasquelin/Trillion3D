<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Leaves cut out by their alpha</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createExplorer } from '../runtime/engine.js';

      const explorer = await createExplorer('view', {
        manifestUrl: '../assets/examples/leaves/cache/native/full/manifest.json',
        scope: 'full',
        interactive: true,
      });
      // Every leaf is a rectangle of two triangles; the leaf outline is the alpha of its
      // texture, and the material's alpha mode is MASK with a cutoff at one half: the engine
      // keeps or discards each pixel, and the shadow pass cuts the same outline.
      explorer.addLight({
        id: 'sun',
        kind: 'directional',
        direction: [-0.4, -0.75, -0.5],
        color: [1, 0.96, 0.85],
        intensity: 3,
        castsShadow: true,
      });
      explorer.addLight({
        id: 'sky',
        kind: 'directional',
        direction: [0.4, -0.5, 0.7],
        color: [0.5, 0.65, 0.9],
        intensity: 1.2,
        castsShadow: false,
      });
      explorer.setPose({ ...explorer.homePose(), position: [2.4, 3, 3.6], target: [0, 2.1, 0] });
      explorer.invalidate();
    </script>
  </body>
</html>
