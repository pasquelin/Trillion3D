<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>An orthographic elevation of the house</title>
    <meta name="thumbnail" content="1.5" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #d8e5e7;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld } from '../runtime/engine.js';
      import { camera, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      const world = createWorld('view');
      world.scene.background = math.color('#d8e5e7');
      const paint = (color, roughness = 0.8) => material.meshStandard({ color, roughness });
      const plaster = paint('#f1eadc', 0.95);
      const roof = paint('#9f493b', 0.85);
      const wood = paint('#7a4b2d', 0.75);
      const glass = paint('#79a9bd', 0.2);
      const stone = paint('#887f73', 1);
      const trim = paint('#f8f3e9', 0.9);
      const put = (shape, matter, at, parent = world.scene) => {
        const mesh = object.mesh(shape, matter);
        mesh.position.set(...at);
        parent.add(mesh);
        return mesh;
      };

      // A complete small house: each elevation is distinct, so front, side and rear are useful
      // drawing views rather than three names for the same silhouette.
      put(geometry.box(10, 6, 7), plaster, [0, 3.2, 0]);
      put(geometry.box(10.4, 0.55, 7.4), stone, [0, 0.3, 0]);
      for (const side of [-1, 1]) {
        const panel = put(geometry.box(6.2, 0.35, 7.8), roof, [side * 2.45, 7.15, 0]);
        panel.rotation.z = side * -0.62;
      }
      put(geometry.box(0.85, 2.5, 1.1), stone, [3.3, 8.1, -1.7]);
      const windowShape = geometry.box(1.55, 1.8, 0.12);
      const sideWindowShape = geometry.box(0.12, 1.8, 1.55);
      const windowTrim = geometry.box(1.9, 2.15, 0.1);
      const sideWindowTrim = geometry.box(0.1, 2.15, 1.9);
      const frameWindow = (x, y, z, side = false) => {
        put(side ? sideWindowTrim : windowTrim, trim, [x, y, z]);
        const outward = side ? [Math.sign(x) * 0.08, 0, 0] : [0, 0, Math.sign(z) * 0.08];
        put(side ? sideWindowShape : windowShape, glass, [x + outward[0], y, z + outward[2]]);
      };
      for (const x of [-3, 3]) frameWindow(x, 4.2, 3.56);
      put(geometry.box(2.1, 3.25, 0.16), wood, [0, 1.95, 3.58]);
      put(geometry.sphere(0.08, 12, 8), trim, [0.68, 1.95, 3.72]);
      for (const x of [-2.8, 0, 2.8]) frameWindow(x, 3.7, -3.56);
      for (const side of [-1, 1])
        for (const z of [-1.8, 1.8]) frameWindow(side * 5.06, 3.8, z, true);
      put(geometry.box(15, 0.18, 12), paint('#789164', 1), [0, 0, 0]);
      world.scene.add(
        light.directional({
          color: '#fff1d5',
          intensity: 3,
          position: [-8, 14, 12],
          castShadow: true,
        }),
        light.hemisphere({ color: '#dcecff', groundColor: '#786b59', intensity: 1.1 }),
      );

      const lens = camera.orthographic({ near: 0.1, far: 200 });
      world.camera = lens;
      let halfHeight = 6.2;
      const frame = () => {
        const aspect = world.canvas.clientWidth / Math.max(1, world.canvas.clientHeight);
        Object.assign(lens, {
          left: -halfHeight * aspect,
          right: halfHeight * aspect,
          top: halfHeight,
          bottom: -halfHeight,
        });
      };
      new ResizeObserver(frame).observe(world.canvas);
      frame();
      controls(
        {
          elevation: ['front', 'right', 'rear'],
          distance: [18, 60, 28, 1],
          zoom: [0.7, 1.8, 1, 0.1],
        },
        (values, key) => {
          if (!key || key === 'zoom') lens.zoom = values.zoom;
          if (!key || key === 'elevation' || key === 'distance') {
            const positions = {
              front: [0, 4.3, values.distance],
              right: [values.distance, 4.3, 0],
              rear: [0, 4.3, -values.distance],
            };
            lens.position.set(...positions[values.elevation]);
            lens.lookAt(0, 4.3, 0);
          }
          world.invalidate();
        },
        world,
      );
      world.invalidate();
      world.onPageHide(() => world.dispose());
    </script>
  </body>
</html>
