<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ten thousand boxes culled by the frustum</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p id="cut"></p>
    <script type="module">
      import { createWorld, geometry, material, object, light, metric } from '../runtime/engine.js';

      // Host-led loop: the camera turns on the spot every frame, so the world schedules nothing.
      const world = createWorld('view', { interactive: false, pixelRatio: devicePixelRatio });
      const ground = object.mesh(geometry.box(160, 0.2, 160), material.meshStandard({ color: [0.42, 0.42, 0.4], roughness: 0.9 }));
      ground.position.y = -0.1;
      world.scene.add(ground);

      // Ten thousand boxes on a square grid, geometry and material shared across every one.
      const boxGeometry = geometry.box(0.6, 0.6, 0.6),
        boxMaterial = material.meshStandard({ color: [0.75, 0.35, 0.22], roughness: 0.7 });
      for (let row = 0; row < 100; row++)
        for (let column = 0; column < 100; column++) {
          const box = object.mesh(boxGeometry, boxMaterial);
          box.position.set((column - 49.5) * 1.5, 0.3, (row - 49.5) * 1.5);
          world.scene.add(box);
        }

      world.scene.add(light.directional({
        intensity: 3, color: [1, 0.95, 0.85], position: [8, 13, 5], target: [0, 0, 0], castShadow: true,
      }));
      world.scene.add(light.directional({
        intensity: 0.6, color: [0.6, 0.7, 0.9], position: [-8, 10, -5], target: [0, 0, 0],
      }));

      // The camera stands in the middle of the grid and turns on the spot: what its frustum does
      // not contain is not drawn. The counter reads the triangles the frame selected.
      const cut = document.getElementById('cut');
      world.camera.fov = 60;
      function frame(time) {
        const angle = time / 6000;
        world.camera.position.set(0, 2.2, 0);
        world.camera.lookAt(Math.sin(angle) * 10, 0.8, Math.cos(angle) * 10);
        world.render();
        const { selectedTriangles } = metric.frame(world);
        cut.textContent = `${selectedTriangles ?? '?'} triangles selected this frame`;
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
