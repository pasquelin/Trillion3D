<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inside the G-buffer</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #a9c4e4;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls, readout } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      world.scene.background = math.color('#a9c4e4');

      // A courtyard still life: a tiled floor, two walls, columns, and things of every colour.
      // Each mesh keeps its lit material, and an unlit one of the same base colour: its albedo.
      // Meshes of the same paint share the same two materials.
      const meshes = [], paints = new Map();
      function place(shape, color, [x, y, z], { rotation = [0, 0, 0], roughness = 0.6, metalness = 0 } = {}) {
        const key = `${color} ${roughness} ${metalness}`;
        if (!paints.has(key)) paints.set(key, { lit: material.meshStandard({ color, roughness, metalness }), albedo: material.meshBasic({ color }) });
        const paint = paints.get(key), piece = object.mesh(shape, paint.lit);
        piece.position.set(x, y, z);
        piece.rotation.set(...rotation);
        piece.castShadow = piece.receiveShadow = true;
        world.scene.add(piece);
        meshes.push({ piece, ...paint });
        return piece;
      }
      const tile = geometry.box(1.96, 0.2, 1.96);
      for (let i = -6; i < 6; i++)
        for (let j = -6; j < 6; j++) place(tile, (i + j) % 2 ? '#d9cdb8' : '#9c8b74', [i * 2 + 1, -0.1, j * 2 + 1], { roughness: 0.8 });
      place(geometry.box(24, 7, 0.6), '#c98b5e', [0, 3.5, -12.3], { roughness: 0.9 });
      place(geometry.box(0.6, 7, 24), '#e3d7c3', [-12.3, 3.5, 0], { roughness: 0.9 });
      for (const [x, z] of [[-8, -8], [-3, -8], [2, -8], [-8, -3], [-8, 2]]) {
        place(geometry.cylinder(0.45, 0.55, 5.4, 48), '#f1ece2', [x, 2.9, z], { roughness: 0.5 });
        place(geometry.box(1.4, 0.3, 1.4), '#f1ece2', [x, 0.15, z]);
        place(geometry.box(1.4, 0.3, 1.4), '#f1ece2', [x, 5.75, z]);
      }
      const vase = geometry.lathe([[0, 0], [0.7, 0.1], [1, 0.8], [0.55, 1.9], [0.35, 2.3], [0.6, 2.6], [0, 2.6]], 64);
      place(vase, '#2f6fb2', [1.5, 0, -2], { roughness: 0.25 });
      const knot = place(geometry.torusKnot(0.9, 0.3, 200, 24), '#e2b340', [-2.5, 3.5, 1.5], { roughness: 0.3, metalness: 1 });
      place(geometry.box(1.6, 2.2, 1.6), '#b23a48', [-2.5, 1.1, 1.5]);
      place(geometry.sphere(1, 64, 32), '#5dbb63', [4, 1, 2.5], { roughness: 0.4 });
      place(geometry.sphere(0.6, 48, 24), '#f28c28', [2.6, 0.6, 4.2], { roughness: 0.2 });
      place(geometry.cone(0.9, 2.2, 64), '#7b4fb0', [5.5, 1.1, -3], { roughness: 0.5 });
      place(geometry.torus(1, 0.3, 32, 96), '#19a7a0', [-5, 1.3, -4.5], { rotation: [0, 0.6, 0], roughness: 0.35 });
      for (let k = 0; k < 5; k++) place(geometry.box(1.2, 0.6, 1.2), ['#e05d5d', '#f2c14e', '#4f9de0', '#8bc34a', '#ffffff'][k], [6.5, 0.3 + k * 0.6, 5.5], { rotation: [0, k * 0.35, 0], roughness: 0.7 });
      const orbiter = place(geometry.sphere(0.45, 48, 24), '#ffffff', [0, 3.2, 0], { roughness: 0.1, metalness: 0.2 });

      world.scene.add(
        light.directional({ color: '#fff0d8', intensity: 3.2, position: [9, 14, 8], castShadow: true }),
        light.hemisphere({ color: '#cfe0ff', groundColor: '#7a6650', intensity: 0.9 }),
      );
      // A near plane at 1.5 m, not the default few centimetres: the depth view then spreads its
      // shades over the court instead of crushing them to black a few metres away.
      Object.assign(world.camera, { near: 1.5, far: 200 });
      world.controls.target.set(0, 1.8, 0);
      world.controls.minDistance = 8;
      world.controls.maxDistance = 70;
      world.controls.maxPolarAngle = Math.PI / 2 - 0.05;

      // What the frame writes before any light is added, one view each. The surface pass keeps a
      // base colour, a normal and a depth per pixel; beneath them, the visibility buffer keeps
      // which triangle covers the pixel, and the material pass which material shades it.
      const normals = material.meshNormal(), depth = material.meshDepth();
      const VIEWS = {
        beauty: ['the lit image', (m) => m.lit, 'beauty'],
        albedo: ['base colour, before any light', (m) => m.albedo, 'beauty'],
        normals: ['which way the surface faces, from the camera', () => normals, 'beauty'],
        depth: ['distance: bright near, dark far', () => depth, 'beauty'],
        'triangle ids': ['which triangle covers the pixel', (m) => m.lit, 'triangles'],
        'material ids': ['which material shades the pixel', (m) => m.lit, 'materials'],
      };
      const holds = readout('Each pixel holds');
      const ui = controls({ mouse: 'Drag to walk around the court · pick a buffer to look inside the frame', buffer: Object.keys(VIEWS), turning: true }, (values, key) => {
        if (key === 'turning') return world.invalidate();
        const [meaning, wear, mode] = VIEWS[values.buffer];
        for (const entry of meshes) entry.piece.material = wear(entry);
        const offered = mode === 'beauty' || world.diagnostic.modes.includes(mode);
        world.diagnostic.mode = offered ? mode : 'beauty';
        holds(offered ? meaning : 'not offered by this renderer');
        world.invalidate();
      });

      // The opening: the camera glides in from afar, 31 degrees above the court, then circles
      // until the first press or wheel on the canvas.
      let circling = true, azimuth = Math.PI / 4, spin = 0;
      for (const type of ['pointerdown', 'wheel'])
        world.canvas.addEventListener(type, () => (circling = false), { passive: true });
      const RISE = 0.55;
      function circle(time) {
        const reach = 20 + 42 * (1 - Math.min(1, time / 3)) ** 3, { target } = world.controls;
        world.camera.position.set(target.x + Math.sin(azimuth) * Math.cos(RISE) * reach, target.y + Math.sin(RISE) * reach, target.z + Math.cos(azimuth) * Math.cos(RISE) * reach);
      }
      circle(0);
      world.camera.lookAt(0, 1.8, 0);
      world.onFrame(({ delta, time }) => {
        const step = Math.min(delta, 0.05);
        if (circling) {
          azimuth += step * 0.1;
          circle(time);
          world.controls.update();
        }
        if (ui.turning) {
          spin += step;
          knot.rotation.y = spin * 0.6;
          orbiter.position.set(Math.cos(spin * 0.8) * 4.5, 3.2 + Math.sin(spin * 1.6) * 0.6, Math.sin(spin * 0.8) * 4.5);
        }
        if (circling || ui.turning) world.invalidate();
      });
      world.invalidate();
    </script>
  </body>
</html>
