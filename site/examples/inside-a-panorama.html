<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inside a panorama</title>
    <meta name="thumbnail" content="4" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f6b37f;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      p {
        position: absolute;
        top: 0;
        margin: 0.5rem;
        color: #fff;
        font: 12px system-ui;
        text-shadow: 0 1px 3px #000;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p data-words="credit"></p>
    <script type="module">
      import { createWorld, geometry, material, object, light, math, texture, side } from '../runtime/engine.js';
      import { controls, seeded, opening, ease } from '../runtime/kit.js';

      // Three skies, one light each. A panorama is a picture of every direction at once: across,
      // the turn around the viewer; down, from straight up to straight down, the horizon halfway.
      const SKIES = {
        dawn: { zenith: '#27335e', middle: '#8a6a9a', horizon: '#f6b37f', ground: '#3b3240', ridges: ['#a07c8e', '#6e5570', '#3a2f45'], sun: '#ffd6a0', turn: 0.3, height: 7, light: ['#ffc590', 2.2], fill: ['#b9a7d6', '#4a3a3e', 0.8] },
        noon: { zenith: '#1f5fbf', middle: '#5f9de0', horizon: '#cfe6ff', ground: '#56663f', ridges: ['#9fb4c8', '#6c8a78', '#40573a'], sun: '#fffbe8', turn: 0.55, height: 58, light: ['#fff4e0', 3.4], fill: ['#bcd6ff', '#5d5a40', 1] },
        dusk: { zenith: '#141436', middle: '#5a3a78', horizon: '#ff7b54', ground: '#2a2130', ridges: ['#8a5070', '#5a3456', '#2a1c2e'], sun: '#ffb070', turn: 0.7, height: 3, light: ['#ff9860', 1.8], fill: ['#8c7ab6', '#3a2a2a', 0.8] },
      };
      const W = 2048, H = 1024;
      function paint(sky) {
        const canvas = document.createElement('canvas');
        canvas.width = W;
        canvas.height = H;
        const brush = canvas.getContext('2d');
        const random = seeded(7);
        const air = brush.createLinearGradient(0, 0, 0, H / 2);
        air.addColorStop(0, sky.zenith);
        air.addColorStop(0.6, sky.middle);
        air.addColorStop(1, sky.horizon);
        brush.fillStyle = air;
        brush.fillRect(0, 0, W, H / 2);
        // The sun, and its glow: wider across near the top, where a row of the picture is a
        // smaller circle of the sky.
        const sx = sky.turn * W, sy = H * (0.5 - sky.height / 180), stretch = 1 / Math.cos((sky.height * Math.PI) / 180);
        brush.save();
        brush.translate(sx, sy);
        brush.scale(stretch, 1);
        const glow = brush.createRadialGradient(0, 0, 0, 0, 0, 280);
        glow.addColorStop(0, sky.sun);
        glow.addColorStop(0.08, sky.sun);
        glow.addColorStop(0.1, sky.sun + 'aa');
        glow.addColorStop(1, sky.sun + '00');
        brush.fillStyle = glow;
        brush.fillRect(-280, -280, 560, 560);
        brush.restore();
        // Soft clouds in a band above the horizon, drawn again past each edge so the seam is clean.
        for (let k = 0; k < 46; k++) {
          const x = random() * W, y = H * (0.22 + random() * 0.24), r = 40 + random() * 110;
          for (const shift of [-W, 0, W]) {
            brush.save();
            brush.translate(x + shift, y);
            brush.scale(2.6, 1);
            const puff = brush.createRadialGradient(0, 0, 0, 0, 0, r);
            puff.addColorStop(0, 'rgba(255,255,255,0.28)');
            puff.addColorStop(1, 'rgba(255,255,255,0)');
            brush.fillStyle = puff;
            brush.fillRect(-r, -r, 2 * r, 2 * r);
            brush.restore();
          }
        }
        // The land: a lake at the foot of the sky, then the ground down to straight below.
        const land = brush.createLinearGradient(0, H / 2, 0, H);
        land.addColorStop(0, sky.horizon);
        land.addColorStop(0.08, sky.ground);
        land.addColorStop(1, '#141414');
        brush.fillStyle = land;
        brush.fillRect(0, H / 2, W, H / 2);
        // Three ridges of mountains, far and pale to near and dark; whole waves across the
        // picture, so the ridge meets itself where the panorama closes.
        sky.ridges.forEach((colour, ridge) => {
          const waves = [3, 7, 13, 29].map((k) => [k, random() * Math.PI * 2, (0.5 + random()) / k]);
          brush.fillStyle = colour;
          brush.beginPath();
          brush.moveTo(0, H / 2 + 12);
          for (let x = 0; x <= W; x += 4) {
            let rise = 0;
            for (const [k, phase, amplitude] of waves) rise += Math.sin((2 * Math.PI * k * x) / W + phase) * amplitude;
            brush.lineTo(x, H / 2 + ridge * 4 - (60 - ridge * 16) * Math.max(0.2, 1.4 + rise * 2.2));
          }
          brush.lineTo(W, H / 2 + 12);
          brush.fill();
        });
        // The sun's path on the lake.
        const shine = brush.createLinearGradient(0, H / 2, 0, H * 0.58);
        shine.addColorStop(0, sky.sun + 'cc');
        shine.addColorStop(1, sky.sun + '00');
        brush.fillStyle = shine;
        brush.fillRect(sx - 18 * stretch, H / 2 + 12, 36 * stretch, H * 0.08);
        return canvas;
      }
      // The sky's direction from its place in the picture, as the sphere's own texture lays it:
      // across is the turn from +x toward +z, down the angle from straight up.
      function towards(sky) {
        const turn = sky.turn * Math.PI * 2, fromUp = Math.PI / 2 - (sky.height * Math.PI) / 180;
        return [Math.sin(fromUp) * Math.cos(turn), Math.cos(fromUp), Math.sin(fromUp) * Math.sin(turn)];
      }

      const world = createWorld('view', { controls: 'orbit' });
      world.scene.background = math.color('#f6b37f');
      // Each panorama on a great sphere seen from inside, unlit: it shows the picture as painted.
      // All three are in the scene from the start; the choice shows one.
      const domes = Object.fromEntries(Object.entries(SKIES).map(([name, sky]) => {
        const dome = object.mesh(geometry.sphere(300, 96, 48), material.meshBasic({ map: texture.canvas(paint(sky)), side: side.double }));
        dome.visible = name === 'dawn';
        dome.castShadow = dome.receiveShadow = false;
        world.scene.add(dome);
        return [name, dome];
      }));

      // A terrace in the middle of it: a round deck, a ring of columns, a bronze knot, stones.
      const stone = material.meshStandard({ color: '#d9d0c2', roughness: 0.75 });
      const pieces = [
        [geometry.cylinder(7, 7.3, 0.6, 96), stone, [0, -0.3, 0]],
        [geometry.cylinder(1.1, 1.3, 1.4, 48), stone, [0, 0.7, 0]],
        [geometry.torus(5.6, 0.25, 24, 160), stone, [0, 5.35, 0], Math.PI / 2],
        [geometry.sphere(0.8, 48, 24), material.meshStandard({ color: '#3b6e8f', roughness: 0.15 }), [3, 0.8, 2.4]],
        [geometry.sphere(0.55, 48, 24), material.meshStandard({ color: '#e8e2d6', roughness: 0.9 }), [-2.6, 0.55, 3]],
        [geometry.box(1.2, 0.8, 1.2), material.meshStandard({ color: '#a4453a', roughness: 0.6 }), [-3, 0.4, -2.4]],
      ];
      for (let k = 0; k < 8; k++) {
        const angle = (k / 8) * Math.PI * 2;
        pieces.push([geometry.cylinder(0.28, 0.32, 5.2, 32), stone, [Math.cos(angle) * 5.6, 2.6, Math.sin(angle) * 5.6]]);
      }
      for (const [shape, matter, [x, y, z], tilt = 0] of pieces) {
        const piece = object.mesh(shape, matter);
        piece.position.set(x, y, z);
        piece.rotation.x = tilt;
        piece.castShadow = piece.receiveShadow = true;
        world.scene.add(piece);
      }
      const knot = object.mesh(geometry.torusKnot(1, 0.32, 220, 28), material.meshStandard({ color: '#b87333', metalness: 1, roughness: 0.3 }));
      knot.position.y = 3;
      knot.castShadow = knot.receiveShadow = true;
      world.scene.add(knot);

      // The sun where the picture has it, the fill in the sky's and the ground's colours.
      const sun = light.directional({ castShadow: true }), fill = light.hemisphere({});
      world.scene.add(sun, fill);
      world.camera.far = 700;
      world.controls.target.set(0, 2.4, 0);
      world.controls.minDistance = 6;
      world.controls.maxDistance = 40;
      world.controls.maxPolarAngle = Math.PI / 2 - 0.05;
      controls({ sky: Object.keys(SKIES), fieldOfView: [35, 100, 60, 1] }, (values, key) => {
        if (key === undefined || key === 'sky') {
          const sky = SKIES[values.sky];
          for (const [name, dome] of Object.entries(domes)) dome.visible = name === values.sky;
          sun.position.set(...towards(sky).map((v) => v * 40));
          sun.color.set(sky.light[0]);
          sun.intensity = sky.light[1];
          fill.color.set(sky.fill[0]);
          fill.groundColor.set(sky.fill[1]);
          fill.intensity = sky.fill[2];
        }
        world.camera.fov = values.fieldOfView;
        world.invalidate();
      });

      // The opening: low and close beside the knot, the camera draws back and rises, turning
      // until the first press or wheel on the canvas.
      opening(world, (time) => {
        const azimuth = 0.6 + time * 0.08, settle = ease.out(time / 4), reach = 7 + 11 * settle, rise = 0.05 + 0.2 * settle, { target } = world.controls;
        world.camera.position.set(target.x + Math.sin(azimuth) * Math.cos(rise) * reach, target.y + Math.sin(rise) * reach, target.z + Math.cos(azimuth) * Math.cos(rise) * reach);
      });
      world.onFrame(({ delta }) => {
        knot.rotation.y += Math.min(delta, 0.05) * 0.4;
        world.invalidate();
      });
    </script>
  </body>
</html>
