<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Labels that follow</title>
    <meta name="thumbnail" content="4.5" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #070a14;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, addLabel, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls, words, language, opening, ease } from '../runtime/kit.js';
      const say = words();

      const world = createWorld('view', { controls: 'orbit' });
      world.scene.background = math.color('#070a14');

      // The planets, their orbits squeezed to fit one view; the facts under each name are the
      // real ones: the mean distance to the Sun in astronomical units, the year in Earth days.
      const PLANETS = [
        { name: 'Mercury', colour: '#b5a89a', radius: 0.35, orbit: 5, au: 0.39, days: 88, moons: 0 },
        { name: 'Venus', colour: '#e8c98a', radius: 0.6, orbit: 7, au: 0.72, days: 225, moons: 0 },
        { name: 'Earth', colour: '#3f7fe0', radius: 0.64, orbit: 9.4, au: 1, days: 365, moons: 1 },
        { name: 'Mars', colour: '#d0643a', radius: 0.45, orbit: 11.8, au: 1.52, days: 687, moons: 2 },
        { name: 'Jupiter', colour: '#d9b08c', radius: 1.6, orbit: 16, au: 5.2, days: 4333, moons: 95 },
        { name: 'Saturn', colour: '#e6d29a', radius: 1.35, orbit: 21, au: 9.54, days: 10759, moons: 146 },
        { name: 'Uranus', colour: '#8fd6e0', radius: 0.95, orbit: 25.5, au: 19.2, days: 30687, moons: 28 },
        { name: 'Neptune', colour: '#4a6fe8', radius: 0.92, orbit: 29.5, au: 30.1, days: 60190, moons: 16 },
      ];

      // The Sun glows on its own; its light falls off with the square of the distance, so a sky
      // fill keeps the far planets' night sides from going black.
      const sunRadius = 2.6;
      const sun = object.mesh(geometry.sphere(sunRadius, 64, 32), material.meshBasic({ color: '#ffc45a' }));
      const corona = object.mesh(geometry.sphere(sunRadius * 1.12, 48, 24), material.meshBasic({ color: '#ff8a2a', side: 'back' }));
      world.scene.add(
        sun,
        corona,
        light.point({ color: '#fff0d6', intensity: 260, position: [0, 0, 0] }),
        light.hemisphere({ color: '#6f86c8', groundColor: '#2a2030', intensity: 0.9 }),
      );

      // Every planet a sphere and a faint ring for its path; Saturn wears its rings, Earth its Moon.
      const orbitPaint = material.meshBasic({ color: '#28324e' });
      const bodies = PLANETS.map((planet, index) => {
        const mesh = object.mesh(geometry.sphere(planet.radius, 48, 24), material.meshStandard({ color: planet.colour, roughness: 0.75 }));
        const path = object.mesh(geometry.torus(planet.orbit, 0.025, 6, 256), orbitPaint);
        path.rotation.x = Math.PI / 2;
        world.scene.add(mesh, path);
        return { ...planet, mesh, angle: index * 2.1, height: planet.radius };
      });
      const saturn = bodies.find(({ name }) => name === 'Saturn');
      const rings = object.mesh(geometry.ring(saturn.radius * 1.35, saturn.radius * 2.3, 128, 3), material.meshStandard({ color: '#cbb78a', roughness: 0.9, side: 'double' }));
      rings.rotation.set(-Math.PI / 2 + 0.45, 0, 0.2);
      const earth = bodies.find(({ name }) => name === 'Earth');
      const moon = { name: 'Moon', colour: '#c9c9c9', radius: 0.18, orbit: 1.25, au: null, days: 27, moons: 0, angle: 0, height: 0.18 };
      moon.mesh = object.mesh(geometry.sphere(moon.radius, 24, 12), material.meshStandard({ color: moon.colour, roughness: 0.9 }));
      world.scene.add(rings, moon.mesh);

      // Labels are scene sprites: their parents carry them and both renderers test scene depth.
      const tagged = [{ name: 'Sun', colour: '#ffc45a', mesh: sun, height: sunRadius, au: 0, days: null, moons: 0 }, ...bodies, moon];
      await Promise.all(tagged.map(async (body) => {
        body.label = await addLabel(body.mesh, {
          text: say(body.name), color: body.colour, height: 0.7,
          position: [0, body.height + 0.15, 0],
        });
      }));
      const FACTS = {
        'distance to the Sun': (body) => (body.au === null ? say('fromEarth') : body.au === 0 ? say('ourStar') : say('au', { au: body.au })),
        year: (body) => (body.days === null ? '' : body.name === 'Moon' ? say('month') : say('year', { days: body.days.toLocaleString(language()) })),
        moons: (body) => (body.name === 'Sun' ? say('planets') : body.name === 'Moon' ? say('earthsMoon') : say(body.moons === 1 ? 'oneMoon' : 'moons', { moons: body.moons })),
        'names only': () => '',
      };

      function placeLabels(fact) {
        for (const body of tagged) {
          const text = FACTS[fact](body);
          void body.label.setText(text ? `${say(body.name)}\n${text}` : say(body.name));
        }
      }
      addEventListener('pagehide', () => {
        for (const body of tagged) body.label.remove();
        world.dispose();
      }, { once: true });

      // The opening: the view falls from high above the plane of the orbits to a low three-quarter
      // view; a press or a wheel on the canvas hands the camera to the viewer at once.
      world.controls.minDistance = 6;
      world.controls.maxDistance = 90;
      world.controls.target.set(0, 0, 0);
      world.camera.position.set(0, 70, 8);
      world.camera.lookAt(0, 0, 0);
      world.controls.update();
      const fall = opening(world, (time) => {
        const t = ease.inOut(time / 4.5), around = 0.9 * t, reach = math.lerp(71, 40, t), up = math.lerp(1.45, 0.42, t);
        world.camera.position.set(reach * Math.cos(up) * Math.sin(around), reach * Math.sin(up), reach * Math.cos(up) * Math.cos(around));
        return time < 4.5;
      });
      let aligning = -1;

      const ui = controls({
        show: Object.keys(FACTS),
        speed: [0, 4, 1],
        lineThemUp: () => ((aligning = 0), world.invalidate()),
      }, (next) => { placeLabels(next.show); world.invalidate(); }, world);

      let starts = [], placed = false;
      world.onFrame(({ delta }) => {
        const step = Math.min(delta, 0.05);
        // An inner planet goes round faster (Kepler: the year grows as the orbit's power 1.5);
        // the button eases every planet onto one line from the Sun, then lets them go again.
        const moving = fall.gliding || aligning >= 0 || ui.speed > 0 || !placed;
        placed = true;
        if (aligning === 0) starts = bodies.map(({ angle }) => angle);
        if (aligning >= 0) {
          aligning = Math.min(1, aligning + step / 2.5);
          bodies.forEach((body, k) => {
            const goal = Math.ceil(starts[k] / (Math.PI * 2)) * Math.PI * 2 + 0.6;
            body.angle = math.lerp(starts[k], goal, ease.inOut(aligning));
          });
          if (aligning === 1) aligning = -1;
        } else for (const body of bodies) body.angle += step * ui.speed * 0.9 * (5 / body.orbit) ** 1.5;
        moon.angle += step * ui.speed * 3.2;
        // Still planets ask for no new frame; each label follows its parent in the engine.
        if (moving) {
          for (const body of bodies) body.mesh.position.set(body.orbit * Math.cos(body.angle), 0, -body.orbit * Math.sin(body.angle));
          rings.position.copy(saturn.mesh.position);
          moon.mesh.position.set(earth.mesh.position.x + moon.orbit * Math.cos(moon.angle), 0.25 * Math.sin(moon.angle), earth.mesh.position.z - moon.orbit * Math.sin(moon.angle));
          world.invalidate();
        }
      });
    </script>
  </body>
</html>
