<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fly a jet through a canyon</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f6c592;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      /* The head-up display: thin green lines and figures over the whole view, glowing a little. */
      #hud {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        fill: none;
        stroke: #3cff7a;
        stroke-width: 1.4;
        color: #3cff7a;
        font: 400 13px/1 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        letter-spacing: 0.04em;
        filter: drop-shadow(0 0 2px #3cff7aaa);
      }
      #hud text {
        fill: currentColor;
        stroke: none;
      }
      #hud .box {
        fill: #00140a;
        fill-opacity: 0.55;
      }
      #hud .big {
        font-size: 28px;
        letter-spacing: 0.12em;
      }
      #hud .blink {
        animation: blink 0.5s steps(2) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.15;
        }
      }
      #toast {
        opacity: 0;
        font-size: 30px;
        letter-spacing: 0.14em;
        transform-box: fill-box;
        transform-origin: center;
      }
      #toast.show {
        animation: toast 1.9s ease-out forwards;
      }
      @keyframes toast {
        0% {
          opacity: 0;
          transform: scale(1.5);
        }
        12% {
          opacity: 1;
          transform: scale(1);
        }
        75% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      /* The big messages: the prompt at the start, a crash, the time at the finish. */
      #banner {
        position: fixed;
        left: 50%;
        top: 24%;
        transform: translate(-50%, -50%);
        width: min(90vw, 900px);
        text-align: center;
        color: #3cff7a;
        pointer-events: none;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        text-shadow: 0 0 8px #3cff7a99, 0 2px 10px #000a;
      }
      #banner h1 {
        margin: 0;
        font-size: clamp(28px, 6vw, 64px);
        font-weight: 500;
        letter-spacing: 0.08em;
      }
      #banner p {
        margin: 10px 0 0;
        font-size: clamp(13px, 1.8vw, 18px);
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <svg id="hud"></svg>
    <div id="banner"><h1></h1><p></p></div>
    <script type="module">
      import { createWorld, geometry, material, object, light, math, buffer } from '../runtime/engine.js';
      import { controls, play, stats } from '../runtime/kit.js';

      // What flies is the engine's own `fly` controller: six degrees of freedom, no up axis kept
      // and no bound on a turn, so a loop or a roll goes all the way round; every key is read by
      // its place on the keyboard (`KeyboardEvent.code`), so a French keyboard flies the same. In
      // cruise (`autoForward`) it flies on by itself at `movementSpeed`; with `pointerLook` off
      // the mouse never turns it. The page sets that speed from a throttle, keeps a slow jet on
      // the runway or lets it stall, and draws around it: the jet riding the camera, the head-up
      // display, the canyon, the rings, the sound.
      const world = createWorld('view', { controls: 'fly' });
      const HORIZON = '#f6c592';
      world.scene.background = math.color(HORIZON);
      const camera = world.camera;
      [camera.near, camera.far, camera.fov] = [0.3, 12000, 62];
      const deg = Math.PI / 180, G = 9.81;
      // Speeds in metres per second: the slowest a flying jet goes, where the wing stalls, where
      // it lifts off, full military power and full afterburner (Mach 1.2).
      const MIN_AIR = 45, STALL = 68, TAKEOFF = 75, MIL = 300, MAX_SPEED = 410, MACH = 340, AB_TOP = 1.15;
      // Turn rates: a fighter rolls fast, pitches hard and barely yaws.
      const ROLL_RATE = 270 * deg, PITCH_RATE = 30 * deg, YAW_RATE = 8 * deg;
      Object.assign(world.controls, {
        pointerLook: false,
        autoForward: true,
        movementSpeed: 0,
        rollSpeed: ROLL_RATE,
        pitchSpeed: PITCH_RATE,
        yawSpeed: YAW_RATE,
        inputResponse: 0.15,
      });
      const canvas = document.getElementById('view');

      // A sequence in [0, 1) from a seed: the same valley on every run.
      function random(seed) {
        let state = seed >>> 0;
        return () => (state = (Math.imul(state, 1664525) + 1013904223) >>> 0) / 4294967296;
      }
      const next = random(7);
      const clamp = (x, a = -1, b = 1) => Math.min(b, Math.max(a, x));
      const smooth = (a, b, x) => {
        const t = clamp((x - a) / (b - a), 0, 1);
        return t * t * (3 - 2 * t);
      };
      const matte = (color, roughness = 0.85) => material.meshStandard({ color, roughness });
      // Sky, distant ranges, sun and trails are see-through materials: drawn after the valley,
      // they cast no shadow, so the dome around everything never hides the sun.
      const sheer = (color, opacity = 1) => material.meshBasic({ color, transparent: true, opacity, depthWrite: false, side: 'double' });
      function place(shape, matter, [x, y, z], parent = world.scene) {
        const mesh = object.mesh(shape, matter);
        mesh.position.set(x, y, z);
        parent.add(mesh);
        return mesh;
      }

      // THE CANYON: a gorge on an arc of 1100 m around (1100, -600), from just north of the
      // runway round the north-eastern peaks and back into the valley in the south-east. It is
      // cut into the terrain, so the walls are the mountains themselves.
      const GORGE = { x: 1100, z: -600, r: 1100, floor: 18, from: -10 * deg, to: 285 * deg };
      const gorgeAt = (a) => [GORGE.x - GORGE.r * Math.cos(a), GORGE.z - GORGE.r * Math.sin(a)];
      function gorgeDistance(x, z) {
        const dx = x - GORGE.x, dz = z - GORGE.z;
        let a = Math.atan2(-dz, -dx);
        if (a < GORGE.from) a += 2 * Math.PI;
        if (a <= GORGE.to) return Math.abs(Math.hypot(dx, dz) - GORGE.r);
        return Math.min(...[GORGE.from, GORGE.to].map((end) => Math.hypot(x - gorgeAt(end)[0], z - gorgeAt(end)[1])));
      }

      // THE VALLEY, in metres. A long flat floor with the runway and the town levelled, a river
      // winding through it, and a ring of peaks — ridges, shoulders and summits stacked — around.
      const riverX = (z) => 170 + 80 * Math.sin(z / 300);
      const RUNWAY = [-30, 30, -560, 560], TOWN = [300, 720, -680, -120], WATER = -2.5;
      const levelled = (x, z, [x0, x1, z0, z1]) => 1 - smooth(0, 80, Math.hypot(Math.max(x0 - x, 0, x - x1), Math.max(z0 - z, 0, z - z1)));
      const PEAKS = Array.from({ length: 18 }, (_, index) => {
        const angle = (index / 18) * Math.PI * 2 + next() * 0.3, far = 1650 + next() * 650;
        return [Math.sin(angle) * far, Math.cos(angle) * far * 1.3, 260 + next() * 420, 170 + next() * 220];
      });
      function terrain(x, z) {
        const around = Math.atan2(x, z), rise = smooth(950, 2050, Math.hypot(x, z / 1.3));
        let height = rise * (330 + 120 * Math.sin(3 * around + 1) + 90 * Math.sin(7 * around + 2));
        height += rise * 45 * Math.sin(x / 97 + Math.sin(z / 140)) * Math.sin(z / 83 + 1);
        for (const [px, pz, top, width] of PEAKS) height += top * Math.exp(-((x - px) ** 2 + (z - pz) ** 2) / width ** 2);
        const floor = (1 - rise) * (1 - Math.max(levelled(x, z, RUNWAY), levelled(x, z, TOWN)));
        height += floor * (3 + 5 * Math.sin(x / 210) * Math.sin(z / 260));
        const cut = 1 - smooth(55, 200, gorgeDistance(x, z));
        height += (Math.min(height, GORGE.floor) - height) * cut;
        return height - (1 - rise) * 7 * Math.exp(-(((x - riverX(z)) / 38) ** 2));
      }
      // Sampled every 36 m over 5.4 km, the normal from the slope. Each triangle takes a band by
      // its height and steepness — meadow, forest floor, rock, snow — and each band is one mesh.
      const SIZE = 5400, CELLS = 150, STEP = SIZE / CELLS;
      const sample = (x, z) => {
        const nx = (terrain(x - 4, z) - terrain(x + 4, z)) / 8, nz = (terrain(x, z - 4) - terrain(x, z + 4)) / 8, length = Math.hypot(nx, 1, nz);
        return [x, terrain(x, z), z, nx / length, 1 / length, nz / length];
      };
      const grid = [];
      for (let i = 0; i <= CELLS; i++) for (let j = 0; j <= CELLS; j++) grid.push(sample(i * STEP - SIZE / 2, j * STEP - SIZE / 2));
      const bands = [[], [], [], []];
      const bandOf = (height, up, x, z) => {
        const ragged = 45 * Math.sin(x / 61) * Math.sin(z / 47);
        if (height > 430 + ragged && up > 0.6) return 3;
        if (up < 0.8 || height > 250 + ragged) return 2;
        return height > 60 ? 1 : 0;
      };
      for (let i = 0; i < CELLS; i++)
        for (let j = 0; j < CELLS; j++) {
          const at = (a, b) => grid[(i + a) * (CELLS + 1) + j + b];
          for (const triangle of [[at(0, 0), at(0, 1), at(1, 1)], [at(0, 0), at(1, 1), at(1, 0)]]) {
            const mean = (k) => (triangle[0][k] + triangle[1][k] + triangle[2][k]) / 3;
            bands[bandOf(mean(1), mean(4), mean(0), mean(2))].push(...triangle.flat());
          }
        }
      ['#6f8f47', '#4f6b36', '#7d7264', '#f2f4f8'].forEach((colour, index) => {
        const flat = new Float32Array(bands[index]), count = flat.length / 6;
        const position = new Float32Array(count * 3), normal = new Float32Array(count * 3);
        for (let v = 0; v < count; v++) position.set(flat.subarray(v * 6, v * 6 + 3), v * 3), normal.set(flat.subarray(v * 6 + 3, v * 6 + 6), v * 3);
        const shape = geometry.createBuffer({ position: buffer.float32(position, 3), normal: buffer.float32(normal, 3), index: buffer.uint32(Array.from({ length: count }, (_, v) => v)) });
        world.scene.add(object.mesh(shape, matte(colour, index === 3 ? 0.6 : 0.92)));
      });
      place(geometry.plane(SIZE, SIZE), material.meshStandard({ color: '#3f7394', metalness: 0.1, roughness: 0.18 }), [0, WATER, 0]).rotation.set(-Math.PI / 2, 0, 0);

      // The airfield: a runway with its centre line and thresholds, a hangar beside it.
      const paint = matte('#f1efe8', 0.6);
      place(geometry.box(34, 0.3, 1100), matte('#3b3d42', 0.9), [0, 0, 0]);
      for (let z = -500; z <= 500; z += 52) place(geometry.box(1.2, 0.05, 24), paint, [0, 0.17, z]);
      for (const end of [-530, 530]) for (let k = -3; k <= 3; k++) if (k) place(geometry.box(2.2, 0.05, 30), paint, [k * 4, 0.17, end]);
      place(geometry.box(30, 14, 24), matte('#b9b2a4', 0.7), [-70, 7, 380]);
      place(geometry.box(32, 1, 26), matte('#7a3b2e', 0.6), [-70, 14.5, 380]);

      // The town: blocks of five colours with dark roofs, a church tower in the middle. Each block
      // is kept as ground for the jet: a roof it cannot land on.
      const walls = ['#e6dac4', '#c9785a', '#8fa3b8', '#d9b86a', '#b9c7a3'].map((colour) => matte(colour, 0.7));
      const roofs = matte('#4a3d3a', 0.55), block = geometry.box(1, 1, 1), buildings = [];
      for (let x = 330; x <= 690; x += 34)
        for (let z = -650; z <= -150; z += 34) {
          if (next() < 0.3 || Math.hypot(x - 510, z + 400) < 30) continue;
          const [width, depth, height] = [14 + next() * 10, 14 + next() * 10, 8 + next() ** 2 * 38];
          place(block, walls[Math.floor(next() * 5)], [x, height / 2, z]).scale.set(width, height, depth);
          place(block, roofs, [x, height + 0.6, z]).scale.set(width + 1, 1.2, depth + 1);
          buildings.push([x, z, width / 2 + 0.5, depth / 2 + 0.5, height + 1.2]);
        }
      place(geometry.box(12, 46, 12), walls[0], [510, 23, -400]);
      place(geometry.cone(8.5, 26, 4), roofs, [510, 59, -400]).rotation.y = Math.PI / 4;
      buildings.push([510, -400, 6, 6, 72]);

      // Forests on the lower slopes, none on the canyon floor, and round trees along the river.
      const pines = [matte('#2f5a33', 0.9), matte('#3b6a38', 0.9)], pine = geometry.cone(4, 14, 7);
      const leaves = matte('#5f8a3a', 0.9), crown = geometry.sphere(5, 12, 8), trunk = geometry.cylinder(0.6, 0.8, 5, 6), bark = matte('#5a4332');
      for (let planted = 0, tries = 0; planted < 190 && tries < 5000; tries++) {
        const [x, z] = [(next() - 0.5) * 3000, (next() - 0.5) * 3600], [, height, , , up] = sample(x, z);
        if (height < 1 || height > 170 || up < 0.93 || levelled(x, z, RUNWAY) > 0 || levelled(x, z, TOWN) > 0 || Math.abs(x - riverX(z)) < 60 || gorgeDistance(x, z) < 120) continue;
        const size = 0.7 + next() * 0.7;
        place(pine, pines[planted++ % 2], [x, height + 7 * size - 1, z]).scale.setScalar(size);
      }
      for (let index = 0; index < 36; index++) {
        const z = -900 + index * 52 + next() * 20, x = riverX(z) + (index % 2 ? 50 : -50) + next() * 12, height = terrain(x, z);
        place(trunk, bark, [x, height + 2.5, z]);
        place(crown, leaves, [x, height + 7.5, z]);
      }

      // THE SKY at golden hour: bands of a dome from a warm horizon to a deep blue zenith, a low
      // sun, and three distant ranges paling into the haze — the farther, the lighter and bluer.
      const mix = (a, b, t) => '#' + [1, 3, 5].map((k) => Math.round(parseInt(a.slice(k, k + 2), 16) * (1 - t) + parseInt(b.slice(k, k + 2), 16) * t).toString(16).padStart(2, '0')).join('');
      const KEYS = [[-12, '#e9b98c'], [0, HORIZON], [6, '#f3d3ae'], [14, '#d6cfc8'], [26, '#a9bddb'], [48, '#7f9fd0'], [90, '#5a7dbf']];
      const SKY = 8000;
      for (let band = 0; band < 18; band++) {
        const [from, to] = [-12 + (band / 18) * 102, -12 + ((band + 1) / 18) * 102], middle = (from + to) / 2;
        const key = KEYS.findIndex(([at]) => at > middle), [a, low] = KEYS[key - 1], [b, high] = KEYS[key];
        const shape = geometry.cylinder(SKY * Math.cos(to * deg), SKY * Math.cos(from * deg), SKY * (Math.sin(to * deg) - Math.sin(from * deg)), 64, 1, true);
        place(shape, sheer(mix(low, high, (middle - a) / (b - a))), [0, (SKY * (Math.sin(to * deg) + Math.sin(from * deg))) / 2, 0]).renderOrder = -20;
      }
      const SUN = math.vector3(-2600, 900, 1500), toSun = SUN.clone().normalize().multiplyScalar(7000);
      place(geometry.sphere(420, 32, 16), sheer('#ffd9a0', 0.35), [toSun.x, toSun.y, toSun.z]).renderOrder = -19;
      place(geometry.sphere(160, 32, 16), sheer('#fff4d6'), [toSun.x, toSun.y, toSun.z]).renderOrder = -18;
      [[3300, 520, '#8d8fa6'], [4300, 760, '#aaa6b6'], [5400, 980, '#c9b8b4']].forEach(([radius, tall, colour], layer) => {
        const corners = [], cuts = [], SEGMENTS = 220;
        for (let k = 0; k <= SEGMENTS; k++) {
          const a = (k / SEGMENTS) * Math.PI * 2, s = layer * 2.1;
          const top = tall * (0.45 + 0.3 * Math.abs(Math.sin(a * 5 + s)) + 0.18 * Math.sin(a * 13 + 2 * s) + 0.1 * Math.sin(a * 31 + s) + 0.08 * next());
          corners.push(Math.sin(a) * radius, -200, Math.cos(a) * radius, Math.sin(a) * radius, top, Math.cos(a) * radius);
          if (k < SEGMENTS) cuts.push(2 * k, 2 * k + 1, 2 * k + 3, 2 * k, 2 * k + 3, 2 * k + 2);
        }
        const ridge = geometry.createBuffer({ position: buffer.float32(new Float32Array(corners), 3), index: buffer.uint32(cuts) });
        ridge.computeVertexNormals();
        // The farthest range is drawn first, the nearer ones over it.
        place(ridge, sheer(colour), [0, 0, 0]).renderOrder = -15 - layer;
      });
      // A still sun — its shadows are cast once, never moved — and a cool sky filling them.
      world.scene.add(light.directional({ intensity: 3.4, color: '#ffb56b', position: [SUN.x, SUN.y, SUN.z], castShadow: true }));
      world.scene.add(light.hemisphere({ color: '#9db8e8', groundColor: '#5e5040', intensity: 0.85 }));

      // Clouds: clusters of soft puffs over the valley.
      const puff = geometry.sphere(1, 18, 12), vapour = material.meshStandard({ color: '#fff4ea', roughness: 1, transparent: true, opacity: 0.82, depthWrite: false });
      const banks = [[-300, 320, 900], [-700, 240, -300], [300, 420, 200]];
      while (banks.length < 17) banks.push([(next() - 0.5) * 3600, 380 + next() * 300, (next() - 0.5) * 4200]);
      for (const [x, y, z] of banks)
        for (let k = 0; k < 7; k++) place(puff, vapour, [x + (next() - 0.5) * 120, y + (next() - 0.5) * 30, z + (next() - 0.5) * 80]).scale.setScalar(22 + next() * 24);

      // The course: ten rings down the canyon, one every 30° of its arc. Each is gold until flown
      // through, then its green twin shows instead — two meshes, never a material changed.
      const COURSE = Array.from({ length: 10 }, (_, index) => {
        const [x, z] = gorgeAt(index * 30 * deg);
        return [Math.round(x), [60, 62, 65, 68, 70, 70, 68, 68, 72, 85][index], Math.round(z)];
      });
      const HOOP = 30, hoop = geometry.torus(HOOP, 2.2, 14, 72);
      const gold = material.meshStandard({ color: '#ffc23a', metalness: 0.7, roughness: 0.3, emissive: '#6b4a00' });
      const green = material.meshStandard({ color: '#3ddc84', roughness: 0.4, emissive: '#0f5a2c' });
      const rings = COURSE.map(([x, y, z], index) => {
        const ring = object.group(), [nx, ny, nz] = COURSE[(index + 1) % COURSE.length];
        ring.position.set(x, y, z);
        world.scene.add(ring);
        ring.lookAt(nx, ny, nz);
        return { ring, todo: place(hoop, gold, [0, 0, 0], ring), passed: place(hoop, green, [0, 0, 0], ring) };
      });
      // Every ring reachable: from one ring, the next lies outside the circle the jet turns on
      // at its pitch rate — the chord d against 2 r sin θ, θ the turn it asks — and the ring
      // clears the canyon floor. The check is printed with its margins.
      function reach(speed) {
        const radius = speed / PITCH_RATE;
        return COURSE.slice(0, -2).map((a, k) => {
          const [b, c] = [COURSE[k + 1], COURSE[k + 2]], u = b.map((v, i) => v - a[i]), w = c.map((v, i) => v - b[i]);
          const d = Math.hypot(...w), turn = Math.acos(clamp(u.reduce((s, v, i) => s + v * w[i], 0) / (Math.hypot(...u) * d)));
          return { ring: k + 3, turn: +(turn / deg).toFixed(1), chord: Math.round(d), radius: Math.round(radius), margin: +(d / (2 * radius * Math.sin(turn))).toFixed(2), floor: Math.round(c[1] - HOOP - terrain(c[0], c[2])) };
        });
      }
      for (const speed of [150, 250]) console.table(reach(speed).map((row) => ({ speed, ...row })));

      // THE JET, in metres, nose along -z like the camera: a twin-engine, twin-tail fighter. The
      // round parts are turned on the lathe (profile: radius, then distance forward), the flat
      // ones are outlines pushed thin; control surfaces hang on their hinges and move with the keys.
      const jet = object.group();
      const skin = material.meshStandard({ color: '#9aa1a9', metalness: 0.25, roughness: 0.55 });
      const camo = material.meshStandard({ color: '#6f767f', metalness: 0.25, roughness: 0.6 });
      const radome = material.meshStandard({ color: '#586068', metalness: 0.2, roughness: 0.5 });
      const metal = material.meshStandard({ color: '#4b4b50', metalness: 0.85, roughness: 0.35 });
      const glass = material.meshPhysical({ color: '#2c2a1e', metalness: 0.5, roughness: 0.06, clearcoat: 1, clearcoatRoughness: 0.03 });
      const ordnance = matte('#dcdcd6', 0.5), soot = material.meshBasic({ color: '#120c0a' }), tyre = matte('#1c1c1c', 0.9), strut = matte('#c8c8c8', 0.4);
      function lathed(profile, matter, at, parent = jet, [width, height] = [1, 1]) {
        const mesh = place(geometry.lathe(profile, 32), matter, at, parent);
        mesh.rotation.x = -Math.PI / 2;
        mesh.scale.set(width, 1, height);
        return mesh;
      }
      // A flat part from its outline: lying (span, forward) or standing (forward, height); a point
      // of four numbers is a curve (control point, then end point).
      function panel(points, depth, matter, [x, y, z], parent = jet, standing = false) {
        const outline = math.shape().moveTo(...points[0]);
        for (const point of points.slice(1)) point.length === 4 ? outline.quadraticCurveTo(...point) : outline.lineTo(...point);
        const bevel = Math.min(0.05, depth * 0.3);
        const mesh = place(geometry.extrude(outline, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2 }), matter, standing ? [x - depth / 2, y, z] : [x, y - depth / 2, z], parent);
        if (standing) mesh.rotation.y = Math.PI / 2;
        else mesh.rotation.x = -Math.PI / 2;
        return mesh;
      }
      const hinge = ([x, y, z], parent = jet) => {
        const pivot = object.group();
        pivot.position.set(x, y, z);
        parent.add(pivot);
        return pivot;
      };
      const mirrored = ([x, y]) => [-x, y];
      // Fuselage, radome and pitot, the dorsal spine, the bubble canopy and a belly tank.
      lathed([[0.001, -6.4], [0.5, -6.2], [0.78, -4.5], [0.95, -1.5], [1.02, 1.5], [0.98, 4.2], [0.82, 6.0], [0.64, 7.6]], skin, [0, 0, 0], jet, [1.25, 0.85]);
      lathed([[0.64, 7.6], [0.5, 8.6], [0.3, 9.6], [0.1, 10.3], [0.001, 10.6]], radome, [0, 0, 0], jet, [1.25, 0.85]);

      lathed([[0.001, -6.0], [0.35, -4.0], [0.5, -1.0], [0.5, 1.5], [0.4, 3.0], [0.001, 4.2]], skin, [0, 0.55, 0], jet, [1.3, 0.9]);

      const shake = math.vector3(), last = math.vector3(), velocity = math.vector3(), before = math.vector3(), accel = math.vector3();
      const scratch = math.vector3(), axis = math.vector3(), nose = math.vector3(), up = math.vector3(), right = math.vector3();
      const spin = math.quaternion(), aim = math.quaternion(), level = math.quaternion(), prevTurn = math.quaternion(), step = math.quaternion();
      const surfaces = { roll: 0, pitch: 0, yaw: 0 };
      // The controller steers only when the phase lets it and the game runs (the pointer locked).
      let steer = false, running = false;
      const steering = (on) => {
        steer = on;
        const enabled = steer && running;
        if (world.controls.enabled !== enabled) world.controls.enabled = enabled;
      };
      const easeFrom = (next) => {
        [phase, phaseTime] = [next, 0];
        from.at.copy(camera.position);
        from.turn.copy(camera.quaternion);
      };
      function setGear(down) {
        gearDown = down;
        gear.visible = down;
      }
      function resetManeuvers() {
        prevTurn.copy(camera.quaternion);
        marks.length = 0;
        knife = 0;
      }
      function park() {
        // On the runway threshold, level, nose north (-z), the camera behind it.
        camera.quaternion.set(0, 0, 0, 1);
        camera.position.copy(PARK).sub(offset);
        jet.position.copy(PARK);
        jet.quaternion.set(0, 0, 0, 1);
        last.copy(PARK);
        velocity.set(0, 0, 0);
        [throttle, airspeed, onGround, load, prevMach] = [0, 0, true, 1, 0];
        world.controls.movementSpeed = 0;
        setGear(true);
        resetManeuvers();
      }
      function orbit(time) {
        const angle = time * 0.25;
        camera.position.set(PARK.x + Math.sin(angle) * 34, PARK.y + 7, PARK.z + Math.cos(angle) * 34);
        camera.lookAt(PARK.x, PARK.y + 1, PARK.z);
      }
      function startOver() {
        for (const ring of rings) [ring.todo.visible, ring.passed.visible] = [true, false];
        [through, started, finished, elapsed, offset, maxLoad] = [0, false, null, 0, CHASE, 1];
        [phase, phaseTime] = ['intro', 0];
        canopy.visible = true;
        steering(false);
        park();
        orbit(0);
        banner('Press Shift to start', 'Hold Shift: full throttle, then afterburner · at 150 kt, ↑ lifts off · keyboard only');
      }

      // The game runs only while the pointer is locked to the canvas: before the first click,
      // after Escape, on a lost focus or a hidden tab, the kit's `play` pauses it — the
      // controller, the simulation, the clock and the sound. It switches `enabled` on the
      // handle given here, which the phases share.
      play(
        { canvas, invalidate: () => world.invalidate(), controls: { get enabled() { return running; }, set enabled(on) { running = on; steering(steer); } } },
        {
          title: 'Click to fly',
          keys: KEY_LINE,
          onPause: () => (held.clear(), audio?.context.suspend()),
          onResume: () => (startSound(), audio?.context.resume()),
        },
      );
      startOver();

      // The keys, read before the controller sees them: W and S are the page's own (throttle and
      // air brake), so the controller's forward boost and stop never reach it — a jet in the air
      // never hangs still.
      const ownKey = (event) => (event.code === 'KeyW' || event.code === 'KeyS') && event.stopPropagation();
      addEventListener('keydown', (event) => {
        ownKey(event);
        if (!running || event.metaKey || event.ctrlKey) return;
        held.add(event.code);
        if (event.code === 'Enter' || event.code === 'NumpadEnter') startOver();
        if (event.code === 'KeyC' && phase === 'flying') {
          // The camera jumps so that the jet stays where it is.
          const other = offset === CHASE ? COCKPIT : CHASE;
          camera.position.add(scratch.copy(offset).sub(other).applyQuaternion(camera.quaternion));
          offset = other;
          canopy.visible = offset === CHASE;
        }
        if ((event.code.startsWith('Shift') || event.code === 'KeyW') && phase === 'intro') {
          easeFrom('boarding');
          banner('', 'Hold Shift to 150 kt, then ↑ to lift off');
        }
      }, true);
      addEventListener('keyup', (event) => (ownKey(event), held.delete(event.code)), true);

      // The ground under a point: a roof, the runway, the water or the terrain, and whether a
      // jet may touch down there.
      function ground(x, z) {
        for (const [bx, bz, hx, hz, top] of buildings) if (Math.abs(x - bx) < hx && Math.abs(z - bz) < hz) return [top, false];
        if (Math.abs(x) < 17 && Math.abs(z) < 550) return [0.15, true];
        if (Math.max(Math.abs(x), Math.abs(z)) > SIZE / 2) return [-Infinity, false];
        const [, height, , , up] = sample(x, z);
        return height < WATER ? [WATER, false] : [height, up > 0.97];
      }
      function crash(time) {
        [phase, crashAt] = ['crashed', time];
        steering(false);
        banner('Crashed!', 'Back to the runway…');
      }
      // A ring is flown through when the path of this frame passes close to its centre.
      function passes(centre) {
        const along = scratch.copy(jet.position).sub(last), length = along.lengthSq();
        const t = length ? clamp(axis.copy(centre).sub(last).dot(along) / length, 0, 1) : 0;
        return axis.copy(last).addScaledVector(along, t).distanceTo(centre) < HOOP - 3;
      }
      // Named manoeuvres, from the attitude history: the pitch and roll the jet has turned
      // through (its own axes, summed), its height and its heading, sampled five times a second.
      const upright = (mark) => mark.uy > 0.8 && Math.abs(mark.fy) < 0.3;
      function maneuvers({ pitch, bank }) {
        const now = { t: flightTime, pitch: cumPitch, roll: cumRoll, y: jet.position.y, fx: nose.x, fz: nose.z, fy: nose.y, uy: up.y };
        marks.push(now);
        while (marks[0].t < now.t - 20) marks.shift();
        let named = null;
        for (const mark of marks) {
          const turned = (now.pitch - mark.pitch) / deg, rolled = (now.roll - mark.roll) / deg;
          const reversed = (mark.fx * now.fx + mark.fz * now.fz) / (Math.hypot(mark.fx, mark.fz) * Math.hypot(now.fx, now.fz) || 1) < -0.7;
          if (Math.abs(turned) >= 340 && Math.abs(rolled) < 70) named = turned > 0 ? 'LOOP!' : 'OUTSIDE LOOP!';
          else if (Math.abs(rolled) >= 340) named = 'BARREL ROLL!';
          else if (upright(mark) && upright(now) && reversed && Math.abs(turned) > 140 && Math.abs(turned) < 240)
            named = now.y - mark.y > 60 ? 'IMMELMANN!' : now.y - mark.y < -60 ? 'SPLIT-S!' : null;
          if (named) break;
        }
        knife = Math.abs(Math.abs(bank) - 90) < 20 && Math.abs(pitch) < 20 ? knife + 1 : 0;
        if (knife === 12) named ??= 'KNIFE EDGE!';
        if (!named) return;
        announce(named);
        marks.length = 0;
        marks.push(now);
      }

      world.onFrame(({ delta, time }) => {
        if (!running) return;
        const dt = Math.min(delta, 0.1);
        camera.position.sub(shake);
        phaseTime += dt;
        last.copy(jet.position);
        // THE ENGINE. The throttle sets the speed the engine pulls to, past 100 % the afterburner;
        // the jet takes seconds to reach it, loses speed climbing and gains it diving, and never
        // drops below its slowest in the air. The controller cruises at that speed.
        const push = held.has('ShiftLeft') || held.has('ShiftRight') || held.has('KeyW');
        throttle = clamp(throttle + (push - held.has('KeyX')) * 0.4 * dt, 0, AB_TOP);
        const burning = throttle > 1;
        nose.set(0, 0, -1).applyQuaternion(camera.quaternion);
        up.set(0, 1, 0).applyQuaternion(camera.quaternion);
        right.set(1, 0, 0).applyQuaternion(camera.quaternion);
        if (phase === 'flying') {
          const idle = onGround ? 0 : MIN_AIR;
          const target = burning ? MIL + ((MAX_SPEED - MIL) * (throttle - 1)) / (AB_TOP - 1) : idle + (MIL - idle) * throttle;
          let pull = clamp((target - airspeed) / 4, -14, 2 + 10 * throttle);
          if (!onGround) pull -= G * nose.y;
          if (held.has('KeyS')) pull -= 20;
          airspeed = clamp(airspeed + pull * dt, idle, MAX_SPEED * 1.05);
        }
        if (Math.abs(world.controls.movementSpeed - airspeed) > 0.01) world.controls.movementSpeed = airspeed;

        if (phase === 'intro') orbit(time);
        else if (phase === 'boarding' || phase === 'returning') {
          // From wherever the camera was, it eases into the chase view behind the jet.
          const t = smooth(0, 1.6, phaseTime);
          aim.copy(jet.quaternion);
          scratch.copy(offset).applyQuaternion(aim).multiplyScalar(-1).add(jet.position);
          camera.position.lerpVectors(from.at, scratch, t);
          camera.quaternion.copy(from.turn).slerp(aim, t);
          if (t === 1) {
            [phase, phaseTime] = ['flying', 0];
            started = true;
            steering(true);
            resetManeuvers();
          }
        } else if (phase === 'crashed' && time - crashAt > 2.2) {
          park();
          banner('', 'Hold Shift to 150 kt, then ↑ to lift off');
          [phase, phaseTime] = ['flying', 0];
          steering(true);
        } else if (phase === 'flyby') {
          // Slow motion: the jet flies on at a quarter of its speed, the camera watches it pass.
          jet.position.addScaledVector(velocity, dt * 0.25);
          camera.lookAt(jet.position);
          if (phaseTime > 4.5) easeFrom('returning');
        }
        let stalling = false, floor = phase === 'flying' ? 0 : ground(jet.position.x, jet.position.z)[0];
        if (phase === 'flying') {
          // The jet where the controller put the camera, its turn eased a little behind.
          jet.position.copy(scratch.copy(offset).applyQuaternion(camera.quaternion).add(camera.position));
          jet.quaternion.slerp(camera.quaternion, offset === CHASE ? 1 - Math.exp(-dt * 12) : 1);
          // Touching the ground: roll on the runway and flat meadows, crash anywhere else, or
          // when coming down too hard, too tilted or with the wheels up.
          const lower = (by) => ((camera.position.y -= by), (jet.position.y -= by));
          let landable;
          [floor, landable] = ground(jet.position.x, jet.position.z);
          const under = jet.position.y - GEAR - floor;
          if (under < 0) {
            if (!landable || velocity.y < -7 || up.y < 0.85 || !gearDown) crash(time);
            else lower(under);
          }
          if (phase === 'flying' && onGround && airspeed < TAKEOFF) {
            // Below take-off speed a jet rolls: held on the ground, its nose eased back level.
            lower(Math.max(0, under));
            level.setFromAxisAngle(axis.set(0, 1, 0), Math.atan2(-nose.x, -nose.z));
            camera.quaternion.slerp(level, 1 - Math.exp(-dt * 8));
          } else if (phase === 'flying' && !onGround && airspeed < STALL) {
            // Too slow in the air: the wing stalls, the nose falls towards the ground and the
            // jet sinks, until the dive gives it its speed back.
            stalling = true;
            const lost = clamp((STALL - airspeed) / (STALL - MIN_AIR), 0, 1);
            axis.copy(nose).cross(scratch.set(0, -1, 0));
            if (axis.length() > 1e-3) camera.quaternion.premultiply(spin.setFromAxisAngle(axis.normalize(), 1.3 * lost * dt));
            lower(22 * lost * dt);
          }
          // The gear folds away once clear of the ground, and comes down slow and low.
          const clearance = jet.position.y - GEAR - floor;
          onGround = clearance < 0.3;
          if (gearDown && clearance > 25) (setGear(false), banner(''));
          else if (!gearDown && clearance < 80 && airspeed < 110) setGear(true);
        }
        // Velocity and g from the jet's own motion, smoothed a little.
        if (dt > 0 && phase !== 'flyby') {
          before.copy(velocity);
          velocity.lerp(scratch.copy(jet.position).sub(last).divideScalar(dt), 1 - Math.exp(-dt * 10));
          accel.copy(velocity).sub(before).divideScalar(dt);
          accel.y += G;
          load += (accel.dot(up) / G - load) * (1 - Math.exp(-dt * 4));
          if (phase === 'flying') maxLoad = Math.max(maxLoad, load);
        }
        // Rings, then the finish.
        if (phase === 'flying')
          for (const ring of rings)
            if (ring.todo.visible && passes(ring.ring.position)) {
              [ring.todo.visible, ring.passed.visible] = [false, true];
              through += 1;
              chime();
              if (through < rings.length) continue;
              finished = elapsed;
              [phase, phaseTime] = ['flyby', 0];
              steering(false);
              camera.position.copy(axis.set(34, 10, -110).applyQuaternion(jet.quaternion).add(jet.position));
              banner(clockOf(finished), 'All ten rings! Enter to fly again');
            }
        if (started && finished === null && (phase === 'flying' || phase === 'crashed')) elapsed += dt;
        // The control surfaces follow the keys: ailerons for the roll, the stabilators for the
        // pitch (and a little of the roll), the rudders for the yaw.
        const ease = 1 - Math.exp(-dt * 12);
        surfaces.roll += (held.has('KeyQ') - held.has('KeyE') - surfaces.roll) * ease;
        surfaces.pitch += (held.has('ArrowUp') - held.has('ArrowDown') - surfaces.pitch) * ease;
        surfaces.yaw += (held.has('ArrowLeft') - held.has('ArrowRight') - surfaces.yaw) * ease;
        ailerons.forEach((pivot, side) => (pivot.rotation.x = (side ? 0.35 : -0.35) * surfaces.roll));
        stabs.forEach((pivot, side) => (pivot.rotation.x = -0.3 * surfaces.pitch + (side ? 0.1 : -0.1) * surfaces.roll));
        rudders.forEach((pivot) => (pivot.rotation.y = -0.4 * surfaces.yaw));
        // Afterburner flames, stretched with the throttle and flickering; the vapour cone and the
        // boom going through Mach 1.
        const flame = burning && (phase === 'flying' || phase === 'flyby');
        flames.forEach((group, side) => {
          if (group.visible !== flame) group.visible = flame;
          if (flame) group.scale.set(1 + 0.05 * Math.sin(time * 47 + side), 1 + 0.05 * Math.sin(time * 53 + side), (0.7 + (0.3 * (throttle - 1)) / (AB_TOP - 1)) * (0.9 + 0.1 * Math.sin(time * 61 + side)));
        });
        const mach = airspeed / MACH;
        if (phase === 'flying' && prevMach < 1 && mach >= 1) (boom(), (coneAge = 0));
        prevMach = mach;
        coneAge += dt;
        if (vapourCone.visible !== coneAge < 1.4) vapourCone.visible = coneAge < 1.4;
        if (coneAge < 1.4) vapourCone.scale.setScalar(0.7 + 0.5 * (coneAge / 1.4));
        // Wing-tip trails in a hard pull: one sample every 1/30 s, the oldest shrinking away.
        if (time - lastTrail > 1 / 30) {
          lastTrail = time;
          const oldest = history.pop();
          TIPS.forEach((tip, side) => oldest.at[side].copy(tip).applyQuaternion(jet.quaternion).add(jet.position));
          oldest.turn.copy(jet.quaternion);
          history.unshift(oldest);
        }
        const streaming = phase === 'flying' && load > 4;
        trails.forEach((strips, side) =>
          strips.forEach((strip, k) => {
            if (strip.visible !== streaming) strip.visible = streaming;
            if (!streaming) return;
            strip.position.copy(history[k].at[side]);
            strip.quaternion.copy(history[k].turn);
            strip.scale.setScalar(1 - k / TRAIL);
          }),
        );
        // The turn the jet made this frame, in its own axes, for the named manoeuvres.
        const q = camera.quaternion, turn = attitude(q.x, q.y, q.z, q.w);
        if (phase === 'flying' && !onGround) {
          step.copy(prevTurn).invert().multiply(q);
          const sign = step.w < 0 ? -2 : 2;
          [cumPitch, cumRoll, flightTime] = [cumPitch + sign * step.x, cumRoll + sign * step.z, flightTime + dt];
          if (flightTime - (marks.at(-1)?.t ?? -1) >= 0.2) maneuvers(turn);
        }
        prevTurn.copy(q);
        // The head-up display, from the camera's turn and the jet's motion.
        const altitude = jet.position.y - GEAR, radar = altitude - floor, speed = velocity.length(), along = velocity.dot(nose);
        const ahead = scratch.copy(jet.position).addScaledVector(velocity, 2.5), aloft = phase === 'flying' && !onGround;
        const pullUp = aloft && velocity.y < -5 && radar / -velocity.y < 5;
        const terrainAhead = aloft && !gearDown && ground(ahead.x, ahead.z)[0] > ahead.y - GEAR - 15;
        const outside = Math.max(Math.abs(jet.position.x), Math.abs(jet.position.z)) > 2450;
        drawHud({
          ...turn,
          speed: phase === 'flying' ? airspeed : speed,
          altitude,
          radar,
          mach,
          marker: speed > 5 && along > 0 ? [Math.atan2(velocity.dot(right), along) / deg, -Math.atan2(velocity.dot(up), along) / deg] : null,
          alert: pullUp ? 'PULL UP' : stalling ? 'STALL' : terrainAhead ? 'TERRAIN' : outside ? 'TURN BACK' : '',
          clock: clockOf(finished ?? elapsed),
        });
        sound(phase === 'flying' ? airspeed : speed, burning, pullUp || stalling || terrainAhead, time);
        // The sense of speed: a wider view the faster the jet goes and a kick in afterburner, a
        // light shake at high speed or rolling on the runway — taken back out before the
        // controller reads the pose.
        const fov = phase === 'flyby' ? 38 : 62 + 10 * Math.min(1, airspeed / MAX_SPEED) + (burning ? 6 : 0);
        camera.fov += (fov - camera.fov) * (1 - Math.exp(-dt * 3));
        const rolling = onGround ? 0.04 * Math.min(1, airspeed / 40) : 0;
        const rough = phase === 'flying' ? 0.05 * smooth(250, 410, airspeed) + (burning ? 0.03 : 0) + rolling : 0;
        shake.set(Math.sin(time * 37) * rough, Math.sin(time * 43 + 1) * rough, 0).applyQuaternion(camera.quaternion);
        camera.position.add(shake);
        world.invalidate();
      });
    </script>
  </body>
</html>
