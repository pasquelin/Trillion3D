<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A fighter jet in the canyon</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f6c592;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      /* The head-up display: thin green lines and figures, glowing a little. */
      #hud {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        fill: none;
        stroke: #3cff7a;
        stroke-width: 1.4;
        color: #3cff7a;
        font: 400 15px/1 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        letter-spacing: 0.04em;
        filter: drop-shadow(0 0 2px #3cff7aaa);
      }
      #hud text {
        fill: currentColor;
        stroke: none;
      }
      #hud .box {
        fill: #00140a;
        fill-opacity: 0.45;
      }
      #hud .small {
        font-size: 13px;
      }
      #hud .big {
        font-size: 24px;
        letter-spacing: 0.12em;
      }
      #hud .blink {
        animation: blink 0.5s steps(2) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.15;
        }
      }
      /* The cockpit's screens: flat pictures laid over the screens of the panel each frame. */
      canvas.mfd {
        position: fixed;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        pointer-events: none;
        display: none;
      }
      /* Past the pilot's 9 g, the view reddens from its edges. */
      #redout {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(ellipse at center, #0000 35%, #a0000c 100%);
      }
      /* The test mode says so, big and red, so no player mistakes it for a broken mouse lock. */
      #testmode {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 16px;
        border-radius: 6px;
        background: #c8102e;
        color: #fff;
        font: 600 15px/1.2 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.04em;
        pointer-events: none;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="redout" data-hud data-example-overlay></div>
    <svg id="hud" data-hud data-example-overlay></svg>
    <div id="testmode" data-example-overlay hidden data-words="testMode"></div>
    <script type="module">
      import { createWorld, geometry, material, object, light, math, buffer } from '../runtime/engine.js';
      import { announce, ease, isCapture, play, seeded, stats, whiteNoise, words } from '../runtime/kit.js';
      const say = words();

      // MOUSE AIM, as PC flight games fly: the mouse moves an aim circle through the sky, not the
      // jet; an instructor turns the jet onto it — bank towards it, pull, level the wings — by
      // setting the stick inputs of the engine's own `fly` controller each step, which turns the
      // jet at its rates and cruises it forward (`autoForward`) at the airspeed the page computes.
      // In Expert there is no instructor: the mouse is the stick. The page adds the physics the
      // controller does not know: thrust, gravity along the path, the stall, the runway, the
      // gear, the crash.
      const world = createWorld('view', { controls: 'fly' });
      const HORIZON = '#f6c592';
      world.scene.background = math.color(HORIZON);
      const camera = world.camera, canvas = document.getElementById('view');
      [camera.near, camera.far, camera.fov] = [0.5, 12000, 62];
      Object.assign(world.controls, { pointerLook: false, autoForward: true, movementSpeed: 0, inputResponse: 0.08 });

      const deg = Math.PI / 180;
      // The kit's smoothstep, from `a` to `b` instead of 0 to 1.
      const smooth = (a, b, x) => ease.smooth((x - a) / (b - a));
      // A seeded sequence (the kit's `seeded`): the same valley on every run.
      const next = seeded(7);
      // THE CANYON: a gorge on an arc of 1100 m around (1100, -600), from just north of the
      // runway round the north-eastern peaks and back into the valley in the south-east. It is
      // cut into the terrain, so the walls are the mountains themselves.
      const GORGE = { x: 1100, z: -600, r: 1100, floor: 18, from: -10 * deg, to: 285 * deg };
      const gorgeAt = (a) => [GORGE.x - GORGE.r * Math.cos(a), GORGE.z - GORGE.r * Math.sin(a)];
      function gorgeDistance(x, z) {
        const dx = x - GORGE.x, dz = z - GORGE.z;
        let a = Math.atan2(-dz, -dx);
        if (a < GORGE.from) a += 2 * Math.PI;
        if (a <= GORGE.to) return Math.abs(Math.hypot(dx, dz) - GORGE.r);
        return Math.min(...[GORGE.from, GORGE.to].map((end) => Math.hypot(x - gorgeAt(end)[0], z - gorgeAt(end)[1])));
      }
      // THE VALLEY, in metres. A long flat floor with the runway and the town levelled, a river
      // winding through it, and a ring of peaks — ridges, shoulders and summits stacked — around.
      const riverX = (z) => 170 + 80 * Math.sin(z / 300);
      const RUNWAY = [-30, 30, -560, 560], TOWN = [300, 720, -680, -120], WATER = -2.5, SIZE = 5400;
      const levelled = (x, z, [x0, x1, z0, z1]) => 1 - smooth(0, 80, Math.hypot(Math.max(x0 - x, 0, x - x1), Math.max(z0 - z, 0, z - z1)));
      const PEAKS = Array.from({ length: 18 }, (_, index) => {
        const angle = (index / 18) * Math.PI * 2 + next() * 0.3, far = 1650 + next() * 650;
        return [Math.sin(angle) * far, Math.cos(angle) * far * 1.3, 260 + next() * 420, 170 + next() * 220];
      });
      function terrain(x, z) {
        const around = Math.atan2(x, z), rise = smooth(950, 2050, Math.hypot(x, z / 1.3));
        let height = rise * (330 + 120 * Math.sin(3 * around + 1) + 90 * Math.sin(7 * around + 2));
        height += rise * 45 * Math.sin(x / 97 + Math.sin(z / 140)) * Math.sin(z / 83 + 1);
        for (const [px, pz, top, width] of PEAKS) height += top * Math.exp(-((x - px) ** 2 + (z - pz) ** 2) / width ** 2);
        const floor = (1 - rise) * (1 - Math.max(levelled(x, z, RUNWAY), levelled(x, z, TOWN)));
        height += floor * (3 + 5 * Math.sin(x / 210) * Math.sin(z / 260));
        const cut = 1 - smooth(55, 200, gorgeDistance(x, z));
        height += (Math.min(height, GORGE.floor) - height) * cut;
        return height - (1 - rise) * 7 * Math.exp(-(((x - riverX(z)) / 38) ** 2));
      }
      // A point of the terrain with its normal, from the slope.
      const sample = (x, z) => {
        const nx = (terrain(x - 4, z) - terrain(x + 4, z)) / 8, nz = (terrain(x, z - 4) - terrain(x, z + 4)) / 8, length = Math.hypot(nx, 1, nz);
        return [x, terrain(x, z), z, nx / length, 1 / length, nz / length];
      };
      // The course: ten rings down the canyon, one every 30° of its arc.
      const COURSE = Array.from({ length: 10 }, (_, index) => {
        const [x, z] = gorgeAt(index * 30 * deg);
        return [Math.round(x), [60, 62, 65, 68, 70, 70, 68, 68, 72, 85][index], Math.round(z)];
      });
      const HOOP = 30;
      // The ground under a point: a roof, the runway, the water or the terrain, and whether a
      // jet may touch down there. Off the map there is none.
      function groundAt(x, z, roofs = []) {
        for (const [bx, bz, hx, hz, top] of roofs) if (Math.abs(x - bx) < hx && Math.abs(z - bz) < hz) return [top, false];
        if (Math.abs(x) < 17 && Math.abs(z) < 550) return [0.15, true];
        if (Math.max(Math.abs(x), Math.abs(z)) > SIZE / 2) return [-Infinity, false];
        const [, height, , , up] = sample(x, z);
        return height < WATER ? [WATER, false] : [height, up > 0.97];
      }
      const G = 9.81, GEAR = 1.95;
      // Speeds in metres per second: the slowest a flying jet goes, where the wing stalls, where
      // it lifts off, what idle holds in the air, full military power, full afterburner, Mach 1.
      const MIN_AIR = 50, STALL = 72, ROTATE = 78, IDLE_AIR = 60, MIL = 280, AB_SPEED = 400, MACH = 340;
      // Turn rates at full stick: a fighter rolls fast, pitches hard and barely yaws.
      const PITCH_RATE = 80 * deg, ROLL_RATE = 240 * deg, YAW_RATE = 20 * deg, GROUND_YAW = 12 * deg;
      // Loads: the airframe holds 12 g, a pilot 9 g before the red-out. The wing lifts the weight
      // exactly at the stall speed, and with the square of the speed above it; the corner speed
      // is where it first gives the pilot's 9 g. A wheel touching down faster than 6 m/s breaks.
      const MAX_G = 12, PILOT_G = 9, liftG = (v) => (v / STALL) ** 2, CORNER = STALL * Math.sqrt(PILOT_G), HARD = 6;
      // ARCADE: the aim never strays past 35° from the nose; the instructor banks at most 70°,
      // rolls at most 120°/s so the view never whips, levels the wings within 2° of the aim, and
      // pulls up by itself 15 m over the ground. The nose closes on the aim, and the bank on the
      // one the turn needs, as first-order lags: no overshoot to damp.
      const ARCADE = { cone: 35 * deg, bank: 70 * deg, roll: 120 * deg, level: 2 * deg, floor: 15, nose: 0.45, wings: 0.3 };
      // EXPERT: the mouse's speed is the stick's, and the stick centres over a few frames.
      const STICK_CENTRE = 0.15;
      // How much the controls bite: little near the stall, fully from 150 m/s.
      const authority = (v) => 0.25 + 0.75 * smooth(MIN_AIR, 150, v);
      // The load the stick may ask for: in Arcade what the wing gives, up to the pilot's limit —
      // never a stall; in Expert the airframe's limit, the wing stalling past what it gives.
      const loadCap = (S, expert) => (expert ? MAX_G : math.clamp(liftG(S.v), 1, PILOT_G));
      const pitchLimit = (S, expert) => (S.onGround ? 10 * deg : Math.min(PITCH_RATE * authority(S.v), (loadCap(S, expert) * G) / Math.max(S.v, 1)) * (expert ? S.soft : 1));
      // Quaternions as [x, y, z, w], the engine's order; a turn `b` after `a` is `qmul(a, b)`.
      const qmul = (a, b) => [
        a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
        a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
        a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
        a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2],
      ];
      const qaxis = (x, y, z, angle) => [x * Math.sin(angle / 2), y * Math.sin(angle / 2), z * Math.sin(angle / 2), Math.cos(angle / 2)];
      const qconj = ([x, y, z, w]) => [-x, -y, -z, w];
      const qnorm = (q) => q.map((v) => v / Math.hypot(...q));
      const qblend = (a, b, t) => qnorm(a.map((v, i) => v + ((a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3] < 0 ? -b[i] : b[i]) - v) * t));
      function rotate([x, y, z, w], [vx, vy, vz]) {
        const tx = 2 * (y * vz - z * vy), ty = 2 * (z * vx - x * vz), tz = 2 * (x * vy - y * vx);
        return [vx + w * tx + y * tz - z * ty, vy + w * ty + z * tx - x * tz, vz + w * tz + x * ty - y * tx];
      }
      const wrap = (angle) => angle - 2 * Math.PI * Math.round(angle / (2 * Math.PI));
      const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
      // The attitude read off the axes, in radians: no angle is integrated, so it holds upside
      // down and through the vertical. Bank is positive with the right wing down.
      function attitude(q) {
        const forward = rotate(q, [0, 0, -1]), up = rotate(q, [0, 1, 0]), right = rotate(q, [1, 0, 0]);
        return {
          forward, up, right,
          pitch: Math.asin(math.clamp(forward[1], -1, 1)),
          bank: Math.atan2(-right[1], up[1]),
          heading: (Math.atan2(forward[0], -forward[2]) + 2 * Math.PI) % (2 * Math.PI),
        };
      }
      const level = (heading, pitch = 0) => qmul(qaxis(0, 1, 0, -heading), qaxis(1, 0, 0, pitch));
      function createFlight() {
        return {
          pos: [0, 0, 0], q: [0, 0, 0, 1], aim: [0, 0, 0, 1], v: 0, throttle: 0, burner: false, braking: false,
          onGround: true, gearDown: true, stalling: false, crashed: false, load: 1, vel: [0, 0, 0], rates: [0, 0, 0],
          stick: [0, 0, 0], rest: 0, lookYaw: 0, lookPitch: 0, mouseX: 0, mouseY: 0,
          virtual: [0, 0], soft: 1, dropSide: 1, ownThrottle: false, pullUp: false, climb: 0,
        };
      }
      // On the runway's southern threshold, nose north (-z), engine idle.
      const park = (S) => Object.assign(S, createFlight(), { pos: [0, 0.15 + GEAR, 480] });
      // In the air at `at`, level towards `toward`, cruising: where a crash sends the jet back to.
      function launch(S, at, toward, speed) {
        const q = level(Math.atan2(toward[0] - at[0], at[2] - toward[2]));
        Object.assign(S, createFlight(), { pos: at.slice(), q, aim: q, v: speed, throttle: 0.6, onGround: false, gearDown: false });
        S.vel = rotate(q, [0, 0, -speed]);
      }
      // The mouse moves the aim: sideways about the vertical while the aim is upright, about its
      // own up axis once over the top, and up and down about its own right axis — so the circle
      // always goes the way the hand does, and pushing on through the zenith flies a loop. It
      // never strays past the cone around the nose: a big move asks for a hard turn, not an
      // impossible one. At rest it drifts gently back onto the nose, and rolls upright.
      function aimBy(S, dx, dy, dt) {
        const upright = rotate(S.aim, [0, 1, 0])[1] > 0.2;
        S.aim = upright ? qmul(qaxis(0, 1, 0, -dx), S.aim) : qmul(S.aim, qaxis(0, 1, 0, -dx));
        S.aim = qnorm(qmul(S.aim, qaxis(1, 0, 0, -dy)));
        const nose = rotate(S.q, [0, 0, -1]), aim = rotate(S.aim, [0, 0, -1]), off = Math.acos(math.clamp(dot(nose, aim), -1, 1));
        const back = off > ARCADE.cone ? off - ARCADE.cone : S.rest > 0.5 ? off * (1 - Math.exp(-dt / 2)) : 0;
        const axis = [aim[1] * nose[2] - aim[2] * nose[1], aim[2] * nose[0] - aim[0] * nose[2], aim[0] * nose[1] - aim[1] * nose[0]], length = Math.hypot(...axis);
        if (back > 0 && length > 1e-9) S.aim = qnorm(qmul(qaxis(...axis.map((v) => v / length), back), S.aim));
        const { pitch, bank } = attitude(S.aim);
        if (Math.abs(pitch) < 60 * deg && (upright || S.rest > 0.5)) S.aim = qnorm(qmul(S.aim, qaxis(0, 0, 1, bank * (1 - Math.exp(-dt * 3)))));
      }
      // THE INSTRUCTOR (Arcade): the stick that brings the nose onto the aim. The nose turns about
      // the axis from it to the aim at a rate proportional to the angle, split into pitch and yaw;
      // the wings bank to what that turn needs — the bank whose lift turns the path at the rate
      // the heading error asks, within the wing's load and 70° — and level within 2° of the aim.
      function instructor(S) {
        const [x, y, z] = rotate(qconj(S.q), rotate(S.aim, [0, 0, -1]));
        const off = Math.acos(math.clamp(-z, -1, 1)), { bank, pitch: climb, heading } = attitude(S.q), a = authority(S.v);
        const across = Math.hypot(x, y) || 1, rate = off / ARCADE.nose, aimed = attitude(S.aim);
        const pitch = math.clamp((rate * y) / across / pitchLimit(S, false), -0.5, 1);
        const yaw = math.clamp((-rate * x) / across / (YAW_RATE * a), -1, 1);
        // Near the vertical the heading means nothing: the bank is held and the pitch flies the loop.
        let wanted = bank;
        if (Math.abs(climb) < 60 * deg && Math.abs(aimed.pitch) < 75 * deg) {
          const most = Math.min(ARCADE.bank, Math.acos(1 / loadCap(S, false))), turn = wrap(aimed.heading - heading) / ARCADE.nose;
          wanted = math.clamp(Math.atan((S.v * turn) / G), -most, most) * smooth(ARCADE.level, 3 * ARCADE.level, off);
        }
        return [pitch, yaw, math.clamp(-wrap(wanted - bank) / ARCADE.wings / Math.min(ROLL_RATE * a, ARCADE.roll), -1, 1)];
      }
      // The stick for this step, signed as the controller's keys are: nose up, left, left. Arcade:
      // the mouse moves the aim and the instructor flies onto it. Expert: the mouse is the stick.
      function steer(S, input, dt) {
        const keys = input.keys, key = (code) => (keys.has(code) ? 1 : 0), expert = input.mode === 'expert';
        const k = input.perPx * input.sensitivity * (input.precision ? 0.4 : 1), dx = S.mouseX * k, dy = S.mouseY * k * (input.invert ? -1 : 1);
        S.mouseX = S.mouseY = 0;
        S.rest = dx || dy ? 0 : S.rest + dt;
        // Looking around: the mouse turns the head, the jet holds its stick.
        if (input.freeLook) {
          S.lookYaw = math.clamp(S.lookYaw - dx, -2.8, 2.8);
          S.lookPitch = math.clamp(S.lookPitch - dy, -1.3, 1.3);
        } else [S.lookYaw, S.lookPitch] = [S.lookYaw, S.lookPitch].map((angle) => angle * Math.exp(-dt * 5));
        const [mx, my] = input.freeLook ? [0, 0] : [dx, dy];
        let stick;
        if (expert) {
          // The mouse's speed is the pitch rate, three times it the roll rate.
          const fade = Math.exp(-dt / STICK_CENTRE), reach = [pitchLimit(S, true), ROLL_RATE * authority(S.v)];
          S.virtual = [math.clamp(S.virtual[0] * fade - my / STICK_CENTRE / reach[0], -1, 1), math.clamp(S.virtual[1] * fade - (3 * mx) / STICK_CENTRE / reach[1], -1, 1)];
          S.aim = S.q.slice();
          stick = [S.virtual[0], 0, math.clamp(S.virtual[1] + key('KeyA') - key('KeyD'), -1, 1)];
        } else {
          aimBy(S, mx, my, dt);
          // Too near the ground and not landing: the aim is taken up, wings level (`physics`).
          if (S.pullUp) S.aim = level(attitude(S.q).heading, S.climb);
          stick = instructor(S);
          const roll = key('KeyA') - key('KeyD');
          if (roll) stick = [0, 0, roll]; // The instructor lets go while the player rolls.
        }
        stick[1] = math.clamp(stick[1] + key('KeyQ') - key('KeyE'), -1, 1);
        if (S.onGround) stick = [S.v >= ROTATE ? math.clamp(stick[0], 0, 0.6) : 0, key('KeyQ') - key('KeyE'), 0];
        return (S.stick = stick);
      }
      // The ground's normal under a point, from its slope; a roof's edge reads as a wall.
      function groundNormal(ground, x, z) {
        const h = (dx, dz) => ground(x + dx, z + dz)[0], nx = (h(-2, 0) - h(2, 0)) / 4, nz = (h(0, -2) - h(0, 2)) / 4;
        return Number.isFinite(nx + nz) ? [nx, 1, nz].map((v) => v / Math.hypot(nx, 1, nz)) : [0, 1, 0];
      }
      // What the controller does not know: engine and gravity along the path, the stall, the
      // ground, the gear, and the load the turn puts on the pilot.
      function physics(S, input, dt, ground, from, before) {
        const keys = input.keys, expert = input.mode === 'expert', turn = qmul(qconj(before), S.q), s = (turn[3] < 0 ? -2 : 2) / dt;
        S.rates = [turn[0] * s, turn[1] * s, turn[2] * s];
        const pushed = (keys.has('KeyW') ? 1 : 0) - (keys.has('KeyS') ? 1 : 0);
        S.ownThrottle ||= Boolean(pushed) && !S.onGround;
        S.throttle = math.clamp(S.throttle + pushed * 0.6 * dt, 0, 1);
        S.burner = keys.has('ShiftLeft') || keys.has('ShiftRight');
        S.braking = keys.has('Space');
        // Arcade, until the player touches the throttle in the air: a helper holds the corner speed.
        if (!expert && !S.onGround && !S.ownThrottle && !S.burner) {
          const wanted = math.clamp((2 * CORNER - IDLE_AIR - S.v) / (MIL - IDLE_AIR), 0, 1);
          S.throttle += (wanted - S.throttle) * (1 - Math.exp(-dt));
        }
        // The stall (Expert): too slow, or asking the wing for more load than it gives. The nose
        // falls about the horizontal line across it, a wing drops, the jet sinks, and rudder held
        // into it winds the stall into a spin — until the dive gives the speed back.
        const demand = (Math.abs(S.rates[0]) * S.v) / G;
        const lost = S.onGround || !expert ? 0 : math.clamp(Math.max((STALL - S.v) / (STALL - MIN_AIR), demand / liftG(S.v) - 1), 0, 1);
        if (lost && !S.stalling) S.dropSide = S.rates[2] > 0 ? 1 : -1;
        S.stalling = lost > 0;
        const nose = attitude(S.q).forward, across = Math.hypot(nose[0], nose[2]);
        if (S.stalling) {
          if (across > 1e-3 && nose[1] > -0.8) S.q = qnorm(qmul(qaxis(nose[2] / across, 0, -nose[0] / across, 1.2 * (0.35 + lost) * dt), S.q));
          S.q = qnorm(qmul(S.q, qaxis(0, 0, 1, S.dropSide * 1.5 * lost * dt)));
          if (Math.abs(S.stick[1]) > 0.5 && lost > 0.5) S.q = qnorm(qmul(qaxis(0, 1, 0, Math.sign(S.stick[1]) * 2 * lost * dt), qmul(S.q, qaxis(0, 0, 1, Math.sign(S.stick[1]) * 2 * lost * dt))));
          S.pos[1] -= 16 * lost * dt;
        }
        // Past the pilot's limit the stick softens in the ratio he is over it.
        S.soft = PILOT_G / Math.max(PILOT_G, S.load);
        // The engine pulls towards the speed its throttle sets; a climb costs speed, a dive
        // gives it, a hard turn bleeds it, the air brake takes it. It never hovers, and in Arcade
        // it never falls under the lift-off speed.
        const idle = S.onGround ? 0 : IDLE_AIR, target = S.burner ? AB_SPEED : idle + (MIL - idle) * S.throttle;
        let accel = math.clamp((target - S.v) / 3.5, -10, 5 + 11 * S.throttle + (S.burner ? 12 : 0));
        if (!S.onGround) accel -= G * attitude(S.q).forward[1] + 1.2 * Math.max(0, S.load - 2);
        if (S.braking) accel -= S.onGround ? 15 : 30;
        S.v = math.clamp(S.v + accel * dt, S.onGround ? 0 : expert ? MIN_AIR : ROTATE, AB_SPEED * 1.1);
        // Touching the ground: roll on the runway and flat meadows with the wheels down, gently
        // and upright. Anything else is a crash in Expert; Arcade forgives what is no hard
        // impact — the jet scrapes along and the instructor climbs away. On the ground the jet
        // stays level until it has the speed to lift its nose.
        const [floor, landable] = ground(S.pos[0], S.pos[2]), agl = S.pos[1] - GEAR - floor, sink = (from[1] - S.pos[1]) / dt;

        rumble.gain.setTargetAtTime(S.burner ? 0.6 : 0.12 * power, now, 0.15);
        band.frequency.setTargetAtTime(300 + S.v * 3, now, 0.2);
        wind.gain.setTargetAtTime(Math.min(0.3, (S.v / 250) ** 2 * 0.3), now, 0.2);
        hornGain.gain.setTargetAtTime(horn && (time * 4) % 1 < 0.5 ? 0.06 : 0, now, 0.01);
      }

      // THE GAME. `S` is the jet, `pilot` what the player holds; the view is the cockpit or the
      // exterior, whose camera follows the aim so the jet is seen catching up with it. The mouse
      // turns the aim by the view's own measure — the screen's width is the field of view — at
      // Medium; Low and High take 0.6 and 1.6 of it, and the right button held 0.4 for fine aim.
      const S = createFlight();
      const pilot = { keys: new Set(), sensitivity: 1, invert: false, mode: 'arcade', freeLook: false, precision: false, perPx: 0 };
      const SENSITIVITY = { Low: 0.6, Medium: 1, High: 1.6 };
      let view = 'cockpit', chosenView = 'cockpit', phase = 'flying', crashTime = 0, passedCount = 0, lastRing = null, fuel = FUEL;
      let airborne = false, elapsed = 0, finished = null, time = 0, zoom = 22, prevMach = 0, coneAge = Infinity, lastTrail = 0, headYaw = 0;
      let chaseTurn = [0, 0, 0, 1];
      function restart() {
        for (const ring of rings) [ring.done, ring.todo.visible, ring.passed.visible] = [false, true, false];
        [passedCount, lastRing, airborne, elapsed, finished, phase, fuel] = [0, null, false, 0, null, 'flying', FUEL];
        park(S);
        chaseTurn = S.aim.slice();
        banner('');
        world.invalidate();
      }
      function respawn() {
        const ahead = rings.findIndex((ring) => !ring.done);
        if (lastRing === null) park(S);
        else launch(S, COURSE[lastRing], COURSE[ahead < 0 ? (lastRing + 1) % COURSE.length : ahead], 170);
        chaseTurn = S.aim.slice();
        phase = 'flying';
        banner('');
      }
      function flyThrough(from) {
        rings.forEach((ring, index) => {
          if (ring.done || !passes(from, S.pos, ring.centre, HOOP - 3)) return;
          [ring.done, ring.todo.visible, ring.passed.visible] = [true, false, true];
          [passedCount, lastRing] = [passedCount + 1, index];
          chime();
          if (passedCount === rings.length) {
            finished = elapsed;
            banner(say('complete'), say('flyAgain', { time: clockOf(finished) }));
          }
        });
      }
      // Where the exterior camera stands before the first Play: three-quarters ahead of the jet
      // waiting on the runway.
      function menuShot() {
        camera.position.set(S.pos[0] - 16, S.pos[1] + 3.5, S.pos[2] - 20);
        camera.lookAt(S.pos[0], S.pos[1] + 0.5, S.pos[2]);
      }
      // A capture shows the jet's own default view instead: parked in the seat, looking down the
      // nose a little, as `present` would draw the cockpit view at rest.
      function cockpitShot() {
        jet.visible = false;
        cockpit.visible = fill.visible = true;
        const eye = S.pos.map((p, i) => p + rotate(S.q, EYE)[i]);
        cockpit.position.set(...eye);
        cockpit.quaternion.set(...S.q);
        camera.position.set(...eye);
        camera.quaternion.set(...qmul(S.q, qaxis(1, 0, 0, -LOOK_DOWN)));
        [camera.near, camera.fov] = [COCKPIT_NEAR, COCKPIT_FOV];
      }
      restart();
      if (isCapture(document)) cockpitShot();
      else menuShot();

      // The keys the page reads by their place on the keyboard (`KeyboardEvent.code`), so an
      // AZERTY keyboard flies the same. They are taken before the controller sees them: its
      // own keys would slide, rise and turn the jet outside the flight model.
      const OWN = new Set(['KeyW', 'KeyS', 'KeyA', 'KeyD', 'KeyQ', 'KeyE', 'KeyR', 'KeyF', 'KeyV', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
      for (const type of ['keydown', 'keyup'])
        addEventListener(type, (event) => {
          if (OWN.has(event.code)) event.stopPropagation();
          if (type === 'keyup') return void pilot.keys.delete(event.code);
          if (free && event.code === 'Escape') return freeRelease();
          if (!game.running || event.metaKey || event.ctrlKey) return;
          if (event.code === 'Space') event.preventDefault();
          if (event.repeat) return;
          pilot.keys.add(event.code);
          if (event.code === 'KeyC') setView(view === 'cockpit' ? 'exterior' : 'cockpit');
          if (event.code === 'KeyR') restart();
        }, true);
      // The mouse: its motion under the lock (`movementX/Y`), summed until the next step.
      addEventListener('mousemove', (event) => {
        if (!game.running) return;
        S.mouseX += math.clamp(event.movementX, -250, 250);
        S.mouseY += math.clamp(event.movementY, -250, 250);
      });
      addEventListener('wheel', (event) => game.running && (zoom = math.clamp(zoom * Math.exp(event.deltaY * 0.001), 12, 70)), { passive: true });
      // The right button held: fine aim. Its menu never opens while playing.
      for (const type of ['mousedown', 'mouseup']) addEventListener(type, (event) => event.button === 2 && (pilot.precision = type === 'mousedown' && game.running));
      addEventListener('contextmenu', (event) => game.running && event.preventDefault());
      function setView(next) {
        view = next;
        chaseTurn = S.aim.slice();
      }

      // TEST MODE, `?input=free`, served from this machine only — a loopback address or a name
      // with no domain: an automated browser cannot be granted a pointer lock, so Play "locks"
      // nothing and the mouse's plain `mousemove` deltas steer instead; Escape pauses. A red
      // banner says so while it is on. A player never needs it; it changes nothing else.
      const loopback = /^(127(\.\d+){3}|\[::1\])$/.test(location.hostname) || !location.hostname.includes('.');
      const free = new URLSearchParams(location.search).get('input') === 'free' && loopback;
      document.getElementById('testmode').hidden = !free;
      let freeHeld = false;
      const lockWatchers = [];
      const freeDoc = {
        get pointerLockElement() {
          return freeHeld ? freeCanvas : null;
        },
        get hidden() {
          return document.hidden;
        },
        defaultView: window,
        addEventListener: (type, listener) => (type === 'pointerlockchange' ? lockWatchers.push(listener) : document.addEventListener(type, listener)),
      };
      const freeCanvas = { isConnected: true, ownerDocument: freeDoc, requestPointerLock: () => ((freeHeld = true), lockWatchers.forEach((watch) => watch({}))) };
      const freeRelease = () => ((freeHeld = false), lockWatchers.forEach((watch) => watch({})));

      // The menu: Play locks the mouse; Escape, a lost focus or a hidden tab pauses behind it.
      const game = play(
        { canvas: free ? freeCanvas : canvas, controls: world.controls, invalidate: () => world.invalidate() },
        {
          keys: [
            { action: 'aim', keys: ['Mouse'] },
            { action: 'fineAim', keys: ['Right button'] },
            { action: 'throttle', keys: ['W', 'S'], azerty: ['Z', 'S'] },
            { action: 'afterburner', keys: ['Shift'] },
            { action: 'roll', keys: ['A', 'D'], azerty: ['Q', 'D'] },
            { action: 'rudder', keys: ['Q', 'E'], azerty: ['A', 'E'] },
            { action: 'airBrake', keys: ['Space'] },
            { action: 'lookAround', keys: ['V'] },
            { action: 'view', keys: ['C'] },
            { action: 'zoom', keys: ['Wheel'] },
            { action: 'startOver', keys: ['R'] },
            { action: 'pause', keys: ['Esc'] },
          ],
          options: [
            { id: 'view', choices: ['cockpit', 'exterior'] },
            { id: 'mode', choices: ['arcade', 'expert'] },
            { id: 'sensitivity', choices: Object.keys(SENSITIVITY), value: 'Medium' },
            { id: 'invert', choices: ['off', 'on'] },
            { id: 'sound', choices: ['on', 'off'] },
          ],
          onStart: () => setView(chosenView),
          onPause() {
            pilot.keys.clear();
            void audio?.context.suspend();
          },
          onResume() {
            startSound();
            void audio?.context.resume();
          },
          onRestart: restart,
          onOption(id, value) {
            if (id === 'view') setView((chosenView = value));
            if (id === 'mode') pilot.mode = value;
            if (id === 'sensitivity') pilot.sensitivity = SENSITIVITY[value];
            if (id === 'invert') pilot.invert = value === 'on';
            if (id === 'sound') muted = value === 'off';
            if (audio) audio.out.gain.value = muted ? 0 : 0.8;
          },
        },
        free ? freeDoc : document,
      );
      stats(world, 'top-left');

      // THE STEP. The flight takes the controller's step from the world and runs it just before
      // the frame is drawn, so the jet, the cockpit, the camera and the display are placed on the
      // pose about to be drawn, never a frame late. The controller integrates the jet's pose, then
      // the camera is moved to the view.
      world.controls.autoUpdate = false;
      world.beforeFrame(({ delta }) => {
        const dt = Math.min(delta, 0.05);
        if (!game.running) return world.controls.update(delta);
        time += dt;
        pilot.freeLook = pilot.keys.has('KeyV');
        if (phase === 'flying') {
          const from = advance(S, (step) => world.controls.update(step), world.controls, camera, pilot, dt, ground);
          if (S.crashed) [phase, crashTime] = ['crashed', 0];
          else if (from) flyThrough(from);
          airborne ||= !S.onGround;
        } else if ((crashTime += dt) > 1.6) respawn();
        if (airborne && finished === null) elapsed += dt;
        present(dt);
      });
      world.onFrame(() => game.running && world.invalidate());
      const redout = document.getElementById('redout');
      let reddened = '0';

      // Everything the step shows: the jet and its surfaces, the cockpit and its screens, the
      // effects, the camera for the view, the display, the sound.
      function present(dt) {
        const cockpitView = view === 'cockpit';
        jet.visible = !cockpitView && phase === 'flying';
        cockpit.visible = cockpitView && phase === 'flying';
        if (fill.visible !== cockpit.visible) fill.visible = cockpit.visible;
        jet.position.set(...S.pos);
        jet.quaternion.set(...S.q);
        const eye = S.pos.map((p, i) => p + rotate(S.q, EYE)[i]);
        cockpit.position.set(...eye);
        cockpit.quaternion.set(...S.q);
        gear.visible = S.gearDown;
        const [pitchStick, yawStick, rollStick] = S.stick;
        ailerons.forEach((pivot, side) => (pivot.rotation.x = (side ? 0.35 : -0.35) * rollStick));
        stabs.forEach((pivot, side) => (pivot.rotation.x = -0.3 * pitchStick + (side ? 0.1 : -0.1) * rollStick));
        rudders.forEach((pivot) => (pivot.rotation.y = -0.4 * yawStick));
        flames.forEach((flame, side) => {
          if (flame.visible !== S.burner) flame.visible = S.burner;
          if (S.burner) flame.scale.set(1 + 0.05 * Math.sin(time * 47 + side), 1 + 0.05 * Math.sin(time * 53 + side), 0.9 + 0.1 * Math.sin(time * 61 + side));
        });
        const mach = S.v / MACH;
        if (prevMach < 1 && mach >= 1) (boom(), (coneAge = 0));
        prevMach = mach;
        coneAge += dt;
        if (vapourCone.visible !== coneAge < 1.4) vapourCone.visible = coneAge < 1.4;
        if (coneAge < 1.4) vapourCone.scale.setScalar(0.7 + 0.5 * (coneAge / 1.4));
        // Wing-tip vapour in a hard pull: a sample every 1/30 s, the oldest shrinking away.
        if (time - lastTrail > 1 / 30) {
          lastTrail = time;
          const oldest = history.pop();
          TIPS.forEach((tip, side) => (oldest.at[side] = S.pos.map((p, i) => p + rotate(S.q, tip)[i])));
          oldest.turn = S.q.slice();
          history.unshift(oldest);
        }
        const streaming = phase === 'flying' && S.load > 5;
        trails.forEach((strips, side) =>
          strips.forEach((strip, k) => {
            if (strip.visible !== streaming) strip.visible = streaming;
            if (!streaming) return;
            strip.position.set(...history[k].at[side]);
            strip.quaternion.set(...history[k].turn);
            strip.scale.setScalar(1 - k / TRAIL);
          }),
        );
        // The cockpit's moving parts: the throttle swings forward with the power and on into
        // the afterburner detent, the stick tilts with the pitch and roll it asks for (back
        // further than forward, as a stick travels), the backup gauges read speed, altitude,
        // load and fuel.
        seat.throttle.rotation.x = 0.35 - 0.6 * S.throttle - (S.burner ? 0.2 : 0);
        const [tiltX, tiltZ] = stickTilt(S.stick);
        seat.stick.rotation.set(tiltX, 0, tiltZ);
        const knots = S.v * KT, feet = (S.pos[1] - GEAR) * FT;
        [math.clamp(knots / 800, 0, 1) * 5.8, ((feet / 1000) % 1) * 2 * Math.PI, math.clamp(S.load / MAX_G, -0.3, 1) * 5.2, (fuel / FUEL) * 4.7].forEach((angle, k) => (seat.needles[k].rotation.z = -angle));
        fuel = Math.max(0, fuel - dt * (0.8 + 4 * S.throttle + (S.burner ? 25 : 0)));
        // The camera. Cockpit: the eye, resting 5° under the axis, turned a little towards the
        // aim (the pilot looks into the turn, never past 10°) and by the free look, shaken by the
        // load, the afterburner, the runway and the stall. Exterior: behind and above the jet
        // along the aim, following it on a quarter-second spring, pulled back with speed and
        // the wheel.
        const [aimX, , aimZ] = rotate(qconj(S.q), rotate(S.aim, [0, 0, -1]));
        headYaw += (math.clamp(-Math.atan2(aimX, -aimZ) * 0.3, -10 * deg, 10 * deg) - headYaw) * (1 - Math.exp(-dt * 4));
        const look = qmul(qaxis(0, 1, 0, S.lookYaw), qaxis(1, 0, 0, S.lookPitch));
        const rough = 0.0025 * Math.max(0, S.load - 3) + (S.burner ? 0.002 : 0) + (S.onGround ? 0.003 * Math.min(1, S.v / 80) : 0) + (S.stalling ? 0.004 : 0);
        const shake = rotate(S.q, [Math.sin(time * 41) * rough, Math.sin(time * 37 + 1) * rough, 0]);
        let eyeAt, turn;
        if (cockpitView) {
          turn = qmul(S.q, qmul(qaxis(0, 1, 0, headYaw), qmul(qaxis(1, 0, 0, -LOOK_DOWN), look)));
          eyeAt = eye.map((p, i) => p + shake[i]);
          [camera.near, camera.fov] = [COCKPIT_NEAR, COCKPIT_FOV + 4 * smooth(100, 400, S.v)];
        } else {
          chaseTurn = qblend(chaseTurn, qmul(S.aim, look), 1 - Math.exp(-dt / 0.25));
          turn = chaseTurn;
          const back = rotate(turn, [0, 3.4, zoom * (1 + 0.3 * smooth(100, 400, S.v))]);
          eyeAt = S.pos.map((p, i) => p + back[i] + shake[i] * 4);
          [camera.near, camera.fov] = [0.5, 60 + 10 * smooth(100, 400, S.v) + (S.burner ? 5 : 0)];
        }
        camera.position.set(...eyeAt);
        camera.quaternion.set(...turn);
        const W = innerWidth, H = innerHeight, f = H / 2 / Math.tan((camera.fov * deg) / 2);
        pilot.perPx = (2 * Math.atan((W / 2 / f))) / W;
        // Past the pilot's 9 g the view reddens from its edges.
        const red = smooth(PILOT_G, MAX_G, S.load).toFixed(2);
        if (reddened !== red) redout.style.opacity = reddened = red;
        // Warnings, the take-off hint, the display.
        const [floor] = ground(S.pos[0], S.pos[2]), radar = S.pos[1] - GEAR - floor, sinking = -S.vel[1];
        const pullUp = S.pullUp || (!S.onGround && sinking > 5 && radar / sinking < 5), overTheEdge = Math.max(Math.abs(S.pos[0]), Math.abs(S.pos[2])) > 2450;
        const alert = phase === 'crashed' ? '' : S.stalling ? say('stall') : pullUp ? say('pullUp') : overTheEdge ? say('turnBack') : '';
        if (phase === 'crashed') banner(say('crashed'), say(lastRing === null ? 'backToRunway' : 'backToRing'));
        else if (!airborne) banner('', S.throttle < 0.5 ? say('throttleUp') : S.v < ROTATE ? say('rolling', { knots: Math.round(S.v * KT) }) : say('liftOff'));
        else if (finished === null) banner('');
        drawHud(f, eyeAt, turn, W, H, alert);
        drawScreens(f, eye, eyeAt, turn, W, H, cockpit.visible);
        sound(Boolean(alert) && phase !== 'crashed', time);
      }
    </script>
  </body>
</html>
