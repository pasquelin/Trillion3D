<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fly over a model town</title>
    <meta name="thumbnail" content="2" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      // A sequence in [0, 1) from a seed: the same scene on every run.
      function random(seed) {
        let state = seed >>> 0;
        return () => (state = (Math.imul(state, 1664525) + 1013904223) >>> 0) / 4294967296;
      }

      // `fly`: six degrees of freedom. The town is a model at table scale, since the controller
      // flies at one metre a second.
      const world = createWorld('view', { controls: 'fly' });
      world.camera.far = 100;
      const next = random(9);
      const grass = object.mesh(geometry.box(24, 0.1, 24), material.meshStandard({ color: '#4f6e3a', roughness: 0.95 }));
      grass.position.y = -0.05;
      const river = object.mesh(geometry.box(1.6, 0.02, 24), material.meshStandard({ color: '#2f6f9f', roughness: 0.15 }));
      river.position.y = 0.01;
      world.scene.add(grass, river);
      // Blocks of towers of five colours on both banks, each with a lit roof lamp.
      const walls = ['#e0d6c2', '#c9785a', '#8fa3b8', '#d9b86a', '#b9c7a3'].map((colour) => material.meshStandard({ color: colour, roughness: 0.7 }));
      const roofs = material.meshStandard({ color: '#3a3d45', roughness: 0.5 });
      const block = geometry.box(1, 1, 1);
      for (let row = -10; row <= 10; row += 1.2)
        for (let column = -10; column <= 10; column += 1.2) {
          if (Math.abs(column) < 1.4 || next() < 0.25) continue;
          const height = 0.3 + next() ** 2 * (Math.abs(column) < 5 ? 3.2 : 1.2);
          const tower = object.mesh(block, walls[Math.floor(next() * 5)]);
          tower.scale.set(0.8, height, 0.8);
          tower.position.set(column, height / 2, row);
          const roof = object.mesh(block, roofs);
          roof.scale.set(0.85, 0.05, 0.85);
          roof.position.set(column, height + 0.025, row);
          world.scene.add(tower, roof);
        }
      // Three bridges over the river, and boats sailing down it.
      for (const z of [-6, 0, 6]) {
        const bridge = object.mesh(geometry.box(2.4, 0.08, 0.5), material.meshStandard({ color: '#8a8580', roughness: 0.8 }));
        bridge.position.set(0, 0.25, z);
        world.scene.add(bridge);
      }
      const hull = material.meshStandard({ color: '#f2efe6', roughness: 0.4 });
      const boats = Array.from({ length: 4 }, (_, index) => {
        const boat = object.mesh(geometry.box(0.25, 0.1, 0.6), hull);
        boat.position.set(index % 2 ? 0.35 : -0.35, 0.06, index * 6 - 9);
        world.scene.add(boat);
        return boat;
      });
      world.scene.add(light.directional({ intensity: 3, color: '#ffd7a8', position: [8, 6, -4], castShadow: true }));
      world.scene.add(light.ambient({ intensity: 0.4, color: '#8fb4ff' }));
      world.camera.position.set(3, 3.2, 12);
      world.camera.lookAt(0, 0.8, 2);

      controls({
        keys: 'W S forward and back · A D sideways · R F up and down',
        look: 'Drag or arrow keys to look · Q E to roll',
        backToStart: () => {
          world.camera.position.set(3, 3.2, 12);
          world.camera.lookAt(0, 0.8, 2);
        },
      });
      world.onFrame(({ delta }) => {
        for (const boat of boats) boat.position.z = ((boat.position.z + 12 + delta * 0.4) % 24) - 12;
        world.invalidate();
      });
    </script>
  </body>
</html>
