<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The material family</title>
    <meta name="thumbnail" content="5" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1d1a2a;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math, texture } from '../runtime/engine.js';
      import { controls, readout, words } from '../runtime/kit.js';
      const say = words();

      const world = createWorld('view', { controls: 'orbit' });
      world.scene.background = math.color('#1d1a2a');

      // A matcap is a picture of a lit ball: the surface takes, at each point, the colour the
      // picture shows where the ball faces the same way. Painted here on a canvas.
      const card = document.createElement('canvas');
      card.width = card.height = 256;
      const paint = card.getContext('2d');
      paint.fillStyle = '#2a3150';
      paint.fillRect(0, 0, 256, 256);
      const ball = paint.createRadialGradient(92, 84, 6, 128, 128, 128);
      ball.addColorStop(0, '#fffaf0');
      ball.addColorStop(0.18, '#f6d38e');
      ball.addColorStop(0.55, '#b86a3c');
      ball.addColorStop(0.86, '#4b2f4a');
      ball.addColorStop(1, '#6f8fd8');
      paint.fillStyle = ball;
      paint.beginPath();
      paint.arc(128, 128, 127, 0, Math.PI * 2);
      paint.fill();
      const matcap = texture.canvas(card);

      // The family: one colour, one shape, eight plinths — only the kind of material changes. The
      // lit kinds answer the lamps; the others show a colour, a direction or a picture instead.
      const PAINT = '#e0894f';
      const KINDS = [
        { name: 'meshBasic', lit: false, matter: material.meshBasic({ color: PAINT }) },
        { name: 'meshLambert', lit: true, matter: material.meshLambert({ color: PAINT }) },
        { name: 'meshPhong', lit: true, matter: material.meshPhong({ color: PAINT, shininess: 120 }) },
        { name: 'meshStandard', lit: true, matter: material.meshStandard({ color: PAINT, metalness: 0.55, roughness: 0.28 }) },
        { name: 'meshPhysical', lit: true, matter: material.meshPhysical({ color: '#fff1de', roughness: 0.04, transmission: 1, ior: 1.5, thickness: 0.9 }) },
        { name: 'meshToon', lit: true, matter: material.meshToon({ color: PAINT }) },
        { name: 'meshNormal', lit: false, matter: material.meshNormal() },
        { name: 'meshMatcap', lit: false, matter: material.meshMatcap({ matcap }) },
      ];

      // Four sculptures to try them on, each built once and shared by every plinth.
      const vase = [[0, -0.75], [0.42, -0.72], [0.55, -0.45], [0.5, -0.1], [0.3, 0.25], [0.22, 0.5], [0.34, 0.72], [0.3, 0.78], [0, 0.7]];
      const SHAPES = {
        knot: geometry.torusKnot(0.42, 0.14, 220, 28, 2, 3),
        sphere: geometry.sphere(0.7, 96, 48),
        vase: geometry.lathe(vase, 96),
        ring: geometry.torus(0.52, 0.2, 40, 120),
      };

      // The stage: a stone floor, a darker paved circle, and a colonnade on a wider circle
      // behind, whose columns throw long shadows across the floor at the end of the day.
      const stone = material.meshStandard({ color: '#8a7b6c', roughness: 0.9 });
      const paving = material.meshStandard({ color: '#4e433e', roughness: 0.7, metalness: 0.05 });
      const marble = material.meshStandard({ color: '#e2d6c4', roughness: 0.55 });
      const floor = object.mesh(geometry.cylinder(42, 42, 0.4, 128), stone);
      floor.position.y = -0.2;
      const circle = object.mesh(geometry.cylinder(12, 12, 0.06, 128), paving);
      circle.position.set(0, 0.03, 4);
      world.scene.add(floor, circle);
      const CENTRE = [0, 4], ARC = 9, COLONNADE = 16;
      const around = (radius, angle) => [CENTRE[0] + radius * Math.sin(angle), CENTRE[1] - radius * Math.cos(angle)];
      const shaft = geometry.cylinder(0.36, 0.44, 7, 32), block = geometry.box(1.1, 0.34, 1.1);
      let previous = null;
      for (let k = 0; k <= 12; k++) {
        const [x, z] = around(COLONNADE, ((k - 6) / 6) * 1.45);
        const column = object.mesh(shaft, marble), foot = object.mesh(block, marble), head = object.mesh(block, marble);
        column.position.set(x, 3.5 + 0.17, z);
        foot.position.set(x, 0.17, z);
        head.position.set(x, 7.2, z);
        world.scene.add(column, foot, head);
        if (previous) {
          // A lintel from the last column to this one.
          const length = Math.hypot(x - previous[0], z - previous[1]);
          const lintel = object.mesh(geometry.box(length + 1.1, 0.5, 0.9), marble);
          lintel.position.set((x + previous[0]) / 2, 7.62, (z + previous[1]) / 2);
          lintel.rotation.set(0, -Math.atan2(z - previous[1], x - previous[0]), 0);
          world.scene.add(lintel);
        }
        previous = [x, z];
      }

      // Eight plinths on an arc, a sculpture over each: every shape is in the scene from the
      // start, the one not chosen hidden.
      const plinth = geometry.cylinder(0.72, 0.84, 1.3, 48), cap = geometry.cylinder(0.92, 0.92, 0.12, 48);
      const stands = KINDS.map((kind, k) => {
        const angle = ((k - (KINDS.length - 1) / 2) / (KINDS.length - 1)) * 2.3;
        const [x, z] = around(ARC, angle);
        const base = object.mesh(plinth, marble), top = object.mesh(cap, marble);
        base.position.set(x, 0.65, z);
        top.position.set(x, 1.36, z);
        const holder = object.group();
        holder.position.set(x, 2.4, z);
        const pieces = Object.fromEntries(Object.entries(SHAPES).map(([name, shape]) => {
          const piece = object.mesh(shape, kind.matter);
          piece.visible = false;
          holder.add(piece);
          return [name, piece];
        }));
        world.scene.add(base, top, holder);
        return { kind, holder, pieces, at: [x, z], outward: [Math.sin(angle), -Math.cos(angle)], shown: null, next: null, swap: 1 };
      });

      // Three hours of the day. The sun is placed only when the hour changes.
      const sun = light.directional({ castShadow: true });
      const sky = light.hemisphere({});
      const cool = light.point({ color: '#6f8cff', intensity: 30, distance: 34, position: [11, 6, -6] });
      world.scene.add(sun, sky, cool);
      const HOURS = {
        'golden hour': { at: [-17, 5.5, 10], colour: '#ffb46a', power: 3.4, sky: '#7f97dc', ground: '#4e3727', fill: 0.75 },
        midday: { at: [-5, 22, 7], colour: '#fff4e4', power: 3, sky: '#a8c2ff', ground: '#5d4f40', fill: 0.95 },
        night: { at: [10, 16, -5], colour: '#8ea4ff', power: 0.3, sky: '#3d4d86', ground: '#171220', fill: 0.35 },
      };

      const WIDE = { position: [0, 5.4, 16.5], target: [0, 1.9, 0.5] };
      world.camera.position.set(0, 12, 30);
      world.controls.target.set(0, 2.2, -2);
      world.controls.minDistance = 3;
      world.controls.maxDistance = 40;
      world.controls.maxPolarAngle = Math.PI / 2 - 0.05;
      world.controls.update();

      // A flight of the camera from where it is to a pose, eased; the viewer's hand ends it.
      let flight = null;
      const flyTo = ({ position, target }, seconds) => {
        const { position: p } = world.camera, t = world.controls.target;
        flight = { from: [p.x, p.y, p.z, t.x, t.y, t.z], to: [...position, ...target], seconds, time: 0 };
      };
      for (const type of ['pointerdown', 'wheel'])
        world.canvas.addEventListener(type, () => (flight = null), { passive: true });
      const poseOf = (stand) => ({
        position: [stand.at[0] + stand.outward[0] * -3.6, 2.9, stand.at[1] + stand.outward[1] * -3.6],
        target: [stand.at[0], 2.3, stand.at[1]],
      });

      let looking = null, lit = null, opened = false;
      const ui = controls({
        mouse: 'Drag to walk round the family; turn the light to night and see which kinds still shine',
        light: Object.keys(HOURS),
        shape: Object.keys(SHAPES),
        lookAt: ['all', ...KINDS.map(({ name }) => name)],
        spin: true,
      }, (values, key) => {
        if (key === undefined || key === 'light') {
          const hour = HOURS[values.light];
          sun.position.set(...hour.at);
          sun.color.set(hour.colour);
          sun.intensity = hour.power;
          sky.color.set(hour.sky);
          sky.groundColor.set(hour.ground);
          sky.intensity = hour.fill;
        }
        if (key === undefined || key === 'shape')
          stands.forEach((stand, k) => {
            stand.next = values.shape;
            // At start the shape is simply shown; a change swaps it, one plinth after another.
            stand.swap = key === undefined ? 1 : -k * 0.09;
            if (key === undefined) show(stand, values.shape);
          });
        if (key === 'lookAt') {
          const stand = stands.find(({ kind }) => kind.name === values.lookAt);
          flyTo(stand ? poseOf(stand) : WIDE, 1.8);
          describe(values.lookAt);
        }
        world.invalidate();
      }, world);
      looking = readout('looking');
      lit = readout('litByLamps');
      function describe(name) {
        const kind = KINDS.find((one) => one.name === name);
        looking(kind ? `${kind.name}: ${say(kind.name)}` : say('allKinds'));
        lit(say(kind ? (kind.lit ? 'yes' : 'no') : 'fiveOfEight'));
      }
      describe(ui.lookAt);
      function show(stand, name) {
        for (const [shape, piece] of Object.entries(stand.pieces)) piece.visible = shape === name;
        stand.shown = name;
      }

      // The opening: the camera comes down to the arc while the sculptures drop onto their
      // plinths, one after another, and settle with a bounce.
      const bounce = (t) => {
        const n = 7.5625, d = 2.75;
        if (t < 1 / d) return n * t * t;
        if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
        if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375;
        return n * (t -= 2.625 / d) * t + 0.984375;
      };
      const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);
      flyTo(WIDE, 4.2);
      let time = 0, turn = 0;
      world.onFrame(({ delta }) => {
        const step = Math.min(delta, 0.05);
        time += step;
        if (ui.spin) turn += step * 0.45;
        stands.forEach((stand, k) => {
          const drop = Math.min(1, Math.max(0, (time - 0.3 - k * 0.22) / 1.3));
          const scale = stand.swap < 0.5 ? 1 - ease(Math.max(0, stand.swap) * 2) : ease((stand.swap - 0.5) * 2);
          if (stand.swap < 1) {
            stand.swap = Math.min(1, stand.swap + step / 0.9);
            if (stand.swap >= 0.5 && stand.shown !== stand.next) show(stand, stand.next);
          }
          stand.holder.position.y = 2.4 + 9 * (1 - bounce(drop)) + Math.sin(time * 1.3 + k) * 0.08;
          stand.holder.rotation.set(0, turn + k * 0.7, 0);
          stand.holder.scale.setScalar(Math.max(0.001, stand.swap >= 1 ? 1 : scale));
        });
        if (flight) {
          flight.time = Math.min(1, flight.time + step / flight.seconds);
          const e = ease(flight.time), [x, y, z, tx, ty, tz] = flight.from.map((value, i) => value + (flight.to[i] - value) * e);
          world.camera.position.set(x, y, z);
          world.controls.target.set(tx, ty, tz);
          world.controls.update();
          if (flight.time >= 1) flight = null;
        }
        opened ||= time > 4.5;
        if (ui.spin || flight || !opened || stands.some(({ swap }) => swap < 1)) world.invalidate();
      });
    </script>
  </body>
</html>
