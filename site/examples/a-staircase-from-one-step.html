<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A spiral staircase from one step</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createExplorer } from '../runtime/engine.js';

      const explorer = await createExplorer('view', {
        manifestUrl: '../assets/examples/staircase/cache/native/full/manifest.json',
        scope: 'full',
        interactive: true,
      });
      // The scene file holds one step mesh and thirty-six nodes that place it, each one turned a
      // twenty-second of a turn further and raised one riser higher: the compiler paged the step
      // once, and every node draws the same pages at its own transform.
      explorer.addLight({
        id: 'skylight',
        kind: 'directional',
        direction: [-0.35, -0.8, -0.45],
        color: [1, 0.97, 0.92],
        intensity: 3,
        castsShadow: true,
      });
      explorer.setPose({ ...explorer.homePose(), position: [5.6, 5.2, 6.4], target: [0, 3.3, 0] });
      explorer.invalidate();
    </script>
  </body>
</html>
