<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spiral staircase</title>
    <meta name="thumbnail" content="1.5" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      const oak = material.meshStandard({ color: '#a8703c', roughness: 0.55 });
      const plaster = material.meshStandard({ color: '#d9d3c7', roughness: 0.85 });
      const base = object.mesh(geometry.cylinder(2.2, 2.2, 0.3, 64), plaster);
      base.position.y = -0.15;
      const column = object.mesh(geometry.cylinder(0.2, 0.2, 7, 32), plaster);
      column.position.y = 3.5;
      world.scene.add(base, column);

      // One step — a tread and its baluster — as a group; each copy is raised one riser higher and
      // turned a little further round the column.
      function step() {
        const group = object.group();
        const tread = object.mesh(geometry.box(1.25, 0.18, 0.3), oak);
        tread.position.x = 0.2 + 1.25 / 2;
        const baluster = object.mesh(geometry.box(0.05, 1, 0.05), oak);
        baluster.position.set(1.38, 0.5, 0);
        group.add(tread, baluster);
        return group;
      }
      const flights = Array.from({ length: 48 }, (_, index) => {
        const flight = step();
        flight.position.y = 0.18 + index * 0.18;
        world.scene.add(flight);
        return flight;
      });
      world.scene.add(light.directional({ intensity: 3, color: '#fff1e0', position: [5, 12, 7], castShadow: true }));
      world.scene.add(light.ambient({ intensity: 0.25, color: '#8fb4ff' }));
      world.camera.position.set(3.4, 10.5, 4.1);
      world.camera.lookAt(0, 2.6, 0);
      world.controls.target.set(0, 2.6, 0);

      controls({ steps: [4, 48, 36, 1], turnPerStep: [0, 45, 16, 1] }, (values) => {
        flights.forEach((flight, index) => {
          flight.visible = index < values.steps;
          flight.rotation.y = (index * values.turnPerStep * Math.PI) / 180;
        });
        world.invalidate();
      });
    </script>
  </body>
</html>
