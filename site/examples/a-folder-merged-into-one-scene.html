<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A folder merged into one scene</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      p {
        position: absolute;
        top: 0;
        margin: 0.5rem;
        color: #cbd5e1;
        font: 12px system-ui;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p data-words="credit"></p>
    <script type="module">
      import { createWorld, light, math } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      world.scene.background = math.color('#171d28');

      // The compiler read corner.obj, windows.obj and lantaarn.obj from one source folder, merged
      // them into one compiled scene, and wrote the single manifest loaded here. The page never
      // joins nodes or guesses which source file produced one: that work belongs to the compiler.
      // prettier-ignore
      const model = await world.scene.load('../assets/examples/street-corner/cache/native/full/manifest.json');

      world.scene.add(
        light.directional({ intensity: 3, color: '#fff0d6', position: [5, 9, 6] }),
        light.hemisphere({ intensity: 1.1, color: '#b9d5ff', groundColor: '#55483d' }),
      );
      world.camera.position.set(4.5, 3.2, 5.5);
      world.camera.lookAt(0, 1.5, 0);
      world.controls.target.set(0, 1.5, 0);

      const ui = controls(
        { spin: true, visible: true },
        (values) => {
          model.visible = values.visible;
          world.invalidate();
        },
        world,
      );
      world.onFrame(({ delta }) => {
        if (!ui.spin || !model.visible) return;
        model.rotation.y += delta * 0.15;
        world.invalidate();
      });
    </script>
  </body>
</html>
