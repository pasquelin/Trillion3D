<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Health check</title>
    <meta name="thumbnail" content="8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      p {
        position: absolute;
        bottom: 0;
        margin: 0.5rem;
        color: #1f2a37;
        font: 12px system-ui;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p data-words="credit"></p>
    <script type="module">
      import { createWorld, geometry, material, object, light, math, texture, filter, side } from '../runtime/engine.js';
      import { animation, vehicle, capability, diagnostic } from '../runtime/engine.js';
      import { announce, controls, leafTexture, matcapBall, physicsReadouts, readout, seeded } from '../runtime/kit.js';
      import { vehicles, walkingRobot, words } from '../runtime/kit.js';

      // Every feature of the engine in one scene, each built by the kit or the engine as its own
      // example builds it: a compiled valley, the streamed observatory past its far edge and its
      // sun, a car to drive, a walking robot, a tree of alpha-cut leaves, see-through panes, balls
      // in each material, a point light with its shadows, and crates and balls that fall and roll.
      const world = createWorld('view', { controls: 'orbit', physics: true });
      const say = words();
      // What a backend refuses is said on the world's channel, with its reason: shown, never hidden.
      diagnostic.createChannel().observe(({ message }) => announce(say('refused'), message));
      world.scene.background = math.color('#bcd3e6');
      world.camera.far = 600;
      const [, sky, observatory] = await Promise.all([
        world.scene.load('../assets/examples/terrain/cache/native/full/manifest.json'),
        fetch('../assets/gallery/signature-architecture/source/sky.json').then((response) => response.json()),
        world.scene.load('../assets/gallery/signature-architecture/cache/native/full/manifest.json'),
      ]);

      // The observatory stands past the valley's far edge (z = -64 m), its floor at that edge's
      // height. Its scene file carries its sun, which lights the whole world and casts its shadows;
      // its sky, declared beside its source as a share of that sun, fills what the sun misses.
      const { min, max } = observatory.bounds;
      observatory.position.set(-(min.x + max.x) / 2, -min.y, -64 - max.z);
      const [sun] = observatory.lights;
      sun.castShadow = true;
      world.scene.add(light.hemisphere({ ...sky, intensity: sun.intensity * sky.sunShare }));

      // The car of `drive-a-car`, parked on the valley once the physics has streamed it in.
      const { car, park, chase, groundAt } = vehicles(world, { geometry, material, object, math, vehicle }, { above: 60 });
      const driven = car();
      await park(driven, [0, 20]);
      world.scene.add(driven.body);
      world.physics.add(driven.driver);
      world.controls.vehicle = driven.driver;

      // A plinth on the valley floor, sunk deep enough to meet every slope under it, its top a
      // checker (a textured material): the stage of the character, the foliage, the panes, the
      // balls in each material and the point light over them.
      const [x, z] = [-24, -10];
      const top = (await groundAt(x, z)) + 0.4;
      const pixels = new Uint8Array(8 * 8 * 4).map((_, k) => (k % 4 === 3 ? 255 : ((k >> 2) + (k >> 5)) % 2 ? 210 : 110));
      const checks = texture.data(pixels, 8, 8);
      checks.colorSpace = 'srgb';
      checks.magFilter = filter.nearest;
      const plinth = object.mesh(geometry.cylinder(9, 9, 4, 64), material.meshStandard({ map: checks, roughness: 0.8, physics: 'stone' }));
      plinth.position.set(x, top - 2, z);
      plinth.physics = 'static';
      const stage = object.group();
      stage.position.set(x, top, z);
      world.scene.add(plinth, stage);
      stage.add(light.point({ color: '#ffd9a8', intensity: 60, distance: 14, castShadow: true, position: [0, 5, 0] }));

      // The robot walks and waves round the middle, its clips blended on one mixer.
      const { robot, actions } = walkingRobot({ geometry, material, object, animation });
      actions.dance.weight = 0;
      stage.add(robot);

      // A tree: a trunk and a crown of leaves, each one rectangle cut to its outline by `alphaTest`.
      const next = seeded(5);
      const leaf = material.meshStandard({ map: leafTexture({ texture }), alphaTest: 0.5, side: side.double, roughness: 0.6 });
      const trunk = object.mesh(geometry.cylinder(0.12, 0.2, 3, 12), material.meshStandard({ color: '#6b4a2e', roughness: 0.9 }));
      trunk.position.set(5, 1.5, -3);
      stage.add(trunk);
      const blade = geometry.plane(0.28, 0.6);
      for (let k = 0; k < 150; k++) {
        const one = object.mesh(blade, leaf);
        one.position.set(5 + (next() - 0.5) * 2.4, 3.4 + (next() - 0.5) * 1.8, -3 + (next() - 0.5) * 2.4);
        one.rotation.set(next() * Math.PI, next() * Math.PI * 2, next() * Math.PI);
        stage.add(one);
      }

      // Two glass panes, blended, each asking for its shadow as dark as it is opaque.
      [0.3, 0.7].forEach((opacity, k) => {
        const glass = material.meshStandard({ color: '#9fd3ff', roughness: 0.1, transparent: true, opacity, depthWrite: false, transparentShadow: true });
        const pane = object.mesh(geometry.box(1.6, 2.4, 0.04), glass);
        pane.position.set(-5.5 + k * 2, 1.2, -3);
        stage.add(pane);
      });

      // One ball per material: toon, Lambert, a matcap painted by the kit, textured, physical.
      const looks = [
        material.meshToon({ color: '#e2553f' }),
        material.meshLambert({ color: '#6cc24a' }),
        material.meshMatcap({ matcap: matcapBall({ math, texture }, { base: [0.9, 0.92, 0.95], metal: 1, shine: 1.2, gloss: 120 }) }),
        material.meshStandard({ map: checks, roughness: 0.5 }),
        material.meshStandard({ color: '#d8b04a', metalness: 1, roughness: 0.25 }),
      ];
      const sphere = geometry.sphere(0.5, 48, 24);
      looks.forEach((look, k) => {
        const ball = object.mesh(sphere, look);
        ball.position.set(-4 + k * 2, 0.5, 5.5);
        stage.add(ball);
      });

      // Six crates fall on the plinth, ten rubber balls roll down the valley's slopes; `drop` lifts
      // them all back up. Setting `physics` again makes each body afresh where it now stands.
      const crate = geometry.box(0.8, 0.8, 0.8),
        rolling = geometry.sphere(0.6, 24, 16);
      const wood = material.meshStandard({ color: '#a8743f', roughness: 0.8 }),
        rubber = material.meshStandard({ color: '#d0453f', roughness: 0.5, physics: 'rubber' });
      const bodies = Array.from({ length: 16 }, (_, k) => object.mesh(k < 6 ? crate : rolling, k < 6 ? wood : rubber));
      world.scene.add(...bodies);
      const drop = () =>
        bodies.forEach((body, k) => {
          if (k < 6) body.position.set(x - 6.5 + next() * 2, top + 5 + k, z + 1 + next() * 3);
          else body.position.set((next() - 0.5) * 90, 30, (next() - 0.5) * 90);
          body.physics = 'dynamic';
        });
      drop();

      // `drive` hands the keyboard to the car and the camera to its chase; `reset` parks it again.
      const ui = controls({ drive: false, drop, reset: () => park(driven, [0, 20]) }, ({ drive }) => {
        world.controls.kind = drive ? 'vehicle' : 'orbit';
      }, world);
      physicsReadouts(world, ['bodies', 'step']);
      const drawn = readout('renderer');
      world.camera.position.set(70, 45, 70);
      world.controls.target.set(0, 0, -20);

      let heading = 0;
      world.beforeFrame(({ delta }) => {
        heading = (heading + delta * 0.35) % (Math.PI * 2);
        robot.position.set(Math.sin(heading) * 2.4, 0, Math.cos(heading) * 2.4);
        robot.rotation.set(0, heading + Math.PI / 2, 0);
        if (ui.drive) chase(driven, delta);
        world.invalidate();
      });

      // The path drawing the world, and what it refuses of the scene file's lights, with why.
      await world.ready;
      drawn(world.renderer);
      const { reason } = capability.lighting(world);
      if (reason) announce(say('refused'), reason);
    </script>
  </body>
</html>
