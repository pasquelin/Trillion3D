<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A mesh simplified on demand</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p>Marble Bust 01 by Rico Cilliers, Poly Haven, CC0 — see assets/examples/CREDITS.md</p>
    <p id="cut" style="top: 0; bottom: auto"></p>
    <script type="module">
      import { createExplorer, webgpuPagesBackend } from '../runtime/engine.js';

      // Manual rendering: the loop below draws every frame itself, so the canvas size is given.
      const canvas = document.getElementById('view');
      const explorer = await createExplorer(canvas, {
        manifestUrl: '../assets/examples/bust/cache/native/full/manifest.json',
        scope: 'full',
        backends: [webgpuPagesBackend],
        width: canvas.clientWidth,
        height: canvas.clientHeight,
        pixelRatio: devicePixelRatio,
      });
      explorer.addLight({
        id: 'sun',
        kind: 'directional',
        direction: [-0.6, -0.7, -0.4],
        color: [1, 0.93, 0.82],
        intensity: 3.5,
        castsShadow: true,
      });
      explorer.setPose({
        ...explorer.homePose(),
        position: [0.5, 0.4, 0.75],
        target: [0, 0.22, 0],
      });

      // The cache holds the simplified clusters the compiler built; `setPixelError` is the
      // screen error the cut may leave, in pixels. Every three seconds it asks for a coarser
      // mesh, then for the exact one again; the counter reads the triangles the frame drew.
      const steps = [0, 2, 6, 16, 40],
        cut = document.getElementById('cut');
      async function frame(time) {
        const error = steps[Math.floor(time / 3000) % steps.length];
        explorer.setPixelError(error);
        await explorer.awaitPages();
        const { drawnTriangles } = explorer.render();
        cut.textContent = `pixel error ${error} px — ${drawnTriangles ?? 'unmeasured'} triangles drawn`;
        await explorer.flush();
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
