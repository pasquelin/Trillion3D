<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A mesh simplified on demand</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1621; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; bottom: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; }
      label { position: absolute; top: 1.6rem; left: 0; margin: 0.5rem; color: #cbd5e1; font: 12px system-ui; display: flex; gap: 0.4rem; align-items: center; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p>Marble Bust 01 by Rico Cilliers, Poly Haven, CC0 — see assets/examples/CREDITS.md</p>
    <p id="cut" style="top: 0; bottom: auto"></p>
    <label>screen error (px) <input id="pixelError" type="range" min="0.25" max="6" step="0.25" value="1" /><span id="pixelErrorValue"></span>
      <button id="profile" type="button">log stage profile</button>
    </label>
    <script type="module">
      import { createWorld, light } from '../runtime/engine.js';

      const world = createWorld('view', { controls: 'orbit' });
      await world.scene.load('../assets/examples/bust/cache/native/full/manifest.json');
      world.scene.add(light.directional({
        intensity: 3.5, color: [1, 0.93, 0.82], position: [12, 14, 8], target: [0, 0, 0], castShadow: true,
      }));
      world.camera.position.set(0.5, 0.4, 0.75);
      world.camera.lookAt(0, 0.22, 0);
      world.controls.target.set(0, 0.22, 0);

      // The engine cuts the DAG to a screen error, in pixels, each frame on its own; the slider
      // asks for a coarser or finer cut on demand, and the counter reads what that cut drew.
      const cut = document.getElementById('cut');
      world.onFrame(({ metrics }) => {
        const text = `${metrics.selectedTriangles ?? 'unmeasured'} triangles drawn — ${metrics.residentPages ?? '?'} resident pages`;
        if (cut.textContent !== text) cut.textContent = text;
      });
      const slider = document.getElementById('pixelError'), value = document.getElementById('pixelErrorValue');
      const setPixelError = () => {
        world.pixelError = Number(slider.value);
        value.textContent = `${world.pixelError.toFixed(2)} px`;
        world.invalidate();
      };
      slider.oninput = setPixelError;
      setPixelError();

      // `stageProfile()` is the same per-step CPU breakdown the engine keeps for its own bench;
      // a host reads it the same way, on demand, without opening a diagnostic channel.
      document.getElementById('profile').onclick = () => console.log('stage profile', world.stageProfile());
    </script>
  </body>
</html>
