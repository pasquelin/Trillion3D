<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Five ways to move the camera</title>
    <meta name="thumbnail" content="1.5" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e1621;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls, banner } from '../runtime/kit.js';

      // What each controller does with the mouse and the keyboard.
      const GESTURES = {
        orbit: 'Drag to turn around the temple, right-drag to slide, scroll to zoom.',
        fly: 'W A S D to fly, R F up and down, Q E to roll; drag to look around.',
        firstPerson: 'Click to take the mouse, then W A S D to walk. Escape gives it back.',
        trackball: 'Drag to spin freely, even upside down; scroll to zoom.',
        panZoom: 'Drag to slide the map, scroll to zoom. The camera never turns.',
      };
      const info = banner('Five ways to move the camera', GESTURES.orbit);
      const world = createWorld('view', { controls: 'orbit' });
      world.scene.background = math.color('#0e1621');

      // A small temple: a floor, two rows of columns, a roof beam on each.
      const sand = material.meshStandard({ color: '#9a8c73', roughness: 0.9 });
      const chalk = material.meshStandard({ color: '#e0d9c7', roughness: 0.7 });
      const floor = object.mesh(geometry.box(7, 0.3, 15), sand);
      floor.position.y = -0.15;
      world.scene.add(floor);
      const profile = [[0, 0], [0.42, 0], [0.42, 0.25], [0.3, 0.25], [0.28, 2.7], [0.4, 2.7], [0.42, 2.95], [0, 2.95]];
      for (const side of [-1, 1]) {
        for (let index = 0; index < 6; index++) {
          const column = object.mesh(geometry.lathe(profile, 32), chalk);
          column.position.set(side * 1.8, 0, index * 2.4 - 6);
          world.scene.add(column);
        }
        const beam = object.mesh(geometry.box(0.9, 0.4, 13.5), chalk);
        beam.position.set(side * 1.8, 3.15, 0);
        world.scene.add(beam);
      }
      world.scene.add(light.directional({ intensity: 3, color: '#fff2dc', position: [7, 8, 11], castShadow: true }));
      world.scene.add(light.ambient({ intensity: 0.3, color: '#8fb4ff' }));
      const home = () => {
        world.camera.position.set(5.5, 3.8, 11);
        world.camera.lookAt(0, 1.2, 0);
        world.controls.target?.set(0, 1.2, 0);
        world.invalidate();
      };
      home();

      // `world.controls.kind` switches the controller live: the previous one lets go of the
      // canvas, the next one takes the camera where it stands.
      controls({ controller: Object.keys(GESTURES), backHome: home }, ({ controller }) => {
        world.controls.kind = controller;
        info.tip(GESTURES[controller]);
      });
    </script>
  </body>
</html>
