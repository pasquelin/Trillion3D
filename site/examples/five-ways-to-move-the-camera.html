<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Five ways to move the camera</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e1621;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      p {
        position: absolute;
        bottom: 0;
        margin: 0.5rem;
        color: #cbd5e1;
        font: 12px system-ui;
      }
      nav {
        position: absolute;
        top: 0;
        margin: 0.5rem;
        display: flex;
        gap: 0.25rem;
      }
      button {
        font: 12px system-ui;
        padding: 0.25rem 0.5rem;
        border: 0;
        border-radius: 4px;
        background: #1e293b;
        color: #cbd5e1;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: #38bdf8;
        color: #0e1621;
      }
    </style>
    <!-- No `three/addons/` entry: the controllers below are the engine's own. -->
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <nav id="pick"></nav>
    <p id="hint"></p>
    <script type="module">
      import { createExplorer } from '../runtime/engine.js';

      const canvas = document.getElementById('view');
      const explorer = await createExplorer(canvas, {
        manifestUrl: '../assets/examples/colonnade/cache/native/full/manifest.json',
        scope: 'full',
        interactive: true,
      });
      explorer.addLight({
        id: 'sun',
        kind: 'directional',
        direction: [-0.5, -0.5, -0.75],
        color: [1, 0.95, 0.85],
        intensity: 3,
        castsShadow: true,
      });

      // One controller at a time, each asked of the session and each disposed when it is
      // replaced. The orbit is the session's own: interactive startup already made it.
      const KINDS = [
        ['Orbit', () => explorer.controls(), 'Drag to turn, right-drag to pan, wheel to zoom.'],
        [
          'Flight',
          () => explorer.flyControls(),
          'W/S/A/D, R/F, arrows, Q/E to roll; drag to look.',
        ],
        [
          'First person',
          () => explorer.firstPersonControls(),
          'Click to lock the pointer; W/S/A/D to walk.',
        ],
        [
          'Trackball',
          () => explorer.trackballControls(),
          'Drag to spin freely, roll included; wheel to zoom.',
        ],
        [
          'Pan-zoom',
          () => explorer.panZoomControls(),
          'Drag to slide the flat view; wheel and arrows to zoom.',
        ],
      ];
      const orbit = explorer.controls();
      const home = explorer.homePose();
      let active = orbit,
        steering = false,
        last = 0;

      function use(index) {
        const [, make, hint] = KINDS[index];
        if (active !== orbit) active.dispose();
        explorer.setPose(home);
        active = make();
        active.addEventListener('change', () => explorer.invalidate());
        steering = typeof active.rollSpeed === 'number' || typeof active.lookSpeed === 'number';
        if (active.target) active.update();
        document.getElementById('hint').textContent = hint;
        for (const [at, button] of [...document.getElementById('pick').children].entries())
          button.setAttribute('aria-pressed', String(at === index));
        explorer.invalidate();
      }
      KINDS.forEach(([label], index) => {
        const button = document.createElement('button');
        button.textContent = label;
        button.onclick = () => use(index);
        document.getElementById('pick').append(button);
      });

      // Only a steered controller needs a clock: the pivot ones move on their events alone.
      function step(now) {
        if (steering && active.update((now - last) / 1000)) explorer.invalidate();
        last = now;
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
      use(0);
    </script>
  </body>
</html>
