<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Five ways to move the camera</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e1621;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      p {
        position: absolute;
        bottom: 0;
        margin: 0.5rem;
        color: #cbd5e1;
        font: 12px system-ui;
      }
      nav {
        position: absolute;
        top: 0;
        margin: 0.5rem;
        display: flex;
        gap: 0.25rem;
      }
      button {
        font: 12px system-ui;
        padding: 0.25rem 0.5rem;
        border: 0;
        border-radius: 4px;
        background: #1e293b;
        color: #cbd5e1;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: #38bdf8;
        color: #0e1621;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <nav id="pick"></nav>
    <p id="hint"></p>
    <script type="module">
      import { createWorld, geometry, material, object, light } from '../runtime/engine.js';

      // `controls` is a world option at creation, and a live handle afterwards: switching kind
      // is one assignment on `world.controls.kind`, no world disposed or remade.
      const KINDS = [
        ['Orbit', 'orbit', 'Drag to turn, right-drag to pan, wheel to zoom.'],
        ['Flight', 'fly', 'W/S/A/D, R/F, arrows, Q/E to roll; drag to look.'],
        ['First person', 'firstPerson', 'Click to lock the pointer; W/S/A/D to walk.'],
        ['Trackball', 'trackball', 'Drag to spin freely, roll included; wheel to zoom.'],
        ['Pan-zoom', 'panZoom', 'Drag to slide the flat view; wheel to zoom, arrows to pan.'],
      ];

      function buildScene(world) {
        const sand = material.meshStandard({ color: [0.6, 0.55, 0.45], roughness: 0.9 });
        const chalk = material.meshStandard({ color: [0.88, 0.85, 0.78], roughness: 0.7 });
        const floor = object.mesh(geometry.box(6, 0.3, 14), sand);
        floor.position.y = -0.15;
        world.scene.add(floor);
        const profile = [[0, 0], [0.42, 0], [0.42, 0.25], [0.3, 0.25], [0.28, 2.7], [0.4, 2.7], [0.42, 2.95], [0, 2.95]];
        for (const side of [-1, 1]) {
          for (let index = 0; index < 6; index++) {
            const column = object.mesh(geometry.lathe(profile, 24), chalk);
            column.position.set(side * 1.8, 0, index * 2.4 - 6);
            world.scene.add(column);
          }
          const lintel = object.mesh(geometry.box(0.9, 0.4, 13.5), chalk);
          lintel.position.set(side * 1.8, 3.15, 0);
          world.scene.add(lintel);
        }
        world.scene.add(light.directional({
          intensity: 3, color: [1, 0.95, 0.85], position: [7, 8, 11], target: [0, 0, 0], castShadow: true,
        }));
        world.camera.position.set(4.5, 3.6, 10);
        world.camera.lookAt(0, 1.2, 0);
        world.controls.target.set(0, 1.2, 0);
      }

      const world = createWorld('view', { controls: KINDS[0][1] });
      buildScene(world);
      function use(index) {
        const [, controls, hint] = KINDS[index];
        world.controls.kind = controls;
        document.getElementById('hint').textContent = hint;
        for (const [at, button] of [...document.getElementById('pick').children].entries())
          button.setAttribute('aria-pressed', String(at === index));
      }
      KINDS.forEach(([label], index) => {
        const button = document.createElement('button');
        button.textContent = label;
        button.onclick = () => use(index);
        document.getElementById('pick').append(button);
      });
      use(0);
    </script>
  </body>
</html>
