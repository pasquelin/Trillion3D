<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web Geometry — documentation</title>
    <meta
      name="description"
      content="Guides, constants, public functions and a live WebGPU demo for the Web Geometry engine."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%23570df8' d='M2 3h12v10H2z'/%3E%3Cpath fill='%23fff' d='M4 5h8v2H4zm0 4h5v2H4z'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Prose of the guides: the portal styles its own markup, no plugin. */
      .wg-prose p {
        margin: 0.75rem 0;
        line-height: 1.7;
      }
      .wg-prose ul,
      .wg-prose ol {
        margin: 0.75rem 0 0.75rem 1.5rem;
      }
      .wg-prose ul {
        list-style: disc;
      }
      .wg-prose ol {
        list-style: decimal;
      }
      .wg-prose li {
        margin: 0.25rem 0;
      }
      .wg-prose h3 {
        font-size: 1.125rem;
        font-weight: 700;
        margin-top: 1.5rem;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.9em;
      }
      :not(pre) > code {
        background: var(--fallback-b2, oklch(var(--b2)));
        border-radius: 0.25rem;
        padding: 0.1em 0.35em;
      }
      aside::-webkit-scrollbar {
        width: 6px;
      }
      aside::-webkit-scrollbar-thumb {
        background: rgba(128, 128, 128, 0.3);
        border-radius: 4px;
      }
    </style>
  </head>
  <body class="bg-base-100 text-base-content min-h-screen flex flex-col">
    <header class="navbar bg-base-200 border-b border-base-300 sticky top-0 z-30 gap-2 px-4">
      <div class="navbar-start gap-2">
        <label
          for="drawer-toggle"
          class="btn btn-square btn-ghost btn-sm lg:hidden"
          aria-label="Open the navigation"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            class="w-5 h-5 stroke-current"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
        </label>
        <a href="#guides/quick-start" class="btn btn-ghost normal-case text-lg font-bold gap-2">
          <span class="text-primary font-mono">&lt;WG/&gt;</span><span>Web Geometry</span>
        </a>
      </div>
      <div class="navbar-center hidden md:flex">
        <a href="#demo/webgpu-demo" class="btn btn-ghost btn-sm">Live demo</a>
        <a href="report.html" class="btn btn-ghost btn-sm">The engine, measured ↗</a>
      </div>
      <div class="navbar-end gap-2">
        <input
          type="search"
          id="search-input"
          placeholder="Search (/)"
          aria-label="Search the documentation"
          class="input input-sm input-bordered hidden sm:block w-40 md:w-56 font-mono text-xs"
        />
        <label class="swap swap-rotate btn btn-ghost btn-circle btn-sm" aria-label="Switch theme">
          <input type="checkbox" id="theme-toggle" />
          <svg
            class="swap-on fill-current w-4 h-4"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
          >
            <path
              d="M12 6.5A5.5 5.5 0 1 0 17.5 12 5.51 5.51 0 0 0 12 6.5Zm0 9A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5ZM12 5a1 1 0 0 0 1-1V3a1 1 0 0 0-2 0v1a1 1 0 0 0 1 1Zm0 14a1 1 0 0 0-1 1v1a1 1 0 0 0 2 0v-1a1 1 0 0 0-1-1ZM5 12a1 1 0 0 0-1-1H3a1 1 0 0 0 0 2h1a1 1 0 0 0 1-1Zm16-1h-1a1 1 0 0 0 0 2h1a1 1 0 0 0 0-2ZM6.36 6.36a1 1 0 0 0 1.41-1.41l-.7-.71a1 1 0 0 0-1.42 1.42Zm11.28 11.28a1 1 0 0 0-1.41 1.41l.7.71a1 1 0 0 0 1.42-1.42ZM17.64 6.36l.71-.7a1 1 0 0 0-1.42-1.42l-.7.71a1 1 0 0 0 1.41 1.41ZM6.36 17.64l-.71.7a1 1 0 1 0 1.42 1.42l.7-.71a1 1 0 0 0-1.41-1.41Z"
            />
          </svg>
          <svg
            class="swap-off fill-current w-4 h-4"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
          >
            <path
              d="M21.64 13a1 1 0 0 0-1.05-.14 8.05 8.05 0 0 1-3.37.73A8.15 8.15 0 0 1 9.08 5.49a8.59 8.59 0 0 1 .25-2A1 1 0 0 0 8 2.36 10.14 10.14 0 1 0 22 14.05a1 1 0 0 0-.36-1.05Z"
            />
          </svg>
        </label>
        <a
          href="https://github.com/pasquelin/WebGeometry"
          class="btn btn-ghost btn-circle btn-sm"
          aria-label="The repository on GitHub"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-5 h-5 fill-current">
            <path
              d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12Z"
            />
          </svg>
        </a>
      </div>
    </header>

    <div class="drawer lg:drawer-open flex-1">
      <input id="drawer-toggle" type="checkbox" class="drawer-toggle" />
      <main class="drawer-content px-6 py-8 lg:px-10 max-w-4xl w-full">
        <div id="main-content"></div>
      </main>
      <div class="drawer-side z-20">
        <label for="drawer-toggle" class="drawer-overlay" aria-label="Close the navigation"></label>
        <aside class="bg-base-200 border-r border-base-300 w-72 min-h-full p-3 overflow-y-auto">
          <input
            type="search"
            id="search-input-mobile"
            placeholder="Search"
            aria-label="Search the documentation"
            class="input input-sm input-bordered w-full font-mono text-xs sm:hidden mb-3"
          />
          <ul id="sidebar-menu" class="menu menu-sm w-full p-0"></ul>
        </aside>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
