<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Geometry — Documentation & API Reference</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    pre code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    /* Custom scrollbar for sidebar */
    aside::-webkit-scrollbar { width: 6px; }
    aside::-webkit-scrollbar-thumb { background: rgba(150, 150, 150, 0.2); border-radius: 4px; }
  </style>
</head>
<body class="bg-base-100 text-base-content min-h-screen flex flex-col">
  <!-- Top Navigation Header -->
  <header class="navbar bg-base-200 border-b border-base-300 sticky top-0 z-30 px-4">
    <div class="navbar-start gap-2">
      <label for="drawer-toggle" class="btn btn-square btn-ghost lg:hidden" aria-label="Toggle navigation">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block w-5 h-5 stroke-current">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </label>
      <a href="#guides/quick-start" class="btn btn-ghost normal-case text-xl font-bold flex items-center gap-2">
        <span class="text-primary font-mono">&lt;WG/&gt;</span>
        <span>Web Geometry</span>
      </a>
    </div>

    <div class="navbar-center hidden md:flex items-center gap-2">
      <a href="#guides/quick-start" class="btn btn-ghost btn-sm">Documentation</a>
      <a href="#demo/webgpu-demo" class="btn btn-ghost btn-sm text-accent">Interactive Demo</a>
      <a href="report.html" class="btn btn-ghost btn-sm text-secondary">Benchmark Report ↗</a>
    </div>

    <div class="navbar-end gap-3">
      <div class="form-control hidden sm:block relative">

        <span class="absolute right-2.5 top-2 text-[10px] bg-base-300 px-1.5 py-0.5 rounded text-base-content/60 font-mono">/</span>
      </div>

        <input type="checkbox" id="theme-toggle" />
        <!-- Sun icon -->

      </label>

      <a href="https://github.com/pasquelin/WebGeometry" target="_blank" rel="noopener" class="btn btn-ghost btn-circle btn-sm" aria-label="GitHub Repository">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-5 h-5 fill-current">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
      </a>
    </div>
  </header>

  <!-- Drawer Container -->
  <div class="drawer lg:drawer-open flex-1">
    <input id="drawer-toggle" type="checkbox" class="drawer-toggle" />
    
    <!-- Main Content Viewport -->
    <main class="drawer-content flex flex-col p-6 lg:p-10 max-w-5xl">
      <div id="main-content" class="flex-1"></div>
    </main>

    <!-- Sidebar Navigation -->
    <div class="drawer-side z-20">
      <label for="drawer-toggle" class="drawer-overlay"></label>
      <aside class="bg-base-200 border-r border-base-300 w-80 min-h-full p-4 overflow-y-auto">
        <div class="sm:hidden mb-4">
          <input type="text" id="search-input-mobile" placeholder="Search..." class="input input-sm input-bordered w-full text-xs font-mono" />
        </div>
        <ul id="sidebar-menu" class="menu menu-sm w-full p-0"></ul>
      </aside>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
