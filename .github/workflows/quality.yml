name: Quality

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]
  # `develop`, and an issue's branch (`<issue>-<name>`) from its first push, so CI runs during the
  # review. Such a run reads only its branch's caches and `main`'s (GitHub's cache scopes), not
  # `develop`'s: its first run rebuilds the compiler, the pull request's reads `develop`'s.
  push:
    branches: [develop, '[0-9]+-*']
  workflow_dispatch:

# One group per event and ref: a pull request's (`refs/pull/<n>/merge`) is never a push's, so a push
# run never cancels the one that proves the merge with `develop`, and a push to a branch with an open
# pull request runs twice. A new run supersedes the older one of its group; a running `develop` run
# is never cancelled, since it is the record that the branch is green.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  # Whether the pull request changes anything but documentation, site images or translations
  # (`scripts/code-change.ts`): when it does not, the code jobs below are skipped and `validate`
  # still reports. The merge commit's first parent is the base branch, so two commits are enough;
  # `--no-renames` lists a moved file's old path too, so moving code out as an image stays code.
  # A push always runs every job: `develop`'s run is the record that the branch is green.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only --no-renames HEAD^1 HEAD | node scripts/code-change.ts >> "$GITHUB_OUTPUT"
          else
            echo code=true >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # The gates that read the sources alone, and nothing this workflow builds. They answer in under a
  # minute, which is when a formatting or a lint mistake should be reported. They include the unit
  # tests that read documentation (`test:docs`): a documentation-only pull request still runs them.
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node
      # `format:check` covers the Rust sources too, and rustfmt alone needs no build cache.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: pnpm run validate --group quick

  # The TypeScript build and the gates that read its products.
  typescript:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node
      - run: pnpm run validate --group typescript

  # Clippy and the Rust tests, beside the unit shards. The Rust tests read the scene caches the
  # release compiler cooks, so this job builds both too (`scripts/validate-steps.ts`).
  native:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The compiler links native Jolt from the pinned submodule (`physics-cook`, `build.rs`).
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          components: clippy, rustfmt
      # A hit means a green run already linted, built and tested these exact sources: nothing left
      # to run. The save is a separate step after the gates, so a red run never publishes it.
      - uses: ./.github/actions/native-cache
        id: native
        with:
          rust: ${{ steps.rust.outputs.cachekey }}
          lookup-only: true
      - if: steps.native.outputs.hit != 'true'
        uses: ./.github/actions/node
      # Dependency crates of both crates (`lint:native` runs Clippy on each, from its own
      # `Cargo.lock` into its own `target/`).
      - uses: Swatinem/rust-cache@v2
        if: steps.native.outputs.hit != 'true'
        with:
          workspaces: |
            packages/asset-compiler-rust
            packages/page-codec-wasm
      - if: steps.native.outputs.hit != 'true'
        run: pnpm run validate --group native
      - uses: actions/cache/save@v4
        if: steps.native.outputs.hit != 'true'
        with:
          path: ${{ steps.native.outputs.path }}
          key: ${{ steps.native.outputs.key }}

  # The unit suite, split into shards of the same file list (`node --test --test-shard`); it drives
  # the compiled compiler and reads `dist/`, so each shard has both (`scripts/validate-steps.ts`).
  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/node
      - uses: dtolnay/rust-toolchain@stable
        id: rust
      # On a hit the restored binary replaces the release build; on a miss each shard builds it
      # rather than wait for the `native` job, which alone publishes it once its gates pass: more
      # runner minutes on a Rust change, no job waiting on another.
      - uses: ./.github/actions/native-cache
        id: native
        with:
          rust: ${{ steps.rust.outputs.cachekey }}
      - uses: Swatinem/rust-cache@v2
        if: steps.native.outputs.hit != 'true'
        with:
          workspaces: packages/asset-compiler-rust
          save-if: ${{ matrix.shard == 1 }}
      - run: pnpm run validate --group unit
        env:
          TRILLION3D_SKIP_NATIVE: ${{ steps.native.outputs.hit == 'true' && '1' || '' }}
          TRILLION3D_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}

  # The one required check of `.github/ruleset.json`: it stays a single stable name whatever the
  # jobs above are split into. A group that failed, was cancelled or never ran fails it; a code
  # group may be skipped only when `changes` found a documentation-only change.
  validate:
    needs: [changes, quick, typescript, native, unit]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every group green, the code groups skipped only on a documentation-only change
        env:
          RESULTS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e --arg code "$CODE" \
            'all(.[]; .result == "success" or ($code == "false" and .result == "skipped"))'
