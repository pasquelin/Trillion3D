name: Quality

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Pull request body — issue linked, local review filled
        if: github.event_name == 'pull_request'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$BODY" | scripts/check-pr-body.sh
      # pnpm BEFORE setup-node: `cache: pnpm` asks it where the store is, and it reads the version
      # from the `packageManager` field of `package.json`.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Cargo AFTER the toolchain: the cache key includes the rustc version. Keeps `target/` and
      # the registry between runs, so a pull request that does not touch Rust skips the three
      # release compilations (clippy, build, test) that made the job ten minutes long.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/asset-compiler-rust
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate
