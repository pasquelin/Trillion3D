name: Quality

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [develop]
  workflow_dispatch:

# One run per branch. A new push supersedes the run it replaces, instead of queueing behind it;
# on `develop` every commit keeps its own run, since that is the record that the branch is green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The gates that read the sources alone, and nothing this workflow builds. They answer in under a
  # minute, which is when a formatting or a lint mistake should be reported.
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node
      # `format:check` covers the Rust sources too, and rustfmt alone needs no build cache.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: pnpm run validate --group quick

  # The TypeScript build and the gates that read its products.
  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node
      - run: pnpm run validate --group typescript

  # Clippy, the release build, the Rust tests, and the unit suite — which drives the compiled
  # compiler and reads `dist/`, so it runs where both exist (`scripts/validate-steps.ts`). The
  # longest group, and the one a cache hit empties down to the unit suite.
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NATIVE_BINARIES: |
        packages/asset-compiler-rust/target/release/trillion3d-compiler
    steps:
      # The compiler links native Jolt from the pinned submodule (`physics-cook`, `build.rs`).
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/node
      - uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          components: clippy, rustfmt
      # The native binary, keyed on the CONTENT of the Rust sources, the compiler and the golden
      # fixtures its tests read. A hit means a green run already built these exact sources: the
      # group skips its Rust steps (`scripts/validate-steps.ts` says why Cargo cannot decide this
      # itself). The save is a separate step after the gates, so a red run never publishes it.
      - uses: actions/cache/restore@v4
        id: native
        with:
          path: ${{ env.NATIVE_BINARIES }}
          key: native-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('packages/asset-compiler-rust/**', '!packages/asset-compiler-rust/target/**', 'packages/page-codec-wasm/**', '!packages/page-codec-wasm/target/**', 'packages/physics-jolt-wasm/cook/**', 'packages/physics-jolt-wasm/src/blob.h', 'packages/physics-jolt-wasm/CMakeLists.txt', 'packages/physics-jolt-wasm/JoltPhysics/Jolt/**', 'tests/fixtures/formats/**', 'tests/fixtures/physics/**') }}
      # Dependency crates of both crates (`lint:native` runs Clippy on each, from its own
      # `Cargo.lock` into its own `target/`), only when Cargo will run: the key includes the rustc
      # version, hence after the toolchain.
      - uses: Swatinem/rust-cache@v2
        if: steps.native.outputs.cache-hit != 'true'
        with:
          workspaces: |
            packages/asset-compiler-rust
            packages/page-codec-wasm
      - run: pnpm run validate --group native
        env:
          TRILLION3D_SKIP_NATIVE: ${{ steps.native.outputs.cache-hit == 'true' && '1' || '' }}
      - uses: actions/cache/save@v4
        if: steps.native.outputs.cache-hit != 'true'
        with:
          path: ${{ env.NATIVE_BINARIES }}
          key: ${{ steps.native.outputs.cache-primary-key }}

  # The one required check of `.github/ruleset.json`: it stays a single stable name whatever the
  # jobs above are split into. A group that failed, was cancelled or never ran fails it.
  validate:
    needs: [quick, typescript, native]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every group green
        env:
          RESULTS: ${{ needs.quick.result }} ${{ needs.typescript.result }} ${{ needs.native.result }}
        run: |
          echo "quick typescript native: $RESULTS"
          case "$RESULTS" in
            'success success success') ;;
            *) exit 1 ;;
          esac
