name: Pull request body

# Its own workflow, and its own required check: editing a body re-reads the body, and never replays
# the code gates of `quality.yml`. `synchronize` is listed because a required check is recorded per
# commit: a new head with no run of this workflow would never become mergeable. A draft is not
# asked for its Lead verification; `ready_for_review` and `converted_to_draft` re-read the body
# when that state changes.
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `issues: read`: the body check reads the Proof section of the issue the pull request closes.
# `pull-requests: read`: the identity check reads the pull request's commits.
permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  pr-body:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Node alone, no dependencies: the gate imports only Node's own modules.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Issue closed, local review filled, lead verified and issue proved once ready
        env:
          BODY: ${{ github.event.pull_request.body }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s\n' "$BODY" | node scripts/check-pr-body.ts
      - name: Commits carry no tool identity and no generated trailer
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-commit-identity.ts
