name: Pages

# The repository's Pages source is "GitHub Actions" (set once through the API): no branch tracks
# a build product, this workflow builds the site from main into dist/site and deploys that tree.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The open world (#332) is generated from its seed and compiled at deploy time: its cache is
      # never committed. The native compiler builds first, then the generator writes the world.
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm run build:native
      - run: node scripts/docs-openworld.ts
      # Styles, demo maths, browser engine, workers, portal and statics, from the sources alone.
      - run: pnpm run build:docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site
      - uses: actions/deploy-pages@v5
        id: deployment
