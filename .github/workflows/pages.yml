name: Site

# The documentation portal, built from the sources into dist/site and deployed to the site's own
# server (docs/LEARNING_PORTAL.md, "Deploy"). A pull request that touches anything the build reads
# only builds it — the engine packages, the build scripts and the dependencies; a push to main, or a
# manual run asked to deploy, also publishes it. The required `validate` check builds the site too
# (`build:docs`, `scripts/validate-steps.ts`). The open world is cooked and published by its own
# repository, pasquelin/Trillion3D-openworld, under `openworld/`, which this deploy leaves alone.
on:
  pull_request:
    paths:
      - 'site/**'
      - 'packages/**'
      - 'scripts/docs/**'
      - 'scripts/docs-build.ts'
      - 'scripts/site-caches.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/actions/node/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the built site (from main only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
      floor: ${{ steps.plan.outputs.floor }}
    steps:
      # The scene caches are compiled here, by the native compiler, which links the pinned Jolt.
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/node
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/asset-compiler-rust
      - run: pnpm run build:native
      # The one published report is no file of git: `bench/runner/publishReport.ts` stages it and
      # the release `report` holds it (bench/runner/README.md, "Published reports").
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download report --pattern report.tar.gz --output - | tar -xz -C site/reports
      # Whether this run publishes, decided once: only main is ever published.
      # The file-count floor of a sound output: the build copies every tracked served static of
      # site/ (sources .ts/.tsx excluded) and writes index.html, robots.txt and the report.html
      # redirect beside them, so a tree holding fewer files than that lost part of the copy.
      - id: plan
        env:
          DEPLOY: >-
            ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' ||
            (github.event_name == 'workflow_dispatch' && inputs.deploy)) }}
        run: |
          statics=$(git ls-files -- site/examples site/assets site/data site/reports | grep -cEv '\.tsx?$')
          echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"
          echo "floor=$((statics + 3))" >> "$GITHUB_OUTPUT"
      # Styles, demo maths, browser engine, workers, portal, API files, scene caches and statics;
      # `--published` adds the audience measurement, which no local or proof build carries.
      - run: node scripts/docs-build.ts --published
      - if: steps.plan.outputs.deploy == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/site
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One deployment at a time, and never one cut off halfway through its transfer.
    concurrency:
      group: site
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist/site
      - name: Refuse an empty or partial output
        env:
          FLOOR: ${{ needs.build.outputs.floor }}
        run: |
          for file in index.html runtime/portal.js; do
            test -s "dist/site/$file" || { echo "::error::dist/site/$file is missing"; exit 1; }
          done
          count=$(find dist/site -type f | wc -l)
          echo "$count files, floor $FLOOR"
          test "$count" -ge "$FLOOR" || { echo "::error::$count files, fewer than $FLOOR"; exit 1; }
      # Served as is by the web server beside each original; binary pages and caches do not shrink.
      - name: Pre-compress the text files
        run: >-
          find dist/site -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.mjs'
          -o -name '*.svg' -o -name '*.json' -o -name '*.xml' -o -name '*.txt' -o -name '*.gltf'
          -o -name '*.obj' -o -name '*.wasm' \) -exec gzip -9 -k -f {} +
      - name: Install the deploy key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts
      # The key is restricted to the web root on the server, so the target path is that root.
      # `openworld/` belongs to pasquelin/Trillion3D-openworld's deploy: never deleted from here.
      - name: Transfer
        env:
          TARGET: ${{ secrets.DEPLOY_TARGET }}
          PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: >-
          rsync -rltz --delete-delay --delay-updates --stats --exclude '.well-known/'
          --exclude 'openworld/'
          -e "ssh -p $PORT -i $HOME/.ssh/deploy -o StrictHostKeyChecking=yes"
          dist/site/ "$TARGET:/"
      # The address checked is the one the built page declares canonical (scripts/docs/site.ts).
      # Each answer must carry the cross-origin isolation `scripts/docs-serve.ts` serves locally:
      # without it `crossOriginIsolated` is false and the physics falls back to one thread (#444).
      - name: Check the published site
        run: |
          url=$(grep -o 'rel="canonical" href="[^"]*"' dist/site/index.html | sed 's/.*href="//; s/"$//')
          test -n "$url" || { echo "::error::no canonical address in index.html"; exit 1; }
          for page in "$url" "${url}runtime/portal.js"; do
            headers=$(curl -fsS -D - -o /dev/null --retry 2 --retry-all-errors --retry-delay 10 "$page")
            echo "$headers" | head -n 1
            for header in 'cross-origin-opener-policy: same-origin' \
              'cross-origin-embedder-policy: credentialless'; do
              echo "$headers" | tr -d '\r' | grep -qix "$header" ||
                { echo "::error::$page does not answer '$header'"; exit 1; }
            done
          done
