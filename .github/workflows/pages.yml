name: Pages

# The repository's Pages source is "GitHub Actions" (set once through the API): no branch tracks
# the generated docs bundles, this workflow builds them from main and deploys the docs/ tree.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Styles, demo maths, browser engine, workers and portal, bundled from the sources alone.
      - run: pnpm run build:docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - uses: actions/deploy-pages@v5
        id: deployment
